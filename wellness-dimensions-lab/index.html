<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wellness Dimensions Lab (Extra Credit)</title>
<meta name="description" content="An interactive 25-minute extra-credit lab: identify, manipulate and integrate physical, mental, emotional, social and environmental wellness and the metrics that measure each one.">
<style>
@property --accent{syntax:'<color>';inherits:true;initial-value:#0f4c81}
@property --soft{syntax:'<color>';inherits:true;initial-value:#e3effb}
:root{
  --ink:#1f2937; --muted:#4b5563; --panel:#ffffff; --line:#cfd6e2;
  --good:#166534; --good-bg:#dcfce7; --bad:#b91c1c; --bad-bg:#fee2e2; --warn:#7c2d12; --warn-bg:#ffedd5;
  --accent-ink:#ffffff; --focus:#1d4ed8; --nav-h:92px;
  --c-physical:#c2410c; --c-mental:#4338ca; --c-emotional:#be185d; --c-social:#a16207; --c-environmental:#15803d; --c-integration:#0f4c81;
  --s-physical:#ffedd5; --s-mental:#e0e7ff; --s-emotional:#fce7f3; --s-social:#fef3c7; --s-environmental:#dcfce7; --s-integration:#e3effb;
  font-family:"Avenir Next","Trebuchet MS",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
body{--accent:#0f4c81;--soft:#e3effb;--edge:#b7cbe3;transition:--accent .7s ease,--soft .7s ease}
body[data-theme=physical]{--accent:#c2410c;--soft:#ffedd5;--edge:#f3c7a8}
body[data-theme=mental]{--accent:#4338ca;--soft:#e0e7ff;--edge:#c3cbf5}
body[data-theme=emotional]{--accent:#be185d;--soft:#fce7f3;--edge:#f5bcd7}
body[data-theme=social]{--accent:#a16207;--soft:#fef3c7;--edge:#ecd28a}
body[data-theme=environmental]{--accent:#15803d;--soft:#dcfce7;--edge:#a8dfb9}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);font-size:17px;line-height:1.5;background:#eef3f9;overflow-x:hidden;min-height:100vh}
h1,h2,h3,h4{line-height:1.15;margin:0 0 .45em;letter-spacing:-.01em}
p{margin:.5em 0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}
.ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- background ---------- */
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bg-layer{position:absolute;inset:0;opacity:0;transition:opacity .9s ease}
.bg-layer.on{opacity:1}
.bg-layer:not(.on) .fl{animation-play-state:paused}
.fl{position:absolute;opacity:.16;animation:drift var(--d,30s) linear infinite;animation-delay:var(--dl,0s)}
@keyframes drift{0%{transform:translate3d(0,30px,0) rotate(0deg)}50%{transform:translate3d(var(--dx,20px),-45vh,0) rotate(180deg)}100%{transform:translate3d(0,-95vh,0) rotate(360deg)}}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);border-bottom:3px solid var(--accent);transition:border-color .7s}
.top-in{max-width:1100px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;color:var(--accent)}
.brand b{display:block;font-size:1.1rem;color:var(--ink)}
.brand small{display:block;color:var(--muted);font-size:.8rem}
.badges{display:flex;gap:6px;margin-left:auto}
.badge{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#e5e7eb;color:#6b7280;border:2px solid #cbd2dc;transition:all .5s}
.badge.on{background:var(--bc);color:#fff;border-color:var(--bc);animation:pop .6s ease both}
.score{display:flex;align-items:center;gap:10px;font-weight:700}
.score .who{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-weight:600}
.score .pts{background:var(--accent);color:#fff;border-radius:999px;padding:4px 14px;transition:background .7s}
.progress{height:6px;background:#dfe5ee}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .6s ease,background .7s}

/* ---------- stage ---------- */
main#stage{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:20px 16px calc(var(--nav-h) + 48px);outline:none}
.page{animation:inFwd .5s cubic-bezier(.2,.8,.2,1) both}
.page.enter-back{animation-name:inBack}
@keyframes inFwd{from{opacity:0;transform:translateX(48px)}to{opacity:1;transform:none}}
@keyframes inBack{from{opacity:0;transform:translateX(-48px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent)}50%{box-shadow:0 0 0 10px transparent}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.shake{animation:shake .45s ease}
.rise{animation:rise .5s ease both}

.panel{background:var(--panel);border:2px solid var(--edge);border-radius:20px;padding:18px 20px;margin:16px 0;box-shadow:0 4px 0 rgba(31,41,55,.06);transition:border-color .7s}
.panel h3{display:flex;align-items:center;gap:10px}
.sec{display:flex;align-items:center;gap:10px;font-size:1.25rem;margin:26px 0 8px;color:var(--accent)}
.sec .n{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;font-size:1rem}
.lead{font-size:1.1rem;color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 22px;border-radius:14px;border:2px solid var(--accent);background:#fff;color:var(--accent);font-weight:700;cursor:pointer;transition:transform .15s,background .2s,color .2s,opacity .2s}
.btn:hover:not(:disabled){transform:translateY(-2px)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary.ready{animation:glow 1.6s infinite}
.btn:disabled,.btn[aria-disabled=true]{opacity:.45;cursor:not-allowed}

/* ---------- bottom nav ---------- */
.navbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-top:3px solid var(--accent);padding:8px 12px calc(8px + env(safe-area-inset-bottom));transition:border-color .7s}
.nav-in{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.dots{display:flex;align-items:center;justify-content:center;gap:clamp(4px,1.4vw,12px);position:relative}
.dots::before{content:"";position:absolute;left:12px;right:12px;top:16px;height:4px;background:#dfe5ee;border-radius:2px;z-index:0}
.dot{position:relative;z-index:1;width:32px;height:32px;border-radius:50%;border:3px solid #cbd2dc;background:#fff;display:grid;place-items:center;cursor:pointer;color:#6b7280;padding:0;transition:all .3s}
.dot:disabled{cursor:not-allowed;opacity:.55}
.dot.done{background:var(--dc);border-color:var(--dc);color:#fff}
.dot.cur{border-color:var(--dc);box-shadow:0 0 0 4px color-mix(in srgb,var(--dc) 25%,transparent);transform:scale(1.18);color:var(--dc);background:#fff}
.dot.cur.done{color:#fff;background:var(--dc)}
.nav-msg{grid-column:1/-1;text-align:center;font-size:.9rem;color:var(--muted);min-height:1.3em;font-weight:600}
.nav-msg.ready{color:var(--good)}
@media(max-width:620px){.nav-in{grid-template-columns:1fr 1fr}.dots{grid-column:1/-1;grid-row:1}.btn{padding:8px 12px}.badges{margin-left:0}.score .who{display:none}}

/* ---------- start ---------- */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:center}
@media(max-width:820px){.hero{grid-template-columns:1fr}}
.hero h1{font-size:clamp(2rem,5vw,3.2rem);color:var(--accent)}
.hero h1 span{display:block;color:var(--ink);font-size:.55em;font-weight:600;letter-spacing:0}
.xc{display:inline-block;background:#fbbf24;color:#1f2937;font-weight:800;border-radius:999px;padding:3px 14px;font-size:.85rem;margin-bottom:10px;transform:rotate(-2deg)}
.namebox{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin:12px 0}
@media(max-width:560px){.namebox{grid-template-columns:1fr}}
.namebox label{display:block;font-weight:700;font-size:.9rem;margin-bottom:4px}
.namebox input{width:100%;min-height:50px;font:inherit;padding:8px 14px;border:2px solid var(--edge);border-radius:12px;background:#fff}
.namebox input:focus{border-color:var(--accent);outline:3px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.err{color:var(--bad);font-weight:700;min-height:1.4em}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
@media(max-width:560px){.rules{grid-template-columns:1fr}}
.rule{border-radius:16px;padding:12px;text-align:center;background:var(--soft);border:2px solid var(--edge)}
.rule b{display:block;font-size:2rem;color:var(--accent)}
.path{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px}
.path div{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:#fff;border:2px solid var(--edge)}
.path .pi{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;background:var(--pc)}
.path small{display:block;color:var(--muted)}

/* ---------- wheel ---------- */
.wheel-grid{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:22px;align-items:start}
@media(max-width:860px){.wheel-grid{grid-template-columns:1fr}}
.wheel{width:100%;max-width:420px;margin:0 auto;display:block}
.wheel .orbit{transform-origin:180px 180px;animation:spin 70s linear infinite}
.wheel .hub-ring{transform-origin:180px 180px;animation:hubpulse 3s ease-in-out infinite}
@keyframes hubpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.wedge{cursor:pointer;transform-origin:180px 180px;transition:transform .3s cubic-bezier(.3,1.6,.5,1),filter .3s}
.wedge:hover,.wedge:focus-visible{transform:scale(1.04);filter:brightness(1.08)}
.wedge.sel{transform:scale(1.07)}
.wedge:focus,.wedge:focus-visible{outline:none}
.wedge .sm{opacity:0;transition:opacity .4s}
.wedge.seen .sm{opacity:1}
.wedge:focus-visible path{stroke:#111827;stroke-width:4}
.wheel.spin{animation:spin 60s linear infinite}
.detail{min-height:300px}
.detail .dhead{display:flex;align-items:center;gap:12px;color:var(--dc)}
.detail .dhead .big{width:56px;height:56px;border-radius:16px;background:var(--dc);color:#fff;display:grid;place-items:center;animation:pop .5s ease both}
.detail h3{font-size:1.6rem;margin:0;color:var(--dc)}
.detail h4{margin:14px 0 4px;font-size:.95rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.detail ul{margin:0;padding-left:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.detail li{background:var(--ds);color:var(--ink);border:2px solid var(--de);border-radius:999px;padding:3px 12px;font-size:.92rem}
.seen-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.seen-row span{display:flex;align-items:center;gap:6px;padding:3px 12px 3px 6px;border-radius:999px;border:2px solid #cbd2dc;color:#6b7280;font-size:.9rem;font-weight:700;background:#fff}
.seen-row span.on{border-color:var(--dc);background:var(--dc);color:#fff}
.locked-note{border:3px dashed var(--edge);border-radius:18px;padding:16px;text-align:center;color:var(--muted);font-weight:700}

/* ---------- items ---------- */
.item{background:var(--panel);border:2px solid var(--edge);border-radius:20px;padding:16px 18px;margin:14px 0;box-shadow:0 4px 0 rgba(31,41,55,.06);animation:rise .5s ease both;transition:border-color .4s,background .4s}
.item.is-done{border-color:#86d3a0;background:#f7fdf9}
.item.is-done.is-miss{border-color:#f0a8a8;background:#fffafa}
.item-head{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.qbadge{flex:none;width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800}
.prompt{flex:1 1 280px;font-weight:700;font-size:1.05rem}
.prompt small{display:block;font-weight:400;color:var(--muted)}
.pips{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pip{font-size:.78rem;font-weight:800;padding:2px 9px;border-radius:999px;border:2px solid #cbd2dc;color:#6b7280;background:#fff;transition:all .3s}
.pip.next{border-color:var(--accent);color:var(--accent);background:var(--soft)}
.pip.used{text-decoration:line-through;background:#f3f4f6;opacity:.7}
.pip.won{background:var(--good);border-color:var(--good);color:#fff;animation:pop .5s ease both}
.ptschip{font-size:.8rem;font-weight:800;padding:2px 10px;border-radius:999px;background:var(--soft);color:var(--ink)}
.fb{margin-top:10px;border-radius:12px;padding:0;font-size:.97rem}
.fb:not(:empty){padding:10px 14px;animation:rise .35s ease both}
.fb.good{background:var(--good-bg);color:#14532d}
.fb.bad{background:var(--bad-bg);color:#7f1d1d}
.fb.miss{background:var(--warn-bg);color:var(--warn)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:12px}
.opts.dimopts{grid-template-columns:repeat(5,1fr)}
@media(max-width:700px){.opts.dimopts{grid-template-columns:repeat(2,1fr)}}
.opt{min-height:52px;border-radius:14px;border:2px solid var(--edge);background:#fff;padding:8px 12px;cursor:pointer;text-align:left;font-weight:600;display:flex;align-items:center;gap:8px;transition:transform .15s,background .2s,border-color .2s}
.opt:hover:not(:disabled){transform:translateY(-2px);border-color:var(--accent);background:var(--soft)}
.opt.dimopt{flex-direction:column;justify-content:center;text-align:center;color:var(--oc);border-color:var(--oc)}
.opt:disabled{cursor:default}
.opt.is-wrong{background:var(--bad-bg);border-color:#e08c8c;color:#7f1d1d;text-decoration:line-through;opacity:.75}
.opt.is-right{background:var(--good-bg);border-color:#3d9b5f;color:#14532d;opacity:1;animation:pop .5s ease both}
.opt.is-right::after{content:"✓";font-weight:900;margin-left:auto}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px;margin:12px 0}
.chk{display:flex;align-items:center;gap:10px;min-height:48px;padding:8px 12px;border:2px solid var(--edge);border-radius:14px;background:#fff;cursor:pointer;font-weight:600}
.chk input{width:22px;height:22px;accent-color:var(--accent)}
.chk:has(input:checked){background:var(--soft);border-color:var(--accent)}
.chk.rev-right{border-color:#3d9b5f;background:var(--good-bg)}
.item.is-done .chk{cursor:default}
.matchrow{display:grid;grid-template-columns:1fr 200px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
@media(max-width:640px){.matchrow{grid-template-columns:1fr}}
.matchrow select{min-height:46px;font:inherit;border:2px solid var(--edge);border-radius:12px;padding:6px 10px;background:#fff}
.matchrow.bad select{border-color:#e08c8c;background:var(--bad-bg)}
.matchrow.good select{border-color:#3d9b5f;background:var(--good-bg)}
.check-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:10px}

/* ---------- sort ---------- */
.tray{display:flex;flex-wrap:wrap;gap:10px;min-height:96px;padding:14px;border:3px dashed var(--edge);border-radius:20px;background:rgba(255,255,255,.7);align-content:flex-start}
.tray:empty::after{content:"All cards sorted! Great work.";color:var(--good);font-weight:800;margin:auto}
.mcard{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;min-height:60px;max-width:250px;padding:8px 12px;border-radius:14px;background:#fff;border:2px solid #9aa6b8;box-shadow:0 3px 0 rgba(31,41,55,.12);transition:transform .2s,box-shadow .2s,border-color .2s;animation:rise .4s ease both}
.mcard b{display:block;font-size:.93rem;line-height:1.2}
.mcard span{display:block;font-size:.85rem;color:var(--accent);font-weight:800}
.mcard:hover{transform:translateY(-3px) rotate(-1deg)}
.mcard.sel{border-color:var(--accent);background:var(--soft);transform:translateY(-6px) scale(1.05);box-shadow:0 8px 0 rgba(31,41,55,.12);animation:bob 1.2s ease-in-out infinite}
.mcard .try{font-size:.72rem;color:var(--bad);font-weight:800}
.mcard.ghost{position:fixed;z-index:100;pointer-events:none;transform:rotate(4deg) scale(1.08);box-shadow:0 14px 24px rgba(0,0,0,.3);animation:none}
.buckets{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:14px}
@media(max-width:860px){.buckets{grid-template-columns:repeat(2,1fr)}.buckets .bucket:last-child{grid-column:1/-1}}
.bucket{border:3px solid var(--c);border-radius:20px;background:var(--cs);padding:10px;min-height:180px;cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .2s,box-shadow .2s,background .2s}
.bucket .bi{width:46px;height:46px;border-radius:14px;background:var(--c);color:#fff;display:grid;place-items:center}
.bucket b{color:var(--c);font-size:1.05rem}
.bucket small{color:var(--muted);font-weight:700}
.bucket.target{background:#fff;transform:scale(1.04);box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 30%,transparent)}
.bucket.armed{animation:glow 1.4s infinite;--accent:var(--c)}
.placed{display:flex;flex-direction:column;gap:4px;width:100%;margin-top:4px}
.chip{font-size:.78rem;line-height:1.2;text-align:left;background:#fff;border:2px solid var(--c);border-radius:10px;padding:3px 8px;animation:pop .45s ease both}
.chip.miss{border-style:dashed;border-color:var(--bad);color:var(--bad)}
.sortbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.meter{flex:1 1 200px;height:12px;border-radius:99px;background:#dfe5ee;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);width:0;transition:width .5s}

/* ---------- labs ---------- */
.lab-banner{display:flex;gap:18px;align-items:center;padding:20px;border-radius:24px;color:#fff;background:linear-gradient(120deg,var(--accent),color-mix(in srgb,var(--accent) 70%,#000));position:relative;overflow:hidden;box-shadow:0 6px 0 rgba(0,0,0,.15)}
.lab-banner::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.12);animation:hubpulse 4s ease-in-out infinite}
.lab-banner .halo{flex:none;width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;position:relative}
.lab-banner .halo::before{content:"";position:absolute;inset:-6px;border-radius:50%;border:3px dashed rgba(255,255,255,.65);animation:spin 18s linear infinite}
.lab-banner h2{margin:0 0 4px;font-size:clamp(1.5rem,4vw,2.2rem)}
.lab-banner p{margin:0;max-width:60ch}
.tag{display:inline-block;background:rgba(255,255,255,.25);border-radius:999px;padding:1px 12px;font-size:.8rem;font-weight:800;margin-bottom:6px}
.skills{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.skills span{background:#fff;color:var(--accent);border-radius:999px;padding:1px 10px;font-size:.8rem;font-weight:800}
.sim-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;align-items:start}
@media(max-width:860px){.sim-grid{grid-template-columns:1fr}}
.sim-view{background:linear-gradient(180deg,#fff,var(--soft));border:2px solid var(--edge);border-radius:18px;padding:12px;text-align:center;overflow:hidden}
.ctl{margin:6px 0 14px}
.ctl label{display:flex;justify-content:space-between;gap:10px;font-weight:800}
.ctl output{color:var(--accent)}
.ctl input[type=range]{width:100%;height:36px;accent-color:var(--accent);margin:2px 0 0;cursor:pointer}
.zbar{position:relative;height:8px;border-radius:99px;background:#e5e7eb;margin:-2px 8px 2px}
.zbar i{position:absolute;top:0;bottom:0;border-radius:99px;background:#4ade80;opacity:.85}
.zlabel{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);font-weight:700}
.zlabel .okc{color:var(--good)}
.switch{display:flex;align-items:center;gap:12px;min-height:48px;padding:6px 12px;border:2px solid var(--edge);border-radius:14px;background:#fff;cursor:pointer;font-weight:700;margin:6px 0}
.switch input{width:24px;height:24px;accent-color:var(--accent)}
.switch:has(input:checked){background:var(--soft);border-color:var(--accent)}
.gauge{margin:8px 0 12px;padding:10px 12px;border-radius:14px;background:#fff;border:2px solid var(--edge);transition:border-color .3s,background .3s}
.gauge.ok{border-color:#3d9b5f;background:#f2fcf5}
.g-top{display:flex;justify-content:space-between;font-weight:800}
.g-val b{font-size:1.4rem;color:var(--accent);font-variant-numeric:tabular-nums}
.g-track{position:relative;height:14px;border-radius:99px;background:linear-gradient(90deg,#e5e7eb,#d1d5db);margin:8px 0 4px}
.g-zone{position:absolute;top:0;bottom:0;background:#4ade80;opacity:.8;border-radius:99px}
.g-mark{position:absolute;top:-6px;width:0;height:0;margin-left:-9px;border-left:9px solid transparent;border-right:9px solid transparent;border-top:14px solid var(--ink);transition:left .6s cubic-bezier(.3,1.4,.5,1)}
.g-foot{display:flex;justify-content:space-between;gap:8px;font-size:.84rem;color:var(--muted);font-weight:700;flex-wrap:wrap}
.g-status.ok{color:var(--good)}
.g-status.off{color:var(--bad)}
.note{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:14px;background:var(--soft);border:2px solid var(--edge);margin-top:14px;font-size:.95rem}
.note svg{color:var(--accent);margin-top:2px}

.heart-wrap{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap}
.heart{width:130px;height:130px;transform-origin:center;animation:beat var(--beat,.8s) ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.16)}30%{transform:scale(1)}45%{transform:scale(1.1)}}
.bpm b{font-size:3rem;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1}
.bpm small{display:block;color:var(--muted);font-weight:700}
.ecg{width:100%;height:70px;display:block;overflow:hidden;background:#111827;border-radius:12px;margin-top:10px}
.ecg path{fill:none;stroke:#4ade80;stroke-width:2.5;stroke-linejoin:round}
.ecg-g{animation:ecgmove var(--beat,.8s) linear infinite}
@keyframes ecgmove{to{transform:translateX(-80px)}}

.brain{width:100%;max-width:380px}
.brain .node{transition:fill .5s,r .5s}
.brain .node.lit{animation:neuron var(--np,1.2s) ease-in-out infinite}
@keyframes neuron{0%,100%{opacity:.75}50%{opacity:1;filter:drop-shadow(0 0 5px #a5b4fc)}}
.brain .edge{stroke:#cbd2dc;stroke-width:1.5;transition:stroke .5s}
.brain .edge.lit{stroke:#6366f1;stroke-width:2.2;stroke-dasharray:5 5;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
.brain .bolt{fill:#f59e0b;stroke:#92400e;stroke-width:1.5;transition:opacity .5s;animation:flicker .6s steps(2) infinite}
@keyframes flicker{0%{transform:translateY(0)}50%{transform:translateY(-3px) rotate(4deg)}}

.face-row{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.face{width:150px}
.hbar{height:20px;border-radius:99px;background:#e5e7eb;border:2px solid #9aa6b8;overflow:hidden;margin-top:10px}
.hbar i{display:block;height:100%;width:80%;background:linear-gradient(90deg,#16a34a,#f59e0b,#dc2626);background-size:100vw 100%;transition:width .15s linear}
.strat{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin:12px 0}
.strat .opt{font-size:.92rem}
.opt .sw{width:22px;height:6px;border-radius:3px;background:var(--sc);flex:none}
.chart{width:100%;background:#fff;border-radius:14px;border:2px solid var(--edge)}
.chart text{font-size:11px;fill:#4b5563;font-weight:700}
.chart .curve{fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.legend{display:grid;gap:4px;font-size:.88rem;margin-top:8px}
.legend div{display:flex;gap:8px;align-items:center}
.legend .sw{width:26px;height:0;border-top:4px solid var(--sc)}

.netsvg{width:100%;background:radial-gradient(circle at 50% 50%,#fff 0,var(--soft) 100%);border-radius:18px;border:2px solid var(--edge)}
.nnode{cursor:pointer}
.nnode circle.body{fill:#fff;stroke:#9aa6b8;stroke-width:3;transition:fill .4s,stroke .4s}
.nnode.on circle.body{fill:var(--c-social);stroke:#7c4a03}
.nnode.on.bad circle.body{fill:#6b7280;stroke:#b91c1c}
.nnode:hover circle.body,.nnode:focus-visible circle.body{stroke:var(--accent);stroke-width:5}
.nnode:focus,.nnode:focus-visible{outline:none}
.nnode text{font-size:11.5px;font-weight:800;fill:var(--ink);text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.nnode .ico{color:#6b7280;pointer-events:none}
.nnode.on .ico{color:#fff}
.nline{stroke:var(--c-social);stroke-width:4;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .6s ease}
.nline.bad{stroke:#b91c1c;stroke-dasharray:1;}
.nline.on{stroke-dashoffset:0}
.you{animation:hubpulse 2.4s ease-in-out infinite;transform-origin:300px 200px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.tile{background:#fff;border:2px solid var(--edge);border-radius:14px;padding:8px;text-align:center;font-weight:700;font-size:.85rem;transition:all .3s}
.tile b{display:block;font-size:1.5rem;color:var(--accent)}
.tile.ok{border-color:#3d9b5f;background:var(--good-bg)}
.tile.ok b{color:var(--good)}

.scene{width:100%;border-radius:16px;border:2px solid var(--edge);display:block}
.puff{transform-box:fill-box;transform-origin:center;animation:smoke var(--sd,4s) ease-out infinite;animation-delay:var(--dl,0s)}
@keyframes smoke{0%{transform:translate(0,0) scale(.5);opacity:.85}100%{transform:translate(40px,-85px) scale(2.1);opacity:0}}
.scene.scrub .puff{fill:#f3f4f6!important;--sd:6s}
.car{animation:drive var(--cd,7s) linear infinite;animation-delay:var(--dl,0s)}
@keyframes drive{from{transform:translateX(-90px)}to{transform:translateX(680px)}}
.tree{transform-box:fill-box;transform-origin:50% 100%;transform:scale(0);transition:transform .7s cubic-bezier(.3,1.6,.5,1)}
.tree.show{transform:scale(1);animation:sway 4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1) rotate(2deg)}}
.cyc{animation:drive 9s linear infinite}

/* ---------- integration ---------- */
.persona{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.avatar{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,var(--c-mental),var(--c-emotional));color:#fff;font-size:2.4rem;font-weight:900;display:grid;place-items:center;animation:bob 3s ease-in-out infinite}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:130px 1fr 44px;gap:8px;align-items:center;font-weight:800;font-size:.92rem}
@media(max-width:560px){.bar{grid-template-columns:96px 1fr 38px;font-size:.82rem}}
.bar .nm{display:flex;align-items:center;gap:6px;color:var(--bc)}
.btrack{position:relative;height:20px;border-radius:99px;background:#e5e7eb;overflow:hidden}
.btrack .base,.btrack .prev{position:absolute;left:0;top:0;bottom:0;border-radius:99px;transition:width .7s cubic-bezier(.3,1.2,.5,1)}
.btrack .prev{background:repeating-linear-gradient(45deg,var(--bc),var(--bc) 6px,color-mix(in srgb,var(--bc) 70%,#fff) 6px,color-mix(in srgb,var(--bc) 70%,#fff) 12px);opacity:.55}
.btrack .base{background:var(--bc);z-index:1}
.btrack .goal{position:absolute;left:60%;top:0;bottom:0;width:3px;background:#111827;z-index:2}
.bar.met .val{color:var(--good)}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px;margin:12px 0}
.act{border:2px solid var(--edge);border-radius:16px;background:#fff;padding:10px 12px;text-align:left;cursor:pointer;transition:transform .15s,border-color .2s,background .2s;min-height:96px}
.act:hover:not(:disabled){transform:translateY(-2px);border-color:var(--accent)}
.act.on{background:var(--soft);border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.act:disabled{opacity:.5;cursor:not-allowed}
.act b{display:block;margin-bottom:4px}
.deltas{display:flex;gap:4px;flex-wrap:wrap}
.dl{font-size:.75rem;font-weight:800;border-radius:999px;padding:1px 8px;color:#fff;background:var(--bc)}
.dl.neg{background:#fff;color:var(--bad);border:2px solid var(--bad)}
.sticky-bars{position:sticky;top:76px;z-index:5}

/* ---------- results ---------- */
.report{background:#fff;border:3px solid var(--accent);border-radius:24px;padding:20px;box-shadow:0 8px 0 rgba(31,41,55,.1)}
.rep-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end;border-bottom:3px solid var(--accent);padding-bottom:10px;margin-bottom:14px}
.rep-head h2{margin:0;font-size:clamp(1.3rem,3.5vw,1.9rem);color:var(--accent)}
.rep-head .meta{text-align:right;font-weight:700}
.rep-head .meta .nm{font-size:1.4rem;color:var(--ink)}
.rep-top{display:grid;grid-template-columns:230px 1fr;gap:20px;align-items:center}
@media(max-width:760px){.rep-top{grid-template-columns:1fr}}
.ring{position:relative;width:210px;height:210px;margin:0 auto}
.ring svg{transform:rotate(-90deg)}
.ring .rt{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .rt b{font-size:3.2rem;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.ring .rt small{display:block;font-weight:800;color:var(--muted)}
.tally{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tally span{border-radius:999px;padding:3px 12px;font-weight:800;font-size:.88rem;background:var(--soft);border:2px solid var(--edge)}
.rep-cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:16px}
@media(max-width:860px){.rep-cols{grid-template-columns:1fr}}
.rep-cols h3{font-size:1.1rem;color:var(--accent);margin-bottom:6px}
.good-list,.rev-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.good-list li{display:flex;gap:8px;align-items:flex-start;background:var(--good-bg);border-radius:10px;padding:6px 10px;font-size:.92rem;color:#14532d}
.rev-list li{border-left:5px solid var(--bad);background:#fff7f7;border-radius:8px;padding:6px 10px;font-size:.9rem}
.rev-list li.half{border-left-color:#d97706;background:#fffbf0}
.rev-list b{display:block}
.rev-list small{display:block;color:var(--muted)}
.dimbars{display:grid;gap:8px}
.dimbars .bar{grid-template-columns:150px 1fr 90px}
@media(max-width:560px){.dimbars .bar{grid-template-columns:100px 1fr 70px}}
.shot{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.celebrate{font-size:1.1rem;font-weight:800;color:var(--good)}

/* ---------- fx ---------- */
.conf{position:fixed;z-index:200;width:9px;height:14px;border-radius:2px;pointer-events:none;animation:confetti .95s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes confetti{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),calc(var(--dy) + 90px)) rotate(var(--r));opacity:0}}
#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 20px);transform:translate(-50%,30px);background:#111827;color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:all .4s;z-index:60;max-width:92vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
noscript{display:block;position:relative;z-index:5;padding:20px;background:#fee2e2;color:#7f1d1d;font-weight:700;text-align:center}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
  .fl{display:none}
}
@media print{
  body{background:#fff}
  #bg,.top,.navbar,.noprint,#toast{display:none!important}
  main#stage{padding:0;max-width:none}
  .report{border-width:2px;box-shadow:none}
  .page{animation:none}
}

<script>
'use strict';
/* =====================================================================
   Wellness Dimensions Lab. One self-contained file: no network needed.
   Scoring: every item allows 3 tries (1st 100%, 2nd 75%, 3rd 50%, then 0).
   ===================================================================== */

/* ---------- utilities ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = n => String(Math.round(n * 10) / 10);
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const MULT = [1, 0.75, 0.5];
const ORDER = ['physical', 'mental', 'emotional', 'social', 'environmental'];

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style' && typeof v === 'object') for (const [p, val] of Object.entries(v)) p.startsWith('--') ? el.style.setProperty(p, val) : (el.style[p] = val);
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  kids.flat(Infinity).forEach(c => { if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(c)); });
  return el;
}
const ic = (k, sz = 24) => `<svg class="ic" width="${sz}" height="${sz}" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-${k}"/></svg>`;
function hash(s) { let x = 2166136261; for (const c of s) { x ^= c.charCodeAt(0); x = Math.imul(x, 16777619); } return x >>> 0; }
function rng(seed) { let a = seed >>> 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffled(arr, key) { const r = rng(S.seed ^ hash(key)); const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

let cleanups = [];
function tween(ms, fn, done) {
  if (REDUCED) { fn(1); if (done) done(); return; }
  let stopped = false, raf; const t0 = performance.now();
  const f = t => { if (stopped) return; const p = Math.min(1, (t - t0) / ms); fn(p); if (p < 1) raf = requestAnimationFrame(f); else if (done) done(); };
  raf = requestAnimationFrame(f);
  cleanups.push(() => { stopped = true; cancelAnimationFrame(raf); });
}
const ease = p => 1 - Math.pow(1 - p, 3);

function burst(x, y, colors, n = 18) {
  if (REDUCED) return;
  for (let i = 0; i < n; i++) {
    const p = h('i', { class: 'conf' });
    const a = Math.random() * Math.PI * 2, d = 40 + Math.random() * 90;
    p.style.cssText = `left:${x}px;top:${y}px;background:${colors[i % colors.length]};--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d - 40}px;--r:${Math.random() * 720 - 360}deg`;
    document.body.append(p);
    setTimeout(() => p.remove(), 1000);
  }
}
const themeColors = () => ['#fbbf24', '#ef4444', '#3b82f6', '#22c55e', '#a855f7', '#ec4899'];
function burstAt(el, n) { const r = el.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + Math.min(r.height / 2, 80), themeColors(), n); }
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 3200); }

const store = {
  get() { try { return JSON.parse(localStorage.getItem('wdl-v1')); } catch { return null; } },
  set(v) { try { localStorage.setItem('wdl-v1', JSON.stringify(v)); } catch { /* storage unavailable: progress lives only in this tab */ } }
};

/* ---------- content ---------- */
const DIM = {
  physical: { name: 'Physical', color: '#c2410c', soft: '#ffedd5', edge: '#f3c7a8', tag: 'Body & movement',
    def: 'How well your body works and moves: fitness, sleep, nutrition, and staying away from harmful substances.',
    metrics: ['Resting heart rate', 'Blood pressure', 'Hours of sleep', 'Steps per day', 'Minutes of exercise', 'Push-ups in a minute'],
    habits: ['Sleep 8–10 hours', '60 minutes of activity', 'Drink water', 'Eat balanced meals'] },
  mental: { name: 'Mental', color: '#4338ca', soft: '#e0e7ff', edge: '#c3cbf5', tag: 'Thinking & learning',
    def: 'How you think, learn, focus, remember, solve problems and manage the demands on your mind.',
    metrics: ['Minutes of focus', 'Memory-test score', 'Puzzle solving time', 'Problems solved correctly', 'Number of distractions'],
    habits: ['Study with short breaks', 'Silence notifications', 'Learn something new', 'Practice mindfulness'] },
  emotional: { name: 'Emotional', color: '#be185d', soft: '#fce7f3', edge: '#f5bcd7', tag: 'Feelings & coping',
    def: 'Recognizing, expressing and managing your feelings in healthy ways, and bouncing back from setbacks.',
    metrics: ['Daily mood rating', 'Minutes to calm down', 'Feelings you can name', 'Self-confidence rating'],
    habits: ['Name your feeling', 'Breathe slowly', 'Journal', 'Talk to someone you trust'] },
  social: { name: 'Social', color: '#a16207', soft: '#fef3c7', edge: '#ecd28a', tag: 'Relationships & belonging',
    def: 'Building and keeping healthy, respectful relationships and feeling that you belong to a group or community.',
    metrics: ['Trusted people you can turn to', 'Club or team meetings attended', 'Conflicts solved by talking', 'Kind acts or thank-yous'],
    habits: ['Listen well', 'Join a team or club', 'Set healthy boundaries', 'Be kind and inclusive'] },
  environmental: { name: 'Environmental', color: '#15803d', soft: '#dcfce7', edge: '#a8dfb9', tag: 'Places & planet',
    def: 'How the places where you live, learn and play (air, water, noise, safety, nature) affect you, and how you affect them.',
    metrics: ['Air Quality Index (AQI)', 'Noise level in decibels', 'Share of waste recycled', 'Working clean-water fountains'],
    habits: ['Recycle and reuse', 'Cut idling cars', 'Plant trees', 'Report unsafe hazards'] },

function judge(id, ok, wrongKey) {

const stepDone = i => remaining(i) === 0;
function maxReach() { for (let i = 0; i < STEPS.length; i++) if (!stepDone(i)) return i; return STEPS.length - 1; }

    const b = h('button', { class: 'dot', type: 'button', role: 'listitem', 'aria-label': `Step ${i + 1}: ${s.label}`, title: s.label, style: { '--dc': DIM[s.dim].color }, onclick: () => { if (i !== cur && i <= maxReach() && (S.startedAt || i === 0)) go(i); } });
    b.innerHTML = i === 0 ? ic('flag', 16) : i === STEPS.length - 1 ? ic('check', 16) : (ORDER.includes(s.id) ? ic(s.id, 16) : `<span aria-hidden="true">${i}</span>`);

function updateChrome() {
  $('#pts').textContent = fmt(totalPts());
  $('#who').textContent = S.name;
  ORDER.forEach(d => $('#bd-' + d).classList.toggle('on', STOP_ITEMS[d].every(id => st(id).done)));
  const doneCount = STEPS.filter((s, i) => i < STEPS.length - 1 && stepDone(i) && (i > 0 || S.startedAt)).length;
  $('#bar').style.width = (doneCount / (STEPS.length - 1) * 100) + '%';
  const reach = maxReach();
  $$('#dots .dot').forEach((b, i) => {
    b.classList.toggle('cur', i === cur);
    b.classList.toggle('done', i < reach || (i === reach && stepDone(i) && i < STEPS.length - 1 && (i > 0 || !!S.startedAt)));
    b.disabled = !(S.startedAt || i === 0) || i > reach;
    if (i === cur) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
  });
  $('#prev').disabled = cur === 0;
  const next = $('#next'), msg = $('#navmsg'), last = cur === STEPS.length - 1;
  next.textContent = cur === 0 ? 'Start the lab →' : cur === STEPS.length - 2 ? 'See my results →' : 'Next →';
  next.hidden = false;
  let ok;
  if (cur === 0) ok = S.startedAt ? true : nameOk();
  else ok = stepDone(cur);
  if (last) { next.hidden = true; msg.textContent = 'You finished! Scroll down for screenshot steps.'; msg.className = 'nav-msg ready'; return; }
  next.disabled = !ok;
  next.setAttribute('aria-disabled', String(!ok));
  next.classList.toggle('ready', ok && cur > 0);
  if (cur === 0) { msg.textContent = ok ? 'Ready when you are.' : 'Type your name to begin.'; msg.className = 'nav-msg' + (ok ? ' ready' : ''); }
  else if (ok) { msg.textContent = 'Stop complete! Press Next to continue, or Previous to review.'; msg.className = 'nav-msg ready'; }
  else { const n = remaining(cur); msg.textContent = cur === 1 && S.seen.length < 5 ? `Explore all 5 sections of the wheel (${5 - S.seen.length} to go).` : `Finish ${n} more ${n === 1 ? 'item' : 'items'} to unlock Next.`; msg.className = 'nav-msg'; }
}

function onNext() {

function go(i) {

function pipsHtml(it, id) {
  const lab = ['1st try 100%', '2nd try 75%', '3rd try 50%'];
  const p = lab.map((l, i) => {
    let c = 'pip';
    if (it.done && !it.missed && i === it.a - 1) c += ' won';
    else if (i < it.a) c += ' used';
    else if (!it.done && i === it.a) c += ' next';
    return `<span class="${c}">${l}</span>`;
  }).join('');
  const pts = it.done ? `<span class="ptschip">${it.missed ? '0' : '+' + fmt(earned(id))} / ${fmt(ITEMS[id].pts)} pts</span>` : `<span class="ptschip">${fmt(ITEMS[id].pts)} pts</span>`;
  return p + pts;
}
function itemShell(id, promptHtml, body, num) {
  const el = h('section', { class: 'item', 'data-id': id },

    body,
    h('div', { class: 'fb', role: 'status', 'aria-live': 'polite' }));
  el.refresh = () => {
    const it = st(id);
    $('.pips', el).innerHTML = pipsHtml(it, id);
    el.classList.toggle('is-done', it.done);
    el.classList.toggle('is-miss', !!it.missed);
  };
  el.refresh();
  return el;
}
function setFb(el, id, hint) {
  const it = st(id), m = ITEMS[id], fb = $('.fb', el);
  fb.className = 'fb';
  if (!it.a) { fb.innerHTML = ''; return; }
  if (it.done && !it.missed) { fb.classList.add('good'); fb.innerHTML = `<b>✓ Correct${it.a > 1 ? ' on try ' + it.a : ''}!</b> +${fmt(earned(id))} pts. ${esc(m.why)}`; }
  else if (it.done) { fb.classList.add('miss'); fb.innerHTML = `<b>Out of tries (0 pts).</b> Correct answer: <b>${esc(m.answer)}</b>. ${esc(m.why)}`; }
  else { fb.classList.add('bad'); fb.innerHTML = `<b>✗ Not quite.</b> ${hint ? esc(hint) + ' ' : ''}Try again. Your next try is worth ${MULT[it.a] * 100}%.`; }
}
function afterJudge(el, id, ok, hint) {

function mcItem(id, { prompt, options, correct, dimStyle, num }) {
  const it = st(id);
  const grid = h('div', { class: 'opts' + (dimStyle ? ' dimopts' : '') });
  const btns = {};
  options.forEach(o => {
    const b = h('button', { class: 'opt' + (dimStyle ? ' dimopt' : ''), type: 'button', style: { '--oc': o.color || 'inherit' }, onclick: () => pick(o.key) });
    b.innerHTML = o.html; btns[o.key] = b; grid.append(b);
  });
  const el = itemShell(id, prompt, grid, num);
  function paint() {
    options.forEach(o => {
      const b = btns[o.key], wrong = it.wrong.includes(o.key), right = it.done && o.key === correct;
      b.disabled = it.done || wrong;
      b.classList.toggle('is-wrong', wrong);
      b.classList.toggle('is-right', right);
    });
  }
  function pick(k) {

        ghost.dataset.dx = start.x - r.left; ghost.dataset.dy = start.y - r.top;

      if (ghost) {

    return el;
  }

  const face = v => {
    const i = clamp(v, 0, 10);
    const g = Math.round(220 - i * 6), b = Math.round(220 - i * 14), rr = Math.round(240 - (10 - i) * 2);
    $('#fh', host).setAttribute('fill', `rgb(${rr},${g + (10 - i) * 3},${b + (10 - i) * 3})`);
    $('#bl', host).setAttribute('d', `M26 ${40 - (10 - i) * 0.2} L50 ${40 + i * 1.5}`);
    $('#br', host).setAttribute('d', `M94 ${40 - (10 - i) * 0.2} L70 ${40 + i * 1.5}`);
    $('#fm', host).setAttribute('d', `M40 86 Q60 ${100 - i * 3} 80 86`);
    $('#lvl', host).textContent = i.toFixed(1);
    $('#th', host).style.width = i * 10 + '%';
  };
  const drawn = {};
  const legend = () => {
    $('#lg', host).innerHTML = sim.ran.map(k => { const s = STRATS.find(x => x.k === k), rc = recovery(s); return `<div style="--sc:${s.c}"><span class="sw"></span><b>${s.t}:</b> ${rc === null ? 'not calm after 10 minutes (ends at ' + intensity(s, 10).toFixed(1) + ')' : 'calm in ' + rc + ' minutes'}</div>`; }).join('') || '<div style="color:var(--muted)">Run a strategy to see its curve and recovery time.</div>';
  };
  function addCurve(s, animate) {
    if (!drawn[s.k]) {
      const pts = Array.from({ length: 11 }, (_, t) => `${t ? 'L' : 'M'}${X(t)} ${Y(intensity(s, t))}`).join('');
      const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      p.setAttribute('class', 'curve'); p.setAttribute('d', pts); p.setAttribute('stroke', s.c); p.setAttribute('pathLength', '1');
      if (s.dash) p.setAttribute('stroke-dasharray', s.dash);
      $('#curves', host).append(p); drawn[s.k] = p;
      if (animate && !REDUCED) { p.style.strokeDasharray = '1'; p.style.strokeDashoffset = '1'; p.getBoundingClientRect(); p.style.transition = 'stroke-dashoffset 2.2s linear'; p.style.strokeDashoffset = '0'; setTimeout(() => { p.style.strokeDasharray = s.dash; p.style.transition = ''; }, 2300); }
    }
  }
  let playing = false;
  function run(s) {
    if (playing) return; playing = true;
    if (!sim.ran.includes(s.k)) { sim.ran.push(s.k); save(); }
    addCurve(s, true); legend();
    tween(2200, p => { const t = p * 10; face(intensity(s, t)); $('#min', host).textContent = Math.round(t); }, () => { playing = false; });
    if (REDUCED) playing = false;
  }
  STRATS.forEach(s => {
    const b = h('button', { class: 'opt', type: 'button', style: { '--sc': s.c }, onclick: () => run(s) }, h('span', { class: 'sw' }), s.t);
    $('#st', host).append(b);
  });
  sim.ran.forEach(k => addCurve(STRATS.find(s => s.k === k), false));
  legend(); face(8);
  const correct = STRATS.filter(s => recovery(s) !== null).map(s => s.k);
  const boxes = h('div', { class: 'checks' });
  STRATS.forEach(s => boxes.append(h('label', { class: 'chk' }, h('input', { type: 'checkbox', value: s.k }), s.t)));
  return {
    extra: boxes,
    check: () => {
      const sel = $$('input:checked', boxes).map(i => i.value);
      if (!sel.length) return { skip: true, hint: 'Select the strategies you think worked first.' };
      const wrong = sel.filter(k => !correct.includes(k)).length + correct.filter(k => !sel.includes(k)).length;
      return { ok: wrong === 0, hint: wrong ? `${wrong} of your choices are off. Compare each curve to the green calm zone.` : '' };
    },
    lock: locked => {
      $$('input', boxes).forEach(i => { i.disabled = locked; });
      if (locked) $$('.chk', boxes).forEach(l => { const i = $('input', l); i.checked = correct.includes(i.value); l.classList.toggle('rev-right', i.checked); });
    }
  };
};

    h('div', {}, h('span', { class: 'tag' }, 'FINAL LAB · PUT IT ALL TOGETHER'), h('h2', {}, 'Integration Lab: Help Jordan'),
      h('p', {}, 'Real people are never just one dimension. Use everything you learned to read Jordan\'s situation, trace the ripple effects and build a plan that lifts every part of wellness.'),
      h('div', { class: 'skills' }, h('span', {}, 'Identify'), h('span', {}, 'Manipulate'), h('span', {}, 'Integrate')))));
  w.append(h('section', { class: 'panel persona' }, h('div', { class: 'avatar' }, 'J'),
    h('div', {}, h('h3', {}, 'Meet Jordan, 16'), h('p', {}, 'Jordan just moved to a new town. Lately Jordan has been staying up late, skipping lunch with others, feeling anxious before class and noticing the smog outside most days. Jordan\'s grades are slipping.'))));

  // Item 1: match
  const rows = shuffled(JORDAN, 'jmatch');
  const sels = {};
  const mBody = h('div', {});
  rows.forEach(r => {
    const sel = h('select', { 'aria-label': r.text }, h('option', { value: '' }, 'Choose a dimension…'), ...ORDER.map(d => h('option', { value: d }, DIM[d].name)));
    sel.value = sim.match[r.k] || ''; sels[r.k] = sel;
    sel.addEventListener('change', () => { sim.match[r.k] = sel.value; save(); });
    mBody.append(h('div', { class: 'matchrow', 'data-k': r.k }, h('span', {}, r.text), sel));
  });
  w.append(secHead(1, 'Identify: read the metrics'));
  w.append(checkItem('int-match', {
    prompt: 'Match each of Jordan\'s readings to the dimension it measures.', num: 1, body: mBody,
    evaluate: () => {
      if (rows.some(r => !sels[r.k].value)) return { skip: true, hint: 'Choose a dimension for every reading first.' };
      let bad = 0;
      rows.forEach(r => { const ok = sels[r.k].value === r.k; const row = $(`.matchrow[data-k="${r.k}"]`, mBody); row.classList.toggle('good', ok); row.classList.toggle('bad', !ok); if (!ok) bad++; });
      return { ok: bad === 0, hint: bad ? bad + ' of the 5 are in the wrong dimension (highlighted in red).' : '' };
    },
    lock: locked => { if (locked) rows.forEach(r => { sels[r.k].value = r.k; sels[r.k].disabled = true; $(`.matchrow[data-k="${r.k}"]`, mBody).className = 'matchrow good'; }); }
  }));

  // Item 2: ripple
  const rBody = h('div', { class: 'checks' });
  ORDER.forEach(d => { const cb = h('input', { type: 'checkbox', value: d }); cb.checked = sim.ripple.includes(d); cb.addEventListener('change', () => { sim.ripple = $$('input:checked', rBody).map(i => i.value); save(); }); rBody.append(h('label', { class: 'chk', style: { borderColor: DIM[d].color } }, cb, h('span', { html: ic(d, 22) }), DIM[d].name)); });
  const rightSet = ['physical', 'mental', 'emotional', 'social'];
  w.append(secHead(2, 'Integrate: trace the ripple'));
  w.append(checkItem('int-ripple', {
    prompt: 'Jordan sleeps only 5 hours a night. Select <b>every</b> dimension this is likely to affect.', num: 2, body: rBody,
    evaluate: () => {
      const sel = $$('input:checked', rBody).map(i => i.value);
      if (!sel.length) return { skip: true, hint: 'Select at least one dimension.' };
      const ok = sel.length === 4 && rightSet.every(d => sel.includes(d));
      return { ok, hint: ok ? '' : sel.length < 4 ? 'Think about more ways short sleep shows up in Jordan\'s life.' : 'One of your picks is not directly changed by how long Jordan sleeps.' };
    },
    lock: locked => { $$('input', rBody).forEach(i => { i.disabled = locked; }); if (locked) $$('.chk', rBody).forEach(l => { const i = $('input', l); i.checked = rightSet.includes(i.value); l.classList.toggle('rev-right', i.checked); }); }
  }));

  // Item 3: plan
  w.append(secHead(3, 'Manipulate: build a plan'));
  const barsPanel = h('div', { class: 'panel sticky-bars' });
  const bars = {};
  const barWrap = h('div', { class: 'bars' });
  ORDER.forEach(d => {
    const row = h('div', { class: 'bar', style: { '--bc': DIM[d].color } });
    row.innerHTML = `<span class="nm">${ic(d, 18)}${DIM[d].name}</span><div class="btrack"><i class="prev"></i><i class="base"></i><i class="goal" title="Goal: ${GOAL}"></i></div><span class="val"></span>`;
    bars[d] = row; barWrap.append(row);
  });
  barsPanel.append(h('div', { class: 'sortbar', style: { marginBottom: '8px' } }, h('b', {}, 'Jordan\'s wellness'), h('span', { class: 'ptschip', id: 'used' }), h('small', {}, 'Black line = goal of ' + GOAL)), barWrap);
  w.append(barsPanel);
  const preview = () => {
    const v = { ...BASE };
    sim.picks.forEach(id => { const a = ACTIONS.find(x => x.id === id); for (const [k, n] of Object.entries(a.d)) v[k] = clamp(v[k] + n, 0, 100); });
    ORDER.forEach(d => { const r = bars[d]; $('.base', r).style.width = BASE[d] + '%'; $('.prev', r).style.width = v[d] + '%'; $('.val', r).textContent = v[d]; r.classList.toggle('met', v[d] >= GOAL); });
    $('#used', barsPanel).textContent = `${sim.picks.length} of ${PICKS} action points used`;
    return v;
  };
  const actBtns = {};
  const grid = h('div', { class: 'actions' });
  const planDone = () => st('int-plan').done;
  const syncActs = () => ACTIONS.forEach(a => { const b = actBtns[a.id], on = sim.picks.includes(a.id); b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); b.disabled = planDone() || (!on && sim.picks.length >= PICKS); });
  ACTIONS.forEach(a => {
    const b = h('button', { class: 'act', type: 'button', onclick: () => { const i = sim.picks.indexOf(a.id); if (i >= 0) sim.picks.splice(i, 1); else if (sim.picks.length < PICKS) sim.picks.push(a.id); save(); preview(); syncActs(); } },
      h('b', {}, a.t), h('div', { class: 'deltas', html: Object.entries(a.d).map(([k, n]) => `<span class="dl ${n < 0 ? 'neg' : ''}" style="--bc:${DIM[k].color}">${DIM[k].name.slice(0, 4)} ${n > 0 ? '+' : '−'}${Math.abs(n)}</span>`).join('') }));
    actBtns[a.id] = b; grid.append(b);
  });
  const pBody = h('div', {}, h('p', { class: 'lead', style: { fontSize: '.97rem', margin: '0 0 4px' } }, `Choose up to ${PICKS} actions. Each one changes several dimensions, and some choices backfire. Striped bars show Jordan's future wellness. Get every bar past the goal line, then check.`), grid);
  w.append(checkItem('int-plan', {
    prompt: `Build a ${PICKS}-action plan that lifts <b>every</b> dimension to ${GOAL} or higher.`, num: 3, body: pBody,
    evaluate: () => { const v = preview(); const low = ORDER.filter(d => v[d] < GOAL); return { ok: low.length === 0, hint: low.length ? 'Still below the goal: ' + low.map(d => DIM[d].name).join(', ') + '.' : '' }; },
    lock: locked => { if (locked) syncActs(); }
  }));
  preview(); syncActs();

  // Item 4: concept
  w.append(secHead(4, 'Reflect'));
  w.append(mcItem('int-concept', {
    prompt: 'Which statement best describes how the dimensions of wellness work together?', num: 4, correct: 'b',
    options: shuffled([
      { key: 'a', html: 'They are separate, so improving one never affects the others.' },
      { key: 'b', html: 'They overlap, so a change in one often ripples into others.' },
      { key: 'c', html: 'Only physical health can be measured, so it is the only one that matters.' },
      { key: 'd', html: 'Social and environmental wellness are really the same thing.' }], 'concept')
  }));
}

/* ---------- results ---------- */
function renderResults(w) {
  if (!S.finishedAt) { S.finishedAt = Date.now(); save(); setTimeout(() => burst(innerWidth / 2, innerHeight / 3, themeColors(), 60), 600); }
  const total = totalPts();
  const mins = Math.max(1, Math.round((S.finishedAt - S.startedAt) / 60000));
  const when = new Date(S.finishedAt).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
  const byDim = {};
  [...ORDER, 'integration'].forEach(d => { byDim[d] = { got: 0, max: 0 }; });
  const tally = { first: 0, second: 0, third: 0, miss: 0 };
  const ids = Object.keys(ITEMS);
  ids.forEach(id => {
    const m = ITEMS[id], it = st(id);
    byDim[m.dim].got += earned(id); byDim[m.dim].max += m.pts;
    if (it.missed) tally.miss++; else if (it.a === 1) tally.first++; else if (it.a === 2) tally.second++; else tally.third++;
  });
  const ranked = Object.entries(byDim).map(([d, v]) => [d, v.got / v.max]).sort((a, b) => b[1] - a[1]);
  const stops = Object.keys(STOP_ITEMS).map(s => {
    const list = STOP_ITEMS[s], first = list.filter(id => st(id).credit === 1 && st(id).a === 1).length;
    return { s, got: list.reduce((n, id) => n + earned(id), 0), max: STOP_PTS[s], first, n: list.length };
  });
  const good = stops.filter(x => x.first > 0).map(x => `<li><span>${ic('check', 18)}</span><span><b>${STOP_NAME[x.s]}:</b> ${x.first} of ${x.n} correct on the first try (${fmt(x.got)} / ${x.max} pts)</span></li>`).join('');
  const review = ids.filter(id => st(id).credit < 1).map(id => {
    const m = ITEMS[id], it = st(id), half = !it.missed;
    return `<li class="${half ? 'half' : ''}"><b>${esc(m.title)}</b><small>${it.missed ? 'Missed after 3 tries (0 pts)' : 'Correct on try ' + it.a + ' (' + fmt(earned(id)) + ' of ' + fmt(m.pts) + ' pts)'} · ${esc(STOP_NAME[m.stop])}</small><small><b style="display:inline">Answer:</b> ${esc(m.answer)}</small></li>`;
  }).join('');
  const C = 2 * Math.PI * 86;
  w.append(h('section', { class: 'report', id: 'report' },
    h('div', { class: 'rep-head' }, h('h2', {}, 'Wellness Dimensions Lab · Extra Credit Report'),
      h('div', { class: 'meta' }, h('div', { class: 'nm' }, S.name + (S.period ? ' · ' + S.period : '')), h('div', {}, 'Completed ' + when + ' · ' + mins + ' min'))),
    h('div', { class: 'rep-top' },
      h('div', { class: 'ring', html: `<svg width="210" height="210" viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="86" fill="none" stroke="#e5e7eb" stroke-width="16"/><circle id="rg" cx="100" cy="100" r="86" fill="none" stroke="var(--accent)" stroke-width="16" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg><div class="rt"><div><b id="rs">0</b><small>out of 100 points</small></div></div>` }),
      h('div', {},
        h('div', { class: 'celebrate' }, total >= 90 ? 'Outstanding work!' : total >= 75 ? 'Great job!' : total >= 50 ? 'Solid effort. Review the notes below.' : 'You finished. Use the review notes to learn from each miss.'),
        h('div', { class: 'dimbars', id: 'db', style: { marginTop: '8px' } }),
        h('div', { class: 'tally', html: `<span>1st try (100%): ${tally.first}</span><span>2nd try (75%): ${tally.second}</span><span>3rd try (50%): ${tally.third}</span><span>Missed (0%): ${tally.miss}</span>` }))),
    h('div', { class: 'rep-cols' },
      h('div', {}, h('h3', {}, '✓ What you did well'), h('ul', { class: 'good-list', html: (good || '<li>Keep practicing: every try builds understanding.</li>') + `<li><span>${ic('flag', 18)}</span><span><b>Strongest area:</b> ${DIM[ranked[0][0]].name} (${Math.round(ranked[0][1] * 100)}%)</span></li>` })),
      h('div', {}, h('h3', {}, '↻ What to review'), h('ul', { class: 'rev-list', html: review || '<li class="half" style="border-color:#16a34a;background:#f0fdf4">Nothing to review. Every item was correct on the first try!</li>' })))));
  const db = $('#db', w);
  Object.entries(byDim).forEach(([d, v]) => {
    const row = h('div', { class: 'bar', style: { '--bc': DIM[d].color } });
    row.innerHTML = `<span class="nm">${ic(d, 18)}${DIM[d].name}</span><div class="btrack"><i class="base"></i></div><span class="val">${fmt(v.got)}/${fmt(v.max)}</span>`;
    db.append(row);
  });
  w.append(h('section', { class: 'panel noprint shot' }, h('div', { html: ic('flag', 40) }),
    h('div', {}, h('h3', {}, 'Turn it in'), h('p', {}, 'Take a screenshot of the whole report above (your name, score, and review notes must be visible) and submit it in your assignment. Chromebook: press ', h('b', {}, 'Ctrl + Shift + Show Windows'), ' (the rectangle key), then drag over the report. If it is too tall, press ', h('b', {}, 'Ctrl and −'), ' to zoom out first, or take two screenshots. Windows/Mac: Snipping Tool or ', h('b', {}, 'Shift + Cmd + 4'), '.'),
      h('div', { class: 'check-row' }, h('button', { class: 'btn primary', type: 'button', onclick: () => window.print() }, 'Print / save as PDF'), h('button', { class: 'btn', type: 'button', onclick: () => go(2) }, 'Review the labs')))));
  tween(1600, p => {
    const e = ease(p);
    $('#rs', w).textContent = fmt(total * e);
    $('#rg', w).setAttribute('stroke-dashoffset', C * (1 - total / 100 * e));
    $$('.btrack .base', db).forEach((b, i) => { const v = Object.values(byDim)[i]; b.style.width = (v.got / v.max * 100 * e) + '%'; });
  });
}

/* ---------- boot ---------- */
buildChrome();
(function boot() {
  let i = S.startedAt ? clamp(S.step, 0, maxReach()) : 0;
  go(i);
})();
</script>
</body>
</html>
