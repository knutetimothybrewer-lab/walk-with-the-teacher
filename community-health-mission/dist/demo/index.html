<title>Community Health Mission</title>

<style>
:root{
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --bg:#f5f7fa; --surface:#ffffff; --surface2:#eef2f6; --ink:#16212e; --ink2:#44566a; --line:#cfd8e3;

  --mod-a:#0f766e; --mod-b:#e6f4f1;
  --r:12px; --r-s:8px; --sp:8px; --dur:260ms; --shadow:0 1px 2px rgba(15,30,50,.08),0 4px 14px rgba(15,30,50,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0f1720; --surface:#17212d; --surface2:#1f2b39; --ink:#e8eef5; --ink2:#a8b7c7; --line:#33445a; --ok-bg:#12331f; --bad-bg:#3b1717; --warn-bg:#3a2a0d; --info-bg:#16264d; --ok:#7ee0a5; --bad:#ffb4b4; --warn:#ffd08a; --info:#b9c9ff; --focus:#8fb0ff; }
}
html[data-motion="off"] *, html[data-motion="off"] *::before, html[data-motion="off"] *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
@media (prefers-reduced-motion: reduce){ html[data-motion="auto"] *, html[data-motion="auto"] *::before, html[data-motion="auto"] *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important} }

*{box-sizing:border-box}
html{font-size:100%}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.5;font-size:16px}

.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.sr-only,.sr-h{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}

.btn{font:600 .95rem var(--font);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:var(--r-s);cursor:pointer;min-height:40px}
.btn:hover{background:var(--surface2)}.btn:disabled{opacity:.55;cursor:not-allowed}

.login{display:grid;grid-template-columns:1.1fr 1fr;gap:24px;align-items:start;padding-top:16px}

.tsteps{padding-left:1.3em}.tsteps li{margin:6px 0}

.mhead h1{color:var(--mod-a);margin:0}.mh-guide{flex:none;animation:arrive 600ms ease-out}@keyframes arrive{from{transform:translateX(-24px);opacity:0}}
.mission{}.mhead .mission{margin:.3em 0;display:block;border:0;background:none;padding:0}
.mgrid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;align-items:start}

.pills{display:flex;gap:6px;flex-wrap:wrap}.pill{position:relative}

.order{list-style:none;padding:0;margin:0}.oi{display:flex;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:var(--r-s);margin:4px 0;background:var(--surface)}
.oi.dragging{opacity:.5}.grip{color:var(--ink2);cursor:grab}.oi-t{flex:1}.oi-b{display:flex;gap:4px}.mini{min-width:34px;min-height:34px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:6px;cursor:pointer;font-weight:800}
.num{width:9em;padding:8px;border:1px solid var(--line);border-radius:var(--r-s);font:inherit;background:var(--surface);color:var(--ink)}.numrow{display:flex;gap:8px;align-items:center;margin-top:4px}.numlab{font-weight:600}
.ctlgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}.ctl{border:1px solid var(--line);border-radius:var(--r-s);padding:6px 8px;margin:0;min-width:0}.ctl legend{font-weight:700;font-size:.88rem;padding:0 4px}
.optgrid{display:block}.budgetgrid .opt{align-items:center}
.bbar{height:12px;background:var(--surface2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}.bfill{height:100%;background:var(--mod-a);width:0;transition:width var(--dur)}.bbar.over .bfill{background:var(--bad)}

.minimap{margin:6px 0}.rbmap{width:100%;height:auto;border:1px solid var(--line);border-radius:8px;display:block}
.spot{cursor:pointer}.spot circle{transition:stroke var(--dur)}.spot:hover circle,.spot.act circle{stroke:#1d4ed8;stroke-width:4}.spot:focus-visible{outline:none}.spot:focus-visible circle{stroke:#1d4ed8;stroke-width:5}
.infocard,.callout{background:var(--info-bg);color:var(--info);border:1px solid var(--info);border-radius:var(--r-s);padding:8px 12px;margin:8px 0}

.seg{display:inline-flex;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:6px 0;flex-wrap:wrap}.segopt,.segbtn{position:relative;padding:6px 12px;font:600 .85rem var(--font);background:var(--surface);color:var(--ink);cursor:pointer;border:0;border-right:1px solid var(--line)}
.segopt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}.segopt:has(input:checked),.segbtn[aria-pressed=true]{background:var(--mod-a);color:#fff}.segopt:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:-3px}
.feedback{margin:10px 0}.fbox{border-radius:var(--r-s);padding:9px 12px;border:1px solid}

.fb.ok{color:var(--ok);font-weight:700}.fb.warn{color:var(--warn);font-weight:700}
.qnav{display:flex;justify-content:space-between;margin-top:12px}

.big{font-size:1.1rem;font-weight:800;margin:4px 0}

.meter{margin:8px 0;padding:8px 12px;background:var(--surface2);border-radius:var(--r-s);border:1px solid var(--line)}.mtitle{font-weight:700;font-size:.85rem}.mrowbars{display:flex;gap:4px;margin:4px 0}.mbar{height:14px;flex:1;background:#d6dde6;border-radius:3px}.mbar.on.l0{background:#2e9d5b}.mbar.on.l1{background:#d9a400}.mbar.on.l2{background:#e8710a}.mbar.on.l3{background:#c0262d}.mtext{font-weight:700}
.stage{width:100%;height:auto;border-radius:8px;border:1px solid var(--line);margin:6px 0;display:block}.nchart,.bars,.scatter{width:100%;height:auto;max-width:560px}
.aqikey{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}.aqi{padding:3px 8px;border-radius:6px;font-size:.78rem;font-weight:700;border:1px solid rgba(0,0,0,.3)}
.ctlrow{display:flex;gap:10px;flex-wrap:wrap}.sel{display:flex;flex-direction:column;font-weight:600;font-size:.85rem;gap:2px}.sel select{padding:6px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;max-width:240px}

.post{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface);max-width:520px;margin:8px 0;box-shadow:var(--shadow)}.phead{display:flex;gap:10px;align-items:center}.avatar{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:#6d28d9;color:#fff;font-weight:800}
.pbody{margin:8px 0;line-height:1.8}.ptags{color:#1d4ed8;font-size:.85rem}.pfoot{font-size:.85rem;margin-top:6px;color:var(--ink2)}
.cue{font:inherit;background:none;border:0;border-bottom:2px dotted #6d28d9;color:inherit;cursor:pointer;padding:0 1px;display:inline}.cue:hover{background:#ece3fd;color:#1b1038}.cue.all{background:#ece3fd;color:#1b1038;border-bottom:2px solid #6d28d9;margin:1px 2px}.kindtag{display:inline-block;font-size:.65rem;font-weight:800;background:#6d28d9;color:#fff;border-radius:4px;padding:0 4px;margin-left:3px;vertical-align:middle}
.prod{display:flex;gap:10px;margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}.can{font-size:2rem;display:grid;place-items:center;width:56px;background:#e0f2fe;border-radius:10px}.label{font-size:.82rem;border:2px solid #16212e;padding:4px 8px;background:#fff;color:#16212e;flex:1}

.srcgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}.scard{border:1px solid var(--line);border-radius:var(--r-s);padding:8px 10px;background:var(--surface)}.scard dl{margin:6px 0;font-size:.82rem;display:grid;grid-template-columns:70px 1fr;gap:2px 6px}.scard dt{font-weight:700}.scard dd{margin:0}.shead{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px;margin:8px 0}.bcard{border:2px dashed var(--line);border-radius:var(--r-s);padding:8px;background:var(--surface);min-height:80px;font-size:.88rem}.bcard.filled{border-style:solid;border-color:var(--mod-a);background:var(--mod-b);color:#16212e}.bcard.weak{border-color:var(--warn);background:var(--warn-bg);color:var(--warn)}.bcard.pop{animation:pop 500ms ease-out}@keyframes pop{from{transform:translateY(14px) scale(.96);opacity:.2}}
.bk{font-weight:800;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em}.chosen{color:var(--ok);text-transform:none}.wk{text-transform:none}
.poster{border:2px solid var(--mod-a);border-radius:var(--r-s);padding:8px 12px;background:var(--surface);margin:8px 0;font-size:.88rem}.pk{font-weight:800;color:var(--mod-a)}.prow{margin:3px 0}
.review .rv{margin:10px 0}.rvl{list-style:none;padding:0}.rvl li{display:flex;gap:10px;justify-content:space-between;border-bottom:1px solid var(--line);padding:5px 0;flex-wrap:wrap}.rvs{font-weight:700;color:var(--ink2)}.rvs.ok{color:var(--ok)}.rvs.bad{color:var(--bad)}
.chk{display:flex;align-items:flex-start;gap:8px;margin:8px 0}.chk input{margin-top:.3em;width:18px;height:18px}
.res-head{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}.scorebox{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:8px 0}.scorebox .big{font-size:3rem;color:var(--brand);margin:0}.stats{display:flex;gap:14px;flex-wrap:wrap}
.statusrow{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.mb{margin:8px 0}.mbl{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.9rem}.mbt{height:14px;background:var(--surface2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}.mbf{height:100%}
.rvd{border:1px solid var(--line);border-radius:var(--r-s);padding:6px 10px;margin:6px 0;background:var(--surface)}.rvd summary{cursor:pointer;font-weight:600}.answer{white-space:pre-wrap;font:inherit;background:var(--surface2);padding:6px 8px;border-radius:6px;margin:4px 0}
dl.plan{display:grid;grid-template-columns:150px 1fr;gap:4px 12px}dl.plan dt{font-weight:800}dl.plan dd{margin:0}
.previewlabel{} .answerpanel{margin-top:12px;border:2px dashed #6d28d9;border-radius:var(--r-s);padding:8px 12px;background:var(--surface)}.ansbox dl.plan{grid-template-columns:140px 1fr}
.teacher .tcontent{margin-top:8px}.loginform{max-width:460px}
.pending[hidden]{display:none}
@media (max-width:1100px){.mgrid,.hub,.login{grid-template-columns:1fr}.cols2{grid-template-columns:1fr}}
@media (max-width:640px){main{padding:8px}dl.plan{grid-template-columns:1fr}.scorebox .big{font-size:2.4rem}}
@media print{.topbar,.noprint,.previewbar,.demobar,.skip,.qnav,details:not([open])>*:not(summary){display:none!important}body{background:#fff}.card,.res-head{box-shadow:none;border:1px solid #999;break-inside:avoid}}
.timechip{font-size:.85rem;font-variant-numeric:tabular-nums;font-weight:700;padding:2px 10px;border-radius:99px;border:1px solid var(--ink2);background:var(--surface2)}
.timechip.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.timechip.crit{background:#b3261e;color:#fff;border-color:#b3261e}

.timebanner[hidden]{display:none}

    }

    // ------------------------------------------------------------------ teacher

    }

    }
    // Fill a preview session so outcomes can be inspected: mode = first | second | third | exhaust
