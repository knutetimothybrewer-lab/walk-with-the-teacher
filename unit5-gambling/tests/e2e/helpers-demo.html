<script type="module">
// Renders every question helper against stand-in items (the real wording lives in the private bank).  Development only.
import { renderBlocks } from '../../js/blocks.js';
import { skinFor, helperFor } from '../../js/helpers.js';
import { h } from '../../js/util.js';
const app = document.getElementById('app'), q = new URLSearchParams(location.search).get('only');
const items = [
  { id: 'c1-ledger', stim: [{ k: 'table', cap: 'Your ledger (fictional)', cols: ['Bet', 'Odds', 'Stake', 'Result', 'Net'], rows: [['Waves to win', '−250', '$50', 'Won', '+$20'], ['Falcons to win', '−280', '$50', 'Lost', '−$50'], ['Raptors to win', '+130', '$20', 'Lost', '−$20']] }] },
  { id: 'c1-market', stim: [{ k: 'table', cap: 'Contracts (fictional)', cols: ['Contract', 'Yes price', 'No price', 'Chance'], rows: [['Rain in Metro on Friday?', '62¢', '38¢', '62%'], ['Gas above $4 by June?', '25¢', '75¢', '25%']] }] },
  { id: 'c2-basics', prompt: 'A bag holds 3 red marbles, 5 blue marbles and 2 green marbles.', stim: [] },
  { id: 'c4-implied', stim: [] }, { id: 'c4-eval', stim: [] }, { id: 'c5-riskfree', stim: [] }, { id: 'c5-match', stim: [] }
].filter((i) => !q || i.id === q);
for (const it of items) app.append(h('h2', null, it.id), skinFor(it, renderBlocks(it.stim)), helperFor(it) || '');
window.__ready = true;
