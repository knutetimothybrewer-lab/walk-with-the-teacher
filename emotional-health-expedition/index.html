<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="light">
<title>Emotional Health Expedition</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M2 28 L12 10 L18 20 L22 14 L30 28Z' fill='%232f7d5b'/%3E%3Ccircle cx='24' cy='7' r='4' fill='%23f2b33d'/%3E%3C/svg%3E">
<style>
:root{
  --ink:#1d2b2a; --muted:#5b6b69; --line:#d9e2df; --card:#ffffff; --soft:#f4f8f6;
  --green:#2f7d5b; --green2:#e3f3ea; --blue:#2c6fb7; --blue2:#e5effa;
  --amber:#b7791f; --amber2:#fdf3df; --red:#c0392b; --red2:#fbe6e3;
  --purple:#6b4fa8; --purple2:#efe9fa;
  --sky1:#bfe3f5; --sky2:#f6efe0;
  --sans:"Nunito","Varela Round",ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --serif:Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.55 var(--sans);
  background:linear-gradient(180deg,var(--sky1) 0%,#dcefef 45%,var(--sky2) 100%);background-attachment:fixed;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}

/* scenery: layered, parallax, cinematic light */
body{transition:background-color 1s}
body[data-sky="p1"]{--sky1:#9fd4f2;--sky2:#fdf1dc;--sun:#fff3c4;--glow:rgba(255,236,170,.75)}
body[data-sky="p2"]{--sky1:#f7b98a;--sky2:#fde6c4;--sun:#ffe3a0;--glow:rgba(255,190,120,.8)}
body[data-sky="end"]{--sky1:#7b6fc4;--sky2:#f7b7a3;--sun:#ffd2a1;--glow:rgba(255,170,150,.8)}
#sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#sky .sun{position:absolute;top:7vh;right:12vw;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#fff 0,var(--sun) 45%,rgba(255,255,255,0) 72%);box-shadow:0 0 120px 60px var(--glow)}
#sky .rays{position:absolute;top:calc(7vh - 340px);right:calc(12vw - 340px);width:800px;height:800px;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.16) 0 6deg,rgba(255,255,255,0) 6deg 18deg);-webkit-mask:radial-gradient(circle,#000 20%,transparent 68%);mask:radial-gradient(circle,#000 20%,transparent 68%);animation:spin 120s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cloud{position:absolute;left:-260px;width:220px;height:80px;animation:drift linear infinite;filter:drop-shadow(0 10px 14px rgba(60,90,120,.18))}
.cloud i{position:absolute;border-radius:50%;background:radial-gradient(circle at 45% 30%,#fff 55%,#e3ebf3 100%)}
.cloud i:nth-child(1){width:90px;height:70px;left:30px;top:6px}.cloud i:nth-child(2){width:110px;height:90px;left:80px;top:-14px}.cloud i:nth-child(3){width:80px;height:58px;left:150px;top:18px}
.cloud i:nth-child(4){width:200px;height:44px;left:10px;top:36px;border-radius:30px;background:linear-gradient(#fff,#e1e9f2)}
@keyframes drift{to{transform:translateX(calc(100vw + 520px))}}
#scenery{position:fixed;inset:auto 0 0 0;height:46vh;min-height:260px;pointer-events:none;z-index:0}
#scenery svg{width:100%;height:100%;display:block;overflow:visible}
#scenery .lay{transition:transform .25s ease-out}
/* layout */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.88);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top .in{max-width:1080px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:800;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.brand svg{width:26px;height:26px}
.prog{flex:1;min-width:140px;display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
.bar{flex:1;height:10px;background:#e6ecea;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#5bb98c);border-radius:99px;transition:width .6s}
.helpbtn{background:var(--red);color:#fff;border:0;border-radius:99px;padding:6px 14px;font-weight:700;cursor:pointer;font-size:.9rem}
.guidebtn{background:var(--blue2);color:var(--blue);border:1px solid #c6d9ef;border-radius:99px;padding:6px 14px;font-weight:700;cursor:pointer;font-size:.9rem}
main:focus{outline:none}
main{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:18px 16px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 8px 30px rgba(30,60,50,.10)}
h1,h2,h3{line-height:1.2;margin:0 0 .5em}
h1{font-size:clamp(1.6rem,4vw,2.4rem)}
h2{font-size:1.35rem}
h3{font-size:1.08rem}
p{margin:0 0 .8em}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 20px;font-weight:700;cursor:pointer;background:var(--green);color:#fff;box-shadow:0 3px 0 #1f5a40;transition:transform .1s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #1f5a40}
.btn[disabled]{background:#a9b8b3;box-shadow:0 3px 0 #8a9893;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--green);border:2px solid var(--green);box-shadow:none}
.btn.blue{background:var(--blue);box-shadow:0 3px 0 #1d4f85}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.78rem;font-weight:700;background:var(--soft);border:1px solid var(--line);color:var(--muted)}
.dots{display:inline-flex;gap:3px;vertical-align:middle}.dots b{width:9px;height:9px;border-radius:50%;background:#d5dedb}.dots b.on{background:var(--amber)}
input[type=text]{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:#fff}
input[type=text]:focus{border-color:var(--green);outline:none}
label.f{display:block;font-weight:700;margin:12px 0 4px}
.fade{animation:fade .45s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* start */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:22px;align-items:center}
@media (max-width:820px){.hero{grid-template-columns:1fr}}
.heroart svg{width:100%;height:auto;display:block}
.howto{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
@media (max-width:600px){.howto{grid-template-columns:1fr}}
.howto div{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.92rem}
.howto b{display:block;font-size:1rem}

/* flip cards */
.flips{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:760px){.flips{grid-template-columns:repeat(2,1fr)}}
@media (max-width:460px){.flips{grid-template-columns:1fr}}
.flip{perspective:900px;height:200px;cursor:pointer;border:0;background:none;padding:0;text-align:left}
.flip .inner{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip.on .inner{transform:rotateY(180deg)}
.flip .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;padding:14px;display:flex;flex-direction:column;border:2px solid var(--line)}
.flip .front{background:#fff;align-items:center;justify-content:center;text-align:center}
.flip .front .ic{font-size:2.4rem}
.flip .front b{font-size:1.2rem}
.flip .back{transform:rotateY(180deg);background:var(--soft);font-size:.88rem;overflow:auto}
.flip .back b{font-size:1rem;margin-bottom:4px}
.flip .back ul{margin:0;padding-left:18px}
.diisrow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
@media (max-width:760px){.diisrow{grid-template-columns:repeat(2,1fr)}}
.diisrow div{border-radius:14px;padding:12px;background:var(--blue2);border:1px solid #c6d9ef}
.diisrow .big{font-size:1.8rem;font-weight:900;color:var(--blue);line-height:1}

/* map */
.mapwrap{position:relative}
.map svg{width:100%;height:auto;display:block;border-radius:16px}
.stop{cursor:pointer}
.stop circle.c{transition:r .2s}
.stop:hover circle.c{r:19}
.stop.locked{cursor:not-allowed}
#hiker{transition:transform 1.4s cubic-bezier(.5,0,.3,1)}
.hikerbob{animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);margin-top:10px}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-1px;background:var(--c)}

/* stage */
.stagehead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px;padding:14px 18px;border-radius:18px;color:#fff;background:var(--region);box-shadow:0 8px 30px rgba(30,60,50,.15)}
.stagehead h2{margin:0;font-size:1.3rem}
.stagehead .pill{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.35);color:#fff}
.stagehead .dots b{background:rgba(255,255,255,.35)}.stagehead .dots b.on{background:#ffd166}
.person{text-align:center;position:sticky;top:70px}
@media (max-width:820px){.person{position:static}}
.avbox{position:relative;cursor:pointer;border:0;background:none;padding:0;width:100%;max-width:190px;margin:0 auto;display:block}
.avbox svg{width:100%;height:auto;display:block}
.bubble{position:relative;background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 12px;font-size:.92rem;font-style:italic;margin:0 auto 10px;max-width:260px;min-height:48px;display:flex;align-items:center;justify-content:center}
.bubble::after{content:"";position:absolute;bottom:-10px;left:50%;margin-left:-8px;border:8px solid transparent;border-top-color:#fff;border-bottom:0}
.bubble.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
.tapme{font-size:.8rem;color:var(--muted)}
.profile{margin-top:8px}
.profile b{font-size:1.15rem}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 0;justify-content:center}
.steps span{font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:99px;background:#eef2f1;color:var(--muted);border:1px solid var(--line)}
.steps span.cur{background:var(--amber2);color:var(--amber);border-color:#f0d9a8}
.steps span.ok{background:var(--green2);color:var(--green);border-color:#bfe2cf}

/* blog */
.blog{background:#fffdf8;border:1px solid #eadfcb;border-radius:18px;overflow:hidden;box-shadow:0 8px 30px rgba(60,50,30,.10)}
.blog .bhead{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#fff;border-bottom:1px solid #eee3d0}
.blog .bhead .mini{width:40px;height:40px;border-radius:50%;overflow:hidden;background:#eef}
.blog .bhead .mini svg{width:100%;height:100%}
.blog .bhead .who b{display:block;line-height:1.1}
.blog .bhead .who small{color:var(--muted)}
.blog .bbody{padding:16px 20px;font-family:var(--serif);font-size:1.04rem;line-height:1.7}
.blog .bbody h3{font-family:var(--sans);font-size:1.25rem;margin-bottom:.6em}
.blog .bfoot{display:flex;gap:14px;align-items:center;padding:10px 18px;border-top:1px solid #eee3d0;background:#fff;font-size:.9rem;color:var(--muted);flex-wrap:wrap}
.heart{border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 12px;cursor:pointer}
.heart.on{color:#d6336c;border-color:#f3b6cb;background:#fff0f5}
.comment{padding:10px 18px 14px;background:#fff;font-size:.92rem;border-top:1px dashed #eee3d0}
.comment b{color:var(--blue)}
.s{border-radius:6px;transition:background .2s,box-shadow .2s;padding:1px 2px;margin:0 -2px}
.tagging .s{cursor:pointer;background:rgba(44,111,183,.06);box-shadow:inset 0 -2px 0 rgba(44,111,183,.25)}
.tagging .s:hover{background:rgba(44,111,183,.14)}
.s.sel{background:#ffe9a8!important;box-shadow:inset 0 -2px 0 var(--amber)!important}
.s.no{text-decoration:line-through;text-decoration-color:var(--red);opacity:.55;cursor:not-allowed}
.s.clue{background:#d9f2e4;box-shadow:inset 0 -2px 0 var(--green)}
.p2post{border:2px solid var(--purple);}
.p2post .bhead{background:var(--purple2)}
.oldpost{margin-top:12px}
details.reread{margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px}
details.reread summary{cursor:pointer;font-weight:700;color:var(--blue)}
details.reread .bbody{padding:10px 0 0;font-family:var(--serif)}

/* task */
.task{margin-top:18px}
.task .q{font-weight:700;font-size:1.08rem}
.attempt{display:inline-flex;gap:6px;align-items:center;font-size:.85rem;color:var(--muted);margin-left:8px}
.attempt i{width:12px;height:12px;border-radius:50%;background:#dfe6e3;display:inline-block}
.attempt i.used{background:var(--red)}
.attempt i.won{background:var(--green)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
@media (max-width:600px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{border:2px solid var(--line);background:#fff;border-radius:14px;padding:14px 10px;cursor:pointer;text-align:center;font-weight:700;transition:transform .12s,border-color .12s}
.tile:hover:not([disabled]){transform:translateY(-2px);border-color:var(--blue)}
.tile .ic{font-size:1.7rem;display:block}
.tile.sel{border-color:var(--blue);background:var(--blue2)}
.tile[disabled]{opacity:.4;cursor:not-allowed;text-decoration:line-through}
.tile.right{border-color:var(--green);background:var(--green2);opacity:1;text-decoration:none}
.opts{display:grid;gap:8px;margin:12px 0}
.opt{border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left}
.opt:hover:not([disabled]){border-color:var(--blue)}
.opt.sel{border-color:var(--blue);background:var(--blue2)}
.opt[disabled]{opacity:.45;cursor:not-allowed;text-decoration:line-through}
.opt.right{border-color:var(--green);background:var(--green2);opacity:1;text-decoration:none}
.diis{display:grid;gap:12px;margin:12px 0}
.drow{border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff}
.drow.bad{border-color:var(--red);background:var(--red2)}
.drow.good{border-color:var(--green);background:var(--green2)}
.drow h4{margin:0 0 6px;font-size:.98rem;display:flex;align-items:center;gap:8px}
.drow h4 .L{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--blue);color:#fff;font-weight:900}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;cursor:pointer;font-size:.9rem}
.chip:hover:not([disabled]){border-color:var(--blue)}
.chip.sel{border-color:var(--blue);background:var(--blue);color:#fff}
.chip.right{border-color:var(--green);background:var(--green);color:#fff}
.chip[disabled]{cursor:default}
.rowhint{font-size:.86rem;margin-top:6px;color:#7d2a20}
.sorts{display:grid;gap:10px;margin:12px 0}
.scard{border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;transition:border-color .2s,background .2s}
@media (max-width:640px){.scard{grid-template-columns:1fr}}
.scard.b0{border-color:#9fd3b6;background:#f3fbf6}.scard.b1{border-color:#efd08f;background:#fffaf0}.scard.b2{border-color:#eca79e;background:#fff4f2}
.scard.bad{box-shadow:0 0 0 3px var(--red)}
.scard .why{grid-column:1/-1;font-size:.86rem;color:var(--muted)}
.bins{display:flex;gap:6px;flex-wrap:wrap}
.bin{border:2px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px;cursor:pointer;font-size:.85rem;font-weight:700}
.bin.k0.sel{background:var(--green);border-color:var(--green);color:#fff}
.bin.k1.sel{background:var(--amber);border-color:var(--amber);color:#fff}
.bin.k2.sel{background:var(--red);border-color:var(--red);color:#fff}
.bin[disabled]{cursor:default}
.tally{display:flex;gap:10px;flex-wrap:wrap;font-size:.88rem}
.tally span{padding:4px 10px;border-radius:99px;font-weight:700}
.fb{margin-top:14px;border-radius:14px;padding:14px 16px;animation:fade .35s}
.fb.good{background:var(--green2);border:2px solid #a9dbbf}
.fb.bad{background:var(--amber2);border:2px solid #f0d9a8}
.fb.reveal{background:var(--blue2);border:2px solid #c6d9ef}
.fb h4{margin:0 0 6px;font-size:1.02rem}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.stagedone{text-align:center;padding:26px}
.stagedone .badge{font-size:3rem;animation:pop .6s}
.safety{margin-top:14px;border-left:5px solid var(--red);background:var(--red2);padding:10px 14px;border-radius:10px;font-size:.92rem}

/* modal */
.modal{position:fixed;inset:0;z-index:100;background:rgba(20,30,30,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.modal .card{max-width:640px;width:100%;max-height:88vh;overflow:auto;position:relative}
.modal .x{position:absolute;top:10px;right:12px;border:0;background:var(--soft);border-radius:50%;width:36px;height:36px;font-size:1.2rem;cursor:pointer}
.gtable{width:100%;border-collapse:collapse;font-size:.9rem}
.gtable td,.gtable th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
.hotline{display:grid;gap:8px;margin:10px 0}
.hotline div{background:var(--soft);border-radius:12px;padding:10px 12px;border:1px solid var(--line)}
.hotline b{font-size:1.1rem}

/* results */
.results{max-width:820px;margin:0 auto}
.rtop{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.stamp{display:inline-block;border:4px solid var(--green);color:var(--green);font-weight:900;font-size:1.4rem;padding:6px 16px;border-radius:12px;transform:rotate(-4deg);letter-spacing:.06em}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpis div{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.kpis b{display:block;font-size:1.5rem;line-height:1.1}
.kpis small{color:var(--muted)}
.rtable{width:100%;border-collapse:collapse;font-size:.9rem}
.rtable th,.rtable td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:left}
.rtable td.c{text-align:center}
.mark{display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:8px;font-weight:800;font-size:.8rem;padding:0 4px}
.mark.a1{background:var(--green);color:#fff}.mark.a2{background:#6fbf93;color:#fff}.mark.a3{background:var(--amber);color:#fff}.mark.a0{background:#cfd8d5;color:#445}
.shot{margin-top:16px;padding:14px;border-radius:14px;background:#fff7d6;border:2px dashed var(--amber);font-weight:700;text-align:center}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:700px){.rgrid{grid-template-columns:1fr}}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.1rem;letter-spacing:.12em;background:#1d2b2a;color:#fff;padding:4px 10px;border-radius:8px}

/* avatar animation */
.av .body{transform-origin:100px 256px;transform-box:view-box;animation:breathe 4s ease-in-out infinite}
.av .head{transform-origin:100px 150px;transform-box:view-box}
.av .armL,.av .armR,.av .legL,.av .legR{transform-box:view-box}
.av .armL{transform-origin:60px 184px;animation:armL 4s ease-in-out infinite}
.av .armR{transform-origin:140px 184px;animation:armR 4s ease-in-out infinite}
@keyframes armL{50%{transform:rotate(2deg)}}
@keyframes armR{50%{transform:rotate(-2deg)}}
.m-anx .legR{transform-origin:118px 250px;animation:tap .5s ease-in-out infinite}
@keyframes tap{50%{transform:rotate(-4deg)}}
.m-panic .armL,.m-panic .armR,.m-panic .legs{animation:tremble .14s linear infinite}
.m-dep .armL{transform:rotate(-2deg)}.m-dep .armR{transform:rotate(2deg)}
.av .eyes{transform-origin:center;transform-box:fill-box;animation:blink 5s infinite}
@keyframes breathe{50%{transform:scale(1.025,1.015)}}

const PAR={x:0,y:0,raf:0};
function applyParallax(){ PAR.raf=0; const sy=Math.min(window.scrollY,600)/600;
  document.querySelectorAll("#scenery .lay").forEach(l=>{ const d=+l.dataset.d; l.style.transform="translate("+(-PAR.x*d)+"px,"+(sy*d*.6)+"px)"; });
  const m=document.querySelector(".map svg"); if(m){ m.style.setProperty("--ry",(PAR.x*4)+"deg"); m.style.setProperty("--rx",(9-PAR.y*4)+"deg"); }
  const sun=document.querySelector("#sky .sun"); if(sun) sun.style.transform="translate("+(-PAR.x*10)+"px,"+(-PAR.y*6)+"px)";
}
function queuePar(){ if(!PAR.raf) PAR.raf=requestAnimationFrame(applyParallax); }
window.addEventListener("pointermove",e=>{ if(e.pointerType!=="mouse") return; PAR.x=e.clientX/window.innerWidth*2-1; PAR.y=e.clientY/window.innerHeight*2-1; queuePar(); },{passive:true});
window.addEventListener("scroll",queuePar,{passive:true});
function confetti(el){
  const r=el?el.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/2,width:0,height:0};
  const cx=r.left+r.width/2, cy=r.top+Math.min(r.height,120)/2, cols=["#f2b33d","#e45a4a","#4fb487","#4a8fd6","#b25fb0","#ffd166"];
  for(let i=0;i<28;i++){ const c=document.createElement("span"); c.className="confetti"; const a=Math.random()*Math.PI*2, d=80+Math.random()*160;
    c.style.cssText="left:"+cx+"px;top:"+cy+"px;background:"+cols[i%cols.length]+";--x:"+Math.cos(a)*d+"px;--y:"+(Math.sin(a)*d-60+Math.random()*120)+"px;--r:"+(Math.random()*720-360)+"deg";
    document.body.appendChild(c); setTimeout(()=>c.remove(),1200); }
}

function render(focus){
  topbar();

  if(v==="start") $app.innerHTML=viewStart();
  else if(v==="camp1") $app.innerHTML=viewCamp1();
  else if(v==="camp2") $app.innerHTML=viewCamp2();
  else if(v==="map") { $app.innerHTML=viewMap(); animateHiker(); }
  else if(v==="stage") $app.innerHTML=viewStage();
  else if(v==="results") $app.innerHTML=viewResults();
  if(focus){ window.scrollTo({top:0,behavior:"instant"}); $app.focus({preventScroll:true}); }
  else { const r=$app.firstElementChild; if(r) r.classList.remove("fade"); }
  const st=STAGES[S.stage];
  document.body.dataset.sky = v==="results" ? "end" : (v==="camp2" || (v==="stage" && st && st.part===2) || (v==="map" && firstOpenStage()>=6) || (v==="map" && firstOpenStage()<0)) ? "p2" : "p1";
  if(UI.react){ const av=document.querySelector(".avbox"); if(av){ av.classList.add(UI.react); }
    if(UI.react==="cheer") confetti(document.querySelector(".fb")||document.getElementById("task"));

  queuePar();
}

function animateHiker(){
  const target=curPtIndex(); const h=document.getElementById("hiker"); if(!h) return;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ h.style.transform='translate('+MAP_PTS[target][0]+'px,'+MAP_PTS[target][1]+'px)'; }));
  if(S.lastPos!==target){ S.lastPos=target; save(); }
}

function blogHTML(p, mode, si){
  // mode: "tag" (tappable), "show" (highlight clues), "plain"
  const t=T(si+":clues");
  let k=0, body="";
  p.blog.paras.forEach((para,pi)=>{
    body+="<p>"+para.map((s,j)=>{
      const id=pi+"-"+j; let cls="s";
      if(mode==="tag"){ if(UI.sel&&UI.sel.has(id)) cls+=" sel"; if(t.marks.includes(id)) cls+=" no"; }
      if(mode==="show" && s.c) cls+=" clue";
      const attrs = mode==="tag" && !t.marks.includes(id) ? ' role="button" tabindex="0" aria-pressed="'+(UI.sel&&UI.sel.has(id)?"true":"false")+'" data-act="sent" data-id="'+id+'"' : "";
      return '<span class="'+cls+'"'+attrs+'>'+s.t+'</span>';
    }).join(" ")+"</p>";
  });
  const hk="h"+si, liked=S.hearts[hk];
  return '<article class="blog '+(mode==="tag"?"tagging":"")+'"><div class="bhead"><div class="mini">'+avatar(p,null,null,true)+'</div><div class="who"><b>'+p.name+'</b><small>'+p.handle+' · '+p.blog.date+'</small></div></div>'+
    '<div class="bbody"><h3>'+p.blog.title+'</h3>'+body+'</div>'+
    '<div class="bfoot"><button type="button" class="heart '+(liked?"on":"")+'" data-act="heart" data-k="'+hk+'">'+(liked?"♥":"♡")+' '+(12+si*3+(liked?1:0))+'</button><span>💬 1 comment</span></div>'+
    '<div class="comment"><b>'+p.blog.comment.who+'</b> '+p.blog.comment.t+'</div></article>';
}
function p2BlogHTML(p, si){
  const hk="h"+si, liked=S.hearts[hk];
  return '<article class="blog p2post"><div class="bhead"><div class="mini">'+avatar(p,null,null,true)+'</div><div class="who"><b>'+p.name+'</b><small>'+p.handle+' · '+p.p2.date+'</small></div><span class="pill" style="margin-left:auto">Follow-up post</span></div>'+
    '<div class="bbody"><h3>'+p.p2.title+'</h3>'+p.p2.paras.map(x=>"<p>"+x+"</p>").join("")+'</div>'+
    '<div class="bfoot"><button type="button" class="heart '+(liked?"on":"")+'" data-act="heart" data-k="'+hk+'">'+(liked?"♥":"♡")+' '+(9+si+(liked?1:0))+'</button></div></article>'+
    '<details class="reread"><summary>Reread '+p.name.split(" ")[0]+'\'s first post (from Part 1)</summary><div class="bbody"><h3>'+p.blog.title+'</h3>'+p.blog.paras.map(pp=>"<p>"+pp.map(s=>s.t).join(" ")+"</p>").join("")+'</div></details>';
}
function viewStage(){
  const si=S.stage, st=STAGES[si], p=PEOPLE[st.pi], reg=REGIONS[si];
  const fbStep = UI.fb && UI.fb.si===si ? UI.fb.step : null;
  const step = fbStep || curStep(si);
  const level = st.part===1 ? st.pi+1 : st.pi+1;
  const stepNames={clues:"Find clues",id:"Identify",diis:"D-I-I-S",sort:"Sort signals",act:"Take action"};
  const stepsHTML='<div class="steps">'+st.steps.map(s=>{ const d=S.t[si+":"+s]&&S.t[si+":"+s].done; return '<span class="'+(d?"ok":(s===step?"cur":""))+'">'+(d?"✓ ":"")+stepNames[s]+'</span>'; }).join("")+'</div>';
  const bub=UI.bubble[si]!=null ? (st.part===1?p.thoughts:p.p2.thoughts)[UI.bubble[si]] : "Tap me to hear what I'm thinking.";
  const person='<div class="person"><div class="diorama"><svg class="hills" viewBox="0 0 300 120" preserveAspectRatio="none" aria-hidden="true"><path d="M0 120 L0 60 Q60 20 120 50 T240 40 T300 45 L300 120Z" fill="#fff" opacity=".18"/><path d="M0 120 L0 88 Q90 62 170 84 T300 76 L300 120Z" fill="#000" opacity=".14"/></svg><div class="bubble" id="bubble">'+esc(bub)+'</div><button type="button" class="avbox" data-act="talk" aria-label="Hear '+p.name+'\'s thoughts">'+avatar(p)+'</button><div class="ground"></div></div>'+
    '<div class="profile"><b>'+p.name+'</b>, '+p.age+'<br><small class="muted">'+p.bio+'</small></div>'+stepsHTML+'</div>';
  let blog;
  if(st.part===1){ const mode = step==="clues" && !(S.t[si+":clues"]&&S.t[si+":clues"].done) ? "tag" : "show"; blog=blogHTML(p,mode,si); }
  else blog=p2BlogHTML(p,si);
  let task="";
  if(!step){ task=stageDoneHTML(si); }
  else task = ({clues:taskClues,id:taskId,diis:taskDiis,sort:taskSort,act:taskAct})[step](si,p);
  return '<div class="fade" style="--region:'+reg.g+'"><div class="stagehead"><div><span class="pill">Part '+st.part+' · Stop '+(si+1)+' of 12</span><h2 style="margin-top:6px">'+reg.n+'</h2></div>'+
    '<div style="text-align:right"><small>Trail difficulty</small><br>'+dots(level)+'</div></div>'+
    '<div class="grid2">'+person+'<div>'+blog+'<div class="card task" id="task">'+task+'</div></div></div>'+
    '<div class="row" style="margin-top:14px"><button class="btn ghost" data-act="tomap" type="button">← Trail map</button></div></div>';
}
function fbBox(){ const f=UI.fb; if(!f) return ""; return '<div class="fb '+f.kind+'" role="status"><h4>'+f.title+'</h4><div>'+f.html+'</div>'+(f.next?'<div style="margin-top:10px"><button class="btn" data-act="fbnext" type="button">'+f.next+'</button></div>':'')+'</div>'; }
function stageDoneHTML(si){
  const st=STAGES[si], p=PEOPLE[st.pi];
  const isLastP1 = si===5, isLast = si===11;
  return '<div class="stagedone"><div class="badge">'+(isLast?"🏔️":"🏅")+'</div><h2>Stop '+(si+1)+' complete!</h2><p>You finished '+p.name.split(" ")[0]+'\'s '+(st.part===1?"story":"check-in")+'.</p>'+
    (p.safety&&st.part===1?'<div class="safety" style="text-align:left"><b>If this sounds like you or a friend:</b> you are not alone. Talk to a trusted adult, or call or text <b>988</b> any time.</div>':'')+
    '<button class="btn" data-act="tomap" type="button" style="margin-top:12px">'+(isLast?"Climb to the summit →":isLastP1?"Head to Ridge Camp →":"Back to the trail →")+'</button></div>';
}
function taskHead(q,t){ return '<div class="q">'+q+attemptPips(t)+'</div>'; }

function taskClues(si,p){
  const id=si+":clues", t=T(id);
  if(t.done) return taskHead("Find the clues",t)+fbBox();
  if(!UI.sel) UI.sel=new Set();
  const n=p.need, c=UI.sel.size;
  return taskHead("Step 1 · Tap "+n+" sentences in "+p.name.split(" ")[0]+"'s blog that are <u>signs</u> of what they're going through.",t)+
    '<p class="muted" style="margin:6px 0 0">Sentences you can tap are underlined in blue. Tap again to unselect. Choose signs, not just background information.</p>'+
    '<p style="margin:10px 0"><b>'+c+' / '+n+'</b> selected</p>'+
    '<button class="btn" data-act="checkClues" type="button" '+(c===n?"":"disabled")+'>Check my clues</button>'+fbBox();
}
function taskId(si,p){
  const id=si+":id", t=T(id);
  const right=CONDS.findIndex(c=>c.k===p.cond);
  return taskHead("Step 2 · What is "+p.name.split(" ")[0]+" most likely experiencing?",t)+
    '<div class="tiles">'+CONDS.map((c,i)=>{ const isR=t.done&&i===right; const dis=t.done||t.elim.includes(i); return '<button type="button" class="tile '+(UI.sel===i?"sel":"")+(isR?" right":"")+'" data-act="pickId" data-i="'+i+'" '+(dis&&!isR?"disabled":(t.done?"disabled":""))+'><span class="ic">'+c.ic+'</span>'+c.name+'</button>'; }).join("")+'</div>'+
    (t.done?"":'<button class="btn" data-act="checkId" type="button" '+(UI.sel!=null?"":"disabled")+'>Lock it in</button>')+fbBox();
}
function taskDiis(si,p){
  const id=si+":diis", t=T(id);
  if(!UI.sel||!Array.isArray(UI.sel)) UI.sel=[null,null,null,null];
  const all=UI.sel.every(x=>x!=null);
  const bad = t.lastBad||[];
  return taskHead("Step 3 · Rate "+p.name.split(" ")[0]+"'s situation with D-I-I-S",t)+
    '<div class="diis">'+DIIS.map((d,r)=>{
      const rowCls = t.done?"good":(bad.includes(r)&&UI.fb?"bad":"");
      return '<div class="drow '+rowCls+'"><h4><span class="L">'+d.L+'</span>'+d.name+' <small class="muted" style="font-weight:400">'+d.ask+'</small></h4><div class="chips">'+
        d.opts.map((o,k)=>{ const isR=t.done&&p.diis[r]===k; return '<button type="button" class="chip '+(isR?"right":(!t.done&&UI.sel[r]===k?"sel":""))+'" data-act="pickDiis" data-r="'+r+'" data-k="'+k+'" '+(t.done?"disabled":"")+'>'+o+'</button>'; }).join("")+
        '</div>'+(!t.done&&UI.fb&&t.tries>=2&&bad.includes(r)?'<div class="rowhint">Hint: '+p.diisHints[r]+'</div>':'')+'</div>';
    }).join("")+'</div>'+
    (t.done?"":'<button class="btn" data-act="checkDiis" type="button" '+(all?"":"disabled")+'>Check D-I-I-S</button>')+fbBox();
}
function taskSort(si,p){
  const id=si+":sort", t=T(id), cards=p.p2.cards, ord=shuffled(cards.length, si*31+1);
  if(!UI.sel||!Array.isArray(UI.sel)) UI.sel=cards.map(()=>null);
  const all=UI.sel.every(x=>x!=null);
  const bad=t.lastBad||[];
  const counts=[0,1,2].map(k=>UI.sel.filter(x=>x===k).length);
  return taskHead("Step 1 · Sort each signal from "+p.name.split(" ")[0]+"'s follow-up post",t)+
    '<p class="muted" style="margin:6px 0 0">Choose <b style="color:var(--green)">Protective</b>, <b style="color:var(--amber)">Warning</b>, or <b style="color:var(--red)">Red flag</b> for every card.</p>'+
    '<div class="tally" style="margin-top:8px">'+BINS.map(b=>'<span style="background:'+['var(--green2)','var(--amber2)','var(--red2)'][b.k]+'">'+b.ic+' '+b.short+': '+(t.done?cards.filter(c=>c.b===b.k).length:counts[b.k])+'</span>').join("")+'</div>'+
    '<div class="sorts">'+ord.map(ci=>{
      const c=cards[ci], v=t.done?c.b:UI.sel[ci];
      const cls="scard"+(v!=null?" b"+v:"")+(!t.done&&UI.fb&&t.tries>=2&&bad.includes(ci)?" bad":"");
      return '<div class="'+cls+'"><div>'+c.t+'</div><div class="bins">'+BINS.map(b=>'<button type="button" class="bin k'+b.k+' '+(v===b.k?"sel":"")+'" data-act="pickBin" data-c="'+ci+'" data-k="'+b.k+'" '+(t.done?"disabled":"")+' aria-pressed="'+(v===b.k)+'">'+b.ic+' '+b.short+'</button>').join("")+'</div>'+(t.done?'<div class="why">'+c.why+'</div>':'')+'</div>';
    }).join("")+'</div>'+
    (t.done?"":'<button class="btn" data-act="checkSort" type="button" '+(all?"":"disabled")+'>Check my sort</button>')+fbBox();
}
function taskAct(si,p){
  const id=si+":act", t=T(id), a=p.p2.act, ord=shuffled(a.opts.length, si*53+7);
  return taskHead("Step 2 · "+a.q,t)+
    '<div class="opts">'+ord.map(oi=>{ const isR=t.done&&oi===0; const dis=t.done||t.elim.includes(oi); return '<button type="button" class="opt '+(UI.sel===oi?"sel":"")+(isR?" right":"")+'" data-act="pickAct" data-i="'+oi+'" '+(dis?"disabled":"")+'>'+a.opts[oi]+'</button>'; }).join("")+'</div>'+
    (t.done?"":'<button class="btn" data-act="checkAct" type="button" '+(UI.sel!=null?"":"disabled")+'>Lock it in</button>')+fbBox();
}

/* grading */
function finishTask(t, correct){
  UI.react = correct ? "cheer" : "oops";
  if(correct){ t.done=true; t.att=t.tries; }
  else if(t.tries>=MAX_TRIES){ t.done=true; t.att=0; }
  save();
}
function nextLabel(si){ const left=STAGES[si].steps.filter(s=>!(S.t[si+":"+s]&&S.t[si+":"+s].done)); return left.length?"Next step →":"Finish this stop →"; }
function setFb(si,step,kind,title,html,next){ UI.fb={si,step,kind,title,html,next}; }
function praise(t){ return t.att===1?"Nailed it on the first try!":t.att===2?"Got it on try 2!":"Got it on try 3 — nice persistence!"; }
function shakeTask(){ const el=document.getElementById("task"); if(el){ el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); } }

function checkClues(si){
  const p=PEOPLE[STAGES[si].pi], t=T(si+":clues");
  const clueSet=new Set(); p.blog.paras.forEach((pa,pi)=>pa.forEach((s,j)=>{ if(s.c) clueSet.add(pi+"-"+j); }));
  const picks=[...UI.sel], good=picks.filter(x=>clueSet.has(x)), wrong=picks.filter(x=>!clueSet.has(x));
  t.tries++;
  const ok=wrong.length===0;
  finishTask(t,ok);
  if(ok){ setFb(si,"clues","good",praise(t),"Every sentence you picked is a sign. All the signs in the post are now highlighted in green. Notice how many there are!",nextLabel(si)); }
  else if(t.done){ setFb(si,"clues","reveal","Here are the signs","The highlighted sentences are signs. "+p.clueHints[1],nextLabel(si)); }
  else {
    if(t.tries>=2){ wrong.forEach(x=>{ if(!t.marks.includes(x)) t.marks.push(x); }); }
    wrong.forEach(x=>UI.sel.delete(x)); save();
    setFb(si,"clues","bad","Not quite. "+good.length+" of your "+picks.length+" picks are signs.",
      (t.tries>=2?"The sentences that are <b>not</b> signs are now crossed out. ":"Your correct picks are still selected. ")+"<b>Hint:</b> "+p.clueHints[t.tries-1],null);
    shakeTask();
  }
  render(); announce(UI.fb.title);
}
function checkId(si){
  const p=PEOPLE[STAGES[si].pi], t=T(si+":id"), right=CONDS.findIndex(c=>c.k===p.cond), pick=UI.sel;
  t.tries++; const ok=pick===right; if(!ok&&!t.elim.includes(pick)) t.elim.push(pick);
  finishTask(t,ok);
  if(ok) setFb(si,"id","good",praise(t),p.idExplain,nextLabel(si));
  else if(t.done) setFb(si,"id","reveal","The answer is "+CONDS[right].name,p.idExplain,nextLabel(si));
  else { setFb(si,"id","bad","Not "+CONDS[pick].name+". Try again.","<b>Hint:</b> "+p.idHints[t.tries-1]+' <br><small class="muted">Tip: open the Field Guide at the top to compare the signs.</small>',null); UI.sel=null; shakeTask(); }
  render(); announce(UI.fb.title);
}
function checkDiis(si){
  const p=PEOPLE[STAGES[si].pi], t=T(si+":diis");
  const bad=[0,1,2,3].filter(r=>UI.sel[r]!==p.diis[r]);
  t.tries++; t.lastBad=bad; const ok=bad.length===0; finishTask(t,ok);
  if(ok) setFb(si,"diis","good",praise(t),p.diisExplain,nextLabel(si));
  else if(t.done) setFb(si,"diis","reveal","Here's the correct D-I-I-S",p.diisExplain,nextLabel(si));
  else {
    const names=bad.map(r=>DIIS[r].name).join(", ");
    setFb(si,"diis","bad",bad.length+" of 4 need another look: "+names,
      t.tries===1?"<b>Hint:</b> Reread the post for the row"+(bad.length>1?"s":"")+" in red. "+(bad.includes(3)?"For Safety, ask: did anyone talk about or do something that could hurt them? ":"")+"Your correct rows are kept.":"Specific hints are now shown under each red row.",null);
    bad.forEach(r=>UI.sel[r]=null); shakeTask();
  }
  save(); render(); announce(UI.fb.title);
}
function checkSort(si){
  const p=PEOPLE[STAGES[si].pi], t=T(si+":sort"), cards=p.p2.cards;
  const bad=cards.map((c,i)=>UI.sel[i]!==c.b?i:-1).filter(i=>i>=0);
  t.tries++; t.lastBad=bad; const ok=bad.length===0; finishTask(t,ok);
  if(ok) setFb(si,"sort","good",praise(t),"Every card is in the right place. Read the reason under each card.",nextLabel(si));
  else if(t.done) setFb(si,"sort","reveal","Here's the correct sort","Read the reason under each card to see why it belongs there.",nextLabel(si));
  else {
    const missedRed=bad.some(i=>cards[i].b===2), overRed=bad.some(i=>UI.sel[i]===2);
    let h = t.tries===1 ? "<b>Hint:</b> "+(missedRed?"A red flag is hiding in the Warning or Protective bin. Red flag = someone's safety or health is in danger <i>right now</i>.":overRed?"Something you marked as a red flag is a warning sign. Red flags mean danger <i>now</i>; warning signs mean someone is struggling.":"Protective = something that HELPS. Warning = a change that shows they're struggling.")
      : "<b>Hint:</b> The cards outlined in red are in the wrong spot. Ask: does this help, show struggle, or put someone in danger now?";
    setFb(si,"sort","bad",bad.length+" card"+(bad.length>1?"s are":" is")+" in the wrong spot.",h,null); shakeTask();
  }
  save(); render(); announce(UI.fb.title);
}
function checkAct(si){
  const p=PEOPLE[STAGES[si].pi], a=p.p2.act, t=T(si+":act"), pick=UI.sel;
  t.tries++; const ok=pick===0; if(!ok&&!t.elim.includes(pick)) t.elim.push(pick); finishTask(t,ok);
  if(ok) setFb(si,"act","good",praise(t),a.explain,nextLabel(si));
  else if(t.done) setFb(si,"act","reveal","Here's the best response",a.explain,nextLabel(si));
  else { setFb(si,"act","bad","Not the best choice. Try again.","<b>Hint:</b> "+a.hints[t.tries-1],null); UI.sel=null; shakeTask(); }
  render(); announce(UI.fb.title);
}

/* ---------- results ---------- */
function viewResults(){
  const total=TASK_IDS.reduce((s,id)=>s+credit(id),0), acc=Math.round(100*total/N_TASKS);
  const first=TASK_IDS.filter(id=>S.t[id]&&S.t[id].att===1).length;
  const complete=doneCount()===N_TASKS;
  const mins=fmtTime((S.finishedAt||Date.now())-S.startedAt);
  const code=hash8([S.name.trim().toLowerCase(),S.period,acc,first,S.finishedAt].join("|"));
  const when=new Date(S.finishedAt||Date.now()).toLocaleString([], {dateStyle:"medium",timeStyle:"short"});
  const mark=id=>{ const t=S.t[id]; if(!t||!t.done) return '<span class="mark a0">–</span>'; return t.att===0?'<span class="mark a0" title="Shown after 3 tries">✕</span>':'<span class="mark a'+t.att+'" title="Solved on try '+t.att+'">'+t.att+'</span>'; };
  const p1=PEOPLE.map((p,i)=>'<tr><td>'+(i+1)+'. '+p.name+' <small class="muted">('+CONDS.find(c=>c.k===p.cond).name+')</small></td><td class="c">'+mark(i+":clues")+'</td><td class="c">'+mark(i+":id")+'</td><td class="c">'+mark(i+":diis")+'</td></tr>').join("");
  const p2=PEOPLE.map((p,i)=>'<tr><td>'+(i+7)+'. '+p.name+'</td><td class="c">'+mark((i+6)+":sort")+'</td><td class="c">'+mark((i+6)+":act")+'</td></tr>').join("");
  // strengths
  const cat=(ids)=>Math.round(100*ids.reduce((s,id)=>s+credit(id),0)/ids.length);
  const areas=[["Spotting signs in a story",PEOPLE.map((p,i)=>i+":clues")],["Identifying the condition",PEOPLE.map((p,i)=>i+":id")],["Rating with D-I-I-S",PEOPLE.map((p,i)=>i+":diis")],["Sorting protective / warning / red flags",PEOPLE.map((p,i)=>(i+6)+":sort")],["Choosing the right action",PEOPLE.map((p,i)=>(i+6)+":act")]].map(a=>[a[0],cat(a[1])]);
  const best=areas.slice().sort((a,b)=>b[1]-a[1])[0], low=areas.slice().sort((a,b)=>a[1]-b[1])[0];
  return '<div class="results card fade">'+
    '<div class="rtop"><div><span class="pill">Expedition Results</span><h1 style="margin:8px 0 2px">'+esc(S.name)+'</h1><div class="muted">'+(S.period?esc(S.period)+" · ":"")+when+'</div></div>'+
    '<div style="text-align:right">'+(complete?'<div class="stamp">COMPLETE ✓</div>':'<div class="stamp" style="color:var(--amber);border-color:var(--amber)">IN PROGRESS</div>')+'<div style="margin-top:10px">Code: <span class="code">'+code+'</span></div></div></div>'+
    '<div class="kpis"><div><b>'+doneCount()+'/'+N_TASKS+'</b><small>tasks completed</small></div><div><b>'+acc+'%</b><small>accuracy score</small></div><div><b>'+first+'</b><small>first-try correct</small></div><div><b>'+mins+'</b><small>time on trail</small></div></div>'+
    '<div class="rgrid">'+
      '<div><h3>Part 1 · Understanding Emotional Health</h3><table class="rtable"><tr><th>Person</th><th class="c">Clues</th><th class="c">ID</th><th class="c">DIIS</th></tr>'+p1+'</table></div>'+
      '<div><h3>Part 2 · Protective, Warning &amp; Red Flags</h3><table class="rtable"><tr><th>Person</th><th class="c">Sort</th><th class="c">Action</th></tr>'+p2+'</table>'+
      '<p style="margin-top:12px;font-size:.9rem"><b>Strongest skill:</b> '+best[0]+' ('+best[1]+'%)<br><b>Keep practicing:</b> '+(low[1]<100?low[0]+' ('+low[1]+'%)':'Nothing. Perfect run!')+'</p></div>'+
    '</div>'+
    '<p class="muted" style="font-size:.82rem;margin-top:10px">Key: <span class="mark a1">1</span> solved on try 1 · <span class="mark a2">2</span> try 2 · <span class="mark a3">3</span> try 3 · <span class="mark a0">✕</span> answer shown after 3 tries ('+Math.round(CONFIG.MISS_CREDIT*100)+'%)</p>'+
    '<div class="shot">📸 Take a screenshot of this whole page and submit it to '+esc(CONFIG.SUBMIT_TO)+'.<br><small class="muted" style="font-weight:400">Chromebook: press Ctrl + Shift + Show windows (□||||) · Windows: Win + Shift + S · Mac: Cmd + Shift + 4</small></div>'+
    '<div class="safety" style="margin-top:14px"><b>You are never alone.</b> If you or a friend are struggling, talk to a trusted adult or school counselor. Call or text <b>988</b> (Suicide &amp; Crisis Lifeline) any time, or text <b>HOME</b> to <b>741741</b>. In an emergency, call <b>911</b>.</div>'+
    '<div class="row" style="margin-top:14px"><button class="btn ghost" data-act="tomap" type="button">View trail map</button></div>'+
  '</div>';
}

/* ---------- modals ---------- */
function openModal(html){ $modal.innerHTML='<div class="modal" data-act="closeBg"><div class="card" role="dialog" aria-modal="true"><button class="x" data-act="close" aria-label="Close" type="button">×</button>'+html+'</div></div>'; const c=$modal.querySelector(".x"); c&&c.focus(); }
function guideHTML(){
  return '<h2>Field Guide</h2><table class="gtable"><tr><th>Condition</th><th>Common signs</th></tr>'+CONDS.map(c=>'<tr><td><b>'+c.ic+' '+c.name+'</b><br><small class="muted">'+c.note+'</small></td><td>'+c.signs.join(", ")+'</td></tr>').join("")+'</table>'+
    '<h3 style="margin-top:16px">D-I-I-S</h3><table class="gtable">'+DIIS.map(d=>'<tr><td><b>'+d.L+' · '+d.name+'</b></td><td>'+d.ask+'<br><small class="muted">'+d.opts.join(" · ")+'</small></td></tr>').join("")+'</table>'+
    '<h3 style="margin-top:16px">Signals</h3><table class="gtable">'+BINS.map(b=>'<tr><td><b>'+b.ic+' '+b.name+'</b></td><td>'+b.def+'</td></tr>').join("")+'</table>';
}
function helpHTML(){
  return '<h2>Need help now?</h2><p>If you or someone you know is struggling or not safe, you don\'t have to handle it alone.</p><div class="hotline">'+
    '<div><b>Call or text 988</b><br>Suicide &amp; Crisis Lifeline: free, confidential, 24/7.</div>'+
    '<div><b>Text HOME to 741741</b><br>Crisis Text Line: 24/7.</div>'+
    '<div><b>Call 911</b><br>If someone is in immediate danger.</div>'+
    '<div><b>Talk to a trusted adult</b><br>A parent, school counselor, teacher, coach, or school nurse.</div></div>'+
    '<p class="muted" style="font-size:.88rem">The people in this activity are fictional. If something here brought up hard feelings, it\'s okay to pause and talk to someone.</p>';
}

/* ======================= EVENTS ======================= */
function go(view){ S.view=view; UI.sel=null; UI.fb=null; save(); render(true); }
function openStage(si){ S.stage=si; S.view="stage"; UI.sel=null; UI.fb=null; save(); render(true); }
function nextFromMap(){
  const f=firstOpenStage();
  if(f<0){ if(!S.finishedAt){ S.finishedAt=Date.now(); } go("results"); return; }
  if(f===6&&!S.camp2){ UI.flips={}; go("camp2"); return; }
  openStage(f);
}
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const a=el.dataset.act;
  if(a==="closeBg"){ if(e.target===el) $modal.innerHTML=""; return; }
  if(a==="close"){ $modal.innerHTML=""; return; }
  if(a==="help"){ openModal(helpHTML()); return; }
  if(a==="guide"){ openModal(guideHTML()); return; }
  if(a==="begin"){
    const nm=document.getElementById("nm").value.trim().replace(/\s+/g," "), pd=document.getElementById("pd").value.trim();
    if(nm.length<3||!/\s/.test(nm)){ document.getElementById("nmerr").textContent="Please type your first AND last name so your teacher knows it's you."; document.getElementById("nm").focus(); return; }
    S.name=nm; S.period=pd; if(!S.startedAt) S.startedAt=Date.now();
    if(S.camp1){ go("map"); } else { UI.flips={}; go("camp1"); }
    return;
  }
  if(a==="flip"){ const i=el.dataset.i; UI.flips[i]=true; el.classList.toggle("on"); el.setAttribute("aria-pressed",el.classList.contains("on")?"true":"false");
    const part=S.view==="camp1"?1:2, n=part===1?6:3;
    document.getElementById("flipmsg").textContent=flipMsg(part);
    document.getElementById("flipgo").disabled=Object.keys(UI.flips).length<n; return; }
  if(a==="camp1done"){ S.camp1=true; S.lastPos=0; go("map"); return; }
  if(a==="camp2done"){ S.camp2=true; openStage(6); return; }
  if(a==="open"){ openStage(+el.dataset.si); return; }
  if(a==="next"){ nextFromMap(); return; }
  if(a==="tomap"){ if(firstOpenStage()<0 && !S.finishedAt) S.finishedAt=Date.now(); go(firstOpenStage()<0 && S.view==="stage" ? "results" : "map"); return; }
  if(a==="heart"){ S.hearts[el.dataset.k]=!S.hearts[el.dataset.k]; save(); keep(()=>render()); return; }
  if(a==="talk"){ const si=S.stage, st=STAGES[si], p=PEOPLE[st.pi], arr=st.part===1?p.thoughts:p.p2.thoughts; UI.bubble[si]=UI.bubble[si]==null?0:(UI.bubble[si]+1)%arr.length; const b=document.getElementById("bubble"); b.textContent=arr[UI.bubble[si]]; b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop");
    el.classList.remove("cheer"); void el.offsetWidth; el.classList.add("cheer"); return; }
  const si=S.stage;
  if(a==="sent"){ if(!(UI.sel instanceof Set)) UI.sel=new Set(); const id=el.dataset.id, n=PEOPLE[STAGES[si].pi].need;
    if(UI.sel.has(id)) UI.sel.delete(id); else if(UI.sel.size<n) UI.sel.add(id); else { announce("You already picked "+n+". Unselect one first."); }
    keep(()=>render()); return; }
  if(a==="checkClues"){ keep(()=>checkClues(si)); return; }
  if(a==="pickId"){ UI.sel=+el.dataset.i; keep(()=>render()); return; }
  if(a==="checkId"){ keep(()=>checkId(si)); return; }
  if(a==="pickDiis"){ if(!Array.isArray(UI.sel)) UI.sel=[null,null,null,null]; UI.sel[+el.dataset.r]=+el.dataset.k; keep(()=>render()); return; }
  if(a==="checkDiis"){ keep(()=>checkDiis(si)); return; }
  if(a==="pickBin"){ const cards=PEOPLE[STAGES[si].pi].p2.cards; if(!Array.isArray(UI.sel)) UI.sel=cards.map(()=>null); UI.sel[+el.dataset.c]=+el.dataset.k; keep(()=>render()); return; }
  if(a==="checkSort"){ keep(()=>checkSort(si)); return; }
  if(a==="pickAct"){ UI.sel=+el.dataset.i; keep(()=>render()); return; }
  if(a==="checkAct"){ keep(()=>checkAct(si)); return; }
  if(a==="fbnext"){ UI.fb=null; UI.sel=null; render(); const tk=document.getElementById("task"); if(tk) tk.scrollIntoView({behavior:"smooth",block:"start"}); return; }
});
function keep(fn){ const y=window.scrollY; fn(); window.scrollTo(0,y); }
document.addEventListener("keydown",e=>{
  if(e.key==="Escape" && $modal.innerHTML){ $modal.innerHTML=""; return; }
  const el=e.target.closest && e.target.closest('[role="button"][data-act]');
  if(el && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); el.click(); }
  if(e.key==="Enter" && e.target.id && (e.target.id==="nm"||e.target.id==="pd")){ document.querySelector('[data-act="begin"]').click(); }
});
buildScenery();
render(true);
</script>
