<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; connect-src 'none'; font-src data:;">
<title>DEED &amp; DEBT: Port Juniper</title>
<style>
:root{
  --ink:#1d2b36; --paper:#fbf7ea; --board:#cfe8d5; --board2:#b9dcc3; --accent:#ffcc29; --accent2:#ff7a1a; --good:#1f9d55; --bad:#d62f3a; --muted:#5d6b75;
  --panel:#ffffff; --panel2:#f3f6f8; --focus:#2563eb; --shadow:0 6px 20px rgba(0,0,0,.18);
  --bs:min(calc(100vh - 54px), calc(100vw - 400px)); --u:calc(var(--bs) / 12.1);
  --spd:1;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#2f4858;color:var(--ink);font-family:"Trebuchet MS","Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;font-size:16px;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;min-height:44px;min-width:44px;border:2px solid var(--ink);border-radius:10px;background:#fff;padding:6px 14px;font-weight:700;box-shadow:0 3px 0 var(--ink);transition:transform .08s}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
button:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
button.primary{background:var(--accent)}
button.go{background:#7be495}
button.danger{background:#ffb3b8}
button.ghost{background:transparent;box-shadow:none;border-color:transparent;text-decoration:underline}
button.small{min-height:36px;padding:3px 10px;font-size:14px}
:focus-visible{outline:4px solid var(--focus)!important;outline-offset:2px}
input[type=text],input[type=number],select,textarea{min-height:44px;border:2px solid var(--ink);border-radius:8px;padding:6px 10px;background:#fff}
h1,h2,h3{font-family:"Arial Black","Segoe UI Black",Roboto,sans-serif;margin:.2em 0;letter-spacing:.5px}
.hidden{display:none!important}
.sr{position:absolute;top:0;left:0;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.money-pos{color:var(--good);font-weight:800}.money-neg{color:var(--bad);font-weight:800}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}

/* ---------- ticker ---------- */
#ticker{height:46px;display:flex;align-items:center;gap:10px;padding:0 8px;background:var(--ink);color:#fff;font-size:14px;white-space:nowrap}
#ticker .logo{font-family:"Arial Black",sans-serif;font-size:18px;color:var(--accent);letter-spacing:1px}
#ticker .tk{background:rgba(255,255,255,.1);border-radius:8px;padding:4px 8px}
#ticker .tk b{color:var(--accent)}
#ticker .news{flex:1;overflow:hidden;position:relative;height:28px;background:rgba(255,255,255,.06);border-radius:8px}
#ticker .news span{position:absolute;white-space:nowrap;line-height:28px;padding-left:100%;animation:marquee calc(22s * var(--spd)) linear infinite}
@keyframes marquee{to{transform:translateX(-100%)}}
#ticker button{min-height:36px;min-width:40px;padding:2px 8px;background:#33495a;color:#fff;border-color:#9fb3c2;box-shadow:none;font-size:15px}
.phase-expansion{color:#7be495!important}.phase-peak{color:#ffd166!important}.phase-recession{color:#ff8a8a!important}.phase-recovery{color:#9ad1ff!important}

/* ---------- layout ---------- */
#game{display:flex;gap:8px;padding:4px 8px;height:calc(100vh - 46px)}
#boardWrap{position:relative;width:var(--bs);height:var(--bs);flex:none}
#side{flex:1;min-width:360px;display:flex;flex-direction:column;gap:6px;overflow:hidden}

/* ---------- board ---------- */
#board{position:absolute;inset:0;display:grid;grid-template-columns:1.55fr repeat(9,1fr) 1.55fr;grid-template-rows:1.55fr repeat(9,1fr) 1.55fr;background:var(--board);border:4px solid var(--ink);border-radius:10px;overflow:hidden}
.cell{position:relative;background:var(--paper);border:1px solid var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2px;font-size:calc(var(--u) * .145);line-height:1.08;cursor:pointer;overflow:hidden;min-width:0;min-height:0}
.cell:hover{filter:brightness(.96)}
.cell .nm{font-weight:700;overflow-wrap:anywhere;max-width:100%}
.cell .pr{font-size:.95em;color:#333;margin-top:1px}
.cell .ic{font-size:1.45em;line-height:1}
.cell .band{position:absolute;display:flex;align-items:center;justify-content:center;gap:1px;font-size:1em}
.cell.bot .band{top:0;left:0;right:0;height:24%}
.cell.top .band{bottom:0;left:0;right:0;height:24%}
.cell.lft .band{right:0;top:0;bottom:0;width:22%;flex-direction:column}
.cell.rgt .band{left:0;top:0;bottom:0;width:22%;flex-direction:column}
.cell.bot{padding-top:calc(var(--u)*.26)}.cell.top{padding-bottom:calc(var(--u)*.26)}
.cell.lft{padding-right:calc(var(--u)*.36)}.cell.rgt{padding-left:calc(var(--u)*.36)}
.cell.corner{font-size:calc(var(--u)*.2);background:#fff6d8}
.cell.corner .ic{font-size:2.2em}
.cell .own{position:absolute;bottom:1px;right:1px;width:calc(var(--u)*.34);height:calc(var(--u)*.34);border-radius:50%;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:calc(var(--u)*.2);background:#fff}
.cell.top .own{top:1px;bottom:auto}
.cell .flags{position:absolute;top:1px;left:2px;font-size:calc(var(--u)*.17);display:flex;gap:1px}
.cell.bot .flags{top:26%}
.cell.mortgaged{background:repeating-linear-gradient(45deg,#e9e9e9 0 6px,#d6d6d6 6px 12px)}
.cell.mortgaged .nm{text-decoration:line-through}
.cell.vacant::after{content:"EMPTY";position:absolute;top:45%;left:50%;transform:translate(-50%,-50%) rotate(-18deg);font-weight:900;color:var(--bad);border:2px solid var(--bad);padding:0 3px;font-size:calc(var(--u)*.15);background:rgba(255,255,255,.85)}
.cell.hl{box-shadow:inset 0 0 0 4px var(--focus)}
.bld{display:inline-block;width:calc(var(--u)*.17);height:calc(var(--u)*.17);background:#2a9d55;border:1px solid #0b3d20;border-radius:2px}
.bld.hotel{width:calc(var(--u)*.34);background:#d62f3a;border-color:#5a0b10}
.pop{animation:pop calc(.5s * var(--spd)) ease-out}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.4)}100%{transform:scale(1)}}
.arrow-up{color:var(--good);font-weight:900}.arrow-dn{color:var(--bad);font-weight:900}
/* colorblind-safe patterns */
.pat-stripes{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.45) 0 3px,transparent 3px 8px)}
.pat-dots{background-image:radial-gradient(rgba(255,255,255,.7) 1.5px,transparent 1.7px);background-size:7px 7px}
.pat-cross{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.4) 0 2px,transparent 2px 7px),repeating-linear-gradient(-45deg,rgba(255,255,255,.4) 0 2px,transparent 2px 7px)}
.pat-waves{background-image:repeating-radial-gradient(circle at 0 100%,transparent 0 4px,rgba(255,255,255,.5) 4px 6px)}
.pat-checks{background-image:conic-gradient(rgba(255,255,255,.45) 25%,transparent 0 50%,rgba(255,255,255,.45) 0 75%,transparent 0);background-size:8px 8px}
.pat-vstripes{background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.25) 0 2px,transparent 2px 6px)}
.pat-zigzag{background-image:linear-gradient(135deg,rgba(255,255,255,.5) 25%,transparent 25%),linear-gradient(225deg,rgba(255,255,255,.5) 25%,transparent 25%);background-size:8px 8px}
.pat-diamonds{background-image:linear-gradient(45deg,rgba(255,255,255,.4) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.4) 75%),linear-gradient(45deg,rgba(255,255,255,.4) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.4) 75%);background-size:8px 8px;background-position:0 0,4px 4px}

#center{grid-column:2 / 11;grid-row:2 / 11;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*.12);padding:calc(var(--u)*.2)}
#center .title{font-family:"Arial Black",sans-serif;font-size:calc(var(--u)*.62);color:var(--ink);text-shadow:3px 3px 0 var(--accent);transform:rotate(-4deg);letter-spacing:2px}
#center .sub{font-size:calc(var(--u)*.2);color:var(--muted);margin-top:-6px}
#yearBadge{font-family:"Arial Black",sans-serif;font-size:calc(var(--u)*.3);background:var(--ink);color:var(--accent);padding:4px 14px;border-radius:30px}
#centerMsg{min-height:2.6em;max-width:90%;text-align:center;font-size:calc(var(--u)*.2);font-weight:700}
.decks{display:flex;gap:calc(var(--u)*.25)}
.deckpile{width:calc(var(--u)*1.15);height:calc(var(--u)*.75);border-radius:8px;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:calc(var(--u)*.14);transform:rotate(-6deg);box-shadow:4px 4px 0 rgba(0,0,0,.25);text-align:center;padding:3px}
.deckpile.opp{background:#ffd166}.deckpile.civ{background:#9ad1ff;transform:rotate(5deg)}.deckpile.dec{background:#c7f9cc;transform:rotate(-2deg)}
#dex{width:calc(var(--u)*1.2);height:calc(var(--u)*1.2)}
.dex-bob{animation:bob calc(2.4s * var(--spd)) ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(3deg)}}

/* dice */
#dice{display:flex;gap:calc(var(--u)*.3);perspective:600px;height:calc(var(--u)*.8);align-items:center}
.die{width:calc(var(--u)*.62);height:calc(var(--u)*.62);position:relative;transform-style:preserve-3d;transition:transform calc(.9s * var(--spd)) cubic-bezier(.2,.7,.3,1.1)}
.face{position:absolute;inset:0;background:#fff;border:2px solid var(--ink);border-radius:18%;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:12%}
.face i{width:72%;height:72%;margin:auto;border-radius:50%;background:var(--ink);visibility:hidden}
.face i.on{visibility:visible}
.f1{transform:translateZ(calc(var(--u)*.31))}.f6{transform:rotateY(180deg) translateZ(calc(var(--u)*.31))}
.f2{transform:rotateY(90deg) translateZ(calc(var(--u)*.31))}.f5{transform:rotateY(-90deg) translateZ(calc(var(--u)*.31))}
.f3{transform:rotateX(90deg) translateZ(calc(var(--u)*.31))}.f4{transform:rotateX(-90deg) translateZ(calc(var(--u)*.31))}

/* tokens */
#tokens{position:absolute;inset:0;pointer-events:none}
.token{position:absolute;width:calc(var(--u)*.5);height:calc(var(--u)*.5);margin:calc(var(--u)*-.25) 0 0 calc(var(--u)*-.25);border-radius:50%;border:3px solid var(--ink);background:#fff;display:flex;align-items:center;justify-content:center;font-size:calc(var(--u)*.3);box-shadow:0 3px 6px rgba(0,0,0,.35);transition:left calc(.13s * var(--spd)) ease-out,top calc(.13s * var(--spd)) ease-out;z-index:5}
.token.hop{animation:hop calc(.15s * var(--spd)) ease-out}
.token.active{z-index:6;box-shadow:0 0 0 4px var(--accent),0 3px 6px rgba(0,0,0,.35)}
@keyframes hop{50%{transform:translateY(-40%) scale(1.15)}}

/* effects */
#fxLayer{position:fixed;inset:0;pointer-events:none;z-index:60}
.shake{animation:shake calc(.6s * var(--spd))}
@keyframes shake{20%{transform:translate(-8px,3px)}40%{transform:translate(7px,-4px)}60%{transform:translate(-5px,2px)}80%{transform:translate(4px,-1px)}}
#wash{position:absolute;inset:0;background:rgba(80,80,90,.0);pointer-events:none;transition:background 1s;z-index:4;border-radius:10px}
#wash.gray{background:rgba(70,70,80,.38)}
#wash.gold{background:linear-gradient(110deg,transparent 30%,rgba(255,215,0,.55) 50%,transparent 70%);background-size:250% 100%;animation:shimmer calc(1.6s * var(--spd)) linear 2}
@keyframes shimmer{from{background-position:120% 0}to{background-position:-120% 0}}
.fall{position:absolute;top:-40px;font-size:34px;font-weight:900;animation:fall calc(1.8s * var(--spd)) ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(25deg);opacity:.2}}
.rise{position:absolute;bottom:-40px;font-size:30px;animation:rise calc(1.8s * var(--spd)) ease-out forwards}
@keyframes rise{to{transform:translateY(-110vh);opacity:.1}}
.flycash{pointer-events:none;position:fixed;font-weight:900;font-size:20px;padding:2px 8px;border-radius:12px;background:#fff;border:2px solid var(--ink);transition:left calc(.6s * var(--spd)) ease-in-out,top calc(.6s * var(--spd)) ease-in-out,opacity .3s;z-index:61}
.floaty{pointer-events:none;position:fixed;font-weight:900;font-size:18px;animation:floaty calc(1.2s * var(--spd)) ease-out forwards;z-index:61;text-shadow:0 1px 0 #fff}
@keyframes floaty{to{transform:translateY(-40px);opacity:0}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
.banner{pointer-events:none;position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.2);background:var(--ink);color:var(--accent);font-family:"Arial Black",sans-serif;font-size:56px;padding:18px 44px;border-radius:20px;border:5px solid var(--accent);z-index:65;opacity:0;animation:banner calc(1.8s * var(--spd)) ease-out forwards;text-align:center;white-space:nowrap}
.banner small{display:block;font-size:22px;color:#fff}
@keyframes banner{15%{transform:translate(-50%,-50%) scale(1.1);opacity:1}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-60%) scale(.9)}}
.reduced .banner{animation:none;opacity:1;transform:translate(-50%,-50%)}

/* ---------- side panel ---------- */
.card{background:var(--panel);border:3px solid var(--ink);border-radius:14px;padding:8px 10px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
#turnCard .who{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:800}
#turnCard .who .tk{font-size:28px}
#turnCard .info{font-size:14px;color:var(--muted)}
#turnBtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
#turnBtns button.big{font-size:20px;padding:6px 22px}
#timerBar{height:6px;background:#e6e6e6;border-radius:4px;overflow:hidden;margin-top:6px}
#timerBar i{display:block;height:100%;background:var(--good);width:100%;transition:width 1s linear}
.hurry{animation:hurry .5s ease-in-out 4}
@keyframes hurry{25%{transform:rotate(-2deg) scale(1.03)}75%{transform:rotate(2deg) scale(1.03)}}
#hurryTag{display:inline-block;background:var(--accent2);color:#fff;padding:2px 8px;border-radius:8px;font-weight:900;margin-left:6px}
#dash{flex:1;overflow:auto;display:flex;flex-direction:column;gap:5px;padding:2px}
.pdash{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;background:var(--panel);border:3px solid var(--ink);border-radius:12px;padding:5px 8px;cursor:pointer;text-align:left;box-shadow:0 3px 0 rgba(0,0,0,.2);min-height:0;font-weight:400}
.pdash.me{border-color:var(--accent2);background:#fff8e6}
.pdash .av{grid-row:1 / 3;width:44px;height:44px;border-radius:50%;border:3px solid;display:flex;align-items:center;justify-content:center;font-size:24px;background:#fff}
.pdash .nm{font-weight:800;font-size:16px;display:flex;gap:6px;align-items:center}
.pdash .nm .tag{font-size:11px;background:var(--panel2);border-radius:6px;padding:1px 5px;font-weight:700}
.pdash .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;font-size:12px}
.pdash .stat{display:flex;flex-direction:column;min-width:0}
.pdash .stat b{font-size:14px;white-space:nowrap}
.pdash .stat span{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pdash canvas{width:100%;height:14px;display:block}
.flowneg{animation:flash 1s steps(2) infinite;color:var(--bad)!important}
@keyframes flash{50%{opacity:.35}}
#sideBtns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
#sideBtns button{font-size:14px;padding:4px 6px}

/* ---------- modals ---------- */
#modalRoot{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(15,25,35,.55);padding:12px}
.modal{background:var(--paper);border:4px solid var(--ink);border-radius:18px;box-shadow:var(--shadow);width:min(720px,96vw);max-height:calc(100vh - 30px);overflow:auto;padding:14px 18px;position:relative}
.modal.wide{width:min(1000px,96vw)}
.modal.flip{animation:flipIn calc(.6s * var(--spd)) ease-out}
@keyframes flipIn{from{transform:perspective(900px) rotateY(90deg)}to{transform:perspective(900px) rotateY(0)}}
.modal h2{font-size:26px;padding-right:90px}
.modal .tools{position:absolute;top:10px;right:10px;display:flex;gap:6px}
.modal .tools button{min-height:40px;padding:2px 8px}
.modal .body{font-size:18px;line-height:1.4}
.modal .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;justify-content:flex-end}
.deckname{display:inline-block;font-weight:900;font-size:13px;padding:3px 10px;border-radius:20px;border:2px solid var(--ink);margin-bottom:4px}
.dk-opportunity{background:#ffd166}.dk-civic{background:#9ad1ff}.dk-decision{background:#c7f9cc}.dk-event{background:#ffadad}.dk-tenant{background:#e4c1f9}.dk-ballot{background:#bde0fe}
.insight{background:#e8f6ff;border:2px dashed #1d7fd8;border-radius:12px;padding:8px 12px;margin-top:10px;font-size:16px}
.insight b{color:#0b4f8a}
.realworld{font-size:14px;color:#444;margin-top:6px;border-left:4px solid var(--accent2);padding-left:8px}
.why{background:#fff3c4;border:2px solid #e0b000;border-radius:12px;padding:8px 12px;margin-top:8px;font-size:16px}
.msgs{margin:8px 0;padding-left:20px}
.msgs li{margin:3px 0}
.opt{display:flex;flex-direction:column;gap:4px;border:3px solid var(--ink);border-radius:12px;padding:8px;background:#fff;flex:1;min-width:220px}
.opts{display:flex;gap:10px;flex-wrap:wrap}
.term{background:none;border:none;box-shadow:none;min-height:0;min-width:0;padding:0;font-weight:inherit;text-decoration:underline dotted 2px;text-underline-offset:3px;color:#0b4f8a;cursor:help}
#termPop{position:fixed;z-index:80;max-width:300px;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:8px 12px;box-shadow:var(--shadow);font-size:15px}
table.t{border-collapse:collapse;width:100%;font-size:15px}
table.t th,table.t td{border-bottom:1px solid #ccc;padding:4px 6px;text-align:right}
table.t th:first-child,table.t td:first-child{text-align:left}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.tabs button{border-radius:10px 10px 0 0;box-shadow:none;font-size:15px}
.tabs button[aria-selected=true]{background:var(--accent)}
.deed{border:3px solid var(--ink);border-radius:12px;overflow:hidden;background:#fff}
.deed .hd{padding:10px;color:#fff;text-align:center;font-weight:900;font-size:20px;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.deed .bd{padding:8px 12px;font-size:15px}
.pill{display:inline-block;padding:2px 8px;border-radius:12px;background:var(--panel2);border:1px solid #bbb;font-size:13px;font-weight:700;margin:1px}
.bar{height:16px;background:#e3e3e3;border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good)}
.toastRoot{position:fixed;bottom:12px;left:calc(var(--bs) / 2 + 8px);transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:66;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:8px 16px;border-radius:12px;font-weight:700;box-shadow:var(--shadow);max-width:min(560px,90vw);animation:toastIn .25s ease-out}
@keyframes toastIn{from{transform:translateY(20px);opacity:0}}
.vote-bars{display:flex;gap:20px;justify-content:center;align-items:flex-end;height:160px;margin:10px 0}
.vote-bars div{width:90px;background:var(--good);border:3px solid var(--ink);border-radius:8px 8px 0 0;display:flex;align-items:flex-start;justify-content:center;color:#fff;font-weight:900;font-size:26px;transition:height calc(1.2s * var(--spd)) ease-out;height:4px}
.vote-bars div.no{background:var(--bad)}
.tally-label{display:flex;gap:20px;justify-content:center;font-weight:900}
.tally-label span{width:90px;text-align:center}

/* ---------- full screens (start / setup / results) ---------- */
.screen{position:fixed;inset:0;overflow:auto;background:radial-gradient(circle at 30% 20%,#cfe8d5,#7fb89a);z-index:40;padding:18px}
.screen .inner{max-width:1100px;margin:0 auto}
.hero{display:flex;align-items:center;gap:20px;justify-content:center;margin:10px 0 18px}
.hero h1{font-size:64px;text-shadow:4px 4px 0 var(--accent);transform:rotate(-3deg)}
.hero p{font-size:18px;max-width:420px}
.savelist{display:flex;flex-direction:column;gap:8px}
.saveitem{display:flex;gap:10px;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:8px 12px}
.prow{display:grid;grid-template-columns:40px 1fr auto auto auto;gap:8px;align-items:center;margin:6px 0}
.tokpick{display:flex;gap:4px;flex-wrap:wrap}
.tokpick button{font-size:22px;padding:2px 6px;min-width:44px}
.tokpick button[aria-pressed=true]{background:var(--accent);border-width:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.careerCard{border:3px solid var(--ink);border-radius:14px;padding:10px;background:#fff;text-align:left;font-weight:400;box-shadow:0 4px 0 var(--ink);display:flex;flex-direction:column;gap:4px}
.careerCard[aria-pressed=true]{background:#fff3c4;outline:4px solid var(--accent2)}
.careerCard .big{font-size:34px}
fieldset{border:2px solid var(--ink);border-radius:12px;padding:8px 12px;margin:8px 0;background:rgba(255,255,255,.7)}
legend{font-weight:900;padding:0 6px}
label.chk{display:flex;align-items:center;gap:8px;min-height:44px;cursor:pointer}
label.chk input{width:22px;height:22px}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:12px;height:260px;margin:10px 0}
.pod{width:150px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.pod .blk{width:100%;background:var(--accent);border:4px solid var(--ink);border-radius:10px 10px 0 0;display:flex;align-items:flex-start;justify-content:center;font-family:"Arial Black",sans-serif;font-size:34px;padding-top:6px;overflow:hidden;animation:growUp calc(1.2s * var(--spd)) ease-out}
@keyframes growUp{from{height:0}}
.pod .tk{font-size:40px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;font-size:14px}
.statgrid div{background:var(--panel2);border-radius:8px;padding:6px}
.statgrid b{display:block;font-size:17px}
.award{display:inline-flex;gap:6px;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:6px 10px;margin:4px;font-weight:800}
.resCard{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:12px;margin:10px 0;page-break-inside:avoid}
textarea{width:100%;min-height:70px}
.qc-choices{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.qc-choices button{text-align:left}
.qc-choices button.right{background:#7be495}.qc-choices button.wrong{background:#ffb3b8}
.coach{position:fixed;z-index:90;background:#fff;border:4px solid var(--accent2);border-radius:16px;padding:12px 16px;max-width:360px;box-shadow:var(--shadow);font-size:17px}
.coachHole{position:fixed;z-index:89;border:4px dashed var(--accent2);border-radius:14px;pointer-events:none;box-shadow:0 0 0 9999px rgba(0,0,0,.35)}
.reduced *{animation-duration:0s!important;transition-duration:0s!important}

@media (max-width:1200px){ #side{min-width:330px} .pdash .stats{grid-template-columns:repeat(3,1fr)} }
@media print{
  html,body{overflow:visible;height:auto;background:#fff}
  #game,#ticker,#modalRoot,.noprint,#fxLayer,.toastRoot{display:none!important}
  .screen{position:static;background:#fff;overflow:visible;padding:0}
  .resCard,.card{box-shadow:none}
  button{display:none!important}
  textarea{border:1px solid #999}
}
</style>

      insight: "Higher return always means higher risk. If someone says \"guaranteed\" and \"high return\" together, be careful.", vocab: "fraud", realWorld: "Real scams almost never pay out. Report investment fraud to the SEC or your state's securities office." },
    { id: "o_startup", title: "Startup Pitch", text: "Your friend is starting a food truck and asks you to invest $100.",
      options: [
        { id: "invest", label: "Invest $100", why: "Most new businesses struggle, but some do great. You could lose it all or earn a lot.", effects: [{ op: "gamble", cost: 100, prob: 0.34, win: 400, winText: "The food truck is a hit! You get $400.", loseText: "The truck closed after one season. You lost your $100." }] },
        { id: "pass", label: "Pass", why: "You keep your $100 safe, but you give up a chance at a big return.", effects: [] }
      ],
      insight: "Investing in one small business is high risk, high reward. Spreading money across many investments lowers risk.", vocab: "risk and return" },
    { id: "o_expo", title: "Business Expo", text: "Advance to Main Street Shops for the business expo. If you pass PAYDAY, collect your Bonus Check.",
      effects: [{ op: "moveTo", space: 24 }], insight: "Commercial real estate is property used for business, like shops, offices and factories.", vocab: "commercial real estate" },
    { id: "o_pricewar", title: "Price War", text: "Two big stores slash prices to win shoppers. Market District rents drop 20% this Year.",
      effects: [{ op: "rentMod", target: ["market"], mult: 0.8, years: 1 }], insight: "When businesses compete hard for customers, prices fall. Competition helps buyers.", vocab: "competition" },
    { id: "o_shoplocal", title: "Shop Local Weekend", text: "The town runs a Shop Local festival. Market District rents rise 30% this Year.",
      effects: [{ op: "rentMod", target: ["market"], mult: 1.3, years: 1 }], insight: "When more people want to shop in an area, store spaces there earn more. That's demand at work.", vocab: "demand" },
    { id: "o_refi", title: "Refinance Offer", text: "A bank offers to replace one of your loans with a new loan at today's rate. The fee is $20.",
      needs: "hasLoan",
      options: [
        { id: "refi", label: "Refinance", why: "If today's rate is lower than your loan's rate, you'll pay less interest. If it's higher, refinancing costs you more.", effects: [{ op: "refinance", fee: 20 }] },
        { id: "keep", label: "Keep my loan", why: "You skip the fee and keep your current rate.", effects: [] }
      ],
      insight: "Refinancing means replacing an old loan with a new one, usually to get a lower interest rate.", vocab: "refinance" },
    { id: "o_compare", title: "Comparison Shopping", text: "You check three stores before buying a new laptop and save $40.",
      effects: [{ op: "cash", amount: 40, cat: "other" }], insight: "Comparing prices before you buy is one of the easiest ways to save money.", vocab: "comparison shopping" },
    { id: "o_detour", title: "Road Construction Detour", text: "The bridge is being repaired. Move back 3 spaces.",
      effects: [{ op: "moveBy", n: -3 }], insight: "Roads and bridges are infrastructure. Fixing them costs money and time, but towns can't work without them.", vocab: "infrastructure" },
    { id: "o_lumber", title: "Lumber Prices Drop", text: "A big harvest means cheap lumber. Building costs drop 25% this Year.",
      effects: [{ op: "buildCost", mult: 0.75, years: 1 }], insight: "When the supply of something goes up, its price usually goes down.", vocab: "supply" },
    { id: "o_franchise", title: "Franchise Deal", text: "A famous coffee chain will put a store in one of your commercial lots if you pay a $150 setup fee.",
      needs: "hasCommercial",
      options: [
        { id: "yes", label: "Pay $150", why: "The lot earns 20% more rent for the rest of the game. It pays off if people land there often.", effects: [{ op: "franchise", cost: 150, mult: 1.2 }] },
        { id: "no", label: "No thanks", why: "You keep $150 now but miss out on higher rent later.", effects: [] }
      ],
      insight: "A well-known brand can bring more customers. Paying for it is an investment that may or may not pay off.", vocab: "investment" },
    { id: "o_lend", title: "A Friend Needs a Loan", text: "Your friend asks to borrow $100 and promises to pay back $110 next Year.",
      options: [
        { id: "lend", label: "Lend $100", why: "If your friend pays you back, you earn $10 interest. If not, you lose $100. Lenders face this credit risk with every loan.", effects: [{ op: "cash", amount: -100, cat: "other" }, { op: "delayed", years: 1, prob: 0.5, win: [{ op: "cash", amount: 110, cat: "interest" }], winText: "Your friend paid you back $110!", loseText: "Your friend never paid you back." }] },
        { id: "no", label: "Say no", why: "You keep your money, but it may be awkward with your friend.", effects: [] }
      ],
      insight: "Credit risk is the chance that a borrower won't pay back a loan. Banks charge higher interest to riskier borrowers for this reason.", vocab: "credit risk" },
    { id: "o_impulse", title: "Impulse Buy?", text: "The newest phone just came out. It costs $120. Your phone works fine.",
      options: [
        { id: "buy", label: "Buy the phone", why: "You get a new phone today. The $120 can't be saved or invested anymore.", effects: [{ op: "cash", amount: -120, cat: "other" }] },
        { id: "skip", label: "Skip it", why: "You keep $120 to save, invest or spend on something else.", effects: [] }
      ],
      insight: "Opportunity cost is what you give up when you choose something. The cost of the phone is also everything else that $120 could have become.", vocab: "opportunity cost", showOppCost: 120 },
    { id: "o_agent", title: "Hire an Agent", text: "A real estate agent can sell one of your lots at full market value. The agent keeps 6%.",
      needs: "lotNoBuildings",
      options: [
        { id: "sell", label: "Sell with the agent", why: "You turn a lot into cash fast (that's liquidity), but you pay a 6% commission and lose the rent.", effects: [{ op: "sellLotOffer", pick: "cheapest", mult: 0.94 }] },
        { id: "keep", label: "Keep the lot", why: "You keep the lot and its rent.", effects: [] }
      ],
      insight: "Liquidity is how fast you can turn something into cash. Real estate is not very liquid: selling takes time and fees.", vocab: "liquidity" },
    { id: "o_room", title: "Rent Your Spare Room", text: "Homeowners can rent a spare room to a college student. If you own your home, collect $40 each Year for 3 Years.",
      effects: [{ op: "homeShare", amount: 40, years: 3 }], insight: "The sharing economy lets people earn money from things they already own, like a room or a car.", vocab: "sharing economy" },
    { id: "o_raiserent", title: "Raise the Rent?", text: "You could raise the rent on your best lot by 30% for a Year.",
      needs: "hasLot",
      options: [
        { id: "raise", label: "Raise it 30%", why: "You earn more per visit, but there's a 30% chance your tenant moves out and the lot sits empty all Year.", effects: [{ op: "raiseRent", mult: 1.3, vacancy: 0.3 }] },
        { id: "keep", label: "Keep rent the same", why: "Steady rent and a happy tenant.", effects: [] }
      ],
      insight: "Price elasticity is how much buyers react to a price change. If tenants have other choices, a big rent hike can make them leave.", vocab: "price elasticity" },
    { id: "o_mixup", title: "Paperwork Mix-up", text: "Your receipts are a mess. Go directly to Audit. Do not pass PAYDAY.",
      effects: [{ op: "toAudit" }], insight: "Keeping good records (receipts, bills, pay stubs) protects you if the tax office has questions.", vocab: "recordkeeping" },
    { id: "o_grand", title: "Grand Opening Buzz", text: "Advance to the nearest commercial lot. If nobody owns it, you may buy it for 10% off.",
      effects: [{ op: "moveNearest", kind: "commercial", discount: 0.1 }], insight: "New businesses enter a market when they think they can make a profit there.", vocab: "market entry" }
  ],

  /* ---------- CIVIC DUTY DECK (government, law, tax) ---------- */
  CIVIC: [
    { id: "c_refund", title: "Tax Refund", text: "Too much tax was taken out of your paychecks. Collect a $60 refund.",
      effects: [{ op: "cash", amount: 60, cat: "other" }], insight: "Employers hold back (withhold) part of each paycheck for taxes. If they hold back too much, you get a refund when you file.", vocab: "withholding" },
    { id: "c_jury", title: "Jury Duty", text: "You serve on a jury for a week. Collect $15 in juror pay.",
      effects: [{ op: "cash", amount: 15, cat: "other" }, { op: "civic", n: 1 }], insight: "The right to a trial by jury depends on citizens serving. Jury service is a civic duty.", vocab: "jury", realWorld: "Juror pay is small and set by each court. Many states require employers to give workers time off for jury duty." },
    { id: "c_reassess", title: "Property Reassessment", text: "The county reassessed your properties. Their assessed value goes up 10%, so your property tax will rise.",
      effects: [{ op: "assess", mult: 1.1 }], insight: "Property tax is based on assessed value, the value the government sets for tax purposes.", vocab: "assessed value" },
    { id: "c_code", title: "Building Code Inspection", text: "Inspectors check your buildings for safety. Pay $25 per house and $100 per hotel for repairs.",
      effects: [{ op: "perBuilding", house: 25, hotel: 100 }], insight: "Building codes are safety rules for construction, like fire exits and safe wiring. They protect the people inside.", vocab: "building code" },
    { id: "c_clean", title: "Clean Records", text: "Your records are perfect. Keep this card. Use it to leave Audit for free.",
      effects: [{ op: "keepCard", card: "clean" }], insight: "Good recordkeeping makes taxes easy and protects you in an audit.", vocab: "audit" },
    { id: "c_filing", title: "Filing Error", text: "You forgot to sign your tax form. Go directly to Audit. Do not pass PAYDAY.",
      effects: [{ op: "toAudit" }], insight: "An audit is when the tax office checks your tax return. Most mistakes are fixed by showing your records.", vocab: "audit", realWorld: "A real audit doesn't put you in jail. Most audits are done by mail and end with a correction or a small payment." },
    { id: "c_census", title: "Census Counts", text: "Port Juniper had a great census response. More state and federal money comes to town. Every player collects $20.",
      effects: [{ op: "cashAll", amount: 20 }], insight: "The census counts everyone every 10 years. It decides how many representatives a state gets and where government money goes.", vocab: "census" },
    { id: "c_register", title: "Register to Vote", text: "You registered to vote at the library. Collect $10 for being a civic star.",
      effects: [{ op: "cash", amount: 10, cat: "other" }, { op: "civic", n: 1 }], insight: "In most states, you must register before you can vote. Local elections decide things like school funding and zoning.", vocab: "voter registration", realWorld: "Nobody gets paid to register to vote. The $10 is just a game reward." },
    { id: "c_easement", title: "Utility Easement", text: "The power company needs a line across one of your lots. Its value drops 10%, and you're paid $40.",
      needs: "hasLot",
      effects: [{ op: "easement", mult: 0.9, comp: 40 }], insight: "An easement gives someone else the right to use part of your land for a purpose, like a power line, while you still own it.", vocab: "easement" },
    { id: "c_eminent", title: "Eminent Domain: New Road", text: "The city needs land for a new road. It takes your cheapest lot without buildings and pays you fair market value.",
      effects: [{ op: "eminentDomain", filter: "noBuildings" }], insight: "Eminent domain is the government's power to take private property for public use. The Fifth Amendment requires \"just compensation,\" usually fair market value.", vocab: "eminent domain", realWorld: "Owners can challenge the price in court, and many get help from an appraiser." },
    { id: "c_hoa", title: "HOA Dues", text: "Your Homeowners Association collects dues. Pay $20 for each lot you own in Juniper Heights or Harbor Point.",
      effects: [{ op: "perLotInGroups", groups: ["heights","harbor"], amount: 20 }], insight: "A Homeowners Association (HOA) sets rules for a neighborhood and charges dues to maintain shared spaces.", vocab: "HOA" },
    { id: "c_permitfree", title: "Permit Fee Waived", text: "The city wants more housing. Your next building permit this Year is free.",
      effects: [{ op: "flagMe", flag: "permitFree", value: 1, years: 1 }], insight: "Governments use incentives, like lower fees, to encourage things they want, such as more housing.", vocab: "incentive" },
    { id: "c_grant", title: "Small Business Grant", text: "The town gives grants to local businesses. If you own a commercial lot, collect $80.",
      effects: [{ op: "ifOwnsKind", kind: "com", amount: 80 }], insight: "A grant is money from the government that you don't pay back. It usually comes with rules.", vocab: "grant" },
    { id: "c_salestax", title: "Sales Tax Holiday", text: "It's back-to-school sales tax holiday. You save $30 on supplies.",
      effects: [{ op: "cash", amount: 30, cat: "other" }], insight: "Sales tax is a tax added to the price of things you buy. Some states pause it for a few days each year.", vocab: "sales tax" },
    { id: "c_records", title: "Tax Records Check", text: "The tax office checks your records. If you've never missed a payment, you're fine. Otherwise, pay a $50 penalty.",
      effects: [{ op: "recordsCheck", penalty: 50 }], insight: "Paying bills and taxes on time keeps you out of trouble and keeps your credit strong.", vocab: "penalty" },
    { id: "c_zoningboard", title: "Zoning Board Hearing", text: "The zoning board is meeting. This Year, your variance applications cost half price.",
      effects: [{ op: "flagMe", flag: "varianceHalf", value: 1, years: 1 }], insight: "A variance is permission to break a zoning rule on one lot. Neighbors can speak at the hearing.", vocab: "variance" },
    { id: "c_sidewalks", title: "Public Works: New Sidewalks", text: "The city builds new sidewalks and streetlights. Demand rises 10% in your most valuable district.",
      effects: [{ op: "demandMyBest", mult: 1.1 }], insight: "Public goods like sidewalks are paid for with taxes and used by everyone. They can make land more valuable.", vocab: "public goods" },
    { id: "c_ratehearing", title: "Utility Rate Hearing", text: "The state utility board limits how much utilities can charge. Utility rent is capped at 4x the dice this Year.",
      effects: [{ op: "flagGlobal", flag: "utilityCap", years: 1 }], insight: "Utilities are often natural monopolies, so governments regulate their prices to protect customers.", vocab: "natural monopoly" },
    { id: "c_smallclaims", title: "Small Claims Court", text: "A contractor took your money but didn't finish the job. You win $50 in small claims court.",
      effects: [{ op: "cash", amount: 50, cat: "other" }], insight: "Small claims court handles small money disputes quickly. You usually don't need a lawyer.", vocab: "small claims court" },
    { id: "c_fineprint", title: "Read the Fine Print", text: "Your gym contract had a $40 cancellation fee you didn't notice. Pay $40.",
      effects: [{ op: "cash", amount: -40, cat: "fees" }], insight: "A contract is a legal agreement. Once you sign, you usually must follow all of it, including the fine print.", vocab: "contract" },
    { id: "c_vita", title: "Free Tax Help", text: "A free tax-help program at the library does your taxes. You save the $30 a preparer would charge.",
      effects: [{ op: "cash", amount: 30, cat: "other" }], insight: "Free tax-prep programs (like VITA) help people with lower incomes file their taxes.", vocab: "tax return" },
    { id: "c_fairhousing", title: "Fair Housing Training", text: "Landlords must take a short Fair Housing course. If you own any residential lot, pay a $10 fee.",
      effects: [{ op: "ifOwnsKind", kind: "res", amount: -10, cat: "fees" }], insight: "The Fair Housing Act makes it illegal to refuse to rent or sell housing because of race, color, religion, sex, national origin, disability or family status.", vocab: "fair housing" },
    { id: "c_bond", title: "City Bond Pays Interest", text: "You bought a Port Juniper city bond. It pays $25 interest.",
      effects: [{ op: "cash", amount: 25, cat: "interest" }], insight: "A bond is a loan you make to a government or company. They pay you interest and return your money later.", vocab: "bond" },
    { id: "c_permitrise", title: "Permit Fees Rise", text: "The city raised fees to pay for more inspectors. Building permits cost $10 more for everyone this Year.",
      effects: [{ op: "flagGlobal", flag: "permitPlus", value: 10, years: 1 }], insight: "Fees are charges for a government service, like a permit. Unlike taxes, you pay them only when you use the service.", vocab: "fee" }
  ],

  /* ---------- DECISION POINTS (two-choice dilemmas; outcomes shown later) ---------- */
  DECISIONS: [
    { id: "d_refi", title: "Refinance or Keep?", text: "You can refinance all your loans at today's rate. The fee is $30.",
      options: [
        { id: "refi", label: "Refinance everything", why: "Good if today's rate is lower than your loans' rates. If rates fall later, you could have waited.", effects: [{ op: "refinanceAll", fee: 30 }] },
        { id: "keep", label: "Keep my loans", why: "No fee. You keep your current rates, good or bad.", effects: [] }
      ], insight: "Interest rates change over time. Refinancing makes sense when the savings are bigger than the fees.", vocab: "interest rate" },
    { id: "d_health", title: "Health Insurance?", text: "Your job offers health insurance for $40 a Year. You feel healthy.",
      options: [
        { id: "buy", label: "Buy health insurance", why: "You pay $40 a Year for sure. A big medical bill would cost you only the $50 deductible.", effects: [{ op: "insure", kind: "health", on: true }] },
        { id: "skip", label: "Go without", why: "You save $40 a Year. If you get sick or hurt, you pay the whole bill.", effects: [{ op: "insure", kind: "health", on: false }] }
      ], insight: "Insurance trades a small, certain cost (the premium) for protection against a big, uncertain cost.", vocab: "premium" },
    { id: "d_job", title: "Job Offer Across Town", text: "A company in another district offers you $40 more a Year. Moving costs $100.",
      options: [
        { id: "take", label: "Take the job", why: "You pay $100 now and earn $40 more every Year. It pays off after about 3 Years. Renters also pay $20 more rent a Year.", effects: [{ op: "cash", amount: -100, cat: "other" }, { op: "salaryDelta", delta: 40 }, { op: "renterCostDelta", delta: 20 }] },
        { id: "stay", label: "Stay put", why: "No moving cost and no change.", effects: [] }
      ], insight: "Good decisions compare costs now with benefits later. Benefits that add up every year can beat a big cost today.", vocab: "cost-benefit analysis" },
    { id: "d_warranty", title: "Extended Warranty?", text: "Your new fridge comes with an offer: $30 for 3 Years of repair coverage.",
      options: [
        { id: "buy", label: "Buy the warranty", why: "If the fridge breaks, you're covered. If it doesn't, you paid $30 for nothing.", effects: [{ op: "cash", amount: -30, cat: "insurance" }, { op: "delayed", years: 2, prob: 0.25, win: [], winText: "Your fridge broke and the warranty paid the $90 repair!", loseText: "Your fridge never broke. The warranty cost $30 and paid nothing.", value: 60 }] },
        { id: "skip", label: "Skip it", why: "You save $30. If the fridge breaks, you pay the repair yourself.", effects: [{ op: "delayed", years: 2, prob: 0.25, win: [{ op: "cash", amount: -90, cat: "other" }], winText: "Your fridge broke. The repair cost $90.", loseText: "Your fridge never broke. Skipping the warranty saved you $30.", value: 30 }] }
      ], insight: "Extended warranties are a kind of insurance. Sellers price them so that, on average, they make money on them.", vocab: "warranty" },
    { id: "d_paydown", title: "Pay Down Debt or Invest?", text: "You have $200 to spare. Pay extra on your highest-rate loan or put it in the index fund?",
      needsCash: 200,
      options: [
        { id: "pay", label: "Pay down debt", why: "Every dollar of debt you pay off saves you that loan's interest rate, guaranteed.", effects: [{ op: "payDownDebt", amount: 200 }] },
        { id: "invest", label: "Invest in the index fund", why: "The fund may grow faster than your loan rate, or it may drop. It's not guaranteed.", effects: [{ op: "investFund", amount: 200 }] }
      ], insight: "Paying off debt is like earning a guaranteed return equal to the interest rate. Investing may earn more, with risk.", vocab: "return" },
    { id: "d_car", title: "Lease or Buy a Car?", text: "You need a car to get to work.",
      options: [
        { id: "lease", label: "Lease ($40 a Year)", why: "Low cost each Year, but you never own the car and pay forever.", effects: [{ op: "recurring", amount: -40, years: 99, label: "Car lease" }] },
        { id: "buy", label: "Buy a used car ($150 now)", why: "A big cost now, but then the car is yours. Cars lose value over time (depreciation).", effects: [{ op: "cash", amount: -150, cat: "other" }] }
      ], insight: "Leasing means paying to use something you don't own. Buying costs more up front but can be cheaper over time.", vocab: "lease" },
    { id: "d_cosign", title: "Co-sign for a Friend?", text: "Your friend needs a co-signer for a car loan. If they don't pay, you must.",
      options: [
        { id: "sign", label: "Co-sign", why: "You help your friend. But if they miss payments, you owe the money and your credit score drops.", effects: [{ op: "delayed", years: 1, prob: 0.3, win: [{ op: "cash", amount: -150, cat: "loans" }, { op: "credit", delta: -40 }], winText: "Your friend stopped paying. You owed $150 and your credit dropped 40 points.", loseText: "Your friend paid every bill on time. Co-signing worked out.", value: -45 }] },
        { id: "no", label: "Say no", why: "No risk to your money or credit. Your friend has to find another way.", effects: [] }
      ], insight: "A co-signer promises to pay a loan if the borrower doesn't. The debt shows on the co-signer's credit too.", vocab: "co-signer" },
    { id: "d_night", title: "Night Classes?", text: "A night class in your field costs $120. Graduates earn $30 more a Year.",
      options: [
        { id: "take", label: "Take the class", why: "You pay $120 now and earn $30 more every Year starting next Year. That's investing in human capital.", effects: [{ op: "cash", amount: -120, cat: "other" }, { op: "delayed", years: 1, prob: 1, win: [{ op: "salaryDelta", delta: 30 }], winText: "You finished the class! Your salary went up $30 a Year." }] },
        { id: "skip", label: "Skip it", why: "You keep $120. Your pay stays the same.", effects: [] }
      ], insight: "Human capital is the skills and knowledge that make you more productive. Education is an investment in it.", vocab: "human capital" },
    { id: "d_bnpl", title: "Buy Now, Pay Later?", text: "A new TV costs $120. Or use Buy Now, Pay Later: $50 a Year for 3 Years.",
      options: [
        { id: "bnpl", label: "Buy now, pay later", why: "Nothing today, but you'll pay $150 in total. That's $30 more than the price.", effects: [{ op: "recurring", amount: -50, years: 3, label: "TV payments" }] },
        { id: "cash", label: "Pay $120 cash", why: "You pay less in total, but your cash drops today.", effects: [{ op: "cash", amount: -120, cat: "other" }] },
      ], insight: "Paying over time often costs more in total. Always compare the total cost, not only the payment.", vocab: "total cost" },
    { id: "d_raiseall", title: "Raise Rents on All Homes?", text: "You could raise rent 15% on every residential lot you own for the rest of the game.",
      needs: "hasRes",
      options: [
        { id: "raise", label: "Raise rents 15%", why: "More income from each visit, but each lot has a 20% chance its tenant leaves and it sits empty next Year.", effects: [{ op: "raiseAllRes", mult: 1.15, vacancy: 0.2 }] },
        { id: "keep", label: "Keep rents steady", why: "Stable tenants and fewer empty units.", effects: [] }
      ], insight: "A landlord sets rent, but tenants decide whether to stay. Too-high rent leads to vacancies.", vocab: "vacancy rate" },
    { id: "d_vacation", title: "Emergency Fund or Vacation?", text: "You have $150 extra. Put it in your emergency fund or take a trip?",
      needsCash: 150,
      options: [
        { id: "fund", label: "Emergency fund", why: "If something breaks or you get a big bill, you won't need a high-interest loan.", effects: [{ op: "toEmergency", amount: 150 }] },
        { id: "trip", label: "Take a trip", why: "You'll make great memories. Fun has value too; the game just can't measure it in dollars.", effects: [{ op: "cash", amount: -150, cat: "other" }] }
      ], insight: "Experts suggest saving 3 to 6 months of expenses for emergencies before taking big risks.", vocab: "emergency fund" },
    { id: "d_solar", title: "Solar Panels?", text: "Solar panels for your home cost $200. They save $30 a Year in power bills and add value to your home.",
      options: [
        { id: "yes", label: "Install solar", why: "Homeowners pay $200 now and save $30 every Year, plus the home is worth more. Renters can't install them.", effects: [{ op: "solar", cost: 200, save: 30 }] },
        { id: "no", label: "Not now", why: "You keep your $200.", effects: [] }
      ], insight: "Some purchases pay for themselves over time. Divide the cost by the yearly savings to find the payback period.", vocab: "payback period" }
  ],

  /* ---------- LIFE / ECONOMY EVENTS (one each Year) ----------
     weights = how likely in each phase [expansion, peak, recession, recovery].
     scope "macro" hits everyone; "personal" hits one random player. */
  EVENTS: [
    { id: "e_recession", scope: "macro", fx: "recession", title: "Recession Hits", weights: [0,4,1,0],
      text: "Businesses slow down and people spend less. Land demand drops 30%, empty stores double, and layoffs cut salaries 10%.",
      effects: [{ op: "demand", target: "all", mult: 0.7 }, { op: "vacancyMult", mult: 2, years: 1 }, { op: "salaryAll", mult: 0.9 }, { op: "phase", set: "recession" }],
      insight: "A recession is a big drop in economic activity that lasts months. Commercial property is usually hit hardest.", vocab: "recession" },
    { id: "e_boom", scope: "macro", fx: "boom", title: "Economic Boom", weights: [3,2,0,1],
      text: "Jobs are everywhere and people are spending. Land demand rises 20% and salaries rise 5%.",
      effects: [{ op: "demand", target: "all", mult: 1.2 }, { op: "salaryAll", mult: 1.05 }],
      insight: "In an expansion, businesses hire and spend more. Booms often end in a peak, then a slowdown.", vocab: "expansion" },
    { id: "e_fedup", scope: "macro", title: "The Fed Raises Rates", weights: [1,3,0,1],
      text: "The Federal Reserve raises interest rates to slow inflation. The Base Rate goes up 1.5%. Variable-rate loans cost more.",
      effects: [{ op: "baseRate", delta: 0.015 }, { op: "inflationSet", value: 0.02 }],
      insight: "The Federal Reserve raises rates to cool the economy and fight inflation. Borrowing gets more expensive.", vocab: "Federal Reserve" },
    { id: "e_fedcut", scope: "macro", title: "The Fed Cuts Rates", weights: [0,0,3,3],
      text: "The Federal Reserve cuts interest rates to help the economy. The Base Rate drops 1%. Borrowing gets cheaper.",
      effects: [{ op: "baseRate", delta: -0.01 }],
      insight: "Lower interest rates make loans cheaper, which encourages people and businesses to borrow and spend.", vocab: "monetary policy" },
    { id: "e_inflation", scope: "macro", title: "Inflation Spike", weights: [2,3,0,1],
      text: "Prices jump this Year. Inflation hits 7%. Living costs rise 7%, building costs 10%, salaries only 4%, and rents 5%.",
      effects: [{ op: "inflationSet", value: 0.07 }, { op: "livingCost", mult: 1.07 }, { op: "buildCost", mult: 1.10 }, { op: "salaryAll", mult: 1.04 }, { op: "priceLevel", mult: 1.05 }],
      insight: "Inflation means prices rise over time. Cash buys less, and if pay rises more slowly than prices, people fall behind.", vocab: "inflation" },
    { id: "e_crash", scope: "macro", fx: "recession", title: "Stock Market Crash", weights: [0,3,2,0],
      text: "Stock prices fall fast. Index funds lose 30% of their value.",
      effects: [{ op: "fundShock", mult: 0.7 }],
      insight: "Stocks can drop sharply, but over long periods, diversified index funds have historically recovered and grown.", vocab: "stock market", realWorld: "Past recoveries don't guarantee future ones." },
    { id: "e_bubble", scope: "macro", fx: "boom", title: "Housing Bubble Inflates", weights: [2,2,0,0], requires: "notBubble",
      text: "Everyone wants to buy a home, and prices race up. Residential demand rises 35%.",
      effects: [{ op: "demand", target: "res", mult: 1.35 }, { op: "bubble", set: true }],
      insight: "A bubble is when prices rise far above what things are really worth because people expect prices to keep rising.", vocab: "bubble" },
    { id: "e_pop", scope: "macro", fx: "recession", title: "Housing Bubble Pops", weights: [1,4,4,0], requires: "bubble",
      text: "Buyers stop paying sky-high prices. Residential demand crashes 40%.",
      effects: [{ op: "demand", target: "res", mult: 0.6 }, { op: "bubble", set: false }],
      insight: "When a bubble pops, prices fall fast. People who borrowed a lot to buy at the top can owe more than their home is worth.", vocab: "underwater" },
    { id: "e_supply", scope: "macro", title: "Supply-Chain Shortage", weights: [2,2,1,1],
      text: "Ships are stuck and materials are scarce. Building costs rise 30% for 2 Years.",
      effects: [{ op: "buildCost", mult: 1.3, years: 2 }],
      insight: "When supply drops but demand stays the same, prices rise. That's what happens in a shortage.", vocab: "shortage" },
    { id: "e_taxreform", scope: "macro", title: "Tax Reform", weights: [1,1,1,1], once: true,
      text: "Congress changes income tax brackets. The first bracket gets wider and the top rate drops to 25%.",
      effects: [{ op: "taxBrackets", brackets: [[300,0.00],[600,0.10],[1100,0.20],[999999,0.25]] }],
      insight: "With progressive income tax, higher slices of income are taxed at higher rates. Lawmakers can change the brackets.", vocab: "progressive tax" },
    { id: "e_railnews", scope: "macro", fx: "boom", title: "New Rail Line Announced", weights: [2,1,1,2],
      text: "An express train will stop at one station. Land near that station jumps in value for 2 Years.",
      effects: [{ op: "corridorDouble", years: 2 }],
      insight: "In the 1800s, railroads created whole towns. Land near a station became valuable because people and goods could reach it.", vocab: "infrastructure" },
    { id: "e_factory", scope: "macro", fx: "boom", title: "New Factory Opens", weights: [2,1,0,2],
      text: "A battery factory opens in the Foundry District. Foundry demand rises 30%, and Mill Flats rises 15% (workers need homes).",
      effects: [{ op: "demand", target: ["foundry"], mult: 1.3 }, { op: "demand", target: ["mill"], mult: 1.15 }],
      insight: "New jobs bring new workers, who need housing and shops. One business can lift a whole area.", vocab: "multiplier effect" },
    { id: "e_tech", scope: "macro", fx: "boom", title: "Tech Company Moves to Midtown", weights: [2,1,0,1],
      text: "A tech company leases a whole building. Midtown Office demand rises 30%.",
      effects: [{ op: "demand", target: ["midtown"], mult: 1.3 }],
      insight: "Offices are worth more when businesses want to be there. Demand for space follows jobs.", vocab: "demand" },
    { id: "e_online", scope: "macro", title: "Online Shopping Surge", weights: [1,1,1,1],
      text: "More people shop online. Retail demand drops 20%, but warehouses are busy: Industrial demand rises 15%.",
      effects: [{ op: "demand", target: ["market"], mult: 0.8 }, { op: "demand", target: ["foundry"], mult: 1.15 }],
      insight: "New technology helps some businesses and hurts others. Economists call this creative destruction.", vocab: "creative destruction" },
    { id: "e_remote", scope: "macro", title: "Remote Work Trend", weights: [1,1,1,1],
      text: "Many workers now work from home. Office demand drops 20% and residential demand rises 10%.",
      effects: [{ op: "demand", target: ["midtown"], mult: 0.8 }, { op: "demand", target: "res", mult: 1.1 }],
      insight: "When people change how they live and work, demand shifts from one kind of property to another.", vocab: "shift in demand" },
    { id: "e_steady", scope: "macro", title: "Steady Growth", weights: [3,1,0,2],
      text: "A calm Year. The economy grows a little. Land demand rises 5%.",
      effects: [{ op: "demand", target: "all", mult: 1.05 }],
      insight: "Most years, the economy grows slowly. GDP measures the total value of everything a country produces.", vocab: "GDP" },
    { id: "e_gas", scope: "macro", title: "Gas Price Spike", weights: [1,2,1,1],
      text: "Gas prices jump. Living costs rise 10% this Year, and more people ride the train: rail rents rise 25%.",
      effects: [{ op: "livingCost", mult: 1.1 }, { op: "railRentMult", mult: 1.25, years: 1 }],
      insight: "When one product gets expensive, people switch to substitutes, like the train instead of driving.", vocab: "substitute" },
    { id: "e_recovery", scope: "macro", fx: "boom", title: "Recovery Begins", weights: [0,0,4,2],
      text: "Hiring picks up again. Land demand rises 10%, and the economy enters recovery.",
      effects: [{ op: "demand", target: "all", mult: 1.1 }, { op: "salaryAll", mult: 1.03 }, { op: "phase", set: "recovery" }],
      insight: "After a recession comes recovery. The business cycle goes expansion, peak, recession, recovery.", vocab: "business cycle" },
    { id: "e_minwage", scope: "macro", title: "State Raises Minimum Wage", weights: [1,1,1,1], once: true,
      text: "The state raises the minimum wage. Straight-to-Work salaries rise $30. Businesses' costs rise, so commercial rents drop 5%.",
      effects: [{ op: "salaryPath", path: "work", delta: 30 }, { op: "rentMod", target: "com", mult: 0.95, years: 99 }],
      insight: "A minimum wage raises pay for some workers but adds costs for businesses. Economists disagree about how much it affects jobs.", vocab: "minimum wage" },
    { id: "e_trades", scope: "macro", title: "Skilled-Trade Shortage", weights: [2,1,1,2],
      text: "Builders can't find enough electricians and plumbers. Trade Program players get an $80 bonus.",
      effects: [{ op: "bonusPath", path: "trade", amount: 80 }],
      insight: "When few workers have a needed skill, employers pay more to get them. Wages follow supply and demand too.", vocab: "labor market" },
    { id: "e_tourism", scope: "macro", fx: "boom", title: "Tourism Boom", weights: [2,1,0,1],
      text: "Port Juniper is on a \"Best Small Towns\" list. Harbor Point and Old Town demand rise 20%.",
      effects: [{ op: "demand", target: ["harbor","oldtown"], mult: 1.2 }],
      insight: "Tourism brings outside money into a town, which raises demand for nearby property.", vocab: "tourism" },
    { id: "p_inherit", scope: "personal", title: "Inheritance", weights: [1,1,1,1],
      text: "A great-aunt leaves {name} $200.",
      effects: [{ op: "cash", amount: 200, cat: "other" }],
      insight: "An inheritance is money or property passed down when someone dies.", vocab: "inheritance", realWorld: "Most inheritances aren't taxed, but a few states have inheritance taxes, and very large estates pay federal estate tax." },
    { id: "p_medical", scope: "personal", title: "Medical Bill", weights: [1,1,1,1],
      text: "{name} breaks an arm. The hospital bill is $250.",
      effects: [{ op: "insured", kind: "health", cost: 250 }],
      insight: "Health insurance pays most of a big medical bill. You pay the deductible first.", vocab: "deductible", realWorld: "Real health plans also have copays and coinsurance, and bills are often much bigger." },
    { id: "p_promo", scope: "personal", fx: "boom", title: "Promotion!", weights: [2,1,0,1],
      text: "{name} gets promoted! Salary rises 15%.",
      effects: [{ op: "salaryMult", mult: 1.15 }],
      insight: "Building skills and doing good work can lead to promotions and higher pay.", vocab: "promotion" },
    { id: "p_layoff", scope: "personal", fx: "recession", title: "Layoff", weights: [0,1,4,1],
      text: "{name}'s company cuts jobs. Next Year's paycheck is cut 60% while they look for work.",
      effects: [{ op: "flagMe", flag: "layoff", value: 0.4, years: 2 }],
      insight: "Unemployment insurance replaces part of your pay for a while if you lose your job through no fault of your own.", vocab: "unemployment insurance", realWorld: "Benefits and how long they last depend on your state." },
    { id: "p_storm", scope: "personal", fx: "recession", title: "Storm Damage", weights: [1,1,1,1],
      text: "A big storm hits {name}'s properties. Damage costs $150 plus $40 per building.",
      effects: [{ op: "propertyDamage", base: 150, perBuilding: 40 }],
      insight: "Property insurance pays to repair damage from storms and fires, minus the deductible.", vocab: "property insurance", realWorld: "Most property insurance doesn't cover floods. Flood insurance is separate." },
    { id: "p_car", scope: "personal", title: "Car Repair", weights: [1,1,1,1],
      text: "{name}'s car needs a new transmission. The repair costs $150.",
      effects: [{ op: "emergency", cost: 150 }],
      insight: "An emergency fund is money saved for surprises, so you don't need an expensive loan.", vocab: "emergency fund" },
    { id: "p_rezone", scope: "personal", title: "Your Lot Is Rezoned", weights: [1,1,1,1], requires: "targetHasLot",
      text: "The city changes the zoning on one of {name}'s lots.",
      effects: [{ op: "rezoneMine" }],
      insight: "Zoning laws decide what can be built where: homes, shops or factories. Cities can change zoning after a public process.", vocab: "zoning" },
    { id: "p_eminent", scope: "personal", title: "Eminent Domain: Highway", weights: [1,1,1,1], requires: "targetHasLot",
      text: "The state needs land for a highway ramp. It takes one of {name}'s lots and pays fair market value.",
      effects: [{ op: "eminentDomain", filter: "noHotel" }],
      insight: "The Fifth Amendment says the government can take private property for public use only with just compensation.", vocab: "just compensation" },
    { id: "p_fire", scope: "personal", title: "Apartment Fire", weights: [1,1,1,1], requires: "targetRents",
      text: "A kitchen fire in {name}'s apartment building damages $150 of their things.",
      effects: [{ op: "insured", kind: "renters", cost: 150 }],
      insight: "A landlord's insurance covers the building, not a renter's belongings. Renters insurance is cheap and covers your stuff.", vocab: "renters insurance" },
    { id: "p_idtheft", scope: "personal", title: "Identity Theft", weights: [1,1,1,1],
      text: "Someone opened a credit card in {name}'s name. Their credit score drops 40 points until the dispute is fixed next Year.",
      effects: [{ op: "credit", delta: -40 }, { op: "delayed", years: 1, prob: 1, win: [{ op: "credit", delta: 30 }], winText: "Your identity theft dispute was fixed. Credit +30." }],
      insight: "Check your credit report for free every year. You can freeze your credit so no one can open accounts in your name.", vocab: "credit report" },
    { id: "p_tuition", scope: "personal", title: "Employer Tuition Help", weights: [1,1,1,1],
      text: "{name}'s employer helps pay off student loans: $150 off the balance. (No student loan? Get a $60 bonus.)",
      effects: [{ op: "studentLoanCut", amount: 150, elseCash: 60 }],
      insight: "Some employers offer benefits like tuition help. Benefits are part of your total pay.", vocab: "benefits" },
    { id: "p_side", scope: "personal", fx: "boom", title: "Side Business Takes Off", weights: [2,1,0,1],
      text: "{name}'s online sticker shop goes viral. Collect $100.",
      effects: [{ op: "cash", amount: 100, cat: "other" }],
      insight: "An entrepreneur starts a business and takes on risk to earn a profit.", vocab: "entrepreneur" },
    { id: "p_pipe", scope: "personal", title: "Burst Pipe in a Rental", weights: [1,1,1,1], requires: "targetHasLot",
      text: "A pipe bursts in one of {name}'s rentals. The repair costs $100.",
      effects: [{ op: "rentalRepair", cost: 100 }],
      insight: "Landlords must keep rentals safe and livable. Repairs are a normal cost of owning rental property.", vocab: "maintenance" }
  ],

  /* ---------- BALLOT MEASURES ---------- */
  BALLOTS: [
    { id: "b_levy", title: "Measure A: School Levy", summary: "Raise the property tax rate by 3 mills to pay for school repairs and teachers.",
      yes: "Property taxes go up 3 mills. Schools get more money. Families want to live here more, so residential demand rises 10%.",
      no: "Property taxes stay the same. Schools keep their current budget.",
      fiscal: "+3 mills (about +$3 a Year for every $1,000 of property).",
      pro: "Good schools help kids and make the whole town more attractive. That raises home values.",
      con: "Owners and businesses pay more each Year, and some people on fixed incomes struggle with higher taxes.",
      effects: [{ op: "millage", delta: 3 }, { op: "demand", target: "res", mult: 1.1 }], cpu: "res",
      insight: "A levy is a tax that voters approve for a specific purpose. School funding in many states depends on local property taxes.", vocab: "levy" },
    { id: "b_taxcut", title: "Measure B: Property Tax Cut", summary: "Lower the property tax rate by 3 mills. The school and parks budgets shrink to match.",
      yes: "Property taxes go down 3 mills. Services are cut, so residential demand drops 5%.",
      no: "Taxes and services stay the same.",
      fiscal: "-3 mills. The town collects less money.",
      pro: "Owners keep more money, and lower taxes can attract new businesses.",
      con: "Less money for schools, roads and parks can make the town less attractive over time.",
      effects: [{ op: "millage", delta: -3 }, { op: "demand", target: "res", mult: 0.95 }], cpu: "owner",
      insight: "Every tax decision is also a decision about what services the community gets.", vocab: "budget" },
    { id: "b_upzone", title: "Measure C: Upzone Juniper Heights", summary: "Rezone Juniper Heights from residential to commercial, so shops and taller buildings are allowed.",
      yes: "Juniper Heights becomes commercial. Hotels are allowed, and rents act like commercial (higher, but empty units are possible).",
      no: "Juniper Heights stays residential only.",
      fiscal: "No direct cost. Could raise tax revenue if new buildings go up.",
      pro: "More buildings mean more jobs, more shops and more housing near transit.",
      con: "Neighbors may face more traffic, noise and change to the neighborhood's character.",
      effects: [{ op: "zoneGroup", group: "heights", to: "C" }], cpu: "group:heights",
      insight: "Zoning is decided by local governments, often after public hearings or votes. It shapes what a town looks like.", vocab: "referendum" },
    { id: "b_mixeduse", title: "Measure D: Foundry Mixed Use", summary: "Let old factories in the Foundry District become apartments and lofts.",
      yes: "Foundry District demand rises 10% and empty units drop, because the buildings can be used for more things.",
      no: "The Foundry District stays industrial only.",
      fiscal: "No direct cost.",
      pro: "Reusing old buildings adds housing and brings life to empty areas.",
      con: "Industry may get pushed out, and new residents may complain about noise from remaining factories.",
      effects: [{ op: "demand", target: ["foundry"], mult: 1.1 }, { op: "groupVacancy", group: "foundry", mult: 0.5 }], cpu: "group:foundry",
      insight: "Mixed-use zoning allows homes, shops and offices in the same area.", vocab: "mixed-use zoning" },
    { id: "b_railbond", title: "Measure E: Rail Bond", summary: "Borrow money (a bond) to build a transit stop in the Town Square, repaid with +1 mill of property tax for 4 Years.",
      yes: "A Town Square Transit Stop is built. Ferry Road, Heron Point, Corner Market and Bazaar Row get a +25% rail corridor boost. Property tax rises 1 mill for 4 Years.",
      no: "No new stop. No new tax.",
      fiscal: "+1 mill for 4 Years to repay the bond.",
      pro: "Transit connects people to jobs and raises land values near the stop.",
      con: "Everyone pays, even people who will never use the train, and projects can go over budget.",
      effects: [{ op: "transitStop" }, { op: "millage", delta: 1, years: 4 }], cpu: "lots:18,19,21,23",
      insight: "Governments sell bonds to pay for big projects now and pay the money back with taxes over time.", vocab: "bond" },
    { id: "b_historic", title: "Measure F: Riverside Historic District", summary: "Protect Riverside's old buildings by making it a historic district.",
      yes: "No new hotels can be built in Riverside. Its charm attracts buyers: demand rises 10%. Existing buildings stay (they're grandfathered).",
      no: "Riverside has no historic limits.",
      fiscal: "Small cost for a review board.",
      pro: "Protects history and the look of the neighborhood, which can raise values.",
      con: "Limits what owners can build and can make it harder to add housing.",
      effects: [{ op: "historic", group: "river" }, { op: "demand", target: ["river"], mult: 1.1 }], cpu: "group:river",
      insight: "Historic districts limit changes to buildings to protect a community's history.", vocab: "historic district" },
    { id: "b_rentcontrol", title: "Measure G: Rent Control", summary: "Limit how fast residential rents can rise each Year.",
      yes: "Residential rents can't rise faster than inflation + 2%. Players who rent an apartment pay less as prices rise. Investors are less interested: residential prices drop 10%.",
      no: "Landlords can set rents freely.",
      fiscal: "Small cost to run a rent board.",
      pro: "Keeps housing affordable for renters and helps families stay in their homes.",
      con: "Many economists say it can reduce the supply of rental housing and cut landlords' income for repairs.",
      effects: [{ op: "rentControl" }, { op: "demand", target: "res", mult: 0.9 }], cpu: "renter",
      insight: "Rent control is a price ceiling. Economists debate how it affects the supply and quality of housing.", vocab: "price ceiling" },
    { id: "b_factory", title: "Measure H: Factory Tax Incentive", summary: "Give a new factory 5 Years with no property tax so it chooses Port Juniper.",
      yes: "The factory comes: Foundry demand rises 30%. Everyone else pays +1 mill to make up the lost tax.",
      no: "The factory may go to another town.",
      fiscal: "The town gives up the factory's taxes; others pay +1 mill for 5 Years.",
      pro: "Brings hundreds of jobs and new customers for local businesses.",
      con: "Other taxpayers pay more, and the factory might leave when the deal ends.",
      effects: [{ op: "demand", target: ["foundry"], mult: 1.3 }, { op: "millage", delta: 1, years: 5 }], cpu: "group:foundry",
      insight: "Tax incentives are used to attract businesses. Communities weigh the jobs gained against the taxes lost.", vocab: "tax incentive" },
    { id: "b_parks", title: "Measure I: Parks & Trails Bond", summary: "Build a riverfront trail and parks, paid for with +1 mill for 5 Years.",
      yes: "Riverside and Juniper Heights demand rise 10%. Property tax rises 1 mill for 5 Years.",
      no: "No new parks. No new tax.",
      fiscal: "+1 mill for 5 Years.",
      pro: "Parks improve health and quality of life and raise nearby home values.",
      con: "It's a new tax, and the money could be used for other needs.",
      effects: [{ op: "demand", target: ["river","heights"], mult: 1.1 }, { op: "millage", delta: 1, years: 5 }], cpu: "group:river",
      insight: "Parks are public goods. Voters decide whether their benefits are worth the tax.", vocab: "public goods" },
    { id: "b_inclusionary", title: "Measure J: Inclusionary Housing", summary: "New big buildings in residential areas must include some affordable units. In return, variances get easier.",
      yes: "Variance approval chances rise 20%. Hotels on residential lots earn 15% less rent (some units are affordable).",
      no: "No change to the rules.",
      fiscal: "No direct cost.",
      pro: "Adds affordable homes so workers can live near their jobs.",
      con: "Builders earn less on each project, which may mean fewer projects.",
      effects: [{ op: "inclusionary" }], cpu: "renter",
      insight: "Inclusionary zoning requires some affordable units in new housing. It's one way towns try to keep housing affordable.", vocab: "affordable housing" }
  ],

  /* ---------- TENANT NOTICES (Advanced only: landlord-tenant law) ---------- */
  TENANT: [
    { id: "t_deposit", title: "Security Deposit Dispute", text: "A tenant moves out and wants their $50 deposit back. The walls show normal scuffs from living there.",
      options: [
        { id: "return", label: "Return the deposit, with a written list", why: "Normal wear and tear can't be charged. You give back the deposit and send a written list, as the law requires.", effects: [] },
        { id: "keep", label: "Keep it for the scuffs", why: "Charging for normal wear and tear usually isn't allowed. The tenant can sue in small claims court.", effects: [{ op: "cash", amount: -40, cat: "fees" }], resultText: "The tenant won in small claims court. You paid back the deposit plus $40 in penalties." }
      ], insight: "A security deposit protects the landlord from damage beyond normal use. Most states require landlords to list any deductions in writing.", vocab: "security deposit", realWorld: "Deadlines and penalty rules for deposits vary by state." },
    { id: "t_heat", title: "No Heat in Winter", text: "Your tenant's heater broke in January. Repairs cost $60.",
      effects: [{ op: "cash", amount: -60, cat: "maintenance" }], insight: "Landlords must keep rentals habitable: safe, with heat, water and working locks.", vocab: "habitability", realWorld: "In some states, tenants may withhold rent or repair and deduct if a landlord ignores serious problems. Rules vary." },
    { id: "t_nopay", title: "Tenant Stops Paying", text: "A tenant hasn't paid rent in two months.",
      options: [
        { id: "evict", label: "File for eviction in court", why: "The legal process takes time and money: about $80 in court costs, and the unit earns nothing next Year.", effects: [{ op: "cash", amount: -80, cat: "fees" }, { op: "vacateBest" }] },
        { id: "plan", label: "Offer a payment plan", why: "You might get paid over time and keep a tenant, but there's a 40% chance they still can't pay.", effects: [{ op: "gamble", cost: 0, prob: 0.6, win: 60, winText: "The tenant caught up through the payment plan. You got $60.", loseText: "The tenant still couldn't pay. You got nothing." }] }
      ], insight: "Eviction is a court process. Only a court can order a tenant to leave, and it can take weeks or months.", vocab: "eviction" },
    { id: "t_locks", title: "\"Just Change the Locks?\"", text: "A friend says you can just change the locks on a tenant who owes rent. That's called a self-help eviction.",
      effects: [], insight: "Self-help evictions (changing locks, removing belongings, shutting off utilities) are illegal in nearly every state. Landlords must go through court.", vocab: "self-help eviction", realWorld: "Landlords who lock out tenants can owe damages to the tenant." },
    { id: "t_animal", title: "Service Animal Request", text: "An applicant with a disability uses a service dog. Your building has a \"no pets\" rule.",
      effects: [], insight: "Under fair housing law, a service or assistance animal isn't a pet. Landlords must make a reasonable accommodation.", vocab: "reasonable accommodation" },
    { id: "t_apply", title: "Two Applicants", text: "Two people apply for your rental. You use the same written rules (income, references, rental history) for both.",
      effects: [{ op: "cash", amount: 10, cat: "rent" }], insight: "Using the same written criteria for everyone is fair and legal. Refusing someone because of a protected characteristic is illegal under the Fair Housing Act.", vocab: "protected class" },
    { id: "t_notice", title: "Tenant Gives Notice", text: "Your tenant gives 30 days' notice and moves out properly. One of your lots will be empty next Year while you find a new tenant.",
      effects: [{ op: "vacateBest" }], insight: "A lease is a contract. Most leases require written notice before moving out.", vocab: "lease" },
    { id: "t_lead", title: "Lead Paint Disclosure", text: "One of your rentals was built before 1978. You must tell tenants about lead paint risks. Testing costs $20.",
      effects: [{ op: "cash", amount: -20, cat: "maintenance" }], insight: "Federal law requires landlords to disclose known lead paint in housing built before 1978.", vocab: "disclosure" }
  ],

<script id="engine">
/* =====================================================================
   ENGINE: pure game logic. No DOM. One serializable state object.

const Engine = (function () {
  'use strict';

  const pct = (v, d = 1) => (v * 100).toFixed(d) + '%';

  const SP = C.SPACES;
  const GROUP_LOTS = {}; SP.forEach(sp => { if (sp.type === 'lot') (GROUP_LOTS[sp.group] = GROUP_LOTS[sp.group] || []).push(sp.id); });

  const UTILS = SP.filter(x => x.type === 'utility').map(x => x.id);
  const OWNABLE = SP.filter(x => ['lot', 'rail', 'utility'].includes(x.type)).map(x => x.id);
  const PHASES = ['expansion', 'peak', 'recession', 'recovery'];
  const STRATEGIES = ['res', 'com', 'rail', 'saver', 'balanced'];
  const STRAT_LABEL = { res: 'Residential-heavy', com: 'Commercial-heavy', rail: 'Rail-heavy', saver: 'Saver/Investor', balanced: 'Balanced' };

  const DEFAULT_SETTINGS = { years: 10, yearTimer: true, yearTimerMin: T.yearTimerMin, turnTimer: true, turnTimerSec: T.turnTimerSec,
    quickChecks: true, ballots: true, prePost: true, difficulty: 'standard', anim: 'normal', muted: false, tutorial: true };

  const diff = (s) => C.DIFFICULTY[s.settings.difficulty] || C.DIFFICULTY.standard;

  function log(s, p, type, text, amt) {

  /* =====================================================================
     NEW GAME
     ===================================================================== */
  function newGame(cfg) {
    const settings = Object.assign({}, DEFAULT_SETTINGS, cfg.settings || {});
    settings.years = clamp(Math.round(+settings.years || 10), T.minYears || 3, T.maxYears || 25);
    const seed = cfg.seed != null ? cfg.seed : Math.floor(Math.random() * 1e9);
    const s = {
      v: 1, seed, rng: hashSeed(String(seed)), groupName: cfg.groupName || 'Group', createdAt: cfg.now || 0, savedAt: 0,
      settings,
      flow: { stage: 'careers', year: 0, queue: [], qi: 0, turn: null, bonusPtr: 0, endRequested: false, turnCount: 0, careerIdx: 0 },
      pending: null,
      economy: {
        phase: 'expansion', phaseYears: 0, phaseLen: 2, baseRate: T.startBaseRate, inflation: T.startInflation, cpi: 1, priceLevel: 1, buildCost: 1,
        millage: T.startMillage, millageMods: [], brackets: T.incomeTaxBrackets.map(b => b.slice()), demand: {}, groupKind: {}, mods: [], flags: {},
        bubble: false, rentControl: null, inclusionary: false, transit: false, livingMult: 1, vacancyGroup: {}, headline: 'Welcome to Port Juniper!', inflationHistory: []
      },
      spaces: SP.map(sp => ({ owner: null, level: 0, mortgage: 0, zoning: sp.zoning || null, historic: !!sp.historic, variance: false, lien: false,
        vacant: false, paid: 0, easement: 1, assess: 1, rentMult: 1, rentMultYears: 0, earned: {}, franchise: false })),
      players: [],
      decks: {}, eventsUsed: [], ballots: { used: [], results: [], years: [] }, markers: [], log: [], qcUsed: [], nextId: 1
    };

    s.economy.phaseLen = rint(s, T.phaseLength.expansion[0], T.phaseLength.expansion[1]);
