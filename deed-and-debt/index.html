      s.players.push({
        id: i, name: String(pc.name || ('Player ' + (i + 1))).slice(0, 16), token: pc.token || '🚲', cpu: !!pc.cpu,
        strategy: pc.strategy || (pc.cpu ? STRATEGIES[i % STRATEGIES.length] : null),
        career: null, home: { mode: 'rent', value: 0, units: 0, switched: false, solar: false },
        cash: T.startCash, savings: 0, fund: 0, emergency: 0, ins: { health: false, property: false, renters: false },
        loans: [], credit: T.startCredit, pos: 0, audit: { in: false, tries: 0 }, keep: [], bk: null, bkPremYears: 0,

        stats: { interestPaid: 0, taxesPaid: 0, rentCollected: 0, rentPaid: 0, interestEarned: 0, fundGain: 0, insuranceSaved: 0, premiumsPaid: 0,

    s.decks.decision = { order: shuffle(s, C.DECISIONS.map((_, i) => i)), i: 0 };

    s.ballots.years = settings.ballots ? by.slice() : [];
    s.ballots.order = shuffle(s, C.BALLOTS.map(b => b.id));
    s.players.forEach(p => { p.yr = blankYr(); });

    advance(s);
    FX = [];
    return s;
  }

  // Years with a ballot vote: from TUNING.ballotYears if listed, otherwise about every 3rd Year (never the last Year), at least one per game
  function ballotYearsFor(n) {
    if (T.ballotYears[n]) return T.ballotYears[n].filter(y => y <= n);

  }
  function blankYr() {
    return { inc: { salary: 0, bonus: 0, rent: 0, interest: 0, other: 0 }, exp: { tax: 0, propTax: 0, maint: 0, loans: 0, insurance: 0, living: 0, housing: 0, rentPaid: 0, fees: 0, other: 0 },
      taxable: 0, withheld: 0, taxPaid: 0, startNW: 0, startDebt: 0, startCredit: 0, notes: [] };
  }

  /* =====================================================================
     MONEY HELPERS
     ===================================================================== */
  const INC_CATS = { salary: 'salary', bonus: 'bonus', rent: 'rent', interest: 'interest', other: 'other', gift: 'other' };
  const EXP_CATS = { tax: 'tax', propTax: 'propTax', maintenance: 'maint', maint: 'maint', loans: 'loans', insurance: 'insurance', living: 'living', housing: 'housing', rentPaid: 'rentPaid', fees: 'fees', other: 'other', build: null, buy: null, invest: null };
  // amt > 0 income, amt < 0 expense. cat decides which line of the income statement it hits.
  function cash(s, p, amt, cat, text) {
    amt = r0(amt); if (!amt) return 0;
    p.cash += amt;
    if (amt > 0) {
      const k = INC_CATS[cat]; if (k) { p.yr.inc[k] += amt; if (cat !== 'gift') p.yr.taxable += amt; p.stats.totalIncome += amt; }
      if (cat === 'interest') p.stats.interestEarned += amt;
    } else {
      const k = EXP_CATS[cat]; if (k) { p.yr.exp[k] += -amt; p.stats.totalExpenses += -amt; }
      if (cat === 'tax' || cat === 'propTax') p.stats.taxesPaid += -amt;
      if (cat === 'insurance') p.stats.premiumsPaid += -amt;
    }
    if (text) log(s, p, cat || 'cash', text, amt);

    to.cash += amt; to.yr.inc.rent += amt; to.yr.taxable += amt; to.stats.rentCollected += amt; to.stats.totalIncome += amt;

  /* =====================================================================
     ECONOMY / VALUES
     ===================================================================== */
  function modsProduct(s, type, test) { let m = 1; s.economy.mods.forEach(md => { if (md.type === type && test(md)) m *= md.mult; }); return m; }
  function targetMatch(s, target, g) {

  function groupDemand(s, g) { return clamp(s.economy.demand[g] * modsProduct(s, 'demand', md => targetMatch(s, md.target, g)), T.demandMin, T.demandMax); }
  function corridorFactor(s, id) {

  function inCorridor(s, id) { return corridorFactor(s, id) > 1; }
  function ownedInGroup(s, g) { return GROUP_LOTS[g].filter(i => s.spaces[i].owner != null).length; }
  function lotDemand(s, id) {

    const d = groupDemand(s, g) * (1 + T.scarcityPerLot * ownedInGroup(s, g)) * corridorFactor(s, id) * s.spaces[id].easement;
    return clamp(d, T.demandMin, T.demandMax);

  function buildCostIdx(s) { return s.economy.buildCost * modsProduct(s, 'build', () => true); }
  function houseCost(s, id) { return r0(T.houseCostBySide[Math.floor(id / 10)] * buildCostIdx(s)); }
  function lotPrice(s, id) {

  }
  function listPrice(s, id) { return SP[id].price; }
  function bldCount(s, id) { const l = s.spaces[id].level; return l === 5 ? T.hotelHouses : l; }
  function bldValue(s, id) { return bldCount(s, id) * houseCost(s, id); }
  function marketValue(s, id) { return lotPrice(s, id) + bldValue(s, id); }
  function assessedValue(s, id) { return r0(marketValue(s, id) * s.spaces[id].assess); }
  function millage(s) { let m = s.economy.millage; s.economy.millageMods.forEach(x => { m += x.delta; }); return Math.max(0, m); }
  function resAvgDemand(s) { const gs = Object.keys(C.GROUPS).filter(g => C.GROUPS[g].kind === 'res'); return gs.reduce((a, g) => a + groupDemand(s, g), 0) / gs.length; }
  function homeValue(s, p) { if (p.home.mode !== 'own') return 0; return r0(p.home.units * s.economy.priceLevel * resAvgDemand(s)); }

  function railsOwned(s, pid) { return RAILS.filter(i => s.spaces[i].owner === pid).length; }
  function utilsOwned(s, pid) { return UTILS.filter(i => s.spaces[i].owner === pid).length; }
  function lotsOf(s, pid) { return OWNABLE.filter(i => s.spaces[i].owner === pid); }
  function lotKind(s, id) { const sp = SP[id]; if (sp.type !== 'lot') return sp.type; return s.spaces[id].zoning === 'C' ? 'com' : 'res'; }
  function maxLevel(s, id) {
    const d = s.spaces[id];
    if (d.historic) return 4;
    if (d.zoning === 'C' || d.variance) return 5;
    return 4;
  }

  function rentFor(s, id, diceTotal) {
    const sp = SP[id], d = s.spaces[id];
    if (d.owner == null || d.mortgage > 0) return 0;
    if (sp.type === 'rail') { const n = railsOwned(s, d.owner); return r0(C.RAIL_RENT[n - 1] * s.economy.priceLevel * modsProduct(s, 'rail', () => true)); }
    if (sp.type === 'utility') { const n = utilsOwned(s, d.owner); const m = s.economy.flags.utilityCap ? C.UTILITY_MULT[0] : C.UTILITY_MULT[n - 1]; return r0((diceTotal || 7) * m * s.economy.priceLevel); }
    if (d.vacant) return 0;

  function loanRate(s, p, type) { const base = s.economy.baseRate - (type === 'variable' ? T.variableDiscount : 0); return Math.max(0.01, base + creditPremium(s, p)); }

    return { payment: r0(pay), rows, totalInterest: r0(totI) };
  }
  function salaryNow(s, p) {
    if (!p.career) return 0;
    const cr = C.CAREERS[p.career.path];

    return p.career.salary;
  }
  function yearlyIncomeEst(s, p) { return Math.max(100, (p.career ? p.career.salary : 0) + (p.yearly.length ? p.yearly[p.yearly.length - 1].rentIncome || 0 : 0)); }

  function dti(s, p) { return yearlyLoanPayments(p) / yearlyIncomeEst(s, p); }
  function totalDebt(s, p) {
    let d = p.loans.reduce((a, l) => a + l.balance, 0) + p.taxLien;

  }
  function propertyValue(s, p) { return lotsOf(s, p.id).reduce((a, i) => a + marketValue(s, i), 0); }
  function netWorth(s, p) {
    return r0(p.cash + p.savings + p.fund + p.emergency + propertyValue(s, p) + homeValue(s, p) - totalDebt(s, p));
  }
  function realCash(s, p) { return r0(p.cash / s.economy.cpi); }
  function savingsAPY(s) { return Math.max(T.savingsMin, s.economy.baseRate - T.savingsSpread); }
  function livingCost(s, p) { let c = T.livingBase * s.economy.cpi * s.economy.livingMult; if (p.home.solar && p.home.mode === 'own') c -= 30; return r0(Math.max(20, c)); }
  function housingCost(s, p) {
    if (p.home.mode === 'rent') return r0(p.renterCost);
    const hv = homeValue(s, p); return r0(hv * T.homeMaintPct + (diff(s).taxes ? hv * millage(s) / 1000 : 0));
  }
  function premiums(s, p) {
    const I = T.insurance; let t = 0;
    if (p.ins.health) t += I.health.premium * s.economy.cpi;
    if (p.ins.renters && p.home.mode === 'rent') t += I.renters.premium * s.economy.cpi;
    if (p.ins.property) { const bv = lotsOf(s, p.id).reduce((a, i) => a + bldValue(s, i), 0) + homeValue(s, p); t += Math.max(I.property.minPremium, bv * I.property.premiumPct); }
    return r0(t);
  }
  function propTaxLots(s, p) { if (!diff(s).taxes) return 0; return r0(lotsOf(s, p.id).reduce((a, i) => a + assessedValue(s, i), 0) * millage(s) / 1000); }
  function yearExpensesEst(s, p) { return livingCost(s, p) + housingCost(s, p) + premiums(s, p) + propTaxLots(s, p) + yearlyLoanPayments(p) + p.recurring.filter(r => r.amount < 0).reduce((a, r) => a - r.amount, 0); }
  function incomeTax(s, income) {
    if (!diff(s).taxes) return { tax: 0, rows: [] };
    let prev = 0, tax = 0; const rows = [];
    for (const [cap, rate] of s.economy.brackets) {
      const slice = Math.max(0, Math.min(income, cap) - prev);
      if (slice > 0 || rows.length === 0) rows.push({ from: prev, to: cap, rate, slice: r0(slice), tax: r0(slice * rate) });
      tax += slice * rate; prev = cap; if (income <= cap) break;
    }
    return { tax: r0(tax), rows };
  }
  function depreciationDeduction(s, p) {
    if (!diff(s).depreciation || !p.depreciation) return 0;
    return r0(lotsOf(s, p.id).reduce((a, i) => a + bldValue(s, i), 0) * 0.036);
  }

  /* =====================================================================
     FLOW: advance() runs automatic steps until a player must decide
     ===================================================================== */
  function advance(s) {
    let guard = 0;
    while (!s.pending && s.flow.stage !== 'results') {
      if (++guard > 500) throw new Error('advance loop');
      // anyone in the red must fix it first (no softlocks: debt always resolves)
      if (s.flow.stage !== 'careers') {
        const debtor = s.players.find(p => p.cash < 0);
        if (debtor) { s.pending = { kind: 'debt', player: debtor.id, owed: -debtor.cash }; emit({ t: 'debt', pid: debtor.id, owed: -debtor.cash }); break; }
      }
      const st = s.flow.stage;
      if (st === 'careers') {
        const p = s.players.find(x => !x.career);
        if (p) { s.pending = { kind: 'career', player: p.id }; break; }
        s.players.forEach(p => { p.yearly.push(snapshot(s, p, 0)); });
        s.flow.stage = 'yearStart';
      } else if (st === 'yearStart') {
        if (s.flow.endRequested || s.flow.year >= s.settings.years) { finish(s); break; }
        yearStart(s);
      } else if (st === 'ballot') {
        startBallot(s);
      } else if (st === 'event') {
        if (s.flow.endRequested) { finish(s); break; }
        drawEvent(s); s.flow.stage = 'turns'; buildQueue(s);
      } else if (st === 'turns') {
        turnTick(s);
      } else if (st === 'yearEnd') {
        yearEnd(s);
      } else if (st === 'tenant') {
        s.flow.stage = 'report';
      } else if (st === 'report') {
        emit({ t: 'annual', year: s.flow.year, reports: s.players.map(p => annualReport(s, p)) });
        s.flow.stage = 'yearStart';
        if (s.flow.endRequested) { finish(s); break; }
      } else break;
    }
  }

  function finish(s) {
    if (s.flow.stage === 'results') return;
    // final snapshot if the last one isn't for this exact moment
    s.players.forEach(p => {
      const last = p.yearly[p.yearly.length - 1];
      if (!last || last.year !== s.flow.year || s.flow.endRequested) { const snap = snapshot(s, p, s.flow.year); snap.partial = !!s.flow.endRequested && s.flow.stage !== 'yearStart'; if (last && last.year === s.flow.year) p.yearly[p.yearly.length - 1] = snap; else p.yearly.push(snap); }
    });
    s.flow.stage = 'results'; s.pending = null; s.flow.turn = null;
    log(s, null, 'game', 'Game over. Final scores by net worth.', null);
    emit({ t: 'results' });
  }

  function turnsPerYear(s) { return T.turnsPerYear[s.players.length] || 2; }
  function buildQueue(s) {
    const n = s.players.length, k = turnsPerYear(s), ids = s.players.map(p => p.id), q = [];
    if (k >= 1 && Number.isInteger(k)) { for (let r = 0; r < k; r++) q.push(...ids); }
    else {
      q.push(...ids);
      const half = Math.ceil(n / 2), bonus = [];
      for (let i = 0; i < half; i++) bonus.push(ids[(s.flow.bonusPtr + i) % n]);
      s.flow.bonusPtr = (s.flow.bonusPtr + half) % n;
      q.push(...bonus.sort((a, b) => a - b));
    }
    s.flow.queue = q; s.flow.qi = 0; s.flow.turn = null;
  }

  function turnTick(s) {
    const f = s.flow;
    if (!f.turn) {
      if (f.endRequested) { finish(s); return; }
      if (f.qi >= f.queue.length) { f.stage = 'yearEnd'; return; }
      const pid = f.queue[f.qi];
      f.turn = { pid, step: 'pre', doubles: 0, rolls: 0 }; f.turnCount++;
      emit({ t: 'turnStart', pid, n: f.qi + 1, of: f.queue.length });
    }
    const t = f.turn, p = P(s, t.pid);
    if (t.step === 'pre') { s.pending = { kind: p.audit.in ? 'audit' : 'roll', player: p.id }; return; }
    if (t.step === 'post') { s.pending = { kind: 'endTurn', player: p.id }; return; }
    if (t.step === 'done') { f.turn = null; f.qi++; if (f.endRequested) finish(s); }
  }

  /* ---------- YEAR START ---------- */
  function yearStart(s) {
    const e = s.economy;
    s.flow.year++;
    const y = s.flow.year;
    // business-cycle demand drift
    Object.keys(e.demand).forEach(g => {
      let m = T.phaseDemand[e.phase];
      if (e.groupKind[g] === 'com') m = 1 + (m - 1) * T.commercialPhaseFactor;
      let d = e.demand[g] * m; d = d + (1 - d) * T.demandReversion; e.demand[g] = clamp(d, T.demandMin, T.demandMax);
    });
    s.players.forEach(p => {
      p.yr = blankYr(); p.yr.startNW = netWorth(s, p); p.yr.startDebt = totalDebt(s, p); p.yr.startCredit = p.credit;
      // paycheck
      let gross = salaryNow(s, p);
      if (p.flags.layoff) { gross = r0(gross * p.flags.layoff.value); p.yr.notes.push('Layoff: you got only part of your pay (unemployment insurance).'); }
      if (p.career && p.career.school === y) { p.career.salary += T.backToSchoolRaise; p.career.school = null; p.yr.notes.push('You finished school! Salary +' + money(T.backToSchoolRaise) + '.'); }
      if (gross > 0) {
        const wh = incomeTax(s, gross).tax;
        p.cash += gross; p.yr.inc.salary += gross; p.yr.taxable += gross; p.stats.salaryEarned += gross; p.stats.totalIncome += gross;
        log(s, p, 'salary', 'Yearly paycheck', gross);
        if (wh > 0) { cash(s, p, -wh, 'tax', 'Income tax withheld from paycheck'); p.yr.withheld += wh; }
        emit({ t: 'cash', pid: p.id, amt: gross - wh });
        // Chapter 13 plan payment comes out of the paycheck
        const plan = p.loans.find(l => l.kind === 'plan');
        if (plan) {
          const disposable = Math.max(0, gross - wh - livingCost(s, p) - housingCost(s, p));
          const pay = Math.min(plan.balance, r0(disposable * 0.7));
          if (pay > 0) { cash(s, p, -pay, 'loans', 'Repayment plan payment'); plan.balance -= pay; }
          plan.years--;
          if (plan.years <= 0 || plan.balance <= 0) { if (plan.balance > 0) p.yr.notes.push('Your repayment plan is done. The remaining ' + money(plan.balance) + ' was discharged.'); p.loans = p.loans.filter(l => l !== plan); }
        }
      }
    });
    // commercial vacancy rolls for this Year
    const vm = modsProduct(s, 'vacancy', () => true) * (e.phase === 'recession' ? T.vacancyRecessionMult : 1);
    SP.forEach(sp => {
      if (sp.type !== 'lot') return; const d = s.spaces[sp.id];
      const forced = d.vacant === 'next'; d.vacant = false;
      if (forced) { d.vacant = true; return; }
      if (d.owner != null && d.zoning === 'C') {
        const gv = e.vacancyGroup[sp.group] != null ? e.vacancyGroup[sp.group] : 1;
        if (rnd(s) < T.vacancyCommercial * vm * gv) { d.vacant = true; P(s, d.owner).yr.notes.push(sp.name + ' sits empty this Year (vacancy). It earns no rent.'); log(s, P(s, d.owner), 'vacancy', sp.name + ' is vacant this Year', 0); }
      }
    });
    e.headline = 'Year ' + y + ': the economy is in ' + e.phase + '.';
    log(s, null, 'year', 'Year ' + y + ' begins (' + e.phase + ')', null);
    emit({ t: 'yearStart', year: y, of: s.settings.years, phase: e.phase });
    s.flow.stage = (s.settings.ballots && s.ballots.years.includes(y)) ? 'ballot' : 'event';
  }

  /* ---------- BALLOTS ---------- */
  function startBallot(s) {
    const id = s.ballots.order.find(b => !s.ballots.used.includes(b));
    if (!id) { s.flow.stage = 'event'; return; }
    s.ballots.used.push(id);
    s.pending = { kind: 'ballot', id, voters: s.players.map(p => p.id), votes: {} };
    emit({ t: 'ballotStart', id });
  }
  function ballotById(id) { return C.BALLOTS.find(b => b.id === id); }
  function finishBallot(s) {
    const pd = s.pending, b = ballotById(pd.id);
    const yes = Object.values(pd.votes).filter(v => v).length, no = Object.values(pd.votes).length - yes;
    const passed = yes > no;
    s.ballots.results.push({ year: s.flow.year, id: b.id, title: b.title, yes, no, passed });
    s.markers.push({ year: s.flow.year, label: b.title.replace(/^Measure [A-Z]: /, '') + (passed ? ' passed' : ' failed') });
    log(s, null, 'ballot', b.title + (passed ? ' PASSED ' : ' FAILED ') + yes + '-' + no, null);
    s.pending = null;
    const msgs = [];
    if (passed) applyEffects(s, b.effects, { p: null, msgs, src: b.id });
    emit({ t: 'ballotResult', id: b.id, yes, no, passed, msgs });
    s.flow.stage = 'event';
  }

  /* ---------- LIFE / ECONOMY EVENT ---------- */
  function eventOk(s, ev, target) {
    if (ev.requires === 'bubble') return s.economy.bubble;
    if (ev.requires === 'notBubble') return !s.economy.bubble;
    if (ev.requires === 'targetHasLot') return target && lotsOf(s, target.id).some(i => SP[i].type === 'lot');
    if (ev.requires === 'targetRents') return target && target.home.mode === 'rent';
    return true;
  }
  function drawEvent(s, forceId, targetId) {
    const ph = PHASES.indexOf(s.economy.phase);
    let ev = null, target = null;
    if (forceId) { ev = C.EVENTS.find(e => e.id === forceId); }
    else {
      const pool = C.EVENTS.filter(e => !(e.once && s.eventsUsed.includes(e.id)) && e.weights[ph] > 0);
      for (let tries = 0; tries < 30 && !ev; tries++) {
        const fresh = pool.filter(e => !s.eventsUsed.slice(-8).includes(e.id));
        const list = fresh.length ? fresh : pool;
        const tot = list.reduce((a, e) => a + e.weights[ph], 0); let r = rnd(s) * tot, cand = list[0];
        for (const e of list) { r -= e.weights[ph]; if (r <= 0) { cand = e; break; } }
        if (cand.scope === 'personal') { const ok = s.players.filter(p => eventOk(s, cand, p)); if (!ok.length) continue; target = pickR(s, ok); }
        else if (!eventOk(s, cand, null)) continue;
        ev = cand;
      }
      if (!ev) ev = C.EVENTS.find(e => e.id === 'e_steady');
    }
    if (ev.scope === 'personal' && !target && targetId != null && eventOk(s, ev, P(s, targetId))) target = P(s, targetId);
    if (ev.scope === 'personal' && !target) { const ok = s.players.filter(p => eventOk(s, ev, p)); target = ok.length ? pickR(s, ok) : s.players[0]; }
    s.eventsUsed.push(ev.id);
    const msgs = [];
    applyEffects(s, ev.effects, { p: target, msgs, src: ev.id, card: ev });
    if (['e_recession', 'e_boom', 'e_crash', 'e_bubble', 'e_pop', 'e_fedup', 'e_fedcut', 'e_inflation', 'e_recovery', 'e_railnews', 'e_factory'].includes(ev.id))
      s.markers.push({ year: s.flow.year, label: ev.title });
    s.economy.headline = ev.title + (target ? ' (' + target.name + ')' : '');
    log(s, target, 'event', ev.title, null);
    emit({ t: 'event', id: ev.id, pid: target ? target.id : null, msgs, fx: ev.fx || null });
    return ev;
  }

  /* ---------- YEAR END ---------- */
  function yearEnd(s) {
    const e = s.economy, D = diff(s);
    s.players.forEach(p => {
      const notes = p.yr.notes;
      // savings & emergency fund earn compound interest; index fund moves with the economy
      const apy = savingsAPY(s);
      const si = r0(p.savings * apy), ei = r0(p.emergency * apy);
      if (si > 0) { p.savings += si; p.yr.inc.interest += si; p.stats.interestEarned += si; p.yr.taxable += si; p.stats.totalIncome += si; }
      if (ei > 0) { p.emergency += ei; p.yr.inc.interest += ei; p.stats.interestEarned += ei; p.yr.taxable += ei; p.stats.totalIncome += ei; }
      if (p.fund > 0) {
        const ret = T.fundReturns[e.phase] + (rnd(s) * 2 - 1) * T.fundNoise;
        const g = r0(p.fund * ret); p.fund = Math.max(0, p.fund + g); p.stats.fundGain += g;
        notes.push('Index fund ' + (g >= 0 ? 'gained ' : 'lost ') + money(Math.abs(g)) + ' (' + pct(ret, 0) + ').');
      }
      // everyday costs
      cash(s, p, -livingCost(s, p), 'living', 'Living costs (food, phone, transport)');
      if (p.home.mode === 'rent') cash(s, p, -housingCost(s, p), 'housing', 'Apartment rent');
      else {
        const hv = homeValue(s, p);
        cash(s, p, -r0(hv * T.homeMaintPct), 'maint', 'Home maintenance');
        if (D.taxes) cash(s, p, -r0(hv * millage(s) / 1000), 'propTax', 'Property tax on your home');
      }
      const prem = premiums(s, p); if (prem > 0) cash(s, p, -prem, 'insurance', 'Insurance premiums');
      p.recurring.forEach(rc => { cash(s, p, rc.amount, rc.amount > 0 ? 'other' : 'other', rc.label); rc.years--; });
      p.recurring = p.recurring.filter(rc => rc.years > 0);
      // tax lien from last Year must be paid now
      if (p.taxLien > 0) { cash(s, p, -p.taxLien, 'propTax', 'Paid tax lien'); notes.push('You paid off your tax lien of ' + money(p.taxLien) + '.'); p.taxLien = 0; lotsOf(s, p.id).forEach(i => { if (s.spaces[i].lien === 'tax') s.spaces[i].lien = false; }); }
      // property tax on investment property: unpaid -> tax lien
      const pt = propTaxLots(s, p);
      if (pt > 0) {
        if (p.cash >= pt) cash(s, p, -pt, 'propTax', 'Property tax: assessed value x ' + millage(s) + ' mills');
        else {
          const lienAmt = r0(pt * (1 + T.taxLienPenalty)); p.taxLien += lienAmt;
          const best = lotsOf(s, p.id).sort((a, b) => marketValue(s, b) - marketValue(s, a))[0]; if (best != null && !s.spaces[best].lien) s.spaces[best].lien = 'tax';
          notes.push('You could not pay ' + money(pt) + ' property tax. It became a TAX LIEN of ' + money(lienAmt) + ' (with a 10% penalty) due next Year.');
          log(s, p, 'lien', 'Unpaid property tax became a tax lien', -lienAmt);
        }
      }
      // loan payments
      let missedThisYear = false;
      p.loans.forEach(l => {
        if (l.kind === 'plan') return;
        if (l.deferUntil && s.flow.year < l.deferUntil) { notes.push('Your ' + l.label + ' is deferred while you are in school.'); return; }
        if (l.rateType === 'variable') l.rate = Math.max(0.01, e.baseRate - T.variableDiscount + l.premium);
        const interest = r0(l.balance * l.rate);
        const due = Math.min(l.payment, l.balance + interest);
        if (p.cash >= due) {
          cash(s, p, -due, 'loans', l.label + ' payment');
          p.stats.interestPaid += Math.min(interest, due);
          l.balance = Math.max(0, l.balance + interest - due); l.yearsLeft--; l.onTime++; l.missed = 0;
        } else {
          missedThisYear = true; p.missedEver = true; p.stats.missed++;
          l.balance += interest + T.lateFee; p.stats.interestPaid += interest; l.missed++;
          if (D.credit) p.credit += T.creditMissed;
          notes.push('MISSED ' + l.label + ' payment. Late fee ' + money(T.lateFee) + (D.credit ? ', credit ' + T.creditMissed : '') + '.');
          log(s, p, 'missed', 'Missed ' + l.label + ' payment', -T.lateFee);
          if (l.missed === 2) {
            const target = l.collateral != null && s.spaces[l.collateral].owner === p.id ? l.collateral : lotsOf(s, p.id).sort((a, b) => marketValue(s, b) - marketValue(s, a))[0];
            if (target != null) { s.spaces[target].lien = 'loan'; l.collateral = target; notes.push('Two missed payments: the Bank put a LIEN on ' + SP[target].name + '. Miss again and it will be foreclosed.'); }
          } else if (l.missed >= 3 && l.collateral != null && s.spaces[l.collateral].owner === p.id) {
            const id = l.collateral, val = marketValue(s, id);
            releaseLot(s, id);
            l.balance = l.balance - val; l.missed = 0; l.collateral = null;
            if (D.credit) p.credit += T.creditForeclosure;
            notes.push('FORECLOSURE: the Bank took ' + SP[id].name + ' (worth ' + money(val) + ') to pay down your loan.');
            log(s, p, 'foreclosure', 'Foreclosure on ' + SP[id].name, val);
            if (l.balance < 0) { cash(s, p, -l.balance, 'other', 'Leftover from foreclosure sale'); l.balance = 0; }
          }
        }
      });
      const closed = p.loans.filter(l => l.balance <= 0.5 && l.kind !== 'plan');
      closed.forEach(l => { notes.push('You paid off your ' + l.label + '!'); if (l.collateral != null && s.spaces[l.collateral].lien === 'loan') s.spaces[l.collateral].lien = false; });
      p.loans = p.loans.filter(l => !(l.balance <= 0.5 && l.kind !== 'plan'));
      if (p.home.mode === 'own' && !p.loans.some(l => l.kind === 'home')) p.home.paidOff = true;
      // credit score
      if (D.credit) {
        const hadLoans = p.loans.length > 0 || closed.length > 0;
        if (!missedThisYear) p.credit += hadLoans ? T.creditOnTime : T.creditNoLoans;
        if (dti(s, p) > 0.4) p.credit += T.creditHighDTI;
        p.credit = clamp(r0(p.credit), 300, 850);
      }
      if (p.bkPremYears > 0) p.bkPremYears--;
      // delayed outcomes (decisions resolve later)
      p.delayed.forEach(dl => { dl.years--; });
      const due = p.delayed.filter(dl => dl.years < 0); p.delayed = p.delayed.filter(dl => dl.years >= 0);
      due.forEach(dl => {
        const win = rnd(s) < dl.prob, msgs = [];
        if (win) applyEffects(s, dl.win || [], { p, msgs, src: dl.src }); else applyEffects(s, dl.lose || [], { p, msgs, src: dl.src });
        const txt = win ? dl.winText : dl.loseText; if (txt) notes.push('Follow-up: ' + txt);
        const dec = p.decisions.find(d => d.uid === dl.uid); if (dec) { dec.outcome = txt; if (dl.valueWin != null) dec.value = win ? dl.valueWin : dl.valueLose; }
      });
      // salary raises
      if (p.career && !(p.career.path === 'college' && s.flow.year < 1)) p.career.salary = r0(p.career.salary * (1 + C.CAREERS[p.career.path].raise));
      // renter's rent rises with inflation and housing demand
      if (p.home.mode === 'rent') {
        let nr = T.renterCost * e.cpi * (1 + diff(s).inflation * 0 + 0) * Math.pow(Math.max(0.8, resAvgDemand(s)), 0.7) + (p.renterDelta || 0);
        if (e.rentControl) nr = Math.min(nr, p.renterCost * (1 + e.inflation + 0.02));
        p.renterCost = r0(Math.max(p.renterCost * 0.97, nr));
      }
      // flags expire
      Object.keys(p.flags).forEach(k => { p.flags[k].years--; if (p.flags[k].years <= 0) delete p.flags[k]; });
      // lot rent boosts expire
      lotsOf(s, p.id).forEach(i => { const d = s.spaces[i]; if (d.rentMultYears > 0) { d.rentMultYears--; if (d.rentMultYears === 0) d.rentMult = d.franchise ? d.franchiseMult : 1; } });
    });
    // economy moves on
    const D2 = diff(s);
    if (D2.inflation) {
      e.inflationHistory.push(e.inflation);
      e.cpi *= 1 + e.inflation; e.priceLevel *= 1 + e.inflation * 0.8; e.buildCost *= 1 + e.inflation;
      e.inflation = T.normalInflation + (e.inflation - T.normalInflation) * 0.4 + (rnd(s) - 0.5) * 0.006;
    }
    if (e.rentControl) Object.keys(e.rentControl.caps).forEach(g => { e.rentControl.caps[g] *= 1 + e.inflation + 0.02; });
    e.mods.forEach(m => { m.years--; }); e.mods = e.mods.filter(m => m.years > 0);
    e.millageMods.forEach(m => { m.years--; }); e.millageMods = e.millageMods.filter(m => m.years > 0);
    Object.keys(e.flags).forEach(k => { e.flags[k].years--; if (e.flags[k].years <= 0) delete e.flags[k]; });
    e.phaseYears++;
    if (e.phaseYears >= e.phaseLen) {
      const nx = PHASES[(PHASES.indexOf(e.phase) + 1) % 4];
      setPhase(s, nx);
    }
    s.players.forEach(p => { p.yearly.push(snapshot(s, p, s.flow.year)); });
    log(s, null, 'year', 'Year ' + s.flow.year + ' ends', null);
    // Advanced: one landlord gets a Tenant Notice
    s.flow.stage = 'tenant';
    if (D2.tenantCards) {
      const landlords = s.players.filter(p => lotsOf(s, p.id).some(i => SP[i].type === 'lot'));
      if (landlords.length && rnd(s) < T.tenantNoticeChance) { const p = pickR(s, landlords); drawCard(s, 'tenant', p); }
    }
  }
  function setPhase(s, ph) {
    const e = s.economy; if (e.phase === ph) { return; }
    e.phase = ph; e.phaseYears = 0; const L = T.phaseLength[ph]; e.phaseLen = rint(s, L[0], L[1]);
    log(s, null, 'phase', 'Economy enters ' + ph, null); emit({ t: 'phase', phase: ph });
  }

  function snapshot(s, p, year) {
    return { year, nw: netWorth(s, p), cash: r0(p.cash), realCash: realCash(s, p), savings: r0(p.savings + p.emergency), fund: r0(p.fund), debt: totalDebt(s, p), credit: p.credit,
      prop: propertyValue(s, p) + homeValue(s, p), equity: propertyValue(s, p) + homeValue(s, p) - lotsOf(s, p.id).reduce((a, i) => a + s.spaces[i].mortgage, 0) - p.loans.filter(l => l.kind === 'home').reduce((a, l) => a + l.balance, 0),
      income: p.yr ? sumObj(p.yr.inc) : 0, expenses: p.yr ? sumObj(p.yr.exp) : 0, rentIncome: p.yr ? p.yr.inc.rent : 0 };
  }
  const sumObj = (o) => Object.values(o).reduce((a, b) => a + b, 0);
  function annualReport(s, p) {
    const inc = sumObj(p.yr.inc), exp = sumObj(p.yr.exp), nw = netWorth(s, p);
    return { pid: p.id, name: p.name, income: inc, expenses: exp, cashFlow: inc - exp, inc: Object.assign({}, p.yr.inc), exp: Object.assign({}, p.yr.exp),
      debt: totalDebt(s, p), debtChange: totalDebt(s, p) - p.yr.startDebt, credit: p.credit, creditChange: p.credit - p.yr.startCredit, nw, nwChange: nw - p.yr.startNW, notes: p.yr.notes.slice() };
  }

  /* =====================================================================
     MOVEMENT & LANDING
     ===================================================================== */
  function moveSteps(s, p, n) {
    const path = []; let pos = p.pos;
    const dir = n >= 0 ? 1 : -1;
    for (let i = 0; i < Math.abs(n); i++) { pos = (pos + dir + 40) % 40; path.push(pos); if (dir > 0 && pos === 0) passPayday(s, p); }
    p.pos = pos; emit({ t: 'move', pid: p.id, path });
  }
  function moveTo(s, p, target, collect = true) {
    const n = (target - p.pos + 40) % 40;
    if (collect) moveSteps(s, p, n);
    else { const path = []; let pos = p.pos; for (let i = 0; i < n; i++) { pos = (pos + 1) % 40; path.push(pos); } p.pos = target; emit({ t: 'move', pid: p.id, path }); }
  }
  function passPayday(s, p) {
    p.laps++;
    const bonus = r0((p.career ? p.career.salary : 0) * T.bonusCheckPct * (p.flags.layoff ? p.flags.layoff.value : 1));
    if (bonus > 0 && !(p.career && p.career.path === 'college' && s.flow.year <= 1)) {
      p.cash += bonus; p.yr.inc.bonus += bonus; p.yr.taxable += bonus; p.stats.totalIncome += bonus;
      log(s, p, 'bonus', 'Bonus Check for passing PAYDAY', bonus); emit({ t: 'cash', pid: p.id, amt: bonus, why: 'Bonus Check' });
    }
  }
  function sendToAudit(s, p) {
    p.pos = 10; p.audit = { in: true, tries: 0 };
    emit({ t: 'audit', pid: p.id }); log(s, p, 'audit', 'Sent to Audit', null);
    if (s.flow.turn && s.flow.turn.pid === p.id) s.flow.turn.step = 'post';
  }

  function landOn(s, p, ctx) {
    ctx = ctx || {};
    const sp = SP[p.pos], d = s.spaces[p.pos];
    emit({ t: 'land', pid: p.id, space: p.pos });
    switch (sp.type) {
      case 'lot': case 'rail': case 'utility':
        if (d.owner == null) {
          const price = r0(lotPrice(s, p.pos) * (1 - (ctx.discount || 0)));
          s.pending = { kind: 'buy', player: p.id, space: p.pos, price };
        } else if (d.owner !== p.id) {
          const owner = P(s, d.owner);
          if (d.mortgage > 0) { emit({ t: 'msg', text: sp.name + ' is mortgaged. No rent is due.' }); break; }
          if (d.vacant && sp.type === 'lot') { emit({ t: 'msg', text: sp.name + ' is vacant this Year. No tenant, no rent!' }); break; }
          let rent = rentFor(s, p.pos, ctx.dice);
          if (ctx.rentMult) rent *= ctx.rentMult;
          d.earned[owner.id] = (d.earned[owner.id] || 0) + r0(rent);
          payPlayer(s, p, owner, rent, 'Rent at ' + sp.name);
        }
        break;
      case 'civic': drawCard(s, 'civic', p); break;
      case 'opportunity': drawCard(s, 'opportunity', p); break;
      case 'decision': drawCard(s, 'decision', p); break;
      case 'tax': taxDay(s, p); break;
      case 'gotoaudit': sendToAudit(s, p); break;
      case 'payday': break;
      default: break;
    }
  }

  function taxDay(s, p) {
    if (!diff(s).taxes) { emit({ t: 'taxday', pid: p.id, off: true }); return; }
    const dep = depreciationDeduction(s, p);
    const taxable = Math.max(0, p.yr.taxable - dep);
    const it = incomeTax(s, taxable);
    const owe = it.tax - p.yr.withheld - p.yr.taxPaid;
    if (owe > 0) { cash(s, p, -owe, 'tax', 'Tax Day: income tax due'); p.yr.taxPaid += owe; }
    else if (owe < 0) { cash(s, p, -owe, 'gift', 'Tax Day: refund'); p.yr.taxPaid += owe; }
    emit({ t: 'taxday', pid: p.id, income: p.yr.taxable, dep, taxable, rows: it.rows, tax: it.tax, withheld: p.yr.withheld, paidBefore: p.yr.taxPaid - owe, owe });
  }

  /* =====================================================================
     CARDS & EFFECTS
     ===================================================================== */
  const DECKS = { opportunity: C.OPPORTUNITY, civic: C.CIVIC, decision: C.DECISIONS, tenant: C.TENANT };
  function needsOk(s, p, card) {
    const n = card.needs;
    if (card.needsCash && p.cash < card.needsCash) return false;
    if (!n) return true;
    const lots = lotsOf(s, p.id).filter(i => SP[i].type === 'lot');
    if (n === 'lotNoBuildings') return lots.some(i => s.spaces[i].level === 0 && !s.spaces[i].lien);
    if (n === 'hasLoan') return p.loans.some(l => l.kind !== 'plan');
    if (n === 'hasCommercial') return lots.some(i => lotKind(s, i) === 'com');
    if (n === 'hasLot') return lots.length > 0;
    if (n === 'hasRes') return lots.some(i => lotKind(s, i) === 'res');
    return true;
  }
  function drawCard(s, deck, p, forceId) {
    const list = DECKS[deck]; let card = null;
    if (forceId) card = list.find(c => c.id === forceId);
    else {
      const dk = s.decks[deck];
      for (let k = 0; k < list.length; k++) {
        const c = list[dk.order[dk.i % dk.order.length]]; dk.i++;
        if (needsOk(s, p, c)) { card = c; break; }
      }
      if (!card) card = list[0];
    }
    log(s, p, 'card', (deck === 'decision' ? 'Decision Point: ' : deck === 'tenant' ? 'Tenant Notice: ' : deck[0].toUpperCase() + deck.slice(1) + ': ') + card.title, null);
    if (card.options) {
      s.pending = { kind: 'choice', player: p.id, deck, id: card.id };
      emit({ t: 'cardShow', deck, id: card.id, pid: p.id, choice: true });
    } else {
      const msgs = [];
      applyEffects(s, card.effects || [], { p, msgs, src: card.id, card });
      emit({ t: 'card', deck, id: card.id, pid: p.id, msgs });
    }
    return card;
  }
  function cardById(deck, id) { return DECKS[deck].find(c => c.id === id); }

  function chooseOption(s, p, deck, id, optId) {
    const card = cardById(deck, id), opt = card.options.find(o => o.id === optId) || card.options[0];
    const msgs = [];
    const uid = 'd' + (s.nextId++);
    const dec = { uid, year: s.flow.year, kind: deck, id, title: card.title, choice: opt.label, optId: opt.id, value: null, outcome: null, insight: card.insight };
    p.decisions.push(dec);
    applyEffects(s, opt.effects || [], { p, msgs, src: card.id, card, dec, uid });
    if (opt.resultText) msgs.push(opt.resultText);
    if (card.showOppCost && opt.id === 'skip') msgs.push(oppCostLine(s, card.showOppCost));
    if (card.showOppCost && opt.id === 'buy') { msgs.push('Opportunity cost: ' + oppCostLine(s, card.showOppCost)); dec.value = -card.showOppCost; }
    log(s, p, 'decision', card.title + ' -> ' + opt.label, null);
    emit({ t: 'cardResult', deck, id, pid: p.id, opt: opt.id, msgs });
  }
  function oppCostLine(s, amt) {
    const yearsLeft = Math.max(1, s.settings.years - s.flow.year);
    const fv = r0(amt * Math.pow(1 + Math.max(savingsAPY(s), 0.03), yearsLeft));
    return 'This ' + money(amt) + ' in savings would be about ' + money(fv) + ' by Year ' + s.settings.years + '.';
  }

  function payBadEvent(s, p, cost, label, msgs) {
    cost = r0(cost); let left = cost;
    if (p.emergency > 0) { const use = Math.min(p.emergency, left); p.emergency -= use; left -= use; msgs.push('Your emergency fund covered ' + money(use) + '.'); p.yr.exp.other += use; p.stats.totalExpenses += use; log(s, p, 'emergency', label + ' (emergency fund)', -use); }
    if (left > 0) {
      if (p.cash >= left) cash(s, p, -left, 'other', label);
      else {
        const short = left - Math.max(0, p.cash);
        if (p.cash > 0) cash(s, p, -p.cash, 'other', label);
        takeLoan(s, p, { amount: short, years: 3, type: 'fixed', kind: 'emergency', force: true });
        p.yr.exp.other += short; p.stats.totalExpenses += short;
        msgs.push('You did not have enough cash, so you took a high-interest emergency loan of ' + money(short) + '.');
      }
    }
    return cost;
  }

  function pickLot(s, p, how, filter) {
    let lots = lotsOf(s, p.id).filter(i => SP[i].type === 'lot' && !s.spaces[i].lien);
    if (filter) lots = lots.filter(filter);
    if (!lots.length) return null;
    lots.sort((a, b) => marketValue(s, a) - marketValue(s, b));
    return how === 'best' ? lots[lots.length - 1] : how === 'random' ? pickR(s, lots) : lots[0];
  }
  function releaseLot(s, id) {
    const d = s.spaces[id];
    d.owner = null; d.level = 0; d.mortgage = 0; d.lien = false; d.vacant = false; d.rentMult = 1; d.rentMultYears = 0; d.franchise = false; d.variance = false;
    emit({ t: 'release', space: id });
  }
  function sellLotForCash(s, p, id, amount, label, msgs) {
    const d = s.spaces[id];
    const gain = amount - d.paid;
    const owed = d.mortgage; // pay off any board mortgage
    releaseLot(s, id);
    cash(s, p, amount, 'gift', label + ': sold ' + SP[id].name);
    if (owed > 0) { cash(s, p, -owed, 'loans', 'Paid off mortgage on ' + SP[id].name); }
    if (gain > 0 && diff(s).taxes) {
      const tx = r0(gain * T.capitalGainsRate);
      cash(s, p, -tx, 'tax', 'Capital gains tax on ' + SP[id].name);
      msgs.push('You sold for ' + money(amount) + ' after paying ' + money(d.paid) + '. Capital gains tax: 15% of the ' + money(gain) + ' profit = ' + money(tx) + '.');
    } else msgs.push('You sold ' + SP[id].name + ' for ' + money(amount) + '.');
  }

  function applyEffects(s, effects, ctx) {
    const p = ctx.p, msgs = ctx.msgs || (ctx.msgs = []), e = s.economy;
    for (const ef of effects) {
      switch (ef.op) {
        /* ----- player money & movement ----- */
        case 'cash': cash(s, p, ef.amount, ef.cat || 'other', (ctx.card ? ctx.card.title : 'Card')); break;
        case 'cashAll': s.players.forEach(q => cash(s, q, ef.amount, 'gift', ctx.card ? ctx.card.title : 'Bonus')); break;
        case 'moveTo': { moveTo(s, p, ef.space, true); landOn(s, p, {}); break; }
        case 'moveBy': { moveSteps(s, p, ef.n); landOn(s, p, {}); break; }
        case 'moveNearest': {
          let tgt = null;
          for (let k = 1; k <= 40; k++) { const id = (p.pos + k) % 40; const sp = SP[id];
            if (ef.kind === 'rail' && sp.type === 'rail') { tgt = id; break; }
            if (ef.kind === 'commercial' && sp.type === 'lot' && s.spaces[id].zoning === 'C') { tgt = id; break; } }
          if (tgt != null) { moveTo(s, p, tgt, true); landOn(s, p, { rentMult: ef.rentMult, discount: ef.discount, dice: 7 }); }
          break;
        }
        case 'toAudit': sendToAudit(s, p); break;
        case 'keepCard': p.keep.push(ef.card); msgs.push('You keep the Clean Records card.'); break;
        case 'civic': p.civic += ef.n; break;
        case 'flagMe': p.flags[ef.flag] = { value: ef.value, years: ef.years }; break;
        case 'flagGlobal': e.flags[ef.flag] = { value: ef.value || 1, years: ef.years }; break;
        case 'credit': if (diff(s).credit) { p.credit = clamp(p.credit + ef.delta, 300, 850); msgs.push('Credit score ' + (ef.delta > 0 ? '+' : '') + ef.delta + '.'); } break;
        case 'salaryMult': if (p.career) { const old = p.career.salary; p.career.salary = r0(old * ef.mult); msgs.push('Salary ' + money(old) + ' -> ' + money(p.career.salary) + '.'); } break;
        case 'salaryDelta': if (p.career) { p.career.salary += ef.delta; msgs.push('Salary is now ' + money(p.career.salary) + ' a Year.'); } break;
        case 'renterCostDelta': if (p.home.mode === 'rent') { p.renterDelta = (p.renterDelta || 0) + ef.delta; p.renterCost += ef.delta; } break;
        case 'gamble': {
          if (ef.cost) cash(s, p, -ef.cost, 'other', ctx.card.title);
          const win = rnd(s) < ef.prob;
          if (win) { cash(s, p, ef.win, 'other', ctx.card.title + ' payout'); msgs.push(ef.winText); }
          else msgs.push(ef.loseText);
          if (ctx.dec) { ctx.dec.value = (win ? ef.win : 0) - (ef.cost || 0); ctx.dec.outcome = win ? ef.winText : ef.loseText; }
          break;
        }
        case 'delayed': {
          p.delayed.push({ uid: ctx.uid || null, src: ctx.src, years: ef.years, prob: ef.prob, win: ef.win, lose: ef.lose || [], winText: ef.winText, loseText: ef.loseText,
            valueWin: ef.value != null ? ef.value : null, valueLose: ef.value != null ? -Math.abs(ef.value) : null });
          if (ctx.dec && ef.value != null) { /* value fixed on resolution */ }
          msgs.push('You will find out how this turns out at the end of a later Year.');
          break;
        }
        case 'recurring': p.recurring.push({ label: ef.label, amount: ef.amount, years: ef.years }); msgs.push(ef.label + ': ' + money(ef.amount) + ' each Year.'); break;
        case 'homeShare': if (p.home.mode === 'own') { p.recurring.push({ label: 'Spare room rent', amount: ef.amount, years: ef.years }); msgs.push('You will earn ' + money(ef.amount) + ' a Year for ' + ef.years + ' Years.'); } else msgs.push('You rent, so you can\'t rent out a room.'); break;
        case 'insure': p.ins[ef.kind] = ef.on; msgs.push(ef.on ? 'You now have ' + ef.kind + ' insurance.' : 'You chose not to buy ' + ef.kind + ' insurance.'); if (ctx.dec) ctx.dec.ref = { insure: ef.kind, on: ef.on }; break;
        case 'insured': {
          const I = T.insurance[ef.kind]; const has = p.ins[ef.kind] && (ef.kind !== 'renters' || p.home.mode === 'rent');
          if (has) { const pay = Math.min(ef.cost, I.deductible); payBadEvent(s, p, pay, ctx.card.title + ' (deductible)', msgs); const saved = ef.cost - pay; p.stats.insuranceSaved += saved; msgs.push('Your ' + ef.kind + ' insurance saved you ' + money(saved) + '!'); emit({ t: 'insSaved', pid: p.id, amt: saved }); }
          else { payBadEvent(s, p, ef.cost, ctx.card.title, msgs); msgs.push('No ' + ef.kind + ' insurance, so you paid the full ' + money(ef.cost) + '.'); p.stats.uninsuredLoss = (p.stats.uninsuredLoss || 0) + ef.cost; }
          break;
        }
        case 'propertyDamage': {
          const nb = lotsOf(s, p.id).reduce((a, i) => a + bldCount(s, i), 0) + (p.home.mode === 'own' ? 1 : 0);
          const cost = ef.base + ef.perBuilding * nb;
          const ownsProp = lotsOf(s, p.id).length > 0 || p.home.mode === 'own';
          const kind = ownsProp ? 'property' : 'renters';
          const has = p.ins[kind] && (kind !== 'renters' || p.home.mode === 'rent');
          const I = T.insurance[kind];
          if (has) { const pay = Math.min(cost, I.deductible); payBadEvent(s, p, pay, 'Storm damage (deductible)', msgs); p.stats.insuranceSaved += cost - pay; msgs.push('Your ' + kind + ' insurance saved you ' + money(cost - pay) + '!'); emit({ t: 'insSaved', pid: p.id, amt: cost - pay }); }
          else { payBadEvent(s, p, cost, 'Storm damage', msgs); msgs.push('No ' + kind + ' insurance: you paid all ' + money(cost) + '.'); p.stats.uninsuredLoss = (p.stats.uninsuredLoss || 0) + cost; }
          break;
        }
        case 'rentalRepair': {
          const I = T.insurance.property;
          if (p.ins.property) { const pay = Math.min(ef.cost, I.deductible); payBadEvent(s, p, pay, 'Rental repair (deductible)', msgs); p.stats.insuranceSaved += ef.cost - pay; msgs.push('Property insurance saved you ' + money(ef.cost - pay) + '!'); }
          else { payBadEvent(s, p, ef.cost, 'Rental repair', msgs); msgs.push('No property insurance: you paid ' + money(ef.cost) + '.'); }
          break;
        }
        case 'emergency': payBadEvent(s, p, ef.cost, ctx.card.title, msgs); break;
        case 'studentLoanCut': { const sl = p.loans.find(l => l.kind === 'student'); if (sl) { const cut = Math.min(sl.balance, ef.amount); sl.balance -= cut; msgs.push('Student loan balance cut by ' + money(cut) + '.'); if (sl.balance <= 0) p.loans = p.loans.filter(l => l !== sl); } else cash(s, p, ef.elseCash, 'other', 'Employer bonus'); break; }
        case 'fundDividend': { const dv = r0(p.fund * ef.rate); if (dv > 0) { cash(s, p, dv, 'interest', 'Index fund dividend'); msgs.push('Dividend: ' + money(dv) + '.'); } else msgs.push('You have no index fund shares, so no dividend.'); break; }
        case 'perBuilding': { let tot = 0; lotsOf(s, p.id).forEach(i => { const l = s.spaces[i].level; tot += l === 5 ? ef.hotel : l * ef.house; }); if (tot) cash(s, p, -tot, 'maintenance', ctx.card.title); msgs.push(tot ? 'You paid ' + money(tot) + '.' : 'You have no buildings. Nothing to pay!'); break; }
        case 'perLotInGroups': { const n = lotsOf(s, p.id).filter(i => SP[i].type === 'lot' && ef.groups.includes(SP[i].group)).length; if (n) cash(s, p, -n * ef.amount, 'fees', ctx.card.title); msgs.push(n ? 'You paid ' + money(n * ef.amount) + ' for ' + n + ' lot(s).' : 'You own no lots there. Nothing to pay!'); break; }
        case 'ifOwnsKind': { const has = lotsOf(s, p.id).some(i => SP[i].type === 'lot' && lotKind(s, i) === ef.kind); if (has) cash(s, p, ef.amount, ef.cat || 'other', ctx.card.title); else msgs.push('This doesn\'t apply to you.'); break; }
        case 'recordsCheck': if (p.missedEver) { cash(s, p, -ef.penalty, 'fees', 'Penalty for past missed payments'); msgs.push('You missed a payment earlier, so you pay ' + money(ef.penalty) + '.'); } else msgs.push('Your records are clean. Nothing to pay!'); break;
        case 'assess': { lotsOf(s, p.id).forEach(i => { s.spaces[i].assess *= ef.mult; }); msgs.push(lotsOf(s, p.id).length ? 'Your property tax bill will be higher.' : 'You own no property, so nothing changes.'); break; }
        case 'easement': { const id = pickLot(s, p, 'random'); if (id != null) { s.spaces[id].easement *= ef.mult; cash(s, p, ef.comp, 'other', 'Easement payment'); msgs.push('A power line now crosses ' + SP[id].name + '. Its value dropped 10%.'); } break; }
        case 'eminentDomain': {
          const id = pickLot(s, p, 'cheapest', i => ef.filter === 'noBuildings' ? s.spaces[i].level === 0 : s.spaces[i].level < 5);
          if (id == null) { msgs.push('You have no lot the government can take. Nothing happens.'); break; }
          const fmv = marketValue(s, id);
          msgs.push('Fair market value means the price a willing buyer would pay today: ' + money(fmv) + ' for ' + SP[id].name + (s.spaces[id].level ? ' (including its buildings)' : '') + '.');
          sellLotForCash(s, p, id, fmv, 'Eminent domain', msgs);
          log(s, p, 'eminent', 'Eminent domain took ' + SP[id].name, fmv);
          break;
        }
        case 'rezoneMine': {
          const id = pickLot(s, p, 'random', i => !s.spaces[i].historic); if (id == null) { msgs.push('No lot to rezone.'); break; }
          const d = s.spaces[id]; d.zoning = d.zoning === 'C' ? 'R' : 'C';
          msgs.push(SP[id].name + ' is now zoned ' + (d.zoning === 'C' ? 'COMMERCIAL: hotels allowed, but vacancies are possible.' : 'RESIDENTIAL: no new hotels. Any existing hotel is grandfathered (allowed to stay).'));
          emit({ t: 'rezone', space: id }); break;
        }
        case 'sellLotOffer': {
          const id = pickLot(s, p, ef.pick, i => s.spaces[i].level === 0); if (id == null) { msgs.push('You have no lot to sell.'); break; }
          const amt = r0(marketValue(s, id) * ef.mult); const paid = s.spaces[id].paid;
          sellLotForCash(s, p, id, amt, ctx.card.title, msgs);
          if (ctx.dec) ctx.dec.value = amt - paid; break;
        }
        case 'auctionRandom': {
          const free = OWNABLE.filter(i => s.spaces[i].owner == null);
          if (!free.length) { msgs.push('Every lot is owned. No auction today.'); break; }
          const id = pickR(s, free); s.pending = { kind: 'auction', space: id, high: 0, bidder: null, min: r0(lotPrice(s, id) * T.auctionStartPct), bids: {}, from: p.id };
          msgs.push(SP[id].name + ' goes to auction!'); break;
        }
        case 'refinance': case 'refinanceAll': {
          const loans = p.loans.filter(l => l.kind !== 'plan' && l.kind !== 'student');
          if (!loans.length) { msgs.push('You have no loans to refinance.'); break; }
          cash(s, p, -ef.fee, 'fees', 'Refinance fee');
          const target = ef.op === 'refinance' ? [loans.sort((a, b) => b.rate - a.rate)[0]] : loans;

  /* =====================================================================

  function canBuild(s, p, id) {

    if (!ownsGroup(s, p.id, sp.group)) return { ok: false, why: 'You must own every lot in ' + C.GROUPS[sp.group].name + ' first.' };
    if (GROUP_LOTS[sp.group].some(i => s.spaces[i].mortgage > 0)) return { ok: false, why: 'Buy back (unmortgage) every lot in the group first.' };
    if (d.level >= maxLevel(s, id)) {
      if (d.level === 4 && d.historic) return { ok: false, why: 'Historic District: no hotels allowed here.' };
      if (d.level === 4) return { ok: false, why: 'Residential zoning: no hotels. Apply for a variance to allow one.' };
      return { ok: false, why: 'This lot is fully built.' };
    }
    const minL = Math.min(...GROUP_LOTS[sp.group].map(i => s.spaces[i].level));
    if (d.level > minL) return { ok: false, why: 'Build evenly: add to the other lots in this group first.' };
    const cost = buildPrice(s, p, id);
    if (p.cash < cost.total) return { ok: false, why: 'You need ' + money(cost.total) + ' (house ' + money(cost.house) + ' + permit ' + money(cost.permit) + ').', cost };
    return { ok: true, cost };
  }
  function buildPrice(s, p, id) {

  function doBuild(s, p, id) {

    d.level++; emit({ t: 'build', space: id, level: d.level, pid: p.id });

  function doMortgage(s, p, id) {

  function doUnmortgage(s, p, id) {

  function varianceChance(s, p, id) {

  function doVariance(s, p, id) {

    const l = { id: 'L' + (s.nextId++), kind, label: labels[kind] || 'Loan', principal: q.amount, balance: q.amount, rate: o.rate != null ? o.rate : q.rate, rateType: q.type, premium: q.premium,
      years: q.years, yearsLeft: q.years, payment: o.rate != null ? r0(payment(q.amount, o.rate, q.years)) : q.payment, missed: 0, onTime: 0, collateral: o.collateral != null ? o.collateral : null, deferUntil: o.deferUntil || null, year: s.flow.year };
    p.loans.push(l);

  function doBank(s, p, a) {

  /* ---------- trades ---------- */
  function tradeValues(s, offer) {

  }

    if (!lotsOk(a, offer.give.lots) || !lotsOk(b, offer.get.lots)) return 'Only lots with no buildings and no liens can be traded.';
    if ((offer.give.cash || 0) > a.cash || (offer.get.cash || 0) > b.cash) return 'Not enough cash for that offer.';

  function applyTrade(s, offer) {

    const aBase = xfer(a, b, offer.give.lots), bBase = xfer(b, a, offer.get.lots);
    if (offer.give.cash) { a.cash -= offer.give.cash; b.cash += offer.give.cash; emit({ t: 'pay', from: a.id, to: b.id, amt: offer.give.cash }); }
    if (offer.get.cash) { b.cash -= offer.get.cash; a.cash += offer.get.cash; emit({ t: 'pay', from: b.id, to: a.id, amt: offer.get.cash }); }
    // capital gains on cash received for lots
    const cg = (pl, cashIn, base, lots) => { if (!diff(s).taxes || !(lots || []).length) return; const gain = (cashIn || 0) - base; if (gain > 0) cash(s, pl, -r0(gain * T.capitalGainsRate), 'tax', 'Capital gains tax on trade'); };
    cg(a, offer.get.cash, aBase, offer.give.lots); cg(b, offer.give.cash, bBase, offer.get.lots);
    const d1 = { uid: 'd' + (s.nextId++), year: s.flow.year, kind: 'trade', id: 'trade', title: 'Trade with ' + b.name, choice: 'Accepted', value: r0(tradeValues(s, offer).toGives - tradeValues(s, offer).fromGives) };
    const d2 = { uid: 'd' + (s.nextId++), year: s.flow.year, kind: 'trade', id: 'trade', title: 'Trade with ' + a.name, choice: 'Accepted', value: -d1.value };
    a.decisions.push(d1); b.decisions.push(d2);
    log(s, a, 'trade', 'Trade with ' + b.name + ': gave ' + describeSide(offer.give) + ', got ' + describeSide(offer.get), null);
    checkGroupComplete(s, a); checkGroupComplete(s, b);
  }
  function describeSide(side) { const parts = (side.lots || []).map(i => SP[i].name); if (side.cash) parts.push(money(side.cash)); return parts.join(' + ') || 'nothing'; }
  function checkGroupComplete(s, p) {
    Object.keys(GROUP_LOTS).forEach(g => { if (ownsGroup(s, p.id, g)) { p.groupsDone = p.groupsDone || []; if (!p.groupsDone.includes(g)) { p.groupsDone.push(g); emit({ t: 'groupComplete', pid: p.id, group: g }); log(s, p, 'group', 'Completed ' + C.GROUPS[g].name, null); } } });
  }

  /* ---------- buying & auctions ---------- */
  function buyLot(s, p, id, price) {
    const d = s.spaces[id];
    cash(s, p, -price, null, 'Bought ' + SP[id].name); d.owner = p.id; d.paid = price;
    p.decisions.push({ uid: 'd' + (s.nextId++), year: s.flow.year, kind: 'buy', id: 'buy', title: 'Bought ' + SP[id].name + ' for ' + money(price), choice: 'Buy', ref: { lot: id, price }, value: null });
    log(s, p, 'buy', 'Bought ' + SP[id].name, -price);
    emit({ t: 'buy', pid: p.id, space: id, price });
    checkGroupComplete(s, p);
  }
  function resolveAuction(s) {
    const a = s.pending; s.pending = null;
    if (a.bidder == null) { emit({ t: 'auctionEnd', space: a.space, none: true }); log(s, null, 'auction', 'No bids for ' + SP[a.space].name, null); return; }
    const p = P(s, a.bidder);
    emit({ t: 'auctionEnd', space: a.space, pid: p.id, price: a.high });
    log(s, p, 'auction', 'Won auction for ' + SP[a.space].name, -a.high);
    buyLot(s, p, a.space, a.high);
  }

  /* ---------- bankruptcy ---------- */
  function liquidatable(s, p) {
    if (p.savings > 0 || p.fund > 0 || p.emergency > 0) return true;
    return lotsOf(s, p.id).some(i => s.spaces[i].level > 0 || (s.spaces[i].mortgage === 0 && !(SP[i].type === 'lot' && GROUP_LOTS[SP[i].group].some(j => s.spaces[j].level > 0))));
  }
  function emergencyLoanOk(s, p) {
    const bal = p.loans.filter(l => l.kind === 'emergency').reduce((a, l) => a + l.balance, 0);
    return (!diff(s).credit || p.credit >= 450) && bal + p.cash * -1 <= 600 && !p.bk;
  }
  function doBankrupt(s, p, type) {
    if (liquidatable(s, p)) return 'You must sell buildings and mortgage property first.';
    const D = diff(s);
    p.stats.bankruptcies++; p.bk = { type, year: s.flow.year }; p.bkPremYears = T.bankruptcyPremiumYears;
    const owed = -p.cash;
    if (type === 'ch7') {
      const keep = lotsOf(s, p.id).sort((a, b) => lotPrice(s, a) - lotPrice(s, b)).slice(0, 2);
      lotsOf(s, p.id).forEach(i => { if (!keep.includes(i)) releaseLot(s, i); });
      p.loans = p.loans.filter(l => l.kind === 'student' || l.kind === 'home');
      p.taxLien = 0; p.cash = 200; p.savings = 0; p.fund = 0;
      if (D.credit) p.credit = Math.min(p.credit, 500);
      log(s, p, 'bankruptcy', 'Liquidation (like Chapter 7): kept ' + keep.length + ' lots, debts cleared, restart with $200', null);
    } else {
      const roll = p.loans.filter(l => l.kind === 'bank' || l.kind === 'emergency');
      const bal = r0(owed + roll.reduce((a, l) => a + l.balance, 0) + p.taxLien);
      p.loans = p.loans.filter(l => !roll.includes(l));
      p.taxLien = 0; p.cash = 0;
      p.loans.push({ id: 'L' + (s.nextId++), kind: 'plan', label: 'Repayment plan', principal: bal, balance: bal, rate: 0, rateType: 'fixed', premium: 0, years: 3, yearsLeft: 3, payment: 0, missed: 0, onTime: 0, collateral: null });
      if (D.credit) p.credit = Math.min(p.credit, 580);
      log(s, p, 'bankruptcy', 'Repayment plan (like Chapter 13): ' + money(bal) + ' repaid from income over 3 Years', null);
    }
    p.decisions.push({ uid: 'd' + (s.nextId++), year: s.flow.year, kind: 'bankrupt', id: type, title: type === 'ch7' ? 'Chose Liquidation (like Chapter 7)' : 'Chose a Repayment Plan (like Chapter 13)', choice: type, value: null });
    emit({ t: 'bankrupt', pid: p.id, type });
    return null;
  }

  /* =====================================================================
     STEP: apply one action
     ===================================================================== */
  const FREE = ['build', 'sell', 'mortgage', 'unmortgage', 'variance', 'deposit', 'withdraw', 'fundBuy', 'fundSell', 'efundIn', 'efundOut', 'insure', 'loan', 'payoff', 'school', 'switchHome', 'depreciation', 'trade', 'emLoan'];
  const FREE_OK = ['roll', 'audit', 'endTurn', 'debt', 'buy'];
  const DEBT_OK = ['sell', 'mortgage', 'withdraw', 'fundSell', 'efundOut', 'emLoan', 'trade', 'loan', 'unmortgage', 'build', 'payoff', 'insure'];

  function apply(s, a) {
    const pd = s.pending;
    if (a.type === 'endGameNow') { s.flow.endRequested = true; log(s, null, 'game', 'Teacher ended the game early', null);
      if (!pd || ['ballot', 'career'].includes(pd.kind) || (pd.kind === 'roll' && s.flow.turn && s.flow.turn.rolls === 0)) { s.pending = null; finish(s); }
      return null; }
    if (a.type === 'postcheck') { const p = P(s, a.player); p.checks.post = a.answers; return null; }
    if (a.type === 'reflect') { const p = P(s, a.player); p.reflections[a.key] = String(a.text || '').slice(0, 2000); return null; }
    if (a.type === 'setting') { if (['anim', 'muted', 'quickChecks', 'turnTimer', 'yearTimer', 'tutorial'].includes(a.key)) s.settings[a.key] = a.value; return null; }
    if (!pd) return 'Nothing to do right now.';

    if (FREE.includes(a.type)) {
      const pid = a.player != null ? a.player : pd.player;
      if (pid !== pd.player) return 'It is not your turn.';
      if (pd.kind === 'debt' ? !DEBT_OK.includes(a.type) : !FREE_OK.includes(pd.kind)) return 'Not right now.';
      const p = P(s, pid); let err = null;
      switch (a.type) {
        case 'build': err = doBuild(s, p, a.space); break;
        case 'sell': err = doSellBuilding(s, p, a.space); break;
        case 'mortgage': err = doMortgage(s, p, a.space); break;
        case 'unmortgage': err = doUnmortgage(s, p, a.space); break;
        case 'variance': err = doVariance(s, p, a.space); break;
        case 'deposit': case 'withdraw': case 'fundBuy': case 'fundSell': case 'efundIn': case 'efundOut': err = doBank(s, p, a); break;
        case 'insure': p.ins[a.kind] = !!a.on; log(s, p, 'insurance', (a.on ? 'Bought ' : 'Dropped ') + a.kind + ' insurance', null);
          p.decisions.push({ uid: 'd' + (s.nextId++), year: s.flow.year, kind: 'insurance', id: a.kind, title: (a.on ? 'Bought ' : 'Dropped ') + a.kind + ' insurance', choice: a.on ? 'Yes' : 'No', ref: { insure: a.kind, on: !!a.on }, value: null }); break;
        case 'loan': err = takeLoan(s, p, { amount: a.amount, years: a.years, type: a.rateType, kind: 'bank' }); break;
        case 'emLoan': if (!emergencyLoanOk(s, p)) err = 'No emergency loan is available.'; else err = takeLoan(s, p, { amount: Math.max(50, -p.cash), years: 3, type: 'fixed', kind: 'emergency', force: true }); break;
        case 'payoff': err = doPayoff(s, p, a.loan, a.amount); break;
        case 'school': err = doSchool(s, p); break;
        case 'switchHome': err = doSwitchHome(s, p); break;
        case 'depreciation': p.depreciation = !!a.on; break;
        case 'trade': {
          const offer = { from: pid, to: a.to, give: a.give || { lots: [], cash: 0 }, get: a.get || { lots: [], cash: 0 } };
          err = tradeError(s, offer); if (err) break;
          const tgt = P(s, a.to);
          if (tgt.cpu) { const ok = cpuAcceptTrade(s, tgt, offer); emit({ t: 'tradeResult', ok, from: pid, to: a.to }); if (ok) applyTrade(s, offer); else log(s, p, 'trade', tgt.name + ' rejected a trade', null); }
          else { s.pending = { kind: 'tradeOffer', player: a.to, offer, resume: pd, round: (a.round || 0) }; }
          break;
        }
      }
      if (err) return err;
      if (s.pending && s.pending.kind === 'debt') { const p2 = P(s, s.pending.player); if (p2.cash >= 0) { s.pending = null; emit({ t: 'debtCleared', pid: p2.id }); } else s.pending.owed = -p2.cash; }
      if (s.pending && s.pending.kind === 'buy') s.pending.price = s.pending.price; // price fixed at landing
      return null;
    }

    if (a.player != null && pd.player != null && a.player !== pd.player && pd.kind !== 'ballot' && pd.kind !== 'auction') return 'It is not your turn.';
    const p = pd.player != null ? P(s, pd.player) : null;
    switch (pd.kind) {
      case 'career': {
        const path = C.CAREERS[a.path] ? a.path : 'work';
        const cr = C.CAREERS[path];
        p.career = { path, salary: cr.salary, title: a.title || cr.titles[0], backToSchool: false };
        if (cr.loan > 0) { const l = { id: 'L' + (s.nextId++), kind: 'student', label: 'Student loan', principal: cr.loan, balance: cr.loan, rate: cr.loanRate, rateType: 'fixed', premium: 0, years: cr.loanYears, yearsLeft: cr.loanYears, payment: r0(payment(cr.loan, cr.loanRate, cr.loanYears)), missed: 0, onTime: 0, collateral: null, deferUntil: path === 'college' ? 2 : null, year: 0 }; p.loans.push(l); }
        if (a.home === 'own') {
          const price = T.homePrice, down = r0(price * T.homeDownPct);
          p.cash -= down;
          const rate = s.economy.baseRate + creditPremium(s, p);
          p.loans.push({ id: 'L' + (s.nextId++), kind: 'home', label: 'Home mortgage', principal: price - down, balance: price - down, rate, rateType: 'fixed', premium: creditPremium(s, p), years: T.homeLoanYears, yearsLeft: T.homeLoanYears, payment: r0(payment(price - down, rate, T.homeLoanYears)), missed: 0, onTime: 0, collateral: null, year: 0 });
          p.home = { mode: 'own', units: price, switched: false, solar: false, boughtFor: price };
        }
        if (a.ins) Object.keys(a.ins).forEach(k => { p.ins[k] = !!a.ins[k]; });
        p.decisions.push({ uid: 'd' + (s.nextId++), year: 0, kind: 'career', id: path, title: 'Chose ' + cr.label, choice: path, value: null });
        p.decisions.push({ uid: 'd' + (s.nextId++), year: 0, kind: 'home', id: a.home === 'own' ? 'buy' : 'rent', title: a.home === 'own' ? 'Bought a starter home' : 'Rented an apartment', choice: a.home || 'rent', ref: a.home === 'own' ? { home: 'buy', price: T.homePrice } : null, value: null });
        p.homeStart = p.home.mode;
        log(s, p, 'career', 'Chose ' + cr.label + ' and ' + (a.home === 'own' ? 'bought a home' : 'rents'), null);
        s.pending = null; break;
      }
      case 'ballot': {
        if (a.type !== 'vote') return 'Vote yes or no.';
        const voter = a.player != null ? a.player : pd.voters.find(v => pd.votes[v] == null);
        if (pd.votes[voter] != null) return 'Already voted.';
        pd.votes[voter] = !!a.yes; P(s, voter).stats.votes++; P(s, voter).civic++;
        log(s, P(s, voter), 'vote', 'Voted on ' + ballotById(pd.id).title, null);
        if (pd.voters.every(v => pd.votes[v] != null)) finishBallot(s);
        break;
      }
      case 'roll': {
        if (a.type !== 'roll') return 'Roll the dice.';
        doRoll(s, p, a.dice); break;
      }
      case 'audit': {
        if (a.type === 'auditPay') { if (p.cash < T.auditFee) return 'You need ' + money(T.auditFee) + '.'; cash(s, p, -T.auditFee, 'fees', 'Paid to settle the audit'); p.audit = { in: false, tries: 0 }; s.pending = { kind: 'roll', player: p.id }; emit({ t: 'auditOut', pid: p.id }); break; }
        if (a.type === 'auditCard') { const k = p.keep.indexOf('clean'); if (k < 0) return 'No card.'; p.keep.splice(k, 1); p.audit = { in: false, tries: 0 }; s.pending = { kind: 'roll', player: p.id }; emit({ t: 'auditOut', pid: p.id }); break; }
        if (a.type === 'roll') {
          const d1 = a.dice ? a.dice[0] : rint(s, 1, 6), d2 = a.dice ? a.dice[1] : rint(s, 1, 6);
          emit({ t: 'dice', d1, d2, pid: p.id }); s.pending = null; s.flow.turn.rolls++;
          if (d1 === d2) { p.audit = { in: false, tries: 0 }; emit({ t: 'auditOut', pid: p.id, doubles: true }); s.flow.turn.step = 'post'; moveSteps(s, p, d1 + d2); landOn(s, p, { dice: d1 + d2 }); maybeQuickCheck(s, p); }
          else {
            p.audit.tries++;
            if (p.audit.tries >= T.auditTries) { cash(s, p, -T.auditFee, 'fees', 'Paid to settle the audit (3rd try)'); p.audit = { in: false, tries: 0 }; emit({ t: 'auditOut', pid: p.id }); s.flow.turn.step = 'post'; moveSteps(s, p, d1 + d2); landOn(s, p, { dice: d1 + d2 }); maybeQuickCheck(s, p); }
            else { emit({ t: 'msg', text: 'No doubles. ' + p.name + ' stays in Audit.' }); s.flow.turn.step = 'post'; }
          }
          break;
        }
        return 'Choose how to leave Audit.';
      }
      case 'buy': {
        if (a.type === 'buy') { if (p.cash < pd.price) return 'You need ' + money(pd.price) + '. Mortgage something or take a loan first, or send it to auction.'; s.pending = null; buyLot(s, p, pd.space, pd.price); maybeQuickCheck(s, p); }
        else if (a.type === 'auction') { s.pending = { kind: 'auction', space: pd.space, high: 0, bidder: null, min: r0(lotPrice(s, pd.space) * T.auctionStartPct), bids: {}, from: p.id }; p.decisions.push({ uid: 'd' + (s.nextId++), year: s.flow.year, kind: 'pass', id: 'pass', title: 'Passed on ' + SP[pd.space].name, choice: 'Auction', ref: { lot: pd.space }, value: null }); emit({ t: 'auctionStart', space: pd.space }); }
        else return 'Buy it or send it to auction.';
        break;
      }
      case 'auction': {
        if (a.type === 'bid') {
          const bp = P(s, a.player); const amt = r0(a.amount);
          if (amt < Math.max(pd.min, pd.high + 1)) return 'Bid at least ' + money(Math.max(pd.min, pd.high + 1)) + '.';
          if (amt > bp.cash) return bp.name + ' doesn\'t have that much cash.';
          pd.high = amt; pd.bidder = bp.id; pd.bids[bp.id] = amt; emit({ t: 'bid', pid: bp.id, amt }); break;
        }
        if (a.type === 'auctionClose') { resolveAuction(s); maybeQuickCheckAfter(s); break; }
        return 'Bid or close the auction.';
      }
      case 'choice': {
        if (a.type !== 'choose') return 'Pick an option.';
        s.pending = null; chooseOption(s, p, pd.deck, pd.id, a.option); break;
      }
      case 'quickcheck': {
        const q = C.QUICK_CHECKS[pd.q]; s.pending = null;
        if (a.type === 'qc' && a.answer != null) { const right = a.answer === q.answer; if (right) cash(s, p, T.quickCheckBonus, 'other', 'Quick Check bonus'); p.stats.qcRight = (p.stats.qcRight || 0) + (right ? 1 : 0); p.stats.qcTried = (p.stats.qcTried || 0) + 1; emit({ t: 'qcResult', right, pid: p.id, answer: q.answer }); }
        break;
      }
      case 'endTurn': {
        if (a.type !== 'endTurn') return 'End your turn when ready.';
        s.pending = null; s.flow.turn.step = 'done'; break;
      }
      case 'debt': {
        if (a.type === 'bankrupt') { const err = doBankrupt(s, p, a.kind === 'ch13' ? 'ch13' : 'ch7'); if (err) return err; s.pending = null; break; }
        return 'Raise cash: sell buildings, mortgage property, or (if nothing is left) choose a bankruptcy option.';
      }
      case 'tradeOffer': {
        const o = pd.offer;
        if (a.type === 'tradeRespond') {
          if (a.answer === 'accept') { const err = tradeError(s, o); s.pending = pd.resume; if (err) { emit({ t: 'tradeResult', ok: false, from: o.from, to: o.to, why: err }); break; } applyTrade(s, o); emit({ t: 'tradeResult', ok: true, from: o.from, to: o.to }); }
          else if (a.answer === 'counter' && a.counter && pd.round < 3) {
            const c = { from: o.to, to: o.from, give: a.counter.give, get: a.counter.get };
            const err = tradeError(s, c); if (err) return err;
            const orig = P(s, o.from);
            if (orig.cpu) { const ok = cpuAcceptTrade(s, orig, c); s.pending = pd.resume; emit({ t: 'tradeResult', ok, from: c.from, to: c.to, counter: true }); if (ok) applyTrade(s, c); }
            else s.pending = { kind: 'tradeOffer', player: o.from, offer: c, resume: pd.resume, round: pd.round + 1 };
          } else { s.pending = pd.resume; emit({ t: 'tradeResult', ok: false, from: o.from, to: o.to }); log(s, P(s, o.to), 'trade', 'Rejected a trade from ' + P(s, o.from).name, null); }
          break;
        }
        return 'Accept, reject or counter.';
      }
      default: return 'Unknown prompt.';
    }
    return null;
  }

  function doRoll(s, p, forced) {
    const t = s.flow.turn;
    const d1 = forced ? forced[0] : rint(s, 1, 6), d2 = forced ? forced[1] : rint(s, 1, 6);
    t.rolls++; s.pending = null;
    emit({ t: 'dice', d1, d2, pid: p.id });
    log(s, p, 'roll', 'Rolled ' + d1 + ' + ' + d2, null);
    if (d1 === d2) {
      t.doubles++;
      if (t.doubles >= 3) { emit({ t: 'msg', text: 'Three doubles in a row! Off to Audit.' }); sendToAudit(s, p); return; }
      t.step = 'pre';
    } else t.step = 'post';
    moveSteps(s, p, d1 + d2);
    landOn(s, p, { dice: d1 + d2 });
    maybeQuickCheck(s, p);
  }

  function maybeQuickCheck(s, p) {
    if (s.pending || !s.settings.quickChecks || p.cpu) return;
    const tag = SP[p.pos].type;
    const pool = C.QUICK_CHECKS.map((q, i) => i).filter(i => C.QUICK_CHECKS[i].on === tag && !s.qcUsed.includes(i));
    if (!pool.length || rnd(s) > T.quickCheckChance) return;
    const qi = pickR(s, pool); s.qcUsed.push(qi);
    s.pending = { kind: 'quickcheck', player: p.id, q: qi };
  }
  function maybeQuickCheckAfter(s) { /* quick checks only follow your own landing */ }

  /* =====================================================================
     CPU PLAYERS
     ===================================================================== */
  const STRAT = {
    res: { reserve: 150, likes: (s, id) => SP[id].type === 'lot' && lotKind(s, id) === 'res' ? 1 : SP[id].type === 'lot' ? 0.2 : 0.4 },
    com: { reserve: 150, likes: (s, id) => SP[id].type === 'lot' && lotKind(s, id) === 'com' ? 1 : SP[id].type === 'lot' ? 0.2 : 0.4 },
    rail: { reserve: 150, likes: (s, id) => SP[id].type === 'rail' ? 1 : SP[id].type === 'utility' ? 0.8 : inCorridor(s, id) ? 0.7 : 0.3 },
    saver: { reserve: 300, likes: (s, id) => lotPrice(s, id) <= 180 ? 0.7 : 0.3 },
    balanced: { reserve: 200, likes: () => 0.7 }
  };
  const strat = (p) => STRAT[p.strategy] || STRAT.balanced;
  function completesGroup(s, p, id) { const sp = SP[id]; if (sp.type !== 'lot') return false; return GROUP_LOTS[sp.group].every(i => i === id || s.spaces[i].owner === p.id); }
  function blocksGroup(s, p, id) { const sp = SP[id]; if (sp.type !== 'lot') return false; const others = GROUP_LOTS[sp.group].filter(i => i !== id).map(i => s.spaces[i].owner); return others.length && others.every(o => o != null && o !== p.id && o === others[0]); }
  function cpuValue(s, p, id) {
    let v = lotPrice(s, id) * (0.6 + 0.6 * strat(p).likes(s, id));
    if (completesGroup(s, p, id)) v *= 1.6;
    if (SP[id].type === 'rail') v *= 1 + 0.25 * railsOwned(s, p.id);
    return r0(v);
  }
  function cpuCeiling(s, p, id) { return Math.min(cpuValue(s, p, id), p.cash - strat(p).reserve * 0.5); }
  function cpuWantsBuy(s, p, id, price) {
    const st = strat(p), like = st.likes(s, id);
    if (completesGroup(s, p, id) && p.cash >= price + 40) return true;
    if (like >= 0.7 && p.cash - price >= st.reserve * 0.4) return true;
    if (like >= 0.4 && p.cash - price >= st.reserve * 1.0) return true;
    return p.cash - price >= st.reserve * 2;
  }
  function cpuAcceptTrade(s, p, offer) {
    // p is the receiver of 'offer' (offer.to === p.id)
    const val = (lots, gaining) => (lots || []).reduce((a, i) => {
      let v = marketValue(s, i) - s.spaces[i].mortgage;
      if (SP[i].type === 'lot') {
        if (gaining && GROUP_LOTS[SP[i].group].every(j => j === i || s.spaces[j].owner === p.id || (offer.give.lots || []).includes(j))) v *= 1.7;
        if (!gaining && GROUP_LOTS[SP[i].group].every(j => j === i || s.spaces[j].owner === offer.from || (offer.give.lots || []).includes(j) === false && s.spaces[j].owner === offer.from)) v *= 1.6;
      }
      return a + v;
    }, 0);
    const get = val(offer.give.lots, true) + (offer.give.cash || 0);

  /* =====================================================================

  // Saves right away whenever the turn, stage or open prompt changes (and when the tab is hidden or closed); repeated changes inside one prompt are saved at most every 5 seconds (fewer, smaller writes are kinder to Chromebook storage).
  let saveTimer = null, lastSave = 0, lastSavedTurn = -1;
  function save(force) {

    if (!force && turnMark === lastSavedTurn && Date.now() - lastSave < 5000) { if (!saveTimer) saveTimer = setTimeout(() => { saveTimer = null; save(true); }, 5000); return; }
    if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }

  // IndexedDB backup copy of every save (the newest of the two copies wins when loading)
  const IDB = {
    db: null,
    open() { return new Promise(res => { try { const r = indexedDB.open('deedndebt', 1); r.onupgradeneeded = () => r.result.createObjectStore('saves'); r.onsuccess = () => { IDB.db = r.result; res(); }; r.onerror = () => res(); r.onblocked = () => res(); } catch (e) { res(); } setTimeout(res, 1500); }); },
    put(k, v) { if (!this.db) return; try { this.db.transaction('saves', 'readwrite').objectStore('saves').put(v, k); } catch (e) { } },
    del(k) { if (!this.db) return; try { this.db.transaction('saves', 'readwrite').objectStore('saves').delete(k); } catch (e) { } },
    all() { return new Promise(res => { if (!this.db) return res([]); const out = []; try { const rq = this.db.transaction('saves').objectStore('saves').openCursor(); rq.onsuccess = () => { const c = rq.result; if (c) { out.push({ key: c.key, json: c.value }); c.continue(); } else res(out); }; rq.onerror = () => res(out); } catch (e) { res(out); } }); }
  };

  function listSaves() {
    const map = {};
    const add = (k, json) => { try { const s = JSON.parse(json); if (!map[k] || (s.savedAt || 0) > (map[k].s.savedAt || 0)) map[k] = { key: k, s }; } catch (e) { } };
    try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(SAVE_PREFIX)) add(k, localStorage.getItem(k)); } } catch (e) { }
    idbCache.forEach(x => { if (String(x.key).startsWith(SAVE_PREFIX)) add(x.key, x.json); });
    return Object.values(map).sort((a, b) => (b.s.savedAt || 0) - (a.s.savedAt || 0));

  /* =====================================================================

  function dispatch(a) {
    if (!G) return false;

    const r = E.step(G, a);
    if (r.error) { toast(r.error); Snd.play('bad'); return false; }
    G = r.state; save(a.type === 'endTurn' || a.type === 'endGameNow' || G.flow.stage === 'results');
    UI.fxq.push(...r.fx);
    pump();
    return true;
  }
  function pendingSig(pd) { if (!pd) return null; return [pd.kind, pd.player, pd.space, pd.id, pd.q, pd.kind === 'tradeOffer' ? JSON.stringify(pd.offer) : ''].join('|'); }

    if (UI.pumping) return; UI.pumping = true;

      while (UI.fxq.length) { const f = UI.fxq.shift(); try { await playFx(f); } catch (e) { console.error(e); } }

  }

  function cellCenter(id, k, n) {

    if (n > 1) { const a = (k / n) * Math.PI * 2, rad = Math.min(r.width, r.height) * 0.22; x += Math.cos(a) * rad; y += Math.sin(a) * rad; }
    return { x, y };
  }

  function isCpuPending(pd) {
    if (pd.kind === 'ballot') { const v = pd.voters.find(x => pd.votes[x] == null); return G.players[v].cpu; }
    if (pd.kind === 'auction') return G.players.every(p => p.cpu || p.cash < pd.min);
    const p = G.players[pd.player]; return p && p.cpu;
  }
  function handlePending() {
    if (!G) return;

    const pd = G.pending; if (!pd) return;

      stopTurnTimer();
      if (UI.cpuTimer) return;
      UI.cpuTimer = setTimeout(() => { UI.cpuTimer = null; if (G && G.pending && isCpuPending(G.pending) && !UI.pumping) dispatch({ type: 'cpu' }); }, 650 * Math.max(0.25, speedK()));
      return;
    }
    const sig = pendingSig(pd);
    if (['roll', 'endTurn', 'audit'].includes(pd.kind)) {
      if (UI.promptSig !== sig) { UI.promptSig = sig; startTurnTimer(); maybeCoach(); setTimeout(() => { const b = $('#btnRoll') || $('#btnEnd'); if (b && !UI.modals.length) b.focus(); }, 60); }
      return;
    }
    if (UI.promptEntry && UI.promptSig === sig) { if (UI.promptEntry.refresh) UI.promptEntry.refresh(); return; }
    UI.promptSig = sig;
    if (['buy', 'choice', 'debt', 'quickcheck'].includes(pd.kind)) startTurnTimer();
    const fn = PROMPTS[pd.kind]; if (fn) fn(pd);
  }

      const a = G.pending; if (!a || a.kind !== 'auction') return;
      const need = Math.max(a.min, a.high + 1);
      body.innerHTML = '<div class="grid2"><div>' + deedHTML(id) + '</div><div><div style="font-size:54px;font-weight:900;text-align:center" aria-live="off">⏱ <span id="auLeft">' + left + '</span>s</div>' +

        G.players.filter(p => !p.cpu).map(p => '<div class="row" style="margin:4px 0"><b style="min-width:90px">' + p.token + ' ' + esc(p.name) + '</b><span class="pill">' + fmt(p.cash) + '</span>' +
          [10, 50, 100].map(inc => { const amt = a.bidder == null ? a.min + (inc === 10 ? 0 : inc) : a.high + inc; return '<button type="button" class="small" data-bid="' + p.id + '" data-amt="' + amt + '" ' + (amt > p.cash || a.bidder === p.id || passed.has(p.id) ? 'disabled' : '') + '>' + fmt(amt) + '</button>'; }).join('') + (passed.has(p.id) ? '<span class="pill">Passed</span>' : '<button type="button" class="small ghost" data-pass="' + p.id + '">Pass</button>') + '</div>').join('') +

      $$('[data-pass]', body).forEach(b => b.onclick = () => { passed.add(+b.dataset.pass); const humans = G.players.filter(p => !p.cpu && p.cash >= Math.max(a.min, a.high + 1) && a.bidder !== p.id); if (humans.every(p => passed.has(p.id))) finishEarly(); else draw(); });
    };

    const parts = Array.from({ length: 140 }, () => ({ x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * 0.4, vx: (Math.random() - 0.5) * 4, vy: 2 + Math.random() * 4, s: 6 + Math.random() * 6, c: COLORS[Math.floor(Math.random() * 6)], r: Math.random() * 6 }));

        break;

      case 'ballotResult': {
