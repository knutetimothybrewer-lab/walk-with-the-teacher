          (f.passed && f.msgs.length ? '<ul class="msgs">' + f.msgs.map(m => '<li>' + esc(m) + '</li>').join('') + '</ul>' : '') +
          '<p>' + (f.passed ? gloss(b.yes) : gloss(b.no)) + '</p><div class="insight">🏛️ <b>Econ &amp; Civics Insight:</b> ' + gloss(b.insight) + ' Taxes and zoning don\'t just happen: they come from political decisions that voters and their representatives make.' + (b.vocab ? '<br>📘 <b>Vocab:</b> ' + esc(b.vocab) : '') + '</div>' + (f.yes === f.no ? '<p class="realworld">A tie fails: a measure needs a majority to pass.</p>' : '');
        await openModal({ fx: true, title: '🗳️ Results: ' + esc(b.title), body, wide: true, label: 'Ballot results',
          onOpen: async () => {
            const max = Math.max(1, f.yes, f.no); const y = $('#vbY'), n = $('#vbN');
            for (let i = 0; i <= Math.max(f.yes, f.no); i++) { if (y) { y.style.height = (Math.min(i, f.yes) / max * 150 + 4) + 'px'; y.textContent = Math.min(i, f.yes); } if (n) { n.style.height = (Math.min(i, f.no) / max * 150 + 4) + 'px'; n.textContent = Math.min(i, f.no); } Snd.play('vote'); await sleep(450); }
            const r = $('#vbRes'); if (r) r.style.opacity = 1; Snd.play(f.passed ? 'fanfare' : 'bad'); if (f.passed) { render(); renderBoard(); }
          }, buttons: [{ label: 'Continue', cls: 'primary' }] });

      case 'taxday': {

        UI.seen = new Set();
        const rows = f.rows.map(r => '<tr><td>' + fmt(r.from) + ' to ' + (r.to > 99999 ? 'up' : fmt(r.to)) + '</td><td>' + pct(r.rate, 0) + '</td><td>' + fmt(r.slice) + '</td><td>' + fmt(r.tax) + '</td></tr>').join('');
        const body = '<p>' + gloss('Progressive income tax: each slice of income is taxed at its own rate. Your income so far this Year is ' + fmt(f.income) + '.') + '</p>' + (f.dep ? '<p>Depreciation deduction: -' + fmt(f.dep) + ' (wear on your rental buildings), so taxable income is ' + fmt(f.taxable) + '.</p>' : '') +
          '<table class="t"><tr><th>Bracket</th><th>Rate</th><th>Your slice</th><th>Tax</th></tr>' + rows + '<tr><td><b>Total tax</b></td><td></td><td></td><td><b>' + fmt(f.tax) + '</b></td></tr><tr><td>Already withheld from paychecks</td><td></td><td></td><td>-' + fmt(f.withheld) + '</td></tr>' + (f.paidBefore ? '<tr><td>Paid at an earlier Tax Day</td><td></td><td></td><td>-' + fmt(f.paidBefore) + '</td></tr>' : '') + '<tr><td><b>' + (f.owe >= 0 ? 'You owe' : 'Refund') + '</b></td><td></td><td></td><td><b>' + fmt(Math.abs(f.owe)) + '</b></td></tr></table>' +
          '<p class="realworld"><b>Real world:</b> you file one tax return each year (usually by April 15) that reports all your income. Real brackets and amounts are much larger.</p>';
        await openModal({ fx: true, title: '🧾 Tax Day for ' + esc(p.name), body, label: 'Tax Day', autoClose: p.cpu ? 4000 : 0, buttons: [{ label: 'Continue', cls: 'primary' }] });
        break;
      }
      case 'audit': Snd.play('bad'); toast('🔍 ' + P(f.pid).name + ' goes to Audit!'); await hopToken(f.pid, [10]); break;
      case 'auditOut': toast(P(f.pid).name + ' leaves Audit' + (f.doubles ? ' with doubles!' : '.')); break;
      case 'msg': toast(f.text); $('#centerMsg').textContent = f.text; await sleep(300); break;
      case 'insSaved': Snd.play('good'); toast('🛡️ ' + P(f.pid).name + '\'s insurance saved ' + fmt(f.amt) + '!'); break;
      case 'variance': {
        const p = P(f.pid); Snd.play(f.ok ? 'good' : 'bad');
        if (!p.cpu) await openModal({ fx: true, title: f.ok ? '✅ Variance approved!' : '❌ Variance denied', body: '<p>The zoning board looked at ' + esc(SP[f.space].name) + '. Chance of approval was ' + pct(f.chance, 0) + ' (based on nearby commercial lots, rail access and neighborhood).</p><p>' + (f.ok ? 'You can now build a hotel here.' : 'You can try again next Year.') + '</p><div class="insight">💡 ' + gloss('A variance is permission to break a zoning rule on one lot. Neighbors can speak at the hearing.') + '</div>', buttons: [{ label: 'OK', cls: 'primary' }] });
        else toast(p.name + ' applied for a variance: ' + (f.ok ? 'approved' : 'denied'));
        renderBoard(); break;
      }
      case 'tradeResult': Snd.play(f.ok ? 'good' : 'bad'); toast(f.ok ? '🤝 Trade done between ' + P(f.from).name + ' and ' + P(f.to).name + '!' : '🙅 Trade rejected' + (f.why ? ': ' + f.why : '.')); render(); break;
      case 'auctionStart': Snd.play('card'); break;
      case 'auctionEnd': toast(f.none ? 'No bids. ' + SP[f.space].name + ' stays with the Bank.' : '🔨 SOLD to ' + P(f.pid).name + ' for ' + fmt(f.price) + '!'); break;
      case 'bid': break;
      case 'loan': renderSide(); break;
      case 'bank': renderSide(); break;
      case 'home': toast(P(f.pid).name + (f.mode === 'own' ? ' bought a home! 🏠' : ' sold their home and now rents. 🔑')); renderSide(); break;
      case 'phase': renderTicker(); toast('📈 The economy enters ' + f.phase.toUpperCase()); break;
      case 'debt': Snd.play('bad'); render(); break;
      case 'debtCleared': Snd.play('good'); toast(P(f.pid).name + ' is back in the black!'); break;
      case 'bankrupt': {
        const p = P(f.pid); Snd.play('card');
        await openModal({ fx: true, title: '📁 A Fresh Start for ' + esc(p.name), body: '<div class="row" style="justify-content:center"><svg width="120" height="120" class="' + (reduced() ? '' : 'dex-bob') + '"><use href="#dexSym"/></svg><div style="font-size:70px">' + (reduced() ? '' : '➡️') + '📁</div></div><p style="font-size:20px">Dex hands ' + esc(p.name) + ' a <b>Fresh Start</b> folder. ' + (f.type === 'ch7' ? 'Liquidation: most properties went to creditors, most debts are gone, and ' + esc(p.name) + ' restarts with $200.' : 'Repayment plan: ' + esc(p.name) + ' keeps everything and repays creditors from income for 3 Years.') + '</p><p>Loans will cost more for a while, but ' + esc(p.name) + ' keeps playing and can absolutely come back. Watch for the <b>Comeback Kid</b> award!</p><div class="insight">💡 ' + gloss('Bankruptcy is a legal way to get relief from debt you can\'t pay. It hurts your credit score for years, but it lets people start over.') + '</div>', buttons: [{ label: 'Keep playing', cls: 'primary' }] });
        render(); break;
      }
      case 'qcResult': toast(f.right ? '✅ Correct! +' + fmt(T.quickCheckBonus) : 'Not quite. Keep going!'); break;
      case 'results': stopTurnTimer(); break;
      default: break;
    }
  }

      const p = G.players[r.pid];
      const notes = r.notes.length ? '<details><summary>What happened (' + r.notes.length + ')</summary><ul class="msgs">' + r.notes.map(n => '<li>' + esc(n) + '</li>').join('') + '</ul></details>' : '';
      return '<div class="opt"><b style="font-size:18px">' + p.token + ' ' + esc(r.name) + '</b>' +
        '<table class="t"><tr><td>Income</td><td class="money-pos" data-roll="' + r.income + '">' + fmt(r.income) + '</td></tr><tr><td>Expenses</td><td class="money-neg" data-roll="' + r.expenses + '">' + fmt(r.expenses) + '</td></tr>' +
        '<tr><td><b>Net cash flow</b></td><td class="' + (r.cashFlow >= 0 ? 'money-pos' : 'money-neg') + '"><b data-roll="' + r.cashFlow + '">' + fmt(r.cashFlow) + '</b></td></tr>' +

        '<tr><td><b>Net worth</b></td><td><b>' + fmt(r.nw) + '</b> <small class="' + (r.nwChange >= 0 ? 'money-pos' : 'money-neg') + '">(' + (r.nwChange >= 0 ? '+' : '') + fmt(r.nwChange) + ')</small></td></tr></table>' + notes + '</div>';

      onOpen: () => { if (reduced()) return; $$('[data-roll]', body).forEach(el => { const to = +el.dataset.roll; const t0 = performance.now(); const tick = (t) => { const k = Math.min(1, (t - t0) / 900); el.textContent = fmt(to * k); if (k < 1) requestAnimationFrame(tick); }; requestAnimationFrame(tick); }); },

  /* =====================================================================
     TOOL PANELS: property, bank, trade, player, log, glossary, settings
     ===================================================================== */
  function actingPlayer() {
    const pd = G.pending; if (!pd) return null;
    if (['roll', 'audit', 'endTurn', 'debt', 'buy'].includes(pd.kind)) { const p = G.players[pd.player]; return p.cpu ? null : p; }
    return null;
  }
  function openDeed(id) {
    if (!G) return;
    const sp = SP[id]; if (!['lot', 'rail', 'utility'].includes(sp.type)) { openModal({ title: esc(sp.name), body: '<p>' + esc(spaceInfo(sp)) + '</p>', closable: true, buttons: [{ label: 'Close' }] }); return; }
    const body = document.createElement('div');
    const draw = () => {
      UI.seen = new Set();
      const me = actingPlayer(), d = G.spaces[id];
      let h = deedHTML(id);
      if (me && d.owner === me.id) {
        h += '<div class="row" style="margin-top:8px">';
        if (sp.type === 'lot') {
          const cb = E.canBuild(G, me, id);
          h += '<button type="button" class="primary" data-a="build" ' + (cb.ok ? '' : 'disabled') + '>Build ' + (d.level === 4 ? 'hotel' : 'house') + (cb.cost ? ' (' + fmt(cb.cost.total) + ')' : '') + '</button>';
          if (d.level > 0) h += '<button type="button" data-a="sell">Sell a building</button>';
          if (d.zoning !== 'C' && !d.variance && !d.historic) h += '<button type="button" data-a="variance">Apply for variance (' + fmt(T.varianceFee * (me.flags.varianceHalf ? 0.5 : 1)) + ', ' + pct(E.varianceChance(G, me, id), 0) + ' chance)</button>';
        }
        if (!d.mortgage) h += '<button type="button" data-a="mortgage">Mortgage (+' + fmt(E.lotPrice(G, id) * T.mortgagePct) + ')</button>';
        else h += '<button type="button" data-a="unmortgage">Unmortgage (-' + fmt(d.mortgage * T.unmortgagePct) + ')</button>';
        h += '<button type="button" class="small" data-a="why">Why?</button></div>';
        if (sp.type === 'lot' && !E.canBuild(G, me, id).ok) h += '<p class="realworld">' + esc(E.canBuild(G, me, id).why) + '</p>';
        h += '<div class="why hidden" id="dWhy">' + gloss('Building costs money now (plus a building permit) but raises rent a lot. Build evenly across the group. Residential lots can\'t have hotels unless a variance is approved; historic lots never can. A mortgage gives you 50% of the value now as cash, but you collect no rent until you pay it back plus 10%.') + '<div class="realworld"><b>Real world:</b> a real mortgage is a loan paid monthly with interest, and you keep using the property. This game simplifies it.</div></div>';
      }
      body.innerHTML = h;
      $$('[data-a]', body).forEach(b => b.onclick = () => { if (b.dataset.a === 'why') { $('#dWhy', body).classList.toggle('hidden'); return; } if (dispatch({ type: b.dataset.a, space: id, player: me.id })) setTimeout(draw, 60); });
    };
    draw();
    openModal({ title: esc(sp.name), body, closable: true, label: sp.name + ' deed', buttons: [{ label: 'Close' }] });
  }

  /* =====================================================================
     CHARTS (2D canvas, no libraries)
     ===================================================================== */
  function setupCanvas(cv, w, h) { const dpr = window.devicePixelRatio || 1; cv.width = w * dpr; cv.height = h * dpr; cv.style.width = w + 'px'; cv.style.height = h + 'px'; const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); return ctx; }
  function sparkline(cv, vals, color) {
    const w = cv.clientWidth || 80, h = 16; const ctx = setupCanvas(cv, w, h); if (vals.length < 2) return;
    const mn = Math.min(...vals), mx = Math.max(...vals), rg = mx - mn || 1;
    ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.beginPath();
    vals.forEach((v, i) => { const x = i / (vals.length - 1) * (w - 2) + 1, y = h - 2 - (v - mn) / rg * (h - 4); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.stroke();
  }
  function lineChart(cv, series, markers, w, h) {
    const ctx = setupCanvas(cv, w, h); const pad = { l: 64, r: 16, t: 20, b: 70 };
    const all = series.flatMap(s => s.pts.map(p => p.y)); let mn = Math.min(0, ...all), mx = Math.max(10, ...all); const rg = mx - mn || 1;
    const xs = series.flatMap(s => s.pts.map(p => p.x)); const xmin = Math.min(...xs, 0), xmax = Math.max(...xs, 1);
    const X = (x) => pad.l + (x - xmin) / (xmax - xmin || 1) * (w - pad.l - pad.r), Y = (y) => pad.t + (1 - (y - mn) / rg) * (h - pad.t - pad.b);
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.font = '12px sans-serif'; ctx.fillStyle = '#333'; ctx.strokeStyle = '#ddd'; ctx.lineWidth = 1;
    for (let i = 0; i <= 5; i++) { const v = mn + rg * i / 5; const y = Y(v); ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w - pad.r, y); ctx.stroke(); ctx.fillText(fmt(v), 4, y + 4); }
    for (let x = xmin; x <= xmax; x++) { ctx.fillText(x === 0 ? 'Start' : 'Y' + x, X(x) - 10, h - pad.b + 16); }
    if (mn < 0) { ctx.strokeStyle = '#999'; ctx.beginPath(); ctx.moveTo(pad.l, Y(0)); ctx.lineTo(w - pad.r, Y(0)); ctx.stroke(); }
    // markers
    const byYear = {}; markers.forEach(m => { (byYear[m.year] = byYear[m.year] || []).push(m.label); });
    Object.keys(byYear).forEach(yr => { const x = X(+yr - 0.5); ctx.strokeStyle = 'rgba(214,47,58,.5)'; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.moveTo(x, pad.t); ctx.lineTo(x, h - pad.b); ctx.stroke(); ctx.setLineDash([]);
      ctx.save(); ctx.translate(x + 3, h - pad.b + 24); ctx.rotate(Math.PI / 7); ctx.fillStyle = '#a11'; ctx.font = '10px sans-serif'; ctx.fillText(byYear[yr].join(' / ').slice(0, 42), 0, 0); ctx.restore(); });
    series.forEach(s => { ctx.strokeStyle = s.color; ctx.lineWidth = 3; ctx.setLineDash(s.dash || []); ctx.beginPath(); s.pts.forEach((p, i) => i ? ctx.lineTo(X(p.x), Y(p.y)) : ctx.moveTo(X(p.x), Y(p.y))); ctx.stroke(); ctx.setLineDash([]);
      s.pts.forEach(p => { ctx.fillStyle = s.color; ctx.beginPath(); ctx.arc(X(p.x), Y(p.y), 3.5, 0, 7); ctx.fill(); }); });
    let lx = pad.l; series.forEach(s => { ctx.fillStyle = s.color; ctx.fillRect(lx, 4, 12, 12); ctx.fillStyle = '#222'; ctx.font = 'bold 12px sans-serif'; ctx.fillText(s.name, lx + 16, 14); lx += ctx.measureText(s.name).width + 36; });
  }
  function stackedBars(cv, rows, w, h) {
    const ctx = setupCanvas(cv, w, h); const pad = { l: 64, r: 10, t: 30, b: 36 };
    const keys = [['cash', '#2a9d55', 'Cash'], ['savingsInv', '#1d7fd8', 'Savings & investments'], ['equity', '#f4a300', 'Real estate']];
    const pos = rows.map(r => keys.reduce((a, k) => a + Math.max(0, r[k[0]]), 0)); const mx = Math.max(10, ...pos), mn = -Math.max(0, ...rows.map(r => r.debt + Math.max(0, -r.cash)));
    const rg = mx - mn || 1; const Y = (v) => pad.t + (1 - (v - mn) / rg) * (h - pad.t - pad.b);
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.font = '12px sans-serif';
    for (let i = 0; i <= 4; i++) { const v = mn + rg * i / 4; ctx.strokeStyle = '#eee'; ctx.beginPath(); ctx.moveTo(pad.l, Y(v)); ctx.lineTo(w - pad.r, Y(v)); ctx.stroke(); ctx.fillStyle = '#333'; ctx.fillText(fmt(v), 4, Y(v) + 4); }
    const bw = Math.min(90, (w - pad.l - pad.r) / rows.length * 0.6);
    rows.forEach((r, i) => {
      const x = pad.l + (i + 0.5) * (w - pad.l - pad.r) / rows.length - bw / 2; let base = 0;
      keys.forEach(([k, c]) => { const v = Math.max(0, r[k]); ctx.fillStyle = c; ctx.fillRect(x, Y(base + v), bw, Y(base) - Y(base + v)); base += v; });
      const debt = r.debt + Math.max(0, -r.cash); ctx.fillStyle = '#d62f3a'; ctx.fillRect(x, Y(0), bw, Y(-debt) - Y(0));
      ctx.fillStyle = '#222'; ctx.font = 'bold 13px sans-serif'; ctx.fillText(r.name.slice(0, 12), x, h - 14);
    });
    let lx = pad.l; keys.concat([['debt', '#d62f3a', 'Debt']]).forEach(([k, c, l]) => { ctx.fillStyle = c; ctx.fillRect(lx, 8, 12, 12); ctx.fillStyle = '#222'; ctx.fillText(l, lx + 16, 18); lx += ctx.measureText(l).width + 36; });
  }

    $('#game').classList.remove('hidden'); $('#ticker').classList.remove('hidden');
    buildBoard(); render(); save(true);
    if (resumed) toast('Welcome back, ' + G.groupName + '! Resuming Year ' + Math.max(1, G.flow.year) + '.');
    handlePending();
  }

  /* ---------- results ---------- */
  function showResults() {
    stopTurnTimer();
    UI.modals.slice().forEach(m => m.close(null));
    $('#game').classList.add('hidden'); $('#ticker').classList.add('hidden');
    const R = E.results(G);
    const byId = (id) => R.players.find(p => p.id === id);
    const order = R.rank.map(byId);
    const pod = [order[1], order[0], order[2]].filter(Boolean);
    const maxNW = Math.max(1, ...order.map(p => Math.abs(p.nw)));
    const humans = R.players.filter(p => !p.cpu);
    const el = screen('<div class="row noprint"><h1 class="grow">🏆 Final Results: ' + esc(G.groupName) + '</h1><button type="button" id="rsCopy">📋 Copy for Google Classroom/Canvas</button><button type="button" id="rsCsv">⬇ Download Game Log (CSV)</button><button type="button" id="rsPrint">🖨 Print / Save as PDF</button><button type="button" id="rsDeb">📋 Debrief Guide</button><button type="button" class="primary" id="rsAgain">🔁 Play Again</button><button type="button" id="rsMenu">Menu</button></div>' +
      '<h1 class="hidden" style="display:none">Final Results</h1><p>' + (R.ended ? 'The teacher ended the game in Year ' + R.years + '. ' : 'All ' + R.of + ' Years played. ') + 'The winner has the highest <b>net worth</b> = cash + savings + investments + market value of property and buildings − all debt.</p>' +
      '<div class="podium" aria-label="Podium">' + pod.map(p => { const place = R.rank.indexOf(p.id) + 1; return '<div class="pod"><div class="tk">' + p.token + '</div><b>' + esc(p.name) + '</b><div>' + fmt(p.nw) + '</div><div class="blk" style="height:' + (place === 1 ? 170 : place === 2 ? 125 : 90) + 'px;background:' + (place === 1 ? '#ffcc29' : place === 2 ? '#d9dee3' : '#e3a46b') + '">' + place + '</div></div>'; }).join('') + '</div>' +
      (order.length > 3 ? '<p style="text-align:center">' + order.slice(3).map((p, i) => (i + 4) + '. ' + p.token + ' ' + esc(p.name) + ' ' + fmt(p.nw)).join(' · ') + '</p>' : '') +
      '<div class="resCard"><h2>🏅 Awards</h2>' + (R.awards.map(a => '<span class="award" title="' + esc(a.desc) + '">' + a.icon + ' ' + esc(a.title) + ': ' + a.winners.map(w => esc(byId(w).name)).join(' & ') + '</span>').join('') || 'No awards this time.') + '</div>' +
      '<div class="resCard"><h2>📈 Net worth over time</h2><canvas id="rsLine"></canvas><h2>🧱 What each player has</h2><canvas id="rsBar"></canvas></div>' +
      order.map(p => playerResultCard(p, R)).join('') +
      '<div class="resCard"><h2>🎓 The long-run career tradeoff</h2>' + careerTradeoff(R) + '</div>' +
      (G.settings.prePost && humans.length ? '<div class="resCard noprint"><h2>📝 Post-check</h2><p>Take the same 5 questions as the pre-check to see what you learned.</p><button type="button" class="primary" id="rsPost">Start Post-check</button></div>' : ''));
    
    if (!reduced()) { confetti(); Snd.play('fanfare'); }
    const w = Math.min(1060, el.querySelector('.inner').clientWidth - 30);
    lineChart($('#rsLine', el), R.players.map(p => ({ name: p.name, color: pColor(p.id), pts: p.yearly.map(y => ({ x: y.year, y: y.nw })) })), R.markers, w, 340);
    stackedBars($('#rsBar', el), R.players, w, 280);
    $$('textarea[data-ref]', el).forEach(t => t.onchange = () => { const [pid, key] = t.dataset.ref.split('|'); dispatch({ type: 'reflect', player: +pid, key, text: t.value }); });
    $('#rsCopy', el).onclick = () => copyText(classroomText(R));
    $('#rsCsv', el).onclick = () => download(G.groupName.replace(/[^a-z0-9]+/gi, '_') + '_game_log.csv', E.csv(G), 'text/csv;charset=utf-8');
    $('#rsPrint', el).onclick = () => window.print();
    $('#rsDeb', el).onclick = () => openDebrief();
    $('#rsAgain', el).onclick = () => { const keep = G; G = null; showSetupFrom(keep); };
    $('#rsMenu', el).onclick = () => { G = null; showStart(); };
    const post = $('#rsPost', el); if (post) post.onclick = () => runCheck('post', G.players.map(p => ({ i: p.id, name: p.name, cpu: p.cpu })), (ans) => { Object.keys(ans).forEach(i => dispatch({ type: 'postcheck', player: +i, answers: ans[i] })); setTimeout(showResults, 100); });
  }
  function playerResultCard(p, R) {
    const st = p.stats, D = C.DIFFICULTY[G.settings.difficulty];
    const pre = checkScore(p.checks.pre), post = checkScore(p.checks.post);
    return '<div class="resCard"><h2>' + p.token + ' ' + esc(p.name) + ' · ' + fmt(p.nw) + (p.cpu ? ' <span class="pill">CPU · ' + esc(E.STRAT_LABEL[p.strategy] || '') + '</span>' : '') + '</h2>' +
      '<div class="statgrid">' +
      '<div>Career path<b>' + esc(p.careerLabel) + '</b></div><div>Home<b>' + (p.homeStart === p.homeEnd ? (p.homeEnd === 'own' ? 'Bought' : 'Rented') : (p.homeStart === 'own' ? 'Bought → Rented' : 'Rented → Bought')) + '</b></div>' +
      '<div>Interest paid<b>' + fmt(st.interestPaid) + '</b></div><div>Taxes paid<b>' + fmt(st.taxesPaid) + '</b></div><div>Rent collected<b>' + fmt(st.rentCollected) + '</b></div><div>Interest earned<b>' + fmt(st.interestEarned) + '</b></div>' +
      '<div>Insurance saved you<b>' + fmt(st.insuranceSaved) + '</b></div>' + (D.credit ? '<div>Credit score<b>' + p.creditStart + ' → ' + p.credit + '</b></div>' : '') + '<div>Debt at end<b>' + fmt(p.debt) + '</b></div><div>Properties<b>' + p.lots + '</b></div>' +
      (p.bankrupt ? '<div>Fresh start<b>' + (p.bk.type === 'ch7' ? 'Liquidation' : 'Repayment plan') + ' (Year ' + p.bk.year + ')</b></div>' : '') +
      (pre != null || post != null ? '<div>Pre → Post check<b>' + (pre != null ? pre : '–') + '/5 → ' + (post != null ? post : '–') + '/5</b></div>' : '') + '</div>' +
      (p.best ? '<p>⭐ <b>Best decision (Year ' + p.best.year + '):</b> ' + esc(p.best.text) + '</p>' : '') + (p.worst ? '<p>🤔 <b>Toughest decision (Year ' + p.worst.year + '):</b> ' + esc(p.worst.text) + '</p>' : '') +
      (!p.cpu ? '<h3>Reflect</h3>' + p.reflectPrompts.map(q => '<label style="display:block;margin:6px 0"><b>' + esc(q.q) + '</b><textarea data-ref="' + p.id + '|' + q.key + '" aria-label="' + esc(q.q) + '">' + esc((p.reflections || {})[q.key] || '') + '</textarea></label>').join('') : '') + '</div>';
  }
  function careerTradeoff(R) {
    const rows = Object.keys(C.CAREERS).map(k => { const c = C.CAREERS[k]; let tot = 0, sal = c.salary; const yrs = [];
      for (let y = 1; y <= 40; y++) { const pay = (k === 'college' && y <= 4) ? 0 : (k === 'trade' && y === 1) ? c.firstYearSalary : sal; tot += pay; if (y > (k === 'college' ? 4 : 1)) sal *= 1 + c.raise; if (y === 10 || y === 25 || y === 40) yrs.push(Math.round(tot - c.loan)); }
      return '<tr><td>' + c.icon + ' ' + c.label + '</td>' + yrs.map(v => '<td>' + fmt(v) + '</td>').join('') + '<td>' + R.players.filter(p => p.career === k).map(p => esc(p.name)).join(', ') + '</td></tr>'; }).join('');
    return '<p>The game lasts only ' + G.settings.years + ' Years. Here is what the same game salaries add up to over a 40-year career (minus student loans, in game dollars). In the game, college students spend Year 1 in school; in real life, it\'s about 4 years.</p><table class="t"><tr><th>Path</th><th>After 10 yrs</th><th>After 25 yrs</th><th>After 40 yrs</th><th>Chosen by</th></tr>' + rows + '</table>' +
      '<p class="realworld"><b>Real world:</b> in 2023, median weekly earnings were about $899 with a high school diploma, $1,058 with an associate degree, and $1,493 with a bachelor\'s degree (U.S. Bureau of Labor Statistics). Many skilled trades pay well above the high school median. Averages hide big differences between jobs and people.</p>';
  }
  function classroomText(R) {
    const lines = ['DEED & DEBT results: ' + G.groupName + ' (' + new Date().toLocaleDateString() + ')', 'Years played: ' + R.years + ' of ' + R.of, ''];
    R.rank.forEach((id, i) => { const p = R.players.find(x => x.id === id); if (p.cpu) return;
      lines.push((i + 1) + '. ' + p.name + ': net worth ' + fmt(p.nw));
      lines.push('   Career: ' + p.careerLabel + ' | Home: ' + (p.homeEnd === 'own' ? 'owned' : 'rented') + ' | Credit: ' + p.creditStart + ' -> ' + p.credit);
      lines.push('   Interest paid ' + fmt(p.stats.interestPaid) + ' | Taxes paid ' + fmt(p.stats.taxesPaid) + ' | Rent collected ' + fmt(p.stats.rentCollected) + ' | Interest earned ' + fmt(p.stats.interestEarned) + ' | Insurance saved ' + fmt(p.stats.insuranceSaved));
      const pre = checkScore(p.checks.pre), post = checkScore(p.checks.post); if (pre != null || post != null) lines.push('   Pre-check ' + (pre != null ? pre : '-') + '/5, Post-check ' + (post != null ? post : '-') + '/5');
      const aw = R.awards.filter(a => a.winners.includes(p.id)).map(a => a.title); if (aw.length) lines.push('   Awards: ' + aw.join(', '));
      if (p.best) lines.push('   Best decision: ' + p.best.text);
      if (p.worst) lines.push('   Toughest decision: ' + p.worst.text);
      p.reflectPrompts.forEach(q => { lines.push('   Q: ' + q.q); lines.push('   A: ' + ((p.reflections || {})[q.key] || '(no answer)')); });
      lines.push(''); });
    return lines.join('\n');
  }
  function copyText(txt) {
    const ok = () => toast('Copied! Paste it into Google Classroom or Canvas.');
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(ok, () => fallback());
    else fallback();
    function fallback() { const t = document.createElement('textarea'); t.value = txt; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); ok(); } catch (e) { openModal({ title: 'Copy this text', body: '<textarea style="min-height:300px">' + esc(txt) + '</textarea>', closable: true, buttons: [{ label: 'Close' }] }); } t.remove(); }
  }
  function download(name, text, type) {
    const blob = new Blob([text], { type }); const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast('Downloaded ' + name);
  }
  function showSetupFrom(old) { const hs = old.players.filter(p => !p.cpu); if (hs.length === 1) { showSetup('solo', { name: hs[0].name, token: hs[0].token }); return; } showSetup('group'); setTimeout(() => { const n = $('#sgName'); if (n) { n.value = old.groupName + ' 2'; n.dispatchEvent(new Event('input')); } }, 20); }

  /* ---------- debrief guide ---------- */
  function openDebrief(general) {
    const g = !general && G ? G : null;
    let h = '<p>Use these questions to lead a 5-minute class discussion.</p>';
    if (g) {
      h += '<h3>About this game: ' + esc(g.groupName) + '</h3><ol>';
      const evs = g.log.filter(l => l.type === 'event');
      evs.forEach(l => { const ev = C.EVENTS.find(e => e.title === l.text); if (!ev) return; h += '<li>Year ' + l.y + ': <b>' + esc(ev.title) + '</b>' + (l.p ? ' (' + esc(l.p) + ')' : '') + '. Who was helped and who was hurt? What does it show about <i>' + esc(ev.vocab) + '</i>?</li>'; });
      g.ballots.results.forEach(b => { const m = E.ballotById(b.id); h += '<li>Year ' + b.year + ': <b>' + esc(b.title) + '</b> ' + (b.passed ? 'passed' : 'failed') + ' ' + b.yes + '-' + b.no + '. Who pays and who benefits? Did people vote their own interest or the town\'s?' + (m ? ' (' + esc(m.vocab) + ')' : '') + '</li>'; });
      const bk = g.players.filter(p => p.stats.bankruptcies); if (bk.length) h += '<li>' + bk.map(p => esc(p.name)).join(', ') + ' needed a fresh start. What warning signs came first? What could have prevented it?</li>';
      const ins = g.players.filter(p => p.stats.insuranceSaved > 0); if (ins.length) h += '<li>Insurance saved ' + ins.map(p => esc(p.name) + ' ' + fmt(p.stats.insuranceSaved)).join(', ') + '. Was the premium worth it?</li>';
      if (g.flow.stage === 'results') { const R = E.results(g); const w = R.players.find(p => p.id === R.rank[0]); h += '<li>' + esc(w.name) + ' won with ' + fmt(w.nw) + ' (' + esc(w.careerLabel) + ', ' + (w.homeEnd === 'own' ? 'homeowner' : 'renter') + '). What choices made the difference?</li>'; }
      h += '</ol>';
    }
    h += '<h3>General questions</h3><ol>' + C.DEBRIEF_GENERAL.map(q => '<li>' + esc(q) + '</li>').join('') + '</ol>';
    openModal({ title: '📋 Teacher Debrief Guide', body: '<div id="debriefBody">' + h + '</div>', wide: true, closable: true, label: 'Debrief guide', buttons: [{ label: '🖨 Print', onClick: () => printHTML('Teacher Debrief Guide', $('#debriefBody').innerHTML), keepOpen: true }, { label: 'Close', cls: 'primary' }] });
  }
  function printHTML(title, html) {
    const s = $('#screens'); const prev = s.innerHTML; const gHidden = $('#game').classList.contains('hidden');
    s.innerHTML = '<div class="screen"><div class="inner"><h1>' + esc(title) + '</h1>' + html + '</div></div>';
    $('#game').classList.add('hidden'); $('#modalRoot').classList.add('hidden');
    setTimeout(() => { window.print(); s.innerHTML = prev; if (!gHidden) $('#game').classList.remove('hidden'); $('#modalRoot').classList.remove('hidden'); if (G && G.flow.stage === 'results') showResults(); else if (!G) showStart(); }, 50);
  }

  /* ---------- boot ---------- */
  applyAnim();
  IDB.open().then(() => IDB.all()).then(list => { idbCache = list; if (!G) showStart(); });
  // test hooks (used by automated checks; harmless for students)
  window.__DD = { get G() { return G; }, dispatch, E, UI, startGame, showResults, exitToMenu, save, listSaves, fx: (f) => { UI.fxq.push(f); pump(); } };
})();
</script>
</body></html>
