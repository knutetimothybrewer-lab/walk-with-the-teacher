<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Health Analyst Training: Three Zones</title>
<meta name="description" content="An animated, interactive Health class walkthrough: health metrics, healthy lifestyle, and the health care system.">
<meta name="color-scheme" content="dark">
<!-- Fonts are optional. Delete these three lines for a fully offline file; the fallback stacks below still look fine. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   STYLES  — tokens, layout, components, per-zone palettes, motion
   ===================================================================== */
:root{
  --bg:#080d1c; --bg2:#0d1428; --panel:#111a33; --panel2:#17234a; --line:rgba(255,255,255,.12);
  --ink:#eef3ff; --muted:#a9b8da; --ok:#4ade80; --bad:#fb7185; --info:#7dd3fc;
  --accent:#2dd4bf; --accent-ink:#03211d; --accent-soft:rgba(45,212,191,.15);
  --f-d:'Bricolage Grotesque','Trebuchet MS','Segoe UI',system-ui,sans-serif;
  --f-b:'Figtree','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  --r:18px; --hud:78px;
}
body[data-z="1"]{--accent:#2dd4bf;--accent-ink:#03211d;--accent-soft:rgba(45,212,191,.15)}
body[data-z="2"]{--accent:#fbbf24;--accent-ink:#2a1c00;--accent-soft:rgba(251,191,36,.15)}
body[data-z="3"]{--accent:#a5b4fc;--accent-ink:#0c1040;--accent-soft:rgba(165,180,252,.17)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 17px/1.6 var(--f-b);min-height:100vh;overflow-x:hidden;
  background-image:radial-gradient(1200px 600px at 10% -10%,rgba(45,212,191,.10),transparent 60%),radial-gradient(900px 600px at 100% 10%,rgba(165,180,252,.10),transparent 60%),radial-gradient(900px 700px at 40% 120%,rgba(251,191,36,.07),transparent 60%);
  background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:44px 44px;
  mask-image:radial-gradient(ellipse at 50% 20%,#000 20%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at 50% 20%,#000 20%,transparent 75%)}
h1,h2,h3,h4{font-family:var(--f-d);line-height:1.12;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:clamp(2rem,6vw,3.6rem);font-weight:800}
h2{font-size:clamp(1.5rem,4vw,2.2rem);font-weight:800}
h3{font-size:1.25rem;font-weight:700}
p{margin:0 0 .8em}
a{color:var(--accent)}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;background:#fff;color:#000;padding:10px 14px;border-radius:10px;z-index:100;font-weight:700}
.skip:focus{top:8px}
:focus-visible{outline:3px solid #fff;outline-offset:3px;border-radius:8px;box-shadow:0 0 0 6px var(--accent)}
button{font:inherit;color:inherit}

/* ---- HUD ---- */
#hud{position:sticky;top:0;z-index:50;background:rgba(8,13,28,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hud-in{max-width:1100px;margin:0 auto;padding:8px 16px 0;display:flex;align-items:center;gap:12px;min-height:56px}
.brand{font:800 1.05rem var(--f-d);display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand b{color:var(--accent)}
.zones{display:flex;gap:6px;flex:1;justify-content:center;min-width:0}
.zp{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 8px;border-radius:12px;border:1px solid transparent;min-width:0;opacity:.55;transition:opacity .4s,background .4s,border-color .4s}
.zp.on{opacity:1;background:var(--accent-soft);border-color:var(--zc)}
.zp.done{opacity:1}
.zp .zl{font:700 .72rem var(--f-b);white-space:nowrap;display:flex;gap:5px;align-items:center}
.zp .zl .bd{filter:grayscale(1);opacity:.4;transition:filter .5s,opacity .5s,transform .5s}
.zp.done .zl .bd{filter:none;opacity:1;animation:pop .7s}
.dots{display:flex;gap:4px}
.dot{width:9px;height:9px;border-radius:50%;border:2px solid var(--zc);background:transparent;transition:background .4s,transform .4s}
.dot.cur{transform:scale(1.35);box-shadow:0 0 0 3px rgba(255,255,255,.2)}
.dot.fin{background:var(--zc)}
.tools{display:flex;gap:6px}
.tbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:1.1rem;display:grid;place-items:center}
.tbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
#bar{height:5px;background:rgba(255,255,255,.08);margin-top:8px}
#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2dd4bf,#fbbf24,#a5b4fc);transition:width .8s cubic-bezier(.2,.8,.2,1);border-radius:0 4px 4px 0}
@media(max-width:620px){.zp .zl span.t{display:none}.brand span.bt{display:none}.zp{padding:4px 6px}}

/* ---- screens ---- */
main{outline:0}
#screen{max-width:920px;margin:0 auto;padding:22px 16px 90px}
.scr-in{animation:scrIn .6s cubic-bezier(.2,.8,.2,1) both}
.scr-out{animation:scrOut .3s ease both}
@keyframes scrIn{from{opacity:0;transform:translateY(24px) scale(.985)}to{opacity:1;transform:none}}
@keyframes scrOut{to{opacity:0;transform:translateY(-14px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes ringOut{from{transform:scale(.6);opacity:.7}to{transform:scale(2.1);opacity:0}}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.16)}24%{transform:scale(.97)}36%{transform:scale(1.09)}50%{transform:scale(1)}}
@keyframes dash{to{stroke-dashoffset:0}}
@keyframes blink{50%{opacity:.25}}
@keyframes slideBg{to{background-position:200% 0}}
@keyframes ecgmove{to{transform:translateX(-70px)}}
@keyframes breathe2{0%,100%{transform:scale(.88)}50%{transform:scale(1.12)}}
@keyframes sigdash{to{stroke-dashoffset:-12}}
.rv{opacity:0;animation:fadeUp .6s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i,0)*90ms)}
.shake{animation:shake .45s}

/* ---- buttons / cards ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 22px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font:800 1rem var(--f-b);cursor:pointer;transition:transform .15s,box-shadow .25s,filter .2s;box-shadow:0 6px 24px -8px var(--accent)}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 12px 28px -8px var(--accent)}
.btn:active:not(:disabled){transform:translateY(0)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:hover:not(:disabled){border-color:var(--accent);box-shadow:none}
.btn.sm{min-height:44px;padding:8px 14px;font-size:.92rem}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r);padding:20px;margin:18px 0;box-shadow:0 18px 40px -24px #000}
.card>h3:first-child{display:flex;align-items:center;gap:10px}
.tag{display:inline-flex;align-items:center;gap:6px;font:700 .78rem var(--f-b);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent);padding:3px 10px;border-radius:99px}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.reveal{animation:scrIn .6s cubic-bezier(.2,.8,.2,1) both}

/* ---- welcome ---- */
.hero-w{text-align:center;padding-top:10px}
.hero-w h1 span{background:linear-gradient(90deg,#2dd4bf,#fbbf24,#a5b4fc);-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% 100%;animation:slideBg 6s linear infinite}
.ecg{width:min(520px,90%);height:80px;margin:6px auto 0;display:block}
.ecg path{stroke-dasharray:900;stroke-dashoffset:900;animation:dash 2.4s ease forwards,blink 3s 2.4s infinite}
.heartsvg{width:84px;height:84px;animation:beat 1.1s infinite;filter:drop-shadow(0 0 18px rgba(251,113,133,.6))}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}
.rule{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.rule>b{display:block;font:800 1.9rem var(--f-d);color:var(--accent)}
.rule span{font-size:.88rem;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px;margin:14px 0}
.field label{font-weight:700}
input[type=text],input[type=number],select{min-height:48px;padding:10px 14px;border-radius:12px;border:1.5px solid rgba(255,255,255,.3);background:#0a1126;color:var(--ink);font:600 1.05rem var(--f-b);width:100%}
input[type=text]:focus,input[type=number]:focus,select:focus{border-color:var(--accent)}
.err{color:#fda4af;font-weight:700;min-height:1.4em}
details{margin-top:14px}
details summary{cursor:pointer;min-height:44px;display:flex;align-items:center;color:var(--muted);font-weight:600}
.privacy{display:flex;gap:10px;align-items:flex-start;background:rgba(74,222,128,.08);border:1px solid rgba(74,222,128,.35);padding:12px 14px;border-radius:12px;font-size:.93rem}

/* ---- zone map ---- */
.map{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;margin:22px 0 10px;position:relative}
.mnode{position:relative;text-align:center;padding:0 6px}
.mnode .disc{width:84px;height:84px;margin:0 auto;border-radius:50%;display:grid;place-items:center;font-size:2.2rem;background:var(--panel);border:3px solid var(--zc);position:relative;transition:transform .5s}
.mnode.lock .disc{border-style:dashed;filter:grayscale(.8);opacity:.6}
.mnode.cur .disc{background:var(--accent-soft);box-shadow:0 0 0 0 var(--zc);animation:pulseDisc 2s infinite}
.mnode.done .disc{background:var(--zc);color:#000}
@keyframes pulseDisc{0%{box-shadow:0 0 0 0 rgba(255,255,255,.35)}100%{box-shadow:0 0 0 22px rgba(255,255,255,0)}}
.mnode .nm{font:800 .95rem var(--f-d);margin-top:8px}
.mnode .st{font-size:.8rem;color:var(--muted)}
.mnode:not(:last-child)::after{content:"";position:absolute;top:41px;left:calc(50% + 50px);width:calc(100% - 100px);height:4px;border-radius:4px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.25) 0 8px,transparent 8px 14px)}
.mnode.done:not(:last-child)::after{background:var(--zc)}
.avatar{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:1.6rem;animation:float 2.4s infinite}
@media(max-width:560px){.mnode .disc{width:64px;height:64px;font-size:1.6rem}.mnode:not(:last-child)::after{top:31px;left:calc(50% + 38px);width:calc(100% - 76px)}}

/* ---- station hero ---- */
.st-hero{display:flex;align-items:center;gap:20px;margin-top:6px}
.orb{position:relative;flex:none;width:96px;height:96px;display:grid;place-items:center;font-size:2.8rem}
.orb i{position:absolute;inset:0;border-radius:50%;border:2px solid var(--accent);animation:ringOut 2.6s infinite}
.orb i:nth-child(2){animation-delay:1.3s}
.orb .emo{position:relative;z-index:1;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);border:2px solid var(--accent);animation:float 3s infinite}
.st-hero h2{margin:4px 0 2px}
.st-hero .w{display:inline-block;opacity:0;animation:fadeUp .6s forwards;margin-right:.28em}
.read p.line{opacity:0;animation:fadeUp .6s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*420ms + 300ms);padding-left:14px;border-left:3px solid var(--accent-soft);margin-bottom:.9em}
.read.seen p.line{border-left-color:var(--accent)}
.term{all:unset;cursor:pointer;color:var(--accent);border-bottom:2px dotted var(--accent);font-weight:700;padding:2px 1px;min-height:24px}
.term:focus-visible{outline:3px solid #fff;box-shadow:0 0 0 6px var(--accent)}
#tip{position:absolute;z-index:80;max-width:min(320px,calc(100vw - 24px));background:#fff;color:#0b1020;border-radius:14px;padding:12px 14px;font-size:.95rem;font-weight:600;box-shadow:0 18px 40px -10px #000;animation:scrIn .25s both}
#tip b{display:block;font-family:var(--f-d);margin-bottom:2px}
.support{border:2px solid #7dd3fc;background:rgba(125,211,252,.1);border-radius:14px;padding:14px 16px;margin:14px 0}
.support b{color:#bae6fd}
.steps-left{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 12px}
.chk{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1.5px solid var(--line);border-radius:99px;font-weight:700;font-size:.85rem}
.chk.on{border-color:var(--ok);color:var(--ok)}

/* ---- sliders / meters ---- */
.ctl{display:grid;grid-template-columns:auto 1fr auto;gap:10px 14px;align-items:center;margin:10px 0}
.ctl label{font-weight:700}
.ctl output{font:800 1.1rem var(--f-d);min-width:84px;text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:99px;background:linear-gradient(90deg,var(--accent) var(--p,50%),rgba(255,255,255,.18) var(--p,50%))}
input[type=range]::-moz-range-track{height:10px;border-radius:99px;background:rgba(255,255,255,.18)}
input[type=range]::-moz-range-progress{height:10px;border-radius:99px;background:var(--accent)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:#fff;border:4px solid var(--accent);margin-top:-10px;box-shadow:0 2px 10px #000}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:4px solid var(--accent)}
@media(max-width:520px){.ctl{grid-template-columns:1fr auto}.ctl input{grid-column:1/-1;order:3}}
.big{font:800 clamp(2.4rem,9vw,3.6rem)/1 var(--f-d)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:center}
@media(max-width:700px){.row2{grid-template-columns:1fr}}
.pill-row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.pill{min-height:44px;padding:8px 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--panel);cursor:pointer;font-weight:700;transition:background .2s,border-color .2s,transform .15s}
.pill:hover{transform:translateY(-2px)}
.pill[aria-pressed="true"],.pill[aria-selected="true"]{background:var(--accent-soft);border-color:var(--accent)}
.scale{position:relative;height:30px;border-radius:99px;overflow:visible;display:flex;margin:30px 0 40px}
.scale .sg{height:100%;display:grid;place-items:center;font-size:.7rem;font-weight:800;color:#001;white-space:nowrap;overflow:visible;position:relative}
.scale .sg:first-child{border-radius:99px 0 0 99px}.scale .sg:last-child{border-radius:0 99px 99px 0}
.scale .sg em{position:absolute;top:34px;font-style:normal;color:var(--muted);font-weight:700;font-size:.74rem;text-align:center;line-height:1.1;width:100%}
.scale .mk{position:absolute;top:-14px;width:0;transition:left .5s cubic-bezier(.3,1.4,.5,1)}
.scale .mk::before{content:"";position:absolute;left:-9px;top:0;border:9px solid transparent;border-top:14px solid #fff;filter:drop-shadow(0 2px 3px #000)}
.scale .mk::after{content:"";position:absolute;left:-1.5px;top:12px;width:3px;height:44px;background:#fff;border-radius:2px;top:14px;height:30px}
.verdict{display:flex;gap:10px;align-items:center;font:800 1.15rem var(--f-d);padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--line);margin-top:8px;min-height:56px}
.meter{margin:8px 0}
.meter .ml{display:flex;justify-content:space-between;font-weight:700;font-size:.92rem}
.meter .mb{height:14px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:3px}
.meter .mb i{display:block;height:100%;width:0;border-radius:99px;background:repeating-linear-gradient(135deg,var(--accent) 0 10px,color-mix(in srgb,var(--accent) 70%,#fff) 10px 20px);transition:width .7s cubic-bezier(.2,.8,.2,1)}
.delta{font-size:.8rem;margin-left:6px}

/* ---- CFU ---- */
.cfu{border-color:rgba(255,255,255,.18)}
.cfu.solved{border-color:rgba(74,222,128,.55)}
.qhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;align-items:center;margin-bottom:10px}
.pips{display:flex;gap:6px;align-items:center}
.pip{width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font-size:.7rem;font-weight:900;transition:all .3s}
.pip.cur{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-soft)}
.pip.used{border-color:var(--bad);color:var(--bad)}
.pip.win{border-color:var(--ok);background:var(--ok);color:#022}
.credit{font-weight:800;font-size:.88rem;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid var(--line)}
.prompt{font-weight:700;font-size:1.08rem}
.opts{display:grid;gap:10px;margin:12px 0}
label.opt{display:flex;gap:12px;align-items:flex-start;min-height:52px;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:rgba(255,255,255,.03);cursor:pointer;transition:border-color .2s,background .2s,transform .15s}
label.opt:hover{border-color:var(--accent);transform:translateX(3px)}
label.opt input{position:absolute;opacity:0;width:1px;height:1px}
label.opt .mark{flex:none;width:24px;height:24px;margin-top:1px;border:2px solid var(--muted);border-radius:50%;display:grid;place-items:center;font-size:.9rem;font-weight:900}
.multi label.opt .mark{border-radius:7px}
label.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
label.opt:has(input:checked) .mark{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
label.opt:has(input:checked) .mark::after{content:"✓"}
label.opt:has(input:focus-visible){outline:3px solid #fff;box-shadow:0 0 0 6px var(--accent)}
label.opt.x{opacity:.62;border-style:dashed;border-color:var(--bad);text-decoration:line-through;cursor:not-allowed}
label.opt.x .mark{border-color:var(--bad);background:transparent;color:var(--bad)}
label.opt.x .mark::after{content:"✕"}
label.opt.good{border-color:var(--ok);background:rgba(74,222,128,.12)}
label.opt.good .mark{background:var(--ok);border-color:var(--ok);color:#022}
label.opt.good .mark::after{content:"✓"}
label.opt.bad{border-color:var(--bad)}
label.opt.bad .mark{border-color:var(--bad);color:var(--bad)}
label.opt.bad .mark::after{content:"✕"}
.otxt{flex:1}
.fb{margin-top:12px;border-radius:14px;padding:12px 14px;border:1.5px solid var(--line);animation:fadeUp .4s both}
.fb h4{display:flex;gap:8px;align-items:center;margin:0 0 4px;font-size:1rem}
.fb.bad{border-color:var(--bad);background:rgba(251,113,133,.09)}
.fb.ok{border-color:var(--ok);background:rgba(74,222,128,.09)}
.fb.info{border-color:var(--info);background:rgba(125,211,252,.08)}
.fb p{margin:0}
.qactions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
.badge-pop{display:inline-block;animation:pop .6s}
/* sort */
.tray,.bin{border:2px dashed var(--line);border-radius:14px;padding:10px;min-height:64px;transition:border-color .2s,background .2s}
.tray{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;background:rgba(255,255,255,.03)}
.tray:empty::after{content:"All cards placed";color:var(--muted);font-size:.9rem;padding:8px}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.bin.over,.tray.over{border-color:var(--accent);background:var(--accent-soft)}
.bin .bh{width:100%;min-height:44px;text-align:left;background:none;border:0;font:800 1rem var(--f-d);cursor:pointer;padding:2px 4px;color:var(--ink)}
.bin .bh small{display:block;font:600 .75rem var(--f-b);color:var(--muted)}
.bin .bi{display:flex;flex-direction:column;gap:6px;margin-top:4px;min-height:20px}

<header id="hud">
  <div class="hud-in">

<noscript><p style="padding:20px">This module needs JavaScript. Please enable it and reload.</p></noscript>
<script>
'use strict';
/* =====================================================================
   SECTION 1 — CONTENT & QUESTION DATA  (edit this section to change the lesson)
   ---------------------------------------------------------------------
   • Each ZONE has stations[]. Each station has:
       read[]        3–6 short sentences (use {{term|definition}} for tap-to-define words)
       interactive   name of an interactive in SECTION 4 (INT.*)
       need          how many distinct "explore" actions unlock the questions
       cfu[]         1–2 question BUILDERS:  R => ({...question...})
   • Builders receive R (a random helper) so numbers differ for every student.
   • Question types: mcq | scenario | multi | sort | match | order | numeric | hotspot
       common fields:  prompt, hints[3] (hint, stronger hint, worked explanation), why
       mcq/scenario/multi: options[], correct (index, or array of indices for multi), optWhy[] (optional)
       sort:    bins[], items[{t, bin}]            match: pairs[[left,right],…]
       order:   items[] listed in the CORRECT order
       numeric: answer, tol, unit, slider{min,max,step} (optional)
       hotspot: html (elements with data-hot="id" data-label="…"), correct "id"
   • Every question is worth the same (POINTS_PER_Q). Total possible is computed automatically.
   ===================================================================== */
const POINTS_PER_Q = 10;
const CREDIT = [1, 0.75, 0.5];                       // attempt 1, 2, 3+ (floor at 50%)
const creditFor = n => CREDIT[Math.min(Math.max(n, 1), 3) - 1];

/* ---------- small helpers used inside question builders ---------- */
const ft = inches => `${Math.floor(inches / 12)} ft ${inches % 12} in`;
const money = n => '$' + Math.round(n).toLocaleString('en-US');
const r1 = n => (Math.round(n * 10) / 10).toFixed(1);
const BP_NAMES = ['Normal', 'Elevated', 'High (Stage 1)', 'High (Stage 2)'];
function bpCat(s, d) { const a = s < 120 ? 0 : s < 130 ? 1 : s < 140 ? 2 : 3; const b = d < 80 ? 0 : d < 90 ? 2 : 3; return Math.max(a, b); }
function bpGen(R, cat) {
  if (cat === 0) return [R.int(98, 119), R.int(60, 79)];
  if (cat === 1) return [R.int(120, 129), R.int(62, 79)];
  if (cat === 2) return R.chance(.5) ? [R.int(130, 139), R.int(68, 89)] : [R.int(108, 129), R.int(80, 89)];
  return R.chance(.5) ? [R.int(140, 158), R.int(80, 98)] : [R.int(118, 138), R.int(90, 98)];
}
/* Stylised body outline with four tape-measure bands (A chest, B waist, C hips, D thigh) */
function bodySVG(hot) {
  const band = (id, y, h, lab) => hot
    ? `<rect data-hot="${id}" data-label="Band ${lab}" x="22" y="${y}" width="96" height="${h}" rx="6" fill="rgba(255,255,255,.04)" stroke="#a9b8da" stroke-width="2" stroke-dasharray="5 4"/><text x="8" y="${y + h / 2 + 5}" fill="#eef3ff" font-weight="800" font-size="15" text-anchor="middle">${lab}</text>`
    : '';
  return `<svg viewBox="0 0 140 270" width="190" role="img" aria-label="Outline of a standing person with four horizontal bands labelled A to D" style="max-width:100%;height:auto">
    <g fill="#1d2b57" stroke="#7f93c9" stroke-width="2.5" stroke-linejoin="round">
      <circle cx="70" cy="24" r="16"/>
      <path d="M56 42h28v10l24 8 8 62-12 4-8-44-6 4 2 54-8 8H64l-8-8 2-54-6-4-8 44-12-4 8-62 24-8z"/>
      <path d="M58 168l-4 90h16l2-60 2 60h16l-4-90z"/>
    </g>
    <circle cx="70" cy="117" r="2.6" fill="#a9b8da"/>
    ${band('chest', 62, 14, 'A')}${band('waist', 108, 14, 'B')}${band('hips', 140, 14, 'C')}${band('thigh', 190, 14, 'D')}
  </svg>`;
}

/* =====================================================================
   ZONE 1 — HEALTH METRICS
   ===================================================================== */
const ZONE1 = {
  id: 1, name: 'Health Metrics', short: 'Metrics', color: '#2dd4bf', emoji: '🩺', time: '15–18 min',
  tagline: 'Read the numbers that describe your body — and learn what they can and can’t tell you.',
  badge: { name: 'Vital Signs Reader', emoji: '🫀' },
  recap: [
    'Screening numbers like BMI, waist-to-height ratio, blood pressure, and heart rate are clues, not diagnoses.',
    'Blood pressure uses two numbers, and the higher category wins: normal is under 120/80, high starts at 130/80.',
    'Resting heart rate is typically 60–100 bpm; exercise zones are percentages of 220 − age.',
    'Always compare a lab result to the reference range printed on that report, then talk with a clinician.'
  ],
  stations: [
    /* ---- 1. BMI ---- */
    {
      id: 'bmi', icon: '📏', title: 'BMI: A First Look', blurb: 'What it measures, and what it can’t.',
      read: [
        '{{Body mass index|BMI: a number calculated from height and weight}} (BMI) compares weight to height: <b>703 × pounds ÷ inches²</b>, or kilograms ÷ meters².',
        'Clinicians use it as a {{screening tool|A quick, simple check that can flag a possible concern. It is not a diagnosis.}}, a starting point that can lead to more questions, not a final answer.',
        'For adults, 18.5–24.9 is the typical range, 25–29.9 is above it, and 30 or more is well above it.',
        'For ages 2–19, BMI is compared to growth-chart {{percentiles|A way to compare one person with others of the same age and sex. The 50th percentile is the middle.}}, because growing bodies change fast.',
        'BMI can’t tell muscle from fat or show where fat is stored, so it is paired with other measures. The people in this module are fictional, and no number defines anyone’s worth.'
      ],
      interactive: 'bmi', need: 3, instr: 'Move both sliders, then open “What BMI can’t see.”',
      cfu: [
        R => {
          const h = R.int(60, 72), tgt = R.pick([21, 22, 23, 24, 26, 27, 28]); const w = Math.round(tgt * h * h / 703);
          const bmi = 703 * w / (h * h);
          return {
            type: 'numeric', topic: 'BMI', answer: bmi, tol: 0.5, unit: '', step: 0.1,
            prompt: `Alex is ${ft(h)} (${h} inches) tall and weighs ${w} pounds. Use <b>BMI = 703 × weight (lb) ÷ height (in)²</b> to find Alex’s BMI. Round to one decimal (anything within 0.5 is accepted).`,

const ZONES = [ZONE1, ZONE2, ZONE3];

/* =====================================================================
   SECTION 2 — QUESTION ENGINE
   Scoring rule (implemented exactly):
     • every CFU question is worth POINTS_PER_Q
     • correct on attempt 1 → 100%, attempt 2 → 75%, attempt 3 or later → 50% (floor)
     • wrong answers never end the question; the student must get it right to continue
     • multi-select / sort / match / order: one full submission = one attempt
     • an empty / incomplete submission is NOT an attempt (the Check button explains what is missing)
   ===================================================================== */

/* ---------- tiny DOM helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function el(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
/* build an SVG child element (HTML parsing would create unknown elements) */
function elSVG(markup) { const t = document.createElement('template'); t.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg">' + markup.trim() + '</svg>'; return t.content.firstElementChild.firstElementChild; }
/* {{term|definition}} → tap-to-define button */
function rich(s) {
  return String(s).replace(/\{\{(.+?)\|(.+?)\}\}/g, (m, t, d) => `<button type="button" class="term" data-def="${esc(d)}" aria-haspopup="dialog">${t}</button>`);
}
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
function live(msg) { const l = $('#live'); l.textContent = ''; setTimeout(() => l.textContent = msg, 30); }

/* ---------- random helper (seeded per session so every student gets different numbers) ---------- */
function makeRng() {
  let seed = (Date.now() ^ (Math.random() * 4294967296)) >>> 0;
  try { const a = new Uint32Array(1); crypto.getRandomValues(a); seed ^= a[0]; } catch (e) { /* fine */ }
  const next = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const R = {
    next, int: (a, b) => a + Math.floor(next() * (b - a + 1)), pick: arr => arr[Math.floor(next() * arr.length)],
    chance: p => next() < p,
    shuffle: arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(next() * (i + 1));[a[i], a[j]] = [a[j], a[i]]; } return a; }
  };
  return R;
}

/* ---------- session state (memory only — nothing is stored or sent anywhere) ---------- */
let S = null;          // set by startSession()
const REC = {};        // per-question record: attempts, correctAttempt, points, solved

/* Turn a question builder's output into a concrete, shuffled question the UI can render */
function prepare(q, R) {
  if (q.type === 'mcq' || q.type === 'scenario' || q.type === 'multi') {
    const multi = q.type === 'multi';
    const cs = new Set(multi ? q.correct : [q.correct]);
    let opts = q.options.map((t, i) => ({ t, ok: cs.has(i), why: q.optWhy ? q.optWhy[i] : null }));
    if (!q.keep) opts = R.shuffle(opts);
    q.opts = opts;
  } else if (q.type === 'sort') {
    q.items = R.shuffle(q.items);
  } else if (q.type === 'match') {
    q.left = q.pairs.map((p, i) => ({ t: p[0], k: i }));
    q.right = R.shuffle(q.pairs.map((p, i) => ({ t: p[1], k: i })));
  } else if (q.type === 'order') {
    let sh, n = 0;
    do { sh = R.shuffle(q.items.map((t, i) => ({ t, k: i }))); n++; } while (sh.every((x, i) => x.k === i) && n < 20);
    q.shuffled = sh;
  }
  return q;
}

/* Build every question for this session (one pass → ids 1..N in play order) */
function buildSessionQuestions(R) {
  let n = 0;
  return ZONES.map((z, zi) => z.stations.map((st, si) => st.cfu.map(fn => {
    const q = prepare(fn(R), R); q.id = ++n; q.zone = zi; q.station = si; q.stationTitle = st.title;
    REC[q.id] = { id: q.id, zone: zi, station: si, topic: q.topic || st.title, attempts: 0, correctAttempt: null, points: 0, solved: false };
    return q;
  })));
}
const countQuestions = () => ZONES.reduce((a, z) => a + z.stations.reduce((b, s) => b + s.cfu.length, 0), 0);
const totalPossible = () => countQuestions() * POINTS_PER_Q;
function pointsFor(attempt) { return POINTS_PER_Q * creditFor(attempt); }
const pctStr = c => Math.round(c * 100) + '%';

/* ---------- question type renderers ----------
   each: render(q, body, ctl) → { get(), eval(answer), mark(res, tier), lock(res) }
   get() returns null when the answer is incomplete (not counted as an attempt)         */
const QT = {};

/* multiple choice / scenario / multi-select */
QT.mcq = QT.scenario = QT.multi = {
  render(q, body, ctl) {
    const multi = q.type === 'multi';
    const g = el(`<div class="opts ${multi ? 'multi' : ''}" role="${multi ? 'group' : 'radiogroup'}" aria-label="Answer choices"></div>`);
    const inputs = [], labels = [];
    q.opts.forEach((o, i) => {
      const id = `q${q.id}o${i}`;
      const lab = el(`<label class="opt" for="${id}"><input type="${multi ? 'checkbox' : 'radio'}" name="q${q.id}" id="${id}"><span class="mark" aria-hidden="true"></span><span class="otxt">${o.t}</span></label>`);
      const inp = lab.querySelector('input'); inp.addEventListener('change', () => ctl.changed());
      g.appendChild(lab); inputs.push(inp); labels.push(lab);
    });
    body.appendChild(g);
    const need = q.opts.filter(o => o.ok).length;
    return {
      get() { const sel = inputs.map((x, i) => x.checked ? i : -1).filter(i => i >= 0); return sel.length ? sel : null; },
      eval(sel) {
        const ok = multi ? (sel.length === need && sel.every(i => q.opts[i].ok)) : q.opts[sel[0]].ok;
        const wrong = sel.filter(i => !q.opts[i].ok);
        const missing = multi ? q.opts.filter((o, i) => o.ok && !sel.includes(i)).length : 0;
        let note = '';
        if (!multi && !ok && q.opts[sel[0]].why) note = q.opts[sel[0]].why;
        if (multi && !ok) note = `${wrong.length ? wrong.length + ' of your picks ' + (wrong.length === 1 ? 'doesn’t' : 'don’t') + ' belong. ' : ''}${missing ? 'You’re missing ' + missing + ' correct ' + (missing === 1 ? 'choice' : 'choices') + '.' : ''}`;
        return { ok, wrong, note, sel };
      },
      mark(res, tier) {
        if (!multi) { res.wrong.forEach(i => { labels[i].classList.add('x'); inputs[i].checked = false; inputs[i].disabled = true; }); }
        else if (tier >= 1) { res.wrong.forEach(i => labels[i].classList.add('bad')); }
        if (multi && tier < 1) { /* first miss: no itemised marks */ }
      },
      lock() { inputs.forEach((x, i) => { x.disabled = true; labels[i].classList.remove('bad', 'x'); if (q.opts[i].ok) labels[i].classList.add('good'); }); }
    };
  }
};

/* generic chip placement used by sort (tap or drag) */
QT.sort = {
  render(q, body, ctl) {
    const items = q.items, place = items.map(() => -1); let sel = -1, locked = false, justDragged = false;
    body.appendChild(el(`<p class="muted small" style="margin:0 0 6px">Drag each card into a box — or tap a card, then tap a box. Tap a placed card to take it back.</p>`));
    const tray = el(`<div class="tray" data-bin="-1" aria-label="Cards to sort"></div>`);
    const binsEl = el(`<div class="bins"></div>`);
    const binNodes = q.bins.map((b, i) => {
      const n = el(`<div class="bin" data-bin="${i}"><button type="button" class="bh" aria-label="Place selected card in: ${esc(b)}">${esc(b)}${q.binSub ? `<small>${esc(q.binSub[i])}</small>` : ''}</button><div class="bi"></div></div>`);
      binsEl.appendChild(n); return n;
    });
    body.append(tray, binsEl);
    const chips = items.map((it, i) => {
      const c = el(`<button type="button" class="chip" data-i="${i}">${esc(it.t)}</button>`);
      c.addEventListener('click', () => {
        if (locked || justDragged) return;
        if (place[i] >= 0) { place[i] = -1; sel = i; } else sel = sel === i ? -1 : i;
        draw(); c.focus(); ctl.changed();
      });
      c.addEventListener('pointerdown', e => startDrag(e, i, c));
      return c;
    });
    function put(i, bin) { place[i] = bin; sel = -1; draw(); chips[i].focus(); ctl.changed(); }
    function draw() {
      tray.innerHTML = ''; binNodes.forEach(n => n.querySelector('.bi').innerHTML = '');
      chips.forEach((c, i) => { c.classList.toggle('sel', i === sel); (place[i] < 0 ? tray : binNodes[place[i]].querySelector('.bi')).appendChild(c); });
    }
    binNodes.forEach((n, bi) => n.addEventListener('click', e => { if (e.target.closest('.chip') || locked) return; if (sel >= 0) put(sel, bi); }));
    tray.addEventListener('click', e => { if (e.target.closest('.chip') || locked) return; if (sel >= 0 && place[sel] >= 0) { place[sel] = -1; draw(); ctl.changed(); } });
    function startDrag(e, i, chip) {
      if (locked || e.button > 0) return;
      const sx = e.clientX, sy = e.clientY; let ghost = null, over = null;
      const move = ev => {
        if (!ghost && Math.hypot(ev.clientX - sx, ev.clientY - sy) > 8) {
          ghost = chip.cloneNode(true); ghost.classList.add('ghost'); ghost.style.width = chip.offsetWidth + 'px'; document.body.appendChild(ghost); chip.classList.add('dragging');
        }
        if (ghost) {
          ghost.style.transform = `translate(${ev.clientX - ghost.offsetWidth / 2}px,${ev.clientY - 20}px) rotate(-2deg)`;
          const t = document.elementFromPoint(ev.clientX, ev.clientY); const z = t && t.closest('[data-bin]');
          if (over !== z) { over && over.classList.remove('over'); over = z; over && over.classList.add('over'); }
        }
      };
      const up = ev => {
        window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up);
        if (ghost) {
          ghost.remove(); chip.classList.remove('dragging'); over && over.classList.remove('over');
          const t = document.elementFromPoint(ev.clientX, ev.clientY); const z = t && t.closest('[data-bin]');
          justDragged = true; setTimeout(() => justDragged = false, 80);
          if (z) put(i, +z.dataset.bin);
        }
      };
      window.addEventListener('pointermove', move); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
    }
    draw();
    return {
      get() { return place.every(p => p >= 0) ? place.slice() : null; },
      emptyMsg: 'Place every card in a box first. This does not use an attempt.',
      eval(pl) { const wrong = []; items.forEach((it, i) => { if (pl[i] !== it.bin) wrong.push(i); }); return { ok: !wrong.length, wrong, note: wrong.length ? `${wrong.length} of ${items.length} cards are in the wrong box.` : '' }; },
      mark(res, tier) { chips.forEach((c, i) => c.classList.remove('wrong')); if (tier >= 1) res.wrong.forEach(i => chips[i].classList.add('wrong')); },
      lock() { locked = true; chips.forEach((c, i) => { c.classList.remove('wrong', 'sel'); c.classList.add('right'); c.disabled = true; c.style.cursor = 'default'; }); $$('.bh', body).forEach(b => b.disabled = true); }
    };
  }
};

/* match pairs: tap a left card, then its partner on the right */
QT.match = {
  render(q, body, ctl) {
    const link = q.left.map(() => -1); let sel = -1, locked = false;
    body.appendChild(el(`<p class="muted small" style="margin:0 0 6px">Tap an item on the left, then tap its match on the right. Matched pairs share the same letter.</p>`));
    const wrap = el(`<div class="mt"><div class="col" role="group" aria-label="Items"></div><div class="col" role="group" aria-label="Matches"></div></div>`);
    const [cl, cr] = wrap.children; body.appendChild(wrap);
    const L = q.left.map((it, i) => { const b = el(`<button type="button" class="mi"><span class="lk" aria-hidden="true"></span><span>${esc(it.t)}</span></button>`); b.addEventListener('click', () => { if (locked) return; sel = sel === i ? -1 : i; if (link[i] >= 0 && sel === i) { link[i] = -1; } draw(); ctl.changed(); }); cl.appendChild(b); return b; });
    const Rr = q.right.map((it, j) => { const b = el(`<button type="button" class="mi"><span class="lk" aria-hidden="true"></span><span>${esc(it.t)}</span></button>`); b.addEventListener('click', () => { if (locked) return; if (sel >= 0) { link.forEach((v, k) => { if (v === j) link[k] = -1; }); link[sel] = j; sel = -1; } else { link.forEach((v, k) => { if (v === j) link[k] = -1; }); } draw(); ctl.changed(); }); cr.appendChild(b); return b; });
    const letter = i => String.fromCharCode(65 + i);
    function draw() {
      L.forEach((b, i) => { b.classList.toggle('sel', i === sel); b.classList.toggle('on', link[i] >= 0); b.querySelector('.lk').textContent = link[i] >= 0 ? letter(i) : '·'; b.setAttribute('aria-label', `${q.left[i].t}${link[i] >= 0 ? ', matched with ' + q.right[link[i]].t : ''}`); });
      Rr.forEach((b, j) => { const k = link.indexOf(j); b.classList.toggle('on', k >= 0); b.querySelector('.lk').textContent = k >= 0 ? letter(k) : '·'; });
    }
    draw();
    return {
      get() { return link.every(v => v >= 0) ? link.slice() : null; },
      emptyMsg: 'Match every item first. This does not use an attempt.',
      eval(lk) { const wrong = []; lk.forEach((j, i) => { if (q.right[j].k !== q.left[i].k) wrong.push(i); }); return { ok: !wrong.length, wrong, note: wrong.length ? `${wrong.length} of ${link.length} pairs are mismatched.` : '' }; },
      mark(res, tier) { L.forEach(b => b.classList.remove('wrong')); if (tier >= 1) res.wrong.forEach(i => L[i].classList.add('wrong')); },
      lock() { locked = true; L.concat(Rr).forEach(b => { b.classList.remove('wrong', 'sel'); b.classList.add('right'); b.disabled = true; }); }
    };
  }
};

/* ordering with up/down buttons + FLIP animation */
QT.order = {
  render(q, body, ctl) {
    let list = q.shuffled.slice(), locked = false;
    body.appendChild(el(`<p class="muted small" style="margin:0 0 6px">Use the ▲ ▼ buttons to move each step into the right position.</p>`));
    const ol = el(`<ol class="ol" aria-label="Steps to order"></ol>`); body.appendChild(ol);
    const nodes = new Map();
    list.forEach(it => {
      const li = el(`<li><span>${esc(it.t)}</span><button type="button" class="mv up" aria-label="Move up: ${esc(it.t)}">▲</button><button type="button" class="mv dn" aria-label="Move down: ${esc(it.t)}">▼</button></li>`);
      li.querySelector('.up').addEventListener('click', () => move(it, -1)); li.querySelector('.dn').addEventListener('click', () => move(it, 1));
      nodes.set(it, li);
    });
    function draw(animate) {
      const first = animate ? new Map(list.map(it => [it, nodes.get(it).getBoundingClientRect().top])) : null;
      list.forEach((it, i) => { const li = nodes.get(it); ol.appendChild(li); li.querySelector('.up').disabled = locked || i === 0; li.querySelector('.dn').disabled = locked || i === list.length - 1; });
      if (animate && !RM()) list.forEach(it => { const li = nodes.get(it); const dy = first.get(it) - li.getBoundingClientRect().top; if (dy) li.animate([{ transform: `translateY(${dy}px)` }, { transform: 'none' }], { duration: 260, easing: 'cubic-bezier(.2,.8,.2,1)' }); });
    }
    function move(it, d) { if (locked) return; const i = list.indexOf(it), j = i + d; if (j < 0 || j >= list.length) return;[list[i], list[j]] = [list[j], list[i]]; draw(true); const b = nodes.get(it).querySelector(d < 0 ? '.up' : '.dn'); if (!b.disabled) b.focus(); ctl.changed(); }
    draw(false);
    return {

/* ---- active-time clock per zone (pauses while the tab is hidden) ---- */
const Clock = {
  zone: -1, last: 0, ms: [0, 0, 0],
  reset() { this.zone = -1; this.last = 0; this.ms = [0, 0, 0]; },
  flush() { if (this.zone >= 0 && this.last) { const n = performance.now(); this.ms[this.zone] += n - this.last; this.last = n; } },
  start(z) { this.flush(); this.zone = z; this.last = performance.now(); },
  stop() { this.flush(); this.zone = -1; this.last = 0; },
  total() { this.flush(); return this.ms.reduce((a, b) => a + b, 0); }
};
document.addEventListener('visibilitychange', () => { if (document.hidden) { Clock.flush(); Clock.last = 0; } else if (Clock.zone >= 0) Clock.last = performance.now(); });
const fmtTime = ms => { const s = Math.round(ms / 1000), m = Math.floor(s / 60); return `${m}m ${String(s % 60).padStart(2, '0')}s`; };

  go(() => {
    const w = el(`<div style="text-align:center"><span class="tag">Zone ${Z.id} complete</span><h2 style="margin-top:10px">${Z.emoji} ${Z.name}</h2>
      <div class="badge-big" role="img" aria-label="Badge unlocked: ${Z.badge.name}">${Z.badge.emoji}</div>
      <h3>Badge unlocked: ${Z.badge.name}</h3>
      <div class="stats"><div class="stat"><b class="cp">0%</b><span>zone score</span></div><div class="stat"><b>${fmtTime(Clock.ms[zi])}</b><span>time in zone</span></div><div class="stat"><b>${zoneQ(zi).filter(q => REC[q.id].correctAttempt === 1).length}/${zoneQ(zi).length}</b><span>first-try correct</span></div></div>
      <ul class="recap-list" style="text-align:left;max-width:640px;margin:14px auto">${Z.recap.map((t, i) => `<li style="--i:${i}">${t}</li>`).join('')}</ul>
      <button class="btn" id="cont" style="margin-top:8px">${zi < 2 ? `Continue to Zone ${zi + 2} →` : 'See my results →'}</button></div>`);
    $('#cont', w).addEventListener('click', () => zi < 2 ? showMap(zi + 1) : showResults());
    setTimeout(() => { counter($('.cp', w), v => Math.round(v) + '%').set(pct, 1200); bigCelebrate(); sfx('badge'); }, 500);
    return w;
  });
}

/* ---- completion code (name + score + minute-of-completion) ---- */
function cyrb53(str, seed = 0) {
  let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for (let i = 0, ch; i < str.length; i++) { ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return 4294967296 * (2097151 & h2) + (h1 >>> 0);
}
function makeCode(name, tenths, minutes) {
  const norm = name.trim().toLowerCase().replace(/\s+/g, ' ');
  const h = cyrb53(`${norm}|${tenths}|${minutes}|HA1`).toString(36).toUpperCase().padStart(6, '0').slice(-6);
  return `HA-${minutes.toString(36).toUpperCase().padStart(5, '0')}-${h}`;
}
function buildVerifier(host) {
  host.innerHTML = `<p class="small muted">Enter the student’s name and score exactly as shown on their screenshot, plus the code, to confirm it was generated by this module. (A determined student could forge a code by reading the page source; this is a light authenticity check, not security.)</p>
    <div class="field"><label for="vn">Name on screenshot</label><input type="text" id="vn"></div><div class="field"><label for="vs">Score % on screenshot (e.g., 93.9)</label><input type="text" id="vs" inputmode="decimal"></div>
    <div class="field"><label for="vc">Completion code</label><input type="text" id="vc" placeholder="HA-XXXXX-XXXXXX"></div><button type="button" class="btn sm" id="vb">Check</button><p id="vr" role="status" style="font-weight:700"></p>`;
  $('#vb', host).addEventListener('click', () => {
    const name = $('#vn', host).value, sc = parseFloat($('#vs', host).value), code = $('#vc', host).value.trim().toUpperCase(); const r = $('#vr', host);
    const m = /^HA-([0-9A-Z]{5})-([0-9A-Z]{6})$/.exec(code);
    if (!m || isNaN(sc) || !name.trim()) { r.textContent = 'Fill in all three fields (code format HA-XXXXX-XXXXXX).'; return; }
    const minutes = parseInt(m[1], 36); const ok = makeCode(name, Math.round(sc * 10), minutes) === code;
    r.textContent = ok ? `✓ Valid. Generated ${new Date(minutes * 60000).toLocaleString()} for this name and score.` : '✕ Does not match this name and score.';
  });
}

/* ---- results (screenshot-ready) ---- */
function showResults() {
  S.screen = 'results'; Clock.stop(); document.body.dataset.z = 0; renderHUD();
  const recs = allRecs(); const earned = recs.reduce((a, r) => a + r.points, 0), poss = totalPossible(); const pct = earned / poss * 100; const tenths = Math.round(pct * 10);
  const now = new Date(); const minutes = Math.floor(now.getTime() / 60000); const code = makeCode(S.name, tenths, minutes);
  const when = now.toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
  const c1 = recs.filter(r => r.correctAttempt === 1).length, c2 = recs.filter(r => r.correctAttempt === 2).length, c3 = recs.filter(r => r.correctAttempt >= 3).length;
  const worst = recs.slice().sort((a, b) => b.attempts - a.attempts)[0];
  const tier = r => r.correctAttempt === 1 ? 't1' : r.correctAttempt === 2 ? 't2' : 't3';
  const credit = r => Math.round(creditFor(r.correctAttempt) * 100);
  go(() => {
    const zrows = ZONES.map((z, zi) => `<div class="qgrow" role="group" aria-label="${z.name} questions">${zoneQ(zi).map(q => { const r = REC[q.id]; return `<div class="qc ${tier(r)}" title="Q${q.id}: attempt ${r.correctAttempt}, ${credit(r)}%"><b>${q.id}</b>${credit(r)}</div>`; }).join('')}</div>`).join('');
    const w = el(`<div>
      <div class="res" id="shot">
        <div class="banner"><span style="font-size:1.8rem" aria-hidden="true">📸</span><span>Screenshot this entire page and submit it. <span class="muted" style="font-weight:600">(On a Chromebook: Ctrl + Shift + Show windows. On a phone: use your screenshot buttons.)</span></span></div>
        <div class="res-top"><div class="ring"><svg viewBox="0 0 120 120" role="img" aria-label="Score ring"><circle cx="60" cy="60" r="52" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="12"/><circle class="rr" cx="60" cy="60" r="52" fill="none" stroke="url(#sg)" stroke-width="12" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="326.7"/><defs><linearGradient id="sg" x1="0" x2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset=".5" stop-color="#fbbf24"/><stop offset="1" stop-color="#a5b4fc"/></linearGradient></defs></svg><div class="num"><span><span class="sc">0.0</span>%</span><small>overall score</small></div></div>
          <div><div class="idline">${esc(S.name)}</div><div class="muted">Health Analyst Training · completed ${esc(when)}</div><p style="margin:10px 0 4px" class="small muted">Completion code</p><span class="codebox">${code}</span>
          <div class="stats" style="justify-content:flex-start;margin-top:10px"><div class="stat"><b>${fmtTime(Clock.total())}</b><span>total time</span></div><div class="stat"><b>${earned % 1 ? earned.toFixed(1) : earned}/${poss}</b><span>points</span></div></div></div></div>
        <div class="zrow">${ZONES.map((z, zi) => `<div class="zbox" style="--zc:${z.color}"><span class="zb" aria-hidden="true">${z.badge.emoji}</span><div><b>${Math.round(zoneEarned(zi) / zonePossible(zi) * 100)}%</b><small>${z.name}<br>${z.badge.name} · ${fmtTime(Clock.ms[zi])}</small></div></div>`).join('')}</div>
        <div class="res-wide"><div><h3 style="font-size:1rem;margin-bottom:4px">Question-by-question credit</h3><div class="qg" id="qgrid">${zrows}</div>
            <div class="legend" style="margin:4px 0 8px"><span style="--c:#4ade80">100 = 1st try</span><span style="--c:#fbbf24">75 = 2nd try</span><span style="--c:#fb923c">50 = 3rd+ try</span></div>
            <div class="rate"><div class="stat"><b>${c1}</b><span>first-try correct</span></div><div class="stat"><b>${c2}</b><span>second-try correct</span></div><div class="stat"><b>${c3}</b><span>third+ try correct</span></div></div></div>
          <div><h3 style="font-size:1rem;margin:0 0 4px">Top 3 takeaways</h3><ol class="take"><li>Health numbers (BMI, waist-to-height, blood pressure, heart rate, lab results) are <b>screening clues</b> — read them against ranges and talk with a clinician.</li><li>Sleep (8–10 h), daily movement (60+ min), balanced eating, stress skills, and strong relationships work together; asking for help (988) is a strength.</li><li>Match care to the need, know how deductibles, copays, and coinsurance work, and check health information with the five source questions.</li></ol>
            ${worst && worst.attempts > 1 ? `<p class="small muted" style="margin:6px 0 0">Most-practiced topic: <b>${esc(worst.topic)}</b> (${worst.attempts} attempts) — worth another look.</p>` : '<p class="small muted" style="margin:6px 0 0">Wow, very few retries. Nice work.</p>'}</div></div>
        <p class="fine" style="margin:10px 0 0">Nothing was saved or sent. This screen is the only record — screenshot it before closing the page.</p></div>
      <div class="qactions noprint" style="margin-top:14px"><button class="btn ghost sm" id="detb" aria-expanded="false">View details</button><button class="btn ghost sm" id="prt">Print / save as PDF</button><button class="btn ghost sm" id="again">Start over</button></div>
      <div class="card noprint" id="det" hidden><h3>Details</h3><div style="overflow:auto"><table class="det"><thead><tr><th>Q</th><th>Zone · Station</th><th>Topic</th><th>Attempts</th><th>Credit</th><th>Pts</th></tr></thead><tbody>${recs.map(r => `<tr><td>${r.id}</td><td>${r.zone + 1} · ${r.station + 1}</td><td>${esc(r.topic)}</td><td>${r.attempts}</td><td>${credit(r)}%</td><td>${r.points}</td></tr>`).join('')}</tbody></table></div></div></div>`);
    $('#detb', w).addEventListener('click', e => { const d = $('#det', w); d.hidden = !d.hidden; e.currentTarget.setAttribute('aria-expanded', !d.hidden); e.currentTarget.textContent = d.hidden ? 'View details' : 'Hide details'; });
    $('#prt', w).addEventListener('click', () => window.print());
    $('#again', w).addEventListener('click', () => { if (confirm('Start over? Your current results will be cleared.')) showWelcome(); });
    setTimeout(() => {
      const rr = $('.rr', w); counter($('.sc', w), v => v.toFixed(1)).set(pct, 1800);
      tween(0, pct / 100, 1800, f => rr.setAttribute('stroke-dashoffset', 326.7 * (1 - f))); bigCelebrate(); sfx('badge');
    }, 400);
    return w;
  });
}

/* ---- toolbar toggles + boot ---- */
function initTools() {
  const sb = $('#btnSound'), mb = $('#btnMotion');
  sb.addEventListener('click', () => { soundOn = !soundOn; sb.setAttribute('aria-pressed', soundOn); sb.textContent = soundOn ? '🔊' : '🔇'; sb.setAttribute('aria-label', 'Sound effects: ' + (soundOn ? 'on' : 'off')); if (soundOn) sfx('ok'); });
  const syncM = () => { document.body.classList.toggle('rm', RM()); mb.setAttribute('aria-pressed', RM()); mb.setAttribute('aria-label', 'Reduce motion: ' + (RM() ? 'on' : 'off')); };
  mb.addEventListener('click', () => { if (mqReduce.matches) return; motionOff = !motionOff; syncM(); });
  if (mqReduce.matches) { mb.disabled = true; mb.title = 'Your device is set to reduce motion'; }
  mqReduce.addEventListener && mqReduce.addEventListener('change', syncM);
  syncM();
}
initTools();
showWelcome();
</script>
