<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sam's Wellness Walk</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{--ink:#2b2d42;--card:#fffdf7;--good:#1fa66a;--bad:#e63a63;--info:#3f7de8;
--phys:#ff7a59;--ment:#5b8cff;--soc:#ffb703;--emo:#ff5d9e;--env:#2ec27e}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#111}
body{font-family:'Fredoka','Baloo 2','Trebuchet MS',system-ui,sans-serif;color:var(--ink);overflow-x:hidden}
body.locked{overflow:hidden}
#track{width:1px;position:relative}
#stage{position:fixed;inset:0;overflow:hidden;background:#222}
#world{position:absolute;inset:0;width:100%;height:100%;display:block}
button{font-family:inherit;cursor:pointer}

/* ---------- scenes ---------- */
.sc{opacity:0;visibility:hidden;transition:opacity .7s ease,visibility 0s .7s}
.sc.on{opacity:1;visibility:visible;transition:opacity .7s ease,visibility 0s 0s}
.sc:not(.on) *{animation-play-state:paused!important}
.far{transform:translateX(calc(var(--px,0)*.25px))}
.near{transform:translateX(calc(var(--px,0)*.7px))}
.cloud{animation:drift 40s linear infinite alternate}
@keyframes drift{from{transform:translateX(-40px)}to{transform:translateX(60px)}}
.spin{animation:spin 30s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.twinkle{animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{opacity:.2}}
.sway{animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.float{animation:flo 3s ease-in-out infinite alternate}
@keyframes flo{to{transform:translateY(-14px)}}
.pulse{animation:pul 1.2s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.tb{transform-box:fill-box;transform-origin:center}

/* ---------- Sam ---------- */
#sam .bob{animation:breathe 3s ease-in-out infinite}
@keyframes breathe{50%{transform:translateY(-4px)}}
#sam .armL{transform:rotate(var(--aL,6deg));transform-origin:-48px -172px;transition:transform .55s cubic-bezier(.3,1.5,.5,1)}
#sam .armR{transform:rotate(var(--aR,-6deg));transform-origin:48px -172px;transition:transform .55s cubic-bezier(.3,1.5,.5,1)}
#sam .legL{transform:rotate(var(--lL,0deg));transform-origin:-24px -105px;transition:transform .4s}
#sam .legR{transform:rotate(var(--lR,0deg));transform-origin:24px -105px;transition:transform .4s}
#sam .head{transform:rotate(var(--ht,0deg));transform-origin:0 -190px;transition:transform .5s cubic-bezier(.3,1.5,.5,1)}
#sam .torso{transform-origin:0 -100px;transition:transform .5s}
#sam .eyes{animation:blink 4.2s infinite;transform-origin:0 -238px}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.08)}}
#sam .mo,#sam .hr,#sam .hc{display:none}
#sam[data-mood=happy] .m-happy,#sam[data-mood=neutral] .m-neutral,#sam[data-mood=sad] .m-sad,#sam[data-mood=worried] .m-worried,
#sam[data-mood=angry] .m-angry,#sam[data-mood=sleepy] .m-sleepy,#sam[data-mood=calm] .m-calm,#sam[data-mood=sick] .m-sick{display:block}
#sam[data-mood=calm] .eyes{display:none}
#sam[data-hold=phone] .hc-phone,#sam[data-hold=pad] .hc-pad,#sam[data-hold=tray] .hc-tray,#sam[data-hold=journal] .hc-journal{display:block}
#sam[data-hold=apple] .hr-apple,#sam[data-hold=soda] .hr-soda,#sam[data-hold=bag] .hr-bag{display:block}
#sam .tear{animation:tear 1.8s infinite}@keyframes tear{0%{transform:translateY(0);opacity:1}100%{transform:translateY(40px);opacity:0}}
#sam .sweat{animation:tear 1.2s infinite}
#sam .zzz{animation:zzz 2.6s infinite}@keyframes zzz{0%{transform:translate(0,0);opacity:0}30%{opacity:1}100%{transform:translate(30px,-60px);opacity:0}}
#sam .steam{animation:steam .9s infinite}@keyframes steam{0%{transform:translateY(0) scale(.6);opacity:.9}100%{transform:translateY(-50px) scale(1.4);opacity:0}}
/* poses */
#sam.p-happy{--aL:165deg;--aR:-165deg}#sam.p-happy .bob{animation:hop .65s ease-in-out infinite}
@keyframes hop{50%{transform:translateY(-26px)}}
#sam.p-wave{--aL:6deg}#sam.p-wave .armR{animation:wave .5s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-135deg)}to{transform:rotate(-176deg)}}
#sam.p-phone{--aL:-118deg;--aR:118deg;--ht:10deg}
#sam.p-yawn{--aL:8deg;--aR:150deg;--ht:-10deg}#sam.p-yawn .bob{animation:yawn 2.4s ease-in-out infinite}
@keyframes yawn{50%{transform:translateY(8px)}}
#sam.p-stretch{--aL:172deg;--aR:-172deg;--ht:-8deg}#sam.p-stretch .bob{animation:stretch 2.4s ease-in-out infinite}
@keyframes stretch{50%{transform:scale(1.03,1.06)}}
#sam.p-pulse{--aL:8deg;--aR:-125deg;--ht:4deg}
#sam.p-slump{--aL:2deg;--aR:-2deg;--ht:12deg}#sam.p-slump .torso{transform:rotate(3deg)}#sam.p-slump .bob{animation:breathe 4.5s ease-in-out infinite}
#sam.p-eat{--aL:6deg;--aR:150deg}#sam.p-eat .head{animation:chomp .5s ease-in-out infinite alternate}
@keyframes chomp{from{transform:rotate(-4deg)}to{transform:rotate(5deg)}}
#sam.p-game{--aL:-118deg;--aR:118deg;--ht:-6deg}#sam.p-game .bob{animation:gm .3s infinite}
@keyframes gm{50%{transform:translateY(-3px)}}
#sam.p-kick{--aL:50deg;--aR:-50deg}#sam.p-kick .legR{animation:kick 1.4s ease-in-out infinite}
@keyframes kick{0%,40%,100%{transform:rotate(0)}55%{transform:rotate(55deg)}70%{transform:rotate(-40deg)}}
#sam.p-stress{--aL:-150deg;--aR:150deg;--ht:-5deg}#sam.p-stress .bob{animation:shake .14s infinite}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
#sam.p-breathe{--aL:35deg;--aR:-35deg;--ht:-4deg}#sam.p-breathe .torso{animation:inhale 8s ease-in-out infinite}
@keyframes inhale{0%,100%{transform:scale(1)}50%{transform:scale(1.07,1.05)}}
#sam.p-write{--aL:-120deg;--aR:118deg;--ht:16deg}
#sam.p-angry{--aL:25deg;--aR:-25deg;--ht:0}#sam.p-angry .bob{animation:shake .1s infinite}
#sam.p-talk{--aL:6deg;--aR:-62deg}#sam.p-talk .armR{animation:talk 1s ease-in-out infinite alternate}
@keyframes talk{from{transform:rotate(-45deg)}to{transform:rotate(-78deg)}}
#sam.p-calmhand{--aL:6deg;--aR:130deg;--ht:-4deg}
#sam.p-cough{--aL:6deg;--aR:150deg;--ht:14deg}#sam.p-cough .bob{animation:cough 1s infinite}
@keyframes cough{0%,60%,100%{transform:translateY(0)}70%{transform:translateY(10px) rotate(2deg)}80%{transform:translateY(0)}90%{transform:translateY(8px)}}
#sam.p-pick{--aL:20deg;--aR:-20deg;--ht:18deg}#sam.p-pick .bob{animation:pick 1.2s ease-in-out infinite}
@keyframes pick{50%{transform:translateY(46px) scaleY(.82)}}
#sam.p-plant{--aL:25deg;--aR:-25deg;--ht:14deg}#sam.p-plant .bob{transform:translateY(40px) scaleY(.84)}
#sam.p-point{--aL:6deg;--aR:-102deg}#sam.p-point .armR{animation:point 1s ease-in-out infinite alternate}
@keyframes point{from{transform:rotate(-92deg)}to{transform:rotate(-112deg)}}
#sam.p-run .bob{animation:runbob .3s infinite}
@keyframes runbob{50%{transform:translateY(-14px)}}
/* walking / running limb swing */
#sam.walk .legL,#sam.p-run .legL{animation:swing .5s ease-in-out infinite alternate;--amp:30}
#sam.walk .legR,#sam.p-run .legR{animation:swing .5s ease-in-out infinite alternate-reverse;--amp:30}
#sam.walk .armL,#sam.p-run .armL{animation:swing .5s ease-in-out infinite alternate-reverse;--amp:32}
#sam.walk .armR,#sam.p-run .armR{animation:swing .5s ease-in-out infinite alternate;--amp:32}
#sam.walk .bob{animation:walkbob .5s ease-in-out infinite}
@keyframes walkbob{50%{transform:translateY(-9px)}}
#sam.p-run .legL,#sam.p-run .legR,#sam.p-run .armL,#sam.p-run .armR{animation-duration:.28s;--amp:55}
@keyframes swing{from{transform:rotate(calc(var(--amp,28)*1deg))}to{transform:rotate(calc(var(--amp,28)*-1deg))}}

/* ---------- HUD ---------- */
#hud{position:fixed;left:14px;top:50%;transform:translateY(-50%);z-index:20;display:flex;flex-direction:column;gap:10px;
 background:rgba(255,253,247,.88);backdrop-filter:blur(8px);border:3px solid var(--ink);border-radius:22px;padding:12px 12px 10px;
 box-shadow:0 6px 0 rgba(43,45,66,.35);width:206px}
#hud h4{font-size:13px;letter-spacing:.08em;text-transform:uppercase;text-align:center;opacity:.75;margin-bottom:2px}
.hb{position:relative}
.hb .row{display:flex;align-items:center;gap:8px}
.hb .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:18px;border:3px solid var(--ink);background:var(--c);flex:none;transition:transform .3s}
.hb .nm{font-size:13px;font-weight:600;line-height:1}
.hb .nm small{display:block;font-size:10px;font-weight:500;opacity:.65;margin-top:2px}
.hb .val{margin-left:auto;font-weight:700;font-size:15px;min-width:28px;text-align:right}
.hb .bar{height:15px;border:3px solid var(--ink);border-radius:10px;background:#e8e4da;margin-top:5px;overflow:hidden;position:relative}
.hb .fill{height:100%;width:0;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c));border-radius:7px;transition:filter .3s;position:relative}
.hb .fill::after{content:"";position:absolute;left:4px;right:4px;top:2px;height:3px;border-radius:3px;background:rgba(255,255,255,.55)}
.hb.low .fill{background:repeating-linear-gradient(45deg,#ff4d6d 0 8px,#ff7b93 8px 16px)}
.hb.low .bar{animation:lowp .8s infinite}
@keyframes lowp{50%{box-shadow:0 0 0 4px rgba(230,58,99,.45)}}
.hb.up .ic{animation:icup .7s}
.hb.dn .ic{animation:icdn .6s}
@keyframes icup{40%{transform:scale(1.35) rotate(-10deg)}}
@keyframes icdn{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.hb.up .fill{filter:brightness(1.3) saturate(1.3)}
.hb.dn .fill{filter:brightness(.8)}
.fl{position:absolute;right:-6px;top:-4px;font-weight:700;font-size:20px;pointer-events:none;animation:fl 1.7s ease-out forwards;text-shadow:0 2px 0 #fff,0 -2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff}
.fl.up{color:var(--good)}.fl.dn{color:var(--bad)}
@keyframes fl{0%{transform:translate(0,10px) scale(.5);opacity:0}15%{opacity:1;transform:translate(0,-4px) scale(1.3)}100%{transform:translate(0,-42px) scale(1);opacity:0}}

/* ---------- top / misc UI ---------- */
#banner{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:20;background:rgba(255,253,247,.92);border:3px solid var(--ink);
 border-radius:40px;padding:8px 20px;display:flex;gap:10px;align-items:center;font-weight:600;font-size:17px;box-shadow:0 5px 0 rgba(43,45,66,.35);white-space:nowrap;max-width:calc(100vw - 260px)}
#banner.swap{animation:bn .8s cubic-bezier(.3,1.6,.5,1)}
@keyframes bn{0%{transform:translateX(-50%) translateY(-90px)}100%{transform:translateX(-50%)}}
#banner .tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:20px;color:#fff;background:var(--info)}
#banner .tag.good{background:var(--good)}#banner .tag.bad{background:var(--bad)}
#tools{position:fixed;top:14px;right:14px;z-index:25;display:flex;gap:8px}
.tb2{background:var(--card);border:3px solid var(--ink);border-radius:16px;padding:7px 12px;font-size:16px;font-weight:600;box-shadow:0 4px 0 rgba(43,45,66,.35);transition:transform .15s;color:var(--ink)}
.tb2:hover{transform:translateY(-2px)}.tb2:active{transform:translateY(2px);box-shadow:none}
#dots{position:fixed;right:8px;top:50%;transform:translateY(-50%);z-index:15;display:flex;flex-direction:column;gap:7px}
#dots i{width:11px;height:11px;border-radius:50%;border:2px solid var(--ink);background:rgba(255,255,255,.7);cursor:pointer;transition:transform .2s,background .2s}
#dots i.g{background:#7ae0ab}#dots i.b{background:#ff93ac}
#dots i.cur{transform:scale(1.7);background:var(--ink)}
#next{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:25;background:var(--ink);color:#fff;border:3px solid #fff;border-radius:40px;
 padding:11px 26px;font-size:17px;font-weight:600;box-shadow:0 5px 0 rgba(0,0,0,.35);animation:nx 1.6s ease-in-out infinite}
#next:hover{background:#3d4066}
@keyframes nx{50%{transform:translateX(-50%) translateY(-7px)}}
#next.off{display:none}
#fx{position:fixed;inset:0;pointer-events:none;z-index:18}
#fx.bad{animation:fxbad .9s}@keyframes fxbad{0%{box-shadow:inset 0 0 0 0 rgba(230,58,99,0)}20%{box-shadow:inset 0 0 160px 40px rgba(230,58,99,.55)}100%{box-shadow:inset 0 0 0 0 rgba(230,58,99,0)}}
#fx.good{animation:fxgood .9s}@keyframes fxgood{0%{box-shadow:inset 0 0 0 0 rgba(31,166,106,0)}20%{box-shadow:inset 0 0 160px 30px rgba(255,255,160,.6)}100%{box-shadow:inset 0 0 0 0 rgba(31,166,106,0)}}
#world.shake{animation:wshake .5s}@keyframes wshake{20%{transform:translate(-8px,3px)}40%{transform:translate(7px,-3px)}60%{transform:translate(-5px,2px)}80%{transform:translate(4px,0)}}
.spark{position:fixed;z-index:19;pointer-events:none;font-size:28px;animation:sp 1.3s ease-out forwards}
@keyframes sp{0%{transform:translate(0,0) scale(.3);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.2) rotate(var(--r));opacity:0}}

/* ---------- explainer card ---------- */
#card{position:fixed;right:34px;top:78px;bottom:84px;width:min(410px,31vw);z-index:19;display:flex;align-items:center;pointer-events:none}
#cardIn{pointer-events:auto;background:var(--card);border:4px solid var(--ink);border-radius:26px;box-shadow:0 8px 0 rgba(43,45,66,.4);padding:0 0 14px;
 max-height:100%;overflow:auto;width:100%;transform:translateX(130%) rotate(4deg);opacity:0;transition:transform .7s cubic-bezier(.3,1.4,.5,1),opacity .4s}
#card.show #cardIn{transform:none;opacity:1}
#cardIn.ping{animation:ping .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes ping{0%{transform:scale(.9) rotate(-2deg)}100%{transform:none}}
.ch{padding:12px 18px;border-radius:20px 20px 0 0;color:#fff;display:flex;gap:12px;align-items:center;background:var(--info)}
.ch.good{background:var(--good)}.ch.bad{background:var(--bad)}
.ch .e{font-size:34px;line-height:1}
.ch .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.9}
.ch h3{font-size:21px;line-height:1.1;font-weight:700}
.cb{padding:12px 18px 0;font-size:15px;line-height:1.38}
.cb p{margin-bottom:9px}
.cb b.l{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:#7a7d93;margin-bottom:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.chip{border:3px solid var(--ink);border-radius:30px;padding:2px 10px 2px 4px;font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:5px;background:#fff;animation:chip .6s cubic-bezier(.3,1.7,.5,1) both}
.chip i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:12px;border:2px solid var(--ink)}
.chip.up{color:var(--good)}.chip.dn{color:var(--bad)}
@keyframes chip{from{transform:scale(0)}}
.metric{display:inline-block;background:#fff3c4;border:2px solid #e3b93c;border-radius:10px;padding:1px 9px;font-weight:600;font-size:13px}
.fact{background:#eef4ff;border-left:5px solid var(--info);border-radius:8px;padding:8px 10px;font-size:13.5px;margin-bottom:8px}
.fact a{color:#1d56c4;font-weight:600;display:block;font-size:12px;margin-top:3px;word-break:break-word}
.think{background:#f1ecff;border-radius:10px;padding:7px 10px;font-size:13.5px;font-weight:500}
.dimlist{display:grid;gap:5px;margin-bottom:8px}
.dimlist div{display:flex;gap:8px;align-items:center;font-size:13.5px}
.dimlist i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--c);border:2px solid var(--ink);display:grid;place-items:center;flex:none}

/* quiz + recap */
.qchips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
.qc{border:3px solid var(--ink);background:#fff;border-radius:14px;padding:5px 10px;font-size:13.5px;font-weight:500;transition:transform .2s,background .2s;color:var(--ink)}
.qc.sel{background:#fff0a8;transform:scale(1.07) rotate(-2deg)}
.qc.done{background:#c9f3dc;opacity:.75;pointer-events:none}
.qc.nope{animation:nope .45s}
@keyframes nope{25%,75%{transform:translateX(-7px)}50%{transform:translateX(7px)}}
.bk{display:grid;gap:7px}
.bkt{border:3px dashed var(--ink);border-radius:14px;padding:7px 10px;background:#fff;font-weight:600;font-size:14.5px;text-align:left;display:flex;flex-wrap:wrap;gap:5px;align-items:center;min-height:44px;width:100%;color:var(--ink)}
.bkt:hover{background:#f6f2ff}
.bkt small{font-weight:500;background:#c9f3dc;border-radius:8px;padding:1px 7px;font-size:12px}
.bkt.fo{border-style:solid;font-weight:500;display:block}.bkt.fo:disabled{cursor:default;color:var(--ink)}
.bkt.fok{background:#c9f3dc;border-color:var(--good)}.bkt.fno{background:#ffd9e1;border-color:var(--bad);animation:nope .45s}
.score{font-weight:700;font-size:15px;text-align:center;margin-top:8px}
.ex{width:100%;border:3px solid var(--ink);border-radius:12px;padding:6px 10px;font:inherit;font-size:14px;margin-bottom:6px}
.big{background:var(--ink);color:#fff;border:0;border-radius:14px;padding:9px 16px;font-weight:600;font-size:15px;width:100%;margin-top:4px}
.sum{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;font-size:13.5px;margin-bottom:10px}
.sum .b{height:10px;border-radius:6px;background:#e8e4da;border:2px solid var(--ink);overflow:hidden}.sum .b span{display:block;height:100%;background:var(--c)}
.srcl{font-size:11.5px;line-height:1.5;margin-top:8px}.srcl a{color:#1d56c4;display:block}

/* ---------- overlay + modal ---------- */
#intro{position:fixed;inset:0;z-index:100;display:grid;place-items:center;text-align:center;padding:20px;
 background:radial-gradient(circle at 50% 40%,#7ec8ff,#3f7de8 60%,#2b2d6b);transition:opacity .8s,visibility .8s}
#intro.gone{opacity:0;visibility:hidden;pointer-events:none}
#intro .box{max-width:640px;color:#fff}
#intro h1{font-size:clamp(34px,6vw,64px);line-height:1;text-shadow:0 5px 0 #2b2d42;-webkit-text-stroke:2px #2b2d42;paint-order:stroke fill;letter-spacing:.01em}
#intro p{font-size:clamp(16px,2.2vw,21px);margin:16px 0 22px;text-shadow:0 2px 0 rgba(0,0,0,.35)}
#intro .go{background:#ffd23f;color:var(--ink);border:4px solid var(--ink);border-radius:50px;padding:14px 38px;font-size:24px;font-weight:700;box-shadow:0 7px 0 var(--ink);animation:nx2 1.4s ease-in-out infinite}
@keyframes nx2{50%{transform:scale(1.07)}}
#intro .five{display:flex;justify-content:center;gap:10px;margin:0 0 16px;font-size:34px;flex-wrap:wrap}
#intro .five span{animation:flo 1.6s ease-in-out infinite alternate;background:#fff;border:3px solid var(--ink);border-radius:50%;width:58px;height:58px;display:grid;place-items:center}
#intro .tip{font-size:14px;opacity:.9;margin-top:16px}
#modal{position:fixed;inset:0;z-index:90;background:rgba(20,20,40,.6);display:none;place-items:center;padding:16px;backdrop-filter:blur(4px)}
#modal.open{display:grid}
#mbox{background:var(--card);border:4px solid var(--ink);border-radius:26px;max-width:900px;width:100%;max-height:88vh;overflow:auto;padding:18px 20px;animation:ping .5s cubic-bezier(.3,1.6,.5,1)}
#mbox h2{font-size:26px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{border:3px solid var(--ink);border-radius:20px;background:#fff;padding:4px 14px;font-weight:600;color:var(--ink)}
.tabs button.on{background:var(--ink);color:#fff}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.mi{border:3px solid var(--ink);border-radius:16px;padding:9px 12px;background:#fff;text-align:left;font-size:14px;line-height:1.3;transition:transform .2s;color:var(--ink)}
.mi:hover{transform:translateY(-3px) rotate(-.6deg)}
.mi b{display:block;font-size:15px}.mi.good{background:#e6f9ef}.mi.bad{background:#ffe9ee}.mi.info{background:#eaf1ff}
.mi .dl{margin-top:4px;font-size:12px;font-weight:600}
.mi .dl span{margin-right:6px}.mi .dl .u{color:var(--good)}.mi .dl .d{color:var(--bad)}
.gl{border:3px solid var(--ink);border-radius:16px;padding:9px 12px;background:#fff;font-size:14px}

 const step=t=>{const k=clamp((t-t0)/dur);scrollTo(0,y0+(y-y0)*ease(k));if(k<1&&anim)anim.id=requestAnimationFrame(step);else anim=null;};anim.id=requestAnimationFrame(step);}
['wheel','touchstart','mousedown'].forEach(e=>addEventListener(e,()=>{if(anim){cancelAnimationFrame(anim.id);anim=null;}},{passive:true}));
function nextBeat(){const y=scrollY;const b=BEATS.find(b=>beatY(b)>y+8);if(b)scrollToY(beatY(b));}
function prevBeat(){const y=scrollY;const l=BEATS.filter(b=>beatY(b)<y-8);scrollToY(l.length?beatY(l[l.length-1]):0);}
addEventListener('keydown',e=>{if(!started||$('#modal').classList.contains('open')||/INPUT|TEXTAREA/.test(e.target.tagName))return;
 if(['ArrowDown','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();nextBeat();}else if(['ArrowUp','PageUp'].includes(e.key)){e.preventDefault();prevBeat();}});
$('#next').onclick=nextBeat;
$('#dots').onclick=e=>{const i=e.target.dataset&&e.target.dataset.i;if(i!=null){const s=SC[i];scrollToY(beatY(s.beats[0]),Math.abs(i-Math.max(lastSi,0))>1);}};

/* sam */
function applySam(si,k,moving){const s=SC[si],b=k>=0?s.beats[k]:null;
 const pose=moving?'idle':(b?b.pose:s.pose),mood=b?b.mood:s.mood,hold=moving?'':(b?(b.hold||''):(s.hold0||''));
 const cn='p-'+pose+(moving?' walk':'');if(sam.getAttribute('class')!==cn)sam.setAttribute('class',cn);
 sam.dataset.mood=mood;sam.dataset.hold=hold;}

/* cards */
const KL={good:'Positive ✓',bad:'Negative ✗',info:'Explore ◆'};
const chipsHTML=d=>{const e=Object.entries(d||{});return e.length?`<div class="chips">${e.map(([k,v],i)=>`<span class="chip ${v>0?'up':'dn'}" style="--c:${DM[k].c};animation-delay:${.25+i*.12}s"><i>${DM[k].ic}</i>${DM[k].n} ${v>0?'▲ +':'▼ '}${v}</span>`).join('')}</div>`:'';};
const srcHTML=s=>(s||[]).map(x=>`<a href="${x[1]}" target="_blank" rel="noopener">↗ ${x[0]}</a>`).join('');
function cardHTML(b){
 const head=`<div class="ch ${b.k}"><div class="e">${b.ico}</div><div><div class="k">${KL[b.k]}</div><h3>${b.t}</h3></div></div>`;
 if(b.final)return head+finalHTML();
 if(b.quiz)return head+quizHTML();
 if(b.recap)return head+recapHTML();
 return head+`<div class="cb">${chipsHTML(b.d)}<p><b class="l">What’s happening</b>${b.w}</p>${b.dims?`<div class="dimlist">${DIMS.map(d=>`<div style="--c:${d.c}"><i>${d.ic}</i><span><b>${d.n}</b> — ${d.sub.toLowerCase()}: ${d.d}</span></div>`).join('')}</div>`:''}
 <p><b class="l">Why it matters</b>${b.why}</p>${b.m?`<p><span class="metric">📏 Metric: ${b.m}</span></p>`:''}
 ${b.f?`<div class="fact">💡 ${b.f}${srcHTML(b.src)}</div>`:''}${b.think?`<div class="think">🤔 ${b.think}</div>`:''}</div>`;}
/* quiz */
const QI=[['Hours of sleep last night','p'],['Ability to name how you feel','se'],['Number of close friends','se'],['Heart rate after running','p'],['Level of stress before a test','m'],['Listening to a friend’s problem','se']];
const QB=[['p','💪 Physical'],['m','🧠 Mental'],['se','🤝❤️ Social / Emotional']];
let Q={sel:-1,done:{},miss:0};
function quizHTML(){const n=Object.keys(Q.done).length;
 return `<div class="cb"><p>Tap a metric, then tap the dimension it best measures.</p><div class="qchips">${QI.map((q,i)=>`<button class="qc ${Q.done[i]?'done':''} ${Q.sel===i?'sel':''}" data-q="${i}">${q[0]}</button>`).join('')}</div>
 <div class="bk">${QB.map(b=>`<button class="bkt" data-b="${b[0]}">${b[1]} ${QI.map((q,i)=>Q.done[i]===b[0]?`<small>${q[0]}</small>`:'').join('')}</button>`).join('')}</div>
 <div class="score">${n===QI.length?`🎉 All sorted! ${QI.length-Q.miss}/${QI.length} first-try correct`:`Sorted ${n}/${QI.length} · tries missed: ${Q.miss}`}</div></div>`;}
/* final check: 15 questions, unlimited attempts, 100% in one run to pass */
const FQ=[
['Which dimension includes sleep, nutrition, physical activity and vital signs?',['Physical','Mental','Social','Environmental'],'Sleep, nutrition, activity and vital signs are all observable Physical metrics.'],
['About how many hours of sleep do teens aged 13–18 need per 24 hours?',['8–10 hours','4–5 hours','6 hours exactly','11–13 hours'],'The AASM recommends 8–10 hours for ages 13–18.'],
['“Heart rate after running” is a metric of which dimension?',['Physical (vital signs)','Mental','Social / Emotional','Environmental'],'Heart rate is a vital sign — a measurable body signal.'],
['Which of these is a Mental health metric?',['Level of stress before a test','Number of close friends','Hours of sleep last night','Heart rate after running'],'Mood and stress level describes how calm, anxious or overwhelmed you feel.'],
['Poor sleep lowered Sam’s focus and patience with friends. What does this show?',['Wellness dimensions are connected','Dimensions never affect each other','Only Physical health matters','Friends don’t affect sleep'],'Wellness is multidimensional: change in one area often affects the others.'],
['What does WHO recommend for children and teens?',['An average of 60+ minutes a day of moderate-to-vigorous activity','10 minutes of activity a week','Only weekend exercise','3 hours of screen time a day'],'WHO: at least an average of 60 minutes per day of moderate-to-vigorous activity.'],
['Why did Sam crash after the vending-machine soda and chips?',['A short sugar burst, then focus faded','Soda gives steady all-day energy','Chips improve vital signs','Food has no effect on focus'],'Low-nutrient snacks give a quick burst of energy, then focus dips — Physical and Mental both suffer.'],
['MyPlate suggests filling about half your plate with…',['Fruits and vegetables','Grains only','Dairy','Sweets'],'Balance and variety fuel the body — half fruits and vegetables.'],
['Which is a healthy coping skill for stress?',['Slow, deep breathing','Skipping sleep to study','Ignoring the feeling','Gaming for four hours'],'Coping skills are strategies to manage stress; breathing, journaling and exercise are examples.'],
['“Sense of belonging” means…',['Feeling accepted, valued and connected to a group','Having the most followers online','Being alone to recharge','Winning every game'],'Belonging is about acceptance and connection — a Social/Emotional metric.'],
['“Listening to a friend’s problem” best measures…',['Communication (Social / Emotional)','Vital signs','Nutrition','Physical activity'],'Communication is expressing needs and listening to others clearly.'],
['What is the first step in “name it to tame it”?',['Naming the feeling','Shouting louder','Pretending nothing is wrong','Walking away from everyone'],'Naming emotions helps you respond rather than react (Lieberman et al., UCLA, 2007).'],
['Emotional regulation is…',['Naming feelings and calming down when upset','Never feeling angry','Hiding every emotion','Avoiding people'],'It’s a skill: name the feeling, then calm down and respond.'],
['Which best describes Environmental wellness?',['Safe, clean spaces with access to nature','Only how your bedroom looks','How many friends you have','Your resting heart rate'],'Home, school and community spaces that support a healthy life.'],
['Which habit helps TWO dimensions at once?',['Walking outside with a friend','Scrolling until 2 AM','Skipping lunch to study alone','Four-hour gaming marathon'],'Walking = Physical + Social (and nature = Environmental, mood = Emotional).']];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
let FC={attempt:0,passed:false,order:[],i:0,right:0,missed:[],opts:[],picked:-1,screen:'intro'};
function fcStart(){FC.attempt++;FC.order=shuf(FQ.map((_,i)=>i));FC.i=0;FC.right=0;FC.missed=[];FC.screen='q';fcOpts();}
function fcOpts(){const q=FQ[FC.order[FC.i]];FC.opts=shuf(q[1].map((t,i)=>({t,ok:i===0})));FC.picked=-1;}
function finalHTML(){const n=FQ.length;
 if(FC.screen==='intro'||FC.attempt===0&&!FC.order.length)return `<div class="cb"><p>${FC.passed?'🏅 You already earned 100%! You can retake it any time.':`Answer all <b>${n}</b> questions correctly in one run to finish the story. You get <b>unlimited attempts</b> — questions and answer order are shuffled each time.`}</p><button class="big" data-fstart>${FC.passed?'Practice again':'▶ Begin the Final Check'}</button></div>`;
 if(FC.screen==='q'){const q=FQ[FC.order[FC.i]],ans=FC.picked>=0,ok=ans&&FC.opts[FC.picked].ok;
  return `<div class="cb"><div class="sum" style="grid-template-columns:1fr auto;margin-bottom:6px"><div class="b" style="--c:var(--good)"><span style="width:${(FC.i/n)*100}%"></span></div><b>${FC.i+1}/${n}</b></div><p style="font-size:12px;opacity:.7;margin-bottom:6px">Attempt ${FC.attempt} · ${FC.right} correct so far</p><p><b>${q[0]}</b></p>
  <div class="bk">${FC.opts.map((o,i)=>`<button class="bkt fo ${ans?(o.ok?'fok':i===FC.picked?'fno':''):''}" style="border-style:solid" data-fa="${i}" ${ans?'disabled':''}>${o.t}</button>`).join('')}</div>
  ${ans?`<div class="fact" style="margin-top:8px;border-left-color:${ok?'var(--good)':'var(--bad)'}">${ok?'✅ Correct! ':'❌ Not quite. '}${q[2]}</div><button class="big" data-fnext>${FC.i+1<n?'Next question ▶':'See my score ▶'}</button>`:''}</div>`;}
 const perfect=FC.right===n;
 return `<div class="cb"><div class="score" style="font-size:22px">${perfect?'🎉':'💪'} ${FC.right} / ${n} correct</div>
 ${perfect?`<p style="text-align:center;margin:8px 0">100%! You’ve mastered the Dimensions of Wellness. Scroll on to finish with your recap.</p>`:`<p style="text-align:center;margin:8px 0">You need all ${n} right in one run — and you have unlimited tries. Review what you missed:</p><div class="srcl" style="font-size:13px">${FC.missed.map(i=>`<div class="fact" style="margin-bottom:6px"><b>${FQ[i][0]}</b><br>✔ ${FQ[i][1][0]}<br><i>${FQ[i][2]}</i></div>`).join('')}</div>`}
 <button class="big" data-fstart>${perfect?'Practice again':'↺ Try again'}</button></div>`;}
function recapHTML(){if(!FC.passed)return `<div class="cb"><p style="text-align:center;font-size:40px">🔒</p><p style="text-align:center"><b>Your recap unlocks when you score 100% on the Final Check.</b> You have unlimited attempts!</p><button class="big" data-fgo>↑ Go to the Final Check</button></div>`;
 return recapHTML2();}
function recapHTML2(){const allSrc=[],seen={};BEATS.forEach(b=>(b.src||[]).forEach(s=>{if(!seen[s[1]]){seen[s[1]]=1;allSrc.push(s);}}));
 return `<div class="cb"><p style="text-align:center">🏅 <b>Final Check mastered — 100%!</b> (attempt ${FC.attempt})</p><p><b class="l">Objective</b>Identify the Physical, Mental, Social, Emotional and Environmental wellness model.</p>
 <div class="sum">${DIMS.map(d=>`<span>${d.ic} ${d.n}</span><div class="b" style="--c:${d.c}"><span style="width:${Math.round(target[d.k])}%"></span></div><b>${Math.round(target[d.k])}</b>`).join('')}</div>
 <p>✓ I can identify <b>physical</b> health metrics.<br>✓ I can identify <b>mental</b> health metrics.<br>✓ I can identify <b>social / emotional</b> health metrics.</p>
 <div class="think" style="margin-bottom:8px">🎟️ <b>Exit ticket:</b> name one metric for each dimension.</div>
 <input class="ex" placeholder="Physical metric (e.g., sleep)"><input class="ex" placeholder="Mental metric (e.g., coping skills)"><input class="ex" placeholder="Social / Emotional metric (e.g., belonging)">
 <button class="big" data-restart>↺ Walk with Sam again</button>
 <div class="srcl"><b>Sources used in this story</b>${allSrc.map(s=>`<a href="${s[1]}" target="_blank" rel="noopener">↗ ${s[0]}</a>`).join('')}</div></div>`;}
$('#cardIn').addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
 if(t.dataset.restart!==undefined){Q={sel:-1,done:{},miss:0};FC={attempt:0,passed:false,order:[],i:0,right:0,missed:[],opts:[],picked:-1,screen:'intro'};scrollToY(0);return;}
 if(t.dataset.fgo!==undefined){scrollToY(beatY(BEATS.find(b=>b.final)));return;}
 if(t.dataset.fstart!==undefined){fcStart();AU.play('pop');renderCard(true);return;}
 if(t.dataset.fa!==undefined&&FC.picked<0){const i=+t.dataset.fa,o=FC.opts[i];FC.picked=i;
  if(o.ok){FC.right++;AU.play('yes');sparks('good',e.clientX,e.clientY,6);}else{FC.missed.push(FC.order[FC.i]);AU.play('nope');}
  renderCard(true);return;}
 if(t.dataset.fnext!==undefined){if(FC.i+1<FQ.length){FC.i++;fcOpts();}else{FC.screen='end';
   if(FC.right===FQ.length){FC.passed=true;AU.play('fanfare');sparks('good',innerWidth/2,innerHeight/2,24);}else AU.play('sigh');}
  renderCard(true);return;}
 if(t.dataset.q!==undefined){Q.sel=+t.dataset.q;AU.play('pop');renderCard(true);return;}
 if(t.dataset.b!==undefined&&Q.sel>=0){const i=Q.sel;if(QI[i][1]===t.dataset.b){Q.done[i]=t.dataset.b;Q.sel=-1;AU.play('yes');sparks('good',e.clientX,e.clientY,6);if(Object.keys(Q.done).length===QI.length){AU.play('chime');sparks('good',innerWidth/2,innerHeight/2,16);}renderCard(true);}
  else{Q.miss++;AU.play('nope');const c=$('#cardIn .qc.sel');if(c){c.classList.remove('sel');c.classList.add('nope');}Q.sel=-1;setTimeout(()=>renderCard(true),450);}}});

let shownBeat=null;
function renderCard(keep){const b=shownBeat;if(!b)return;const ci=$('#cardIn'),st=ci.scrollTop;ci.innerHTML=cardHTML(b);if(keep)ci.scrollTop=st;else{ci.classList.remove('ping');void ci.offsetWidth;ci.classList.add('ping');ci.scrollTop=0;}}
function showCard(b){if(b===shownBeat)return;shownBeat=b;if(b){renderCard();$('#card').classList.add('show');}else $('#card').classList.remove('show');}

/* effects */
function sparks(kind,x,y,n=12){const em=kind==='good'?['✨','⭐','💖','🌟','🎉']:['💥','💢','💫','💨'];
 for(let i=0;i<n;i++){const s=document.createElement('span');s.className='spark';s.textContent=em[i%em.length];s.style.left=x+'px';s.style.top=y+'px';
  const a=Math.random()*Math.PI*2,r=60+Math.random()*130;s.style.setProperty('--dx',Math.cos(a)*r+'px');s.style.setProperty('--dy',(Math.sin(a)*r-(kind==='good'?60:0))+'px');s.style.setProperty('--r',(Math.random()*240-120)+'deg');
  document.body.appendChild(s);setTimeout(()=>s.remove(),1400);}}
function trigger(b,jump){
 const r=$('#sam').getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height*.35;
 Object.entries(b.d||{}).forEach(([k,v])=>{if(jump>1)return;const h=HB[k].e;h.classList.remove('up','dn');void h.offsetWidth;h.classList.add(v>0?'up':'dn');
  const f=document.createElement('div');f.className='fl '+(v>0?'up':'dn');f.textContent=(v>0?'+':'')+v;h.appendChild(f);setTimeout(()=>{f.remove();h.classList.remove('up','dn');},1800);});
 if(jump>1)return;
 AU.stinger(b.k);const fx=$('#fx');if(b.k==='good'||b.k==='bad'){fx.className='';void fx.offsetWidth;fx.className=b.k;}
 if(b.k==='bad'){world.classList.remove('shake');void world.offsetWidth;world.classList.add('shake');}
 if(b.k!=='info')sparks(b.k,cx,cy,b.k==='good'?14:7);
 (b.sfx||[]).forEach((s,i)=>setTimeout(()=>AU.play(s),350+i*450));}

/* main loop */
function frame(t){
 const y=scrollY;let si=0;for(let i=0;i<SC.length;i++)if(y>=starts[i])si=i;
 const s=SC[si],p=clamp((y-starts[si])/(s.len*vh));
 let k=-1;s.beats.forEach((b,i)=>{if(p>=b.at-1e-6)k=i;});
 if(!started)k=-1;
 if(si!==lastSi){SC.forEach((q,i)=>q.root.classList.toggle('on',i===si));
  lastSi=si;sx=NaN;lastK=-2;$('#stage').style.background=s.sky;
  const bn=$('#banner');bn.innerHTML=`<span>${s.loc}</span><span>${s.name}</span><span class="tag ${s.kind}">${s.kind==='good'?'Positive':s.kind==='bad'?'Negative':'Explore'}</span>`;bn.classList.remove('swap');void bn.offsetWidth;bn.classList.add('swap');
  if(started)AU.setAmb(s.amb);document.querySelectorAll('#dots i').forEach((d,i)=>d.classList.toggle('cur',i===si));}
 if(k!==lastK){SC.forEach(q=>q.root.classList.remove('b0','b1','b2'));if(k>=0)s.root.classList.add('b'+k);if(s.onBeat)s.onBeat(k,s.root);lastK=k;}
 s.root.style.setProperty('--px',((p-.5)*-160).toFixed(1));
 /* sam position: walks in during the first 20% of a scene, walks out after 86% */
 let enter=clamp(p/.2);if(si===0)enter=Math.max(enter,started?introT:0);
 let tx=-220+(SX+220)*ease(enter);
 if(si!==SC.length-1&&p>.86)tx=SX+(1900-SX)*ease(clamp((p-.86)/.14));
 if(!isFinite(tx))tx=SX;
 if(!isFinite(sx))sx=tx;else sx+=(tx-sx)*.16;
 const moving=Math.abs(tx-sx)>.9;
 applySam(si,k,moving);
 samPos.setAttribute('transform',`translate(${sx.toFixed(1)},${SY}) scale(.95)`);
 if(moving&&started&&t-lastStep>260){lastStep=t;AU.play('walk');}
 if(started&&introT<1)introT=clamp((t-introStart)/2400);
 /* health */
 const g=started?s.base+k:-1;
 if(started){target=g>=0?BEATS[g].after:INIT;if(g!==lastG){if(g>lastG&&g>=0)trigger(BEATS[g],g-lastG);lastG=g;}}
 DIMS.forEach(d=>{const c=cur[d.k],tv=started?target[d.k]:0;const n=Math.abs(tv-c)<.05?tv:c+(tv-c)*.07;if(n!==c){cur[d.k]=n;const h=HB[d.k];h.fill.style.width=n+'%';h.val.textContent=Math.round(n);h.e.classList.toggle('low',n<35);}});
 if(s.onTick)s.onTick(s.root,cur);
 /* explainer card */
 const hide=!started||k<0||(si<SC.length-1&&p>.93);
 if(!hide){const b=s.beats[k];if(cardKey!==si+':'+k){cardKey=si+':'+k;shownBeat=null;showCard(b);}}else{cardKey='';showCard(null);}
 const last=BEATS[BEATS.length-1];$('#next').classList.toggle('off',!started||y>=beatY(last)-8);
 requestAnimationFrame(frame);}
requestAnimationFrame(frame);

/* review modal */
const GLOSS=[['p','Sleep','Hours of sleep and how rested a person feels each day.'],['p','Nutrition','Balance and variety of foods eaten to fuel the body.'],['p','Physical Activity','Amount and type of movement or exercise each week.'],['p','Vital Signs','Heart rate, breathing, and other measurable body signals.'],
 ['m','Mood & Stress Level','How often someone feels calm, anxious, or overwhelmed.'],['m','Focus & Concentration','Ability to pay attention and complete tasks.'],['m','Coping Skills','Strategies used to manage stress or setbacks.'],['m','Sleep Quality','Restfulness of sleep, which strongly affects thinking.'],
 ['s','Relationships','Quality and number of supportive friendships and family ties.'],['s','Communication','Ability to express needs and listen to others clearly.'],['e','Emotional Regulation','Skill in naming feelings and calming down when upset.'],['s','Sense of Belonging','Feeling accepted, valued, and connected to a group.'],
 ['v','Safe, clean surroundings','Environmental overview: spaces that support a healthy life.'],['v','Access to nature','Outdoor space and nature near home, school and community.'],['v','Reducing pollution or clutter','Keeping the space around you cleaner and calmer.']];
let tab='all';
function modal(){const m=$('#mbox');
 const tabs=[['all','All scenes'],['good','✓ Positive'],['bad','✗ Negative'],['gloss','📏 Metrics glossary']];
 let body;
 if(tab==='gloss')body=`<div class="mgrid">${GLOSS.map(g=>{const key=g[1].toLowerCase().replace(/ \(.*/,'');const b=BEATS.find(b=>(b.m||'').toLowerCase().includes(key.split(',')[0]));return `<div class="gl" style="--c:${DM[g[0]].c}"><b>${g[1]}</b>${g[2]}<br><small>${DM[g[0]].ic} ${DM[g[0]].n}</small>${b?` <button class="tb2" style="padding:0 8px;font-size:12px;box-shadow:none" data-j="${BEATS.indexOf(b)}">see scene →</button>`:''}</div>`;}).join('')}</div>`;
 else body=`<div class="mgrid">${BEATS.map((b,i)=>({b,i})).filter(x=>tab==='all'||x.b.k===tab).map(({b,i})=>`<button class="mi ${b.k}" data-j="${i}"><b>${b.ico} ${b.t}</b>${SC[b.si].name}<div class="dl">${Object.entries(b.d||{}).map(([k,v])=>`<span class="${v>0?'u':'d'}">${DM[k].ic}${v>0?'+':''}${v}</span>`).join('')||'<span>◆ concept</span>'}</div></button>`).join('')}</div>`;
 m.innerHTML=`<h2>📚 Concept Review <button class="tb2" data-x>✕</button></h2><div class="tabs">${tabs.map(t=>`<button class="${tab===t[0]?'on':''}" data-t="${t[0]}">${t[1]}</button>`).join('')}</div>${body}`;}
$('#review').onclick=()=>{modal();$('#modal').classList.add('open');};
$('#modal').addEventListener('click',e=>{const t=e.target;
 if(t.id==='modal'||t.closest('[data-x]'))return $('#modal').classList.remove('open');
 const tb=t.closest('[data-t]');if(tb){tab=tb.dataset.t;modal();return;}
 const j=t.closest('[data-j]');if(j){$('#modal').classList.remove('open');scrollToY(beatY(BEATS[+j.dataset.j]),true);}});
$('#mute').onclick=()=>{const m=AU.toggle();$('#mute').textContent=m?'🔇':'🔊';};

/* start */
$('#startBtn').onclick=()=>{AU.start();started=true;introStart=performance.now();$('#intro').classList.add('gone');document.body.classList.remove('locked');
 AU.setAmb(SC[Math.max(lastSi,0)].amb);AU.play('chime');};
document.body.classList.add('locked');scrollTo(0,0);
</script>
