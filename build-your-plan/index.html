<script>
/* =====================================================================
 ARCHITECTURE (read me first)
 1. CONFIG + CONTENT constants      : edit text here without touching logic.
 2. Helpers                         : h() / s() build DOM safely with textContent (no innerHTML).
 3. State + storage                 : one object S, save() after every change, localStorage in try/catch,
                                      falls back to memory. Completion is DERIVED from S by each step's need().
 4. Components                      : mcq (quiz), cardSort, frameAnim (accessible animation), fields.
 5. Pure rule functions             : evalGoal, ifThenCheck, planQuality, scoring. No DOM.
 6. Modules: MODS = [{id,title,minutes,steps:[{t,build(root),need()}]}].
 7. Shell: hash router (#/m3/s2), top bar, bottom bar, Menu/Help dialogs, keyboard shortcuts.
 8. Results page, print and .txt export.
 No network calls, no external files, no service worker.
===================================================================== */

/* ================= 1. CONFIG ================= */
const CONFIG = {
  title: "Build Your Plan",
  periodMinutes: 65,
  showAnswerAfterWrong: true,
  standards: "Goal setting, decision-making, self-management, evidence evaluation. (Add your own standard codes here.)",
  freeMinutesDefault: 45,
  minPurposeWords: 8,
  reflectionMinChars: 25,
  storageKey: "build-your-plan-v1"
};

/* ================= 1b. CONTENT (edit text here) ================= */
const AREAS = [
  { id: "study", t: "Study habits" },
  { id: "sleep", t: "Sleep routine" },
  { id: "move", t: "Movement / exercise" },
  { id: "skill", t: "Learning a skill (music, language, art, coding)" },
  { id: "phone", t: "Managing phone / screen distractions" },
  { id: "sport", t: "A sports skill" },
  { id: "kind", t: "A social / kindness habit" },
  { id: "other", t: "Other (non-sensitive)" }
];
const PRIVACY_NOTE = "Pick something you're comfortable keeping private from classmates. Your teacher won't grade what you choose, only how you plan it.";
const COUNSELOR_LINE = "If you're feeling stuck or overwhelmed in a way that's lasting, talking with a counselor, school nurse, or trusted adult is a strength.";

const NEEDS = [
  { id: "autonomy", t: "Autonomy", d: "Having some choice" },
  { id: "competence", t: "Competence", d: "Feeling capable, getting better" },
  { id: "connection", t: "Connection", d: "Belonging, working with others" }
];
const NEEDS_ITEMS = [
  { id: "n1", text: "Mr. Lee lets students pick their own project topic. Almost everyone gets more into it.", a: "autonomy", why: "Choice supports autonomy: the sense that your actions are your own." },
  { id: "n2", text: "Dana gets specific feedback: “Your main idea is clear. Add one example.” She keeps revising.", a: "competence", why: "Specific feedback shows you how to improve, which builds competence." },
  { id: "n3", text: "Ravi starts practicing guitar with a friend after school and sticks with it for weeks.", a: "connection", why: "Doing something with someone supports connection, the feeling of belonging." },
  { id: "n4", text: "Sam's teacher says, “Do it exactly this way. No changes.” Sam stops caring about the project.", a: "autonomy", why: "No room for choice blocks autonomy, and interest often drops." },
  { id: "n5", text: "Lena keeps getting problems far too hard, with no hints. She stops trying.", a: "competence", why: "Tasks with no path to success block competence." },
  { id: "n6", text: "Jo does a group-style task alone, never hears from anyone, and drifts away from it.", a: "connection", why: "Feeling disconnected blocks the need for connection." }
];

const OA_ITEMS = [
  { id: "o1", text: "Get a B in science", a: "outcome" },
  { id: "o2", text: "Do 5 practice questions after dinner", a: "action" },
  { id: "o3", text: "Make varsity", a: "outcome" },
  { id: "o4", text: "Shoot 30 free throws on Tuesday", a: "action" },
  { id: "o5", text: "Win the debate tournament", a: "outcome" },
  { id: "o6", text: "Practice scales for 10 minutes before school", a: "action" },
  { id: "o7", text: "Be fluent in Spanish", a: "outcome" },
  { id: "o8", text: "Text a friend to study together on Wednesday", a: "action" }
];
const OA_FIX = [
  { id: "f1", outcome: "Get a B in science", opts: ["Review my notes for 15 minutes after school, Monday to Thursday", "Try harder in science class", "Be a better science student"], c: 0 },
  { id: "f2", outcome: "Make varsity", opts: ["Be more athletic", "Take 30 practice shots after team practice on Tuesday and Thursday", "Impress the coach"], c: 1 },
  { id: "f3", outcome: "Be fluent in Spanish", opts: ["Do 10 vocabulary cards before dinner on weekdays", "Know a lot of Spanish soon", "Get really good at Spanish"], c: 0 }
];
const PRESSURE_CARDS = [
  { id: "p1", text: "“I want to learn this song because it sounds fun to play.”", a: "mine", why: "“I want to” language points to a goal that comes from you." },
  { id: "p2", text: "“I have to finish this or I'll be in trouble.”", a: "pressure", why: "“I have to” language usually points to pressure from outside." },
  { id: "p3", text: "“I'm only doing this because everyone else is.”", a: "pressure", why: "Following the crowd is outside pressure. You can still look for a part of it you care about." }
];

const SVH_BINS = [
  { id: "S", t: "Supported", d: "Good evidence" },
  { id: "P", t: "Partly true / it's complicated", d: "True in some cases" },
  { id: "H", t: "Hype / not supported", d: "Evidence points the other way" },
  { id: "N", t: "Not enough evidence yet", d: "Not established" }
];
const SVH_CARDS = [
  { id: "c1", text: "“It takes 21 days to build a habit.”", a: "H", why: "One study of 96 adults found it took anywhere from 18 to 254 days to feel automatic. The median was about 66. It depends on the person and the habit.", src: "Lally et al., 2010" },
  { id: "c2", text: "“Missing one day ruins your habit.”", a: "H", why: "In that same study, missing a single day did not meaningfully derail habit formation. What hurts more is the “I blew it, so why bother” reaction.", src: "Lally et al., 2010" },
  { id: "c3", text: "“Every time you do something fun, you get a ‘dopamine hit.’”", a: "H", why: "Oversimplified. Dopamine is involved in wanting, learning, effort, and movement. It does not work like a simple pleasure meter. Surprise matters more than the activity itself.", src: "Schultz; Berridge & Robinson (animal and human research)" },
  { id: "c4", text: "“Rewards always destroy motivation.”", a: "P", why: "Expected, tangible rewards for something you already enjoy can undermine interest. Rewards for dull tasks, and specific feedback or praise, often do not.", src: "Lepper et al., 1973; Deci et al., 1999" },
  { id: "c5", text: "“Making an ‘if–then’ plan helps you follow through.”", a: "S", why: "Across about 94 studies, implementation intentions (if–then plans) had a medium-to-large effect on reaching goals. They work best when they are specific and linked to the goal.", src: "Gollwitzer & Sheeran, 2006" },
  { id: "c6", text: "“Just imagine your success as vividly as possible and you'll get there.”", a: "P", why: "Purely positive daydreaming can lower effort. Imagining the goal and the obstacle, then planning a response (mental contrasting with if–then plans), worked better, including in a study of high-school students.", src: "Oettingen; Duckworth et al., 2011" },
  { id: "c7", text: "“Writing about why a topic matters to your own life can raise interest and performance.”", a: "S", why: "In studies with high school students, those who wrote about the personal relevance of what they were learning showed more interest and better grades, especially students who started out less confident. Effects vary.", src: "Hulleman & Harackiewicz, 2009" },
  { id: "c8", text: "“The hardest tasks should always be done in the first 8 hours after you wake up.”", a: "N", why: "This is not established. People differ, and teens' body clocks tend to run later. Find your own high-energy window by experimenting. Sleep (8 to 10 hours is recommended for teens) matters more than clock tricks.", src: "American Academy of Sleep Medicine consensus" },
  { id: "c9", text: "“Being kind to yourself after a setback makes you less likely to try again.”", a: "H", why: "In one study, self-compassion after a failure led to more effort to improve, not less.", src: "Breines & Chen, 2012" },
  { id: "c10", text: "“Energy drinks and supplements are a good shortcut for motivation.”", a: "H", why: "No product replaces sleep, food, planning, and support. Caffeine and stimulant products carry real risks for teens. Talk with a doctor or school nurse about any product.", src: "General health guidance" }
];
const RED_FLAGS = [
  "It's based on just one study",
  "It was only tested on animals",
  "It uses a number that sounds too neat",
  "Someone is selling something",
  "It says “always” or “never”"
];

const OBST_EVENTS = [
  { day: "Monday", ev: "Friends invite Jordan to hang out right after school.", opts: [
    { t: "Say no and study anyway: “I never miss.”", st: "full", fb: "That can work on some days. But “never miss” plans snap easily, and one slip can feel like the whole plan broke." },
    { t: "Say “I'll join at 5:00, after 25 minutes at the library.”", st: "full", best: true, fb: "Flexible and specific. Jordan keeps the plan and the friendship by moving the time, not dropping the goal." },
    { t: "Go out and think, “This week is already ruined.”", st: "miss", fb: "One missed day turns into a missed week when the thought is all-or-nothing. The plan needed a backup, not a verdict." } ] },
  { day: "Tuesday", ev: "Practice runs late. Jordan gets home tired at 6:00.", opts: [
    { t: "Do a 10-minute version after a snack, then rest.", st: "short", best: true, fb: "A smaller version keeps the habit alive on a hard day. Short sessions still count." },
    { t: "Skip it and promise to do double tomorrow.", st: "miss", fb: "Doubling up sounds responsible but tends to make tomorrow harder. Making up missed days often leads to quitting." },
    { t: "Force the full 25 minutes while exhausted.", st: "full", fb: "This may work today, but it is costly. If every tired day needs full effort, the plan gets hard to repeat." } ] },
  { day: "Wednesday", ev: "Jordan's phone buzzes with the group chat during study time.", opts: [
    { t: "Put the phone in the backpack across the room, then start.", st: "full", best: true, fb: "Adding friction between you and the distraction is a system change. It beats relying on willpower." },
    { t: "Take a quick peek, then go back to work.", st: "miss", fb: "A “quick peek” often turns into twenty minutes. The cue is strong and the phone is easy to reach." },
    { t: "Keep the phone face-down on the desk.", st: "short", fb: "Better than nothing, but it is still within reach. Jordan got through part of the session." } ] },
  { day: "Thursday", ev: "A family event takes the whole evening.", opts: [
    { t: "Do a 10-minute version before leaving.", st: "short", best: true, fb: "A small version keeps the chain going. It does not need to be perfect." },
    { t: "Skip tonight with no guilt and restart tomorrow at the usual time.", st: "rest", best: true, fb: "A planned skip with a clear restart is a flexible choice. Notice, don't make it up, and restart small." },

function safeName() { return (S.name.last + "-" + S.name.first).trim().replace(/[^A-Za-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "Student"; }

const LAST = MODS.length - 1;

    () => [h("h1", null, "How to use this (3 of 3): shortcuts"), h("table", { class: "t" }, h("tbody", null, [["Enter or →", "Next"], ["←", "Back"], ["M", "Menu"], ["?", "This help"]].map(([k, v]) => h("tr", null, h("td", null, h("span", { class: "kbd" }, k)), h("td", null, v))))), P("Shortcuts turn off while you're typing in a box. You can close the tab and come back; your progress is saved on this computer.")]

document.addEventListener("keydown", (e) => {
