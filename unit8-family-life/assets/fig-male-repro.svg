<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-labelledby="t d">
  <title id="t">Male reproductive system, side view cross-section (simplified schematic)</title>
  <desc id="d">A simplified side-view cross-section. A rounded sac sits at the top, with a small round gland below it. A narrow tube runs from the sac through the gland and along the long outer organ to its tip. In the pouch below, a large oval organ has a coiled tube along its back, and a second narrow tube rises from the coiled tube and loops up behind the sac.</desc>
