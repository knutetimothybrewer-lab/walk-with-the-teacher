<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Long Game</title>
<meta name="description" content="An educational life simulation for ages 14-18: small choices compound, obstacles happen to everyone, and many paths are valid.">
<style>
:root{--bg:#0d1830;--panel:#15244a;--panel2:#1c3060;--ink:#f3f6fc;--muted:#b9c5e0;--line:#3a508a;--accent:#ffb020;--acc-ink:#1a1300;--good:#52e0aa;--bad:#ff8a80;--info:#8fd0ff;--btn:#243b74;--btn-h:#2f4c96;--focus:#9ddcff;--spd:1}
body.hc{--bg:#000;--panel:#000;--panel2:#0d0d0d;--ink:#fff;--muted:#f0f0f0;--line:#fff;--accent:#ffd400;--btn:#000;--btn-h:#262626;--focus:#00e5ff;--good:#3dff9e;--bad:#ff6b6b;--info:#7fe0ff}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;min-height:100vh}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-70px;background:var(--accent);color:var(--acc-ink);padding:8px 12px;border-radius:8px;z-index:60}.skip:focus{top:8px}
.top{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:2px solid var(--line);flex-wrap:wrap;background:var(--panel)}
.brand{margin:0;font-size:1.3rem;font-weight:800;font-style:italic;letter-spacing:.3px}.brand span{color:var(--accent)}
.tools{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.tools button{min-height:40px;padding:4px 10px;font-size:.9rem}
button{font:inherit;color:var(--ink);background:var(--btn);border:2px solid var(--line);border-radius:10px;padding:6px 12px;min-height:44px;cursor:pointer;transition:background .15s,transform .1s}
button:hover:not(:disabled){background:var(--btn-h)}button:active:not(:disabled){transform:translateY(1px)}button:disabled{cursor:default}
button[aria-pressed="true"],button[aria-checked="true"]{border-color:var(--accent)}
.primary{background:var(--accent);color:var(--acc-ink);border-color:var(--accent);font-weight:700}.primary:hover:not(:disabled){background:#ffc24d}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-areas:"stage side" "beat side";gap:12px;padding:12px;max-width:1380px;margin:0 auto;align-items:start}
.stageCol{grid-area:stage}#side{grid-area:side}#beat{grid-area:beat}
@media (max-width:920px){.grid{grid-template-columns:minmax(0,1fr);grid-template-areas:"stage" "side" "beat"}}
#stage{position:relative;width:min(100%,calc(52vh*16/9));min-width:min(100%,300px);aspect-ratio:16/9;margin:0 auto;border-radius:14px;overflow:hidden;border:2px solid var(--line);background:#000}
#stage svg,#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1s}
#stage[data-fx="rain"]::after{background:rgba(30,50,110,.25);opacity:1}
#stage[data-fx="rays"]::after{background:linear-gradient(115deg,rgba(255,224,150,.28),rgba(255,224,150,0) 60%);opacity:1}
.tl{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .5s}.tl.on{opacity:1}
.tl div{background:rgba(8,14,34,.82);padding:12px 24px;border-radius:14px;text-align:center;border:2px solid var(--accent)}
.tl b{display:block;font-size:1.6rem;font-style:italic}.tl span{color:var(--muted)}
.badge{position:absolute;left:10px;top:10px;background:rgba(8,14,34,.78);padding:4px 12px;border-radius:999px;font-size:.9rem;font-weight:700}
.beatCard{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:16px 18px;max-width:900px;margin:0 auto}
.fadeUp{animation:fadeUp calc(.5s/var(--spd)) both}@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.chip{display:inline-block;font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.chip.ev{background:var(--accent);color:var(--acc-ink);border-color:var(--accent)}
.beatCard h2{margin:8px 0 6px;font-size:1.35rem}.beatCard p{font-size:1.1rem;margin:.4em 0;max-width:68ch}
.note{border-left:4px solid var(--info);padding:6px 12px;background:var(--panel2);border-radius:0 8px 8px 0;font-size:.95rem;color:var(--muted)}
.think{font-style:italic;color:var(--info)}
.opts{display:grid;gap:10px;margin-top:12px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;min-height:58px;padding:10px 14px;font-size:1.05rem;width:100%}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;background:var(--panel);border:2px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:.9rem}
.opt.picked{border-color:var(--accent);background:var(--panel2)}.opt.dim{opacity:.5}
.outcome{margin-top:12px;padding:10px 14px;border-radius:10px;background:var(--panel2);border:2px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.hud,.creator{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px 14px}
@media (min-width:921px){#side{position:sticky;top:8px}}
.hud h2,.creator h2{font-size:1.1rem;margin:0 0 6px}
.hrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:6px 0;border-top:1px solid var(--line);position:relative}
.hrow:first-of-type{border-top:0}
.hl{color:var(--muted);font-size:.85rem}.hv{font-weight:800;font-size:1.15rem;font-variant-numeric:tabular-nums}
.hv.neg{color:var(--bad)}
.hsub{font-size:.9rem;font-weight:600;text-align:right}
.bar{height:10px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--good);width:0;transition:width calc(.8s/var(--spd))}
.hbody{display:flex;gap:10px;align-items:center;padding:6px 0}.hbody svg{flex:none;width:58px;height:100px}
.people{display:flex;gap:2px}.people svg{width:14px;height:22px}
.delta{position:absolute;right:0;top:-4px;font-weight:800;font-size:.95rem;pointer-events:none;animation:floatUp calc(2s/var(--spd)) forwards;text-shadow:0 1px 2px #000}
.delta.g{color:var(--good)}.delta.b{color:var(--bad)}
@keyframes floatUp{0%{opacity:0;transform:translateY(8px)}15%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}
.pill{display:inline-block;padding:1px 10px;border-radius:999px;border:2px solid var(--accent);font-weight:700;font-size:.85rem}
.field{margin:10px 0}.field>label,.field>legend,legend{display:block;font-weight:700;margin-bottom:4px}
fieldset{border:0;margin:10px 0;padding:0}
input[type=text]{font:inherit;width:100%;padding:8px 10px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);min-height:44px}
.sw{display:flex;gap:8px;flex-wrap:wrap}.sw button{min-width:44px;padding:0 8px}
.sw .c{width:44px;padding:0;border-radius:50%}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{flex:1;min-width:84px}
.hint{color:var(--muted);font-size:.85rem}
.rv{max-width:1100px;margin:0 auto;padding:14px}.rv h1{font-style:italic;margin:.2em 0}
.rvs{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}.rvs h2{margin-top:0}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.chart svg{width:100%;height:auto}.chart h3{margin:0 0 4px;font-size:1rem}
.ln{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.tip{position:fixed;z-index:70;background:#000;color:#fff;border:1px solid #fff;padding:4px 8px;border-radius:6px;font-size:.85rem;pointer-events:none}
.tbl{width:100%;border-collapse:collapse;font-size:.85rem}.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:3px 6px;text-align:right}.tbl th:first-child,.tbl td:first-child{text-align:left}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.9rem;color:var(--muted);margin:6px 0}
.legend i{display:inline-block;width:12px;height:12px;vertical-align:-1px;margin-right:4px}
.mk:focus{outline:none}.mk:focus-visible{outline:3px solid var(--focus)}
ol.moments{columns:2;column-gap:20px;padding-left:22px}ol.moments li{break-inside:avoid;margin-bottom:6px}
@media (max-width:700px){ol.moments{columns:1}}
.qs li{margin:8px 0}
#debug{position:fixed;right:8px;bottom:8px;width:390px;max-width:calc(100vw - 16px);max-height:82vh;overflow:auto;z-index:80;background:#06101f;border:2px solid var(--accent);border-radius:12px;padding:10px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;color:#e8f0ff}
#debug h3{margin:8px 0 2px;font-size:12px;color:var(--accent)}#debug button{min-height:30px;font-size:12px;padding:2px 8px;margin:2px}
#debug .ab{display:flex;align-items:center;gap:6px}#debug .ab i{display:block;height:8px;background:var(--info)}
body.reduced *{animation:none!important;transition:none!important}
body.reduced .delta{animation:none!important;opacity:1;position:static;display:inline-block;margin-left:6px}
body.reduced .fadeUp{animation:none!important}
@media print{.top,#debug{display:none}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to main content</a>
<header class="top">
  <h1 class="brand">The Long <span>Game</span></h1>
  <div class="tools" role="toolbar" aria-label="Settings">
    <button id="btnSpeed" aria-pressed="false" title="Make animations and pauses shorter (good for demos)">Speed: Normal</button>
    <button id="btnMotion" aria-pressed="false" title="Turn motion effects on or off">Motion: On</button>
    <button id="btnSound" aria-pressed="false" title="Soft ambient music">Sound: Off</button>
    <button id="btnHC" aria-pressed="false" title="High-contrast colors">High contrast: Off</button>
    <button id="btnNew" title="Start over">New game</button>
  </div>
</header>
<main id="main" tabindex="-1">
  <div id="play" class="grid">
    <div class="stageCol">
      <div id="stage" data-fx="">
        <svg id="scene" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <defs>
            <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1"><stop id="sk1" offset="0" stop-color="#6fb4f5"/><stop id="sk2" offset="1" stop-color="#d4ebff"/></linearGradient>
            <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
          </defs>
          <rect width="800" height="450" fill="url(#gSky)"/>
          <g id="gStars"></g>
          <g id="gSun"><circle r="46" fill="#fff3c4" opacity=".25"/><circle r="26" fill="#ffe9a8"/></g>
          <g id="gMoon"><circle r="22" fill="#eef2ff"/><circle cx="8" cy="-4" r="20" fill="#16204d" opacity=".0"/></g>
          <g id="Lfar"><g id="clouds"></g><g id="farA"></g></g>
          <g id="Lmid"><g id="midA"></g></g>
          <g id="Lnear"><g id="nearA"></g></g>
          <rect id="night" width="800" height="450" fill="#070d26" opacity="0"/>
          <g id="Lav"></g>
          <g id="Lfront"></g>
        </svg>
        <canvas id="fxc" aria-hidden="true"></canvas>
        <div class="badge" id="badge" aria-hidden="true"></div>
        <div class="tl" id="tl" aria-hidden="true"><div><b></b><span></span></div></div>
      </div>
      <p class="sr" id="stageDesc"></p>
    </div>
    <aside id="side" aria-label="Character and life dashboard"></aside>
    <section id="beat" aria-label="Story"></section>
  </div>
  <div id="review" hidden></div>
</main>
<div id="debug" role="dialog" aria-label="Teacher debug panel" hidden></div>
<div id="live" class="sr" aria-live="polite" role="status"></div>
<noscript><p style="padding:20px">This simulation needs JavaScript.</p></noscript>

<!-- ======================================================================
     CONTENT CONFIG  — edit this block to change/add scenes, choices, events.
     (See the "How to add content" notes in the project README / chat.)
     ====================================================================== -->
<script id="content">
const CONFIG = {
  /* ---------- core numbers ---------- */
  axes: {                       // hidden momentum axes (0..axisMax). Revealed only in the debrief.
    fin:  { label: 'Financial Stability',      short: 'Money',  blurb: 'saving, debt, and how well money can absorb surprises' },
    phys: { label: 'Physical Health Habits',   short: 'Body',   blurb: 'sleep, movement, and getting care when you need it' },
    ment: { label: 'Mental Resilience',        short: 'Mind',   blurb: 'coping skills and being willing to ask for help' },
    rel:  { label: 'Relationships & Support',  short: 'People', blurb: 'friends, family, mentors, and community' },
    skill:{ label: 'Skill & Career Capital',   short: 'Skills', blurb: 'what you know, what you can do, and who knows it' }
  },
  axisMax: 30, axisStart: 12, maxStep: 5,   // no choice moves an axis more than maxStep (≈17% of range)
  locMult: { city: 1.12, suburb: 1.05, town: 1, rural: 0.92 },       // income by place
  locSave: { city: -0.03, suburb: -0.01, town: 0, rural: 0.02 },     // savings rate by place
  houseSave: { family: 0.08, dorm: 0, rent: 0, shared: 0.05, own: 0.03 },
  locName: { city: 'City', suburb: 'Suburb', town: 'Small town', rural: 'Rural area' },
  houseName: { family: 'Living with family', dorm: 'Campus housing', rent: 'Renting', shared: 'Shared housing', own: 'Owns a home' },

  /* ---------- starting traits (student picks) ---------- */
  traits: {
    risk:   { label: 'Risk tolerance', levels: ['Cautious', 'Balanced', 'Bold'],
              blurb: ['likes to play it safe', 'weighs both sides', 'likes big swings'],
              fx: [{ fin: 2, skill: -1 }, {}, { fin: -1, skill: 1, ment: 1 }] },
    family: { label: 'Family support', levels: ['Limited', 'Steady', 'Strong'],
              blurb: ['has less family support to lean on', 'has steady family support', 'has a strong family support system'],
              fx: [{ rel: -3, ment: -1 }, {}, { rel: 3, ment: 1, fin: 1 }] },
    money:  { label: 'Money at home', levels: ['Tight', 'Okay', 'Comfortable'],
              blurb: ['grew up with tight money', 'grew up with enough money', 'grew up comfortable'],
              fx: [{ fin: -3 }, {}, { fin: 3 }], cash: [0, 500, 2500] }
  },
  looks: {
    skin: ['#f6d5b8', '#e8b98f', '#c98e63', '#a8683f', '#7a4a2c', '#4f2e1c'],
    hair: ['#1b1b1f', '#4a2c1a', '#8a5a2b', '#c9a24b', '#b5502d', '#9aa0aa'],
    style: ['short', 'long', 'curly', 'bun'],
    accent: ['#3b5b9a', '#7a3b6e', '#2f7f6f', '#b0533a', '#555b6b']
  },
  names: ['Amara', 'Mateo', 'Priya', 'Jordan', 'Mei', 'Dre', 'Sofia', 'Kofi', 'Layla', 'Noah', 'Tariq', 'Rosa', 'Aiko', 'Sam'],

  /* ---------- life stages & beat plan ----------
     Each plan slot: ['D', kind] decision of kind neutral|tilted|clear, ['D','=id'] a fixed decision,
     ['E', tone] event of tone bad|good|any. A queued follow-up (from an event) takes the next
     non-clear, non-fixed decision slot. */
  stages: [
    { id: 'teen',   label: 'Late Teens',     short: '17–19', start: 17, end: 20, blurb: '{name} is almost grown. Choices here open doors, but nothing is locked.',
      plan: [['D','tilted'],['E','any'],['D','=fork_hs']] },
    { id: 'early',  label: 'Early Twenties', short: '20–24', start: 20, end: 25, blurb: 'Independence arrives, along with rent, schedules, and big questions.',
      plan: [['D','neutral'],['D','clear'],['E','bad'],['D','tilted']] },
    { id: 'late',   label: 'Late Twenties',  short: '25–29', start: 25, end: 30, blurb: 'Habits set in. People start to compare paths, and no two look alike.',
      plan: [['D','neutral'],['E','good'],['D','neutral'],['E','bad'],['D','neutral']] },
    { id: 'thirty', label: 'Thirties',       short: '30–39', start: 30, end: 40, blurb: 'Years move faster. Responsibilities grow, and so do rewards.',
      plan: [['D','neutral'],['E','any'],['D','tilted'],['D','clear']] },
    { id: 'forty',  label: 'Forties',        short: '40–49', start: 40, end: 50, blurb: 'Time to look at what has been built and what still matters.',
      plan: [['D','neutral'],['E','bad'],['D','neutral'],['E','any'],['D','tilted']] },
    { id: 'fifty',  label: 'Age 50',         short: '50',    start: 50, end: 50, blurb: '', plan: [] }
  ],

  /* ---------- arcs & jobs ---------- */
  arcs: {
    college: { label: 'College-to-career',   desc: 'Debt and delayed income early, higher skill capital and a different network later.' },
    trade:   { label: 'Trade / service',     desc: 'Paid training, earlier income and hands-on skill, with physical wear to manage.' },
    work:    { label: 'Workforce-first',     desc: 'Income right away and little debt, with a slower climb unless new skills are added.' },
    founder: { label: 'Entrepreneur',        desc: 'High variety and high variance: freedom and risk arrive together.' },
    care:    { label: 'Family / caregiver',  desc: 'Deep ties and purpose, with lower income and fewer career doors early on.' }
  },
  jobs: {   // by arc, then stage index 0..5. emp defaults to 'Employed'.
    school:  [{ title: 'High school student', inc: 3000, emp: 'Student' }],
    college: [{ title: 'College student', inc: 4000, emp: 'Student' }, { title: 'College student', inc: 9000, emp: 'Student' }, { title: 'Early-career professional', inc: 56000 }, { title: 'Senior specialist', inc: 84000 }, { title: 'Department lead', inc: 102000 }, { title: 'Experienced professional', inc: 110000 }],
    trade:   [{ title: 'Apprentice / service recruit', inc: 18000 }, { title: 'Apprentice, then journey-level', inc: 40000 }, { title: 'Licensed tradesperson', inc: 64000 }, { title: 'Crew lead', inc: 80000 }, { title: 'Master tradesperson', inc: 90000 }, { title: 'Master tradesperson', inc: 94000 }],
    work:    [{ title: 'Part-time cashier', inc: 13000 }, { title: 'Warehouse / retail associate', inc: 31000 }, { title: 'Shift supervisor', inc: 43000 }, { title: 'Operations coordinator', inc: 57000 }, { title: 'Operations manager', inc: 68000 }, { title: 'Operations manager', inc: 72000 }],
    founder: [{ title: 'Student & side-hustler', inc: 5000, emp: 'Student' }, { title: 'Founder (early days)', inc: 17000, emp: 'Self-employed' }, { title: 'Small-business owner', inc: 46000, emp: 'Self-employed' }, { title: 'Business owner', inc: 78000, emp: 'Self-employed' }, { title: 'Business owner', inc: 96000, emp: 'Self-employed' }, { title: 'Business owner', inc: 102000, emp: 'Self-employed' }],
    care:    [{ title: 'Part-time worker & family helper', inc: 11000 }, { title: 'Part-time worker & caregiver', inc: 22000 }, { title: 'Home health aide', inc: 35000 }, { title: 'Care coordinator', inc: 48000 }, { title: 'Care coordinator', inc: 56000 }, { title: 'Care coordinator', inc: 58000 }]
  },

  /* ---------- DECISIONS ----------
     kind: neutral | tilted | clear   (hidden from players)
     Option fields: text, out, ax:{fin,phys,ment,rel,skill} (±1–3, big ones up to 5),
       v:{hp,ful,sup,cash,debt,hi,mult,tmp,pur}, set:{arc,loc,housing,flags,unflags,title,queue},
       roll:{p,hit:{out,ax,v,set},miss:{...}}, fn:(s)=>{}, tag:'recovery'|'temptation', pose, fx   */
  decisions: {
    hs_stress: { kind: 'tilted', stages: [0], title: 'Finals pressure', scene: 'school', help: true,
      text: "Finals week is here, and {name} has three big tests and a pile of worry. Sleep has been short and the pressure keeps building.",
      note: "Feeling overwhelmed is normal. A school counselor, teacher, or other trusted adult can help with stress.",
      options: [
        { text: "Tell a counselor, teacher, or family member how much pressure I'm under.", out: "{name} admitted it was a lot, and someone helped break the week into smaller pieces.", ax: { ment: 2, rel: 1 }, v: { hp: 3, sup: 4 }, tag: 'recovery' },
        { text: "Make a study plan with a few classmates.", out: "Studying together made the material stick, and the group chat turned into real friendships.", ax: { skill: 2, rel: 1 }, v: { ful: 2, sup: 3 } },
        { text: "Stay up all night cramming and keep it to myself.", out: "{name} got through the tests on caffeine and nerves, but felt wrung out for days.", ax: { skill: 1, phys: -2, ment: -1 }, v: { hp: -6, ful: -2 } }
      ] },
    hs_friend: { kind: 'tilted', stages: [0], title: 'Friend fight', scene: 'school',
      text: "{name} and a close friend had an argument over something small that snowballed. Now the group chat is quiet and school feels awkward.",
      options: [
        { text: "Reach out first and apologize for my part.", out: "The apology was awkward but honest, and the friendship came back a little stronger.", ax: { rel: 2, ment: 1 }, v: { sup: 5, ful: 3 } },
        { text: "Wait for them to make the first move.", out: "Days turned into weeks, and the friendship cooled even though nobody was really angry.", ax: { rel: -1 }, v: { sup: -3 } },
        { text: "Vent online and pull other friends into it.", out: "The drama spread fast and people picked sides. {name} felt more alone than before.", ax: { rel: -2, ment: -1 }, v: { sup: -6, ful: -3 } }
      ] },
    fork_hs: { kind: 'neutral', stages: [0], title: 'What comes after graduation', scene: 'school', fixed: true,
      text: "Graduation is a few weeks away. Everyone keeps asking {name} the same question: \"So, what's next?\" Several roads look good, and each one costs something different.",
      think: "Which cost are you most comfortable carrying: debt, a slower start, distance from home, or uncertainty?",
      options: [
        { text: "Go to a four-year college.", out: "{name} packed up for campus with loans and big plans. A full paycheck was years away, but so were new people and new skills.", ax: { skill: 3, fin: -2, rel: 1 }, v: { ful: 3 }, set: { arc: 'college', housing: 'dorm' }, fn: s => { s.debt += [30000, 22000, 9000][s.traits.money]; } },
        { text: "Learn a trade, or join an apprenticeship or national service.", out: "{name} signed up to learn by doing, and got paid a little while training.", ax: { skill: 2, phys: 2, fin: 2 }, v: { cash: 1500, ful: 2 }, set: { arc: 'trade', housing: 'shared' } },
        { text: "Start working full-time right away.", out: "A steady paycheck started immediately, and {name} loved the freedom of earning their own money.", ax: { fin: 3, skill: 1 }, v: { cash: 3000, ful: 2 }, set: { arc: 'work', housing: 'family' } },
        { text: "Stay close to home, help my family, and work part-time.", out: "{name} stayed close, picking up shifts and helping at home. Family ties deepened, even as some other doors stayed closed for now.", ax: { rel: 3, ment: 1, fin: -1 }, v: { sup: 8, ful: 3, pur: 4 }, set: { arc: 'care', housing: 'family' } }
      ] },

const abs = o => Object.values(o).reduce((a, b) => a + Math.abs(b), 0);

  const rank = Object.keys(CONFIG.axes).map(k => ({ k, d: S.ax[k] - S.ax0[k] })).sort((a, b) => Math.abs(b.d) - Math.abs(a.d)).slice(0, 2);
  rank.forEach(({ k, d }) => {

    out.push(`${CONFIG.axes[k].label} (${CONFIG.axes[k].blurb}) moved from ${S.ax0[k].toFixed(1)} to ${S.ax[k].toFixed(1)} out of ${CONFIG.axisMax}. ${n} separate choices touched it, and none moved it by more than ${CONFIG.maxStep} points. About ${p >= 0 ? '+' : '−'}${Math.abs(p).toFixed(1)} points came purely from habits feeding each other: sleep helps mood, mood helps work, friends help both. That is compounding.`);
  });

  out.push(`Of the ${ch.length} decisions, ${kc.neutral} were forks where neither option was better, just different (each traded one set of benefits and risks for another), ${kc.tilted} gently favored one direction, and ${kc.clear} had a clearly safer option.`);
  const first = S.arcLog[0], arcs30 = S.arcAt30 && CONFIG.arcs[S.arcAt30];

  const bad = ev.filter(x => x.tone !== 'good');
  if (bad.length) { const av = bad.reduce((a, x) => a + x.sev, 0) / bad.length; out.push(`${bad.length} hard events arrived no matter what. On average they landed ${Math.abs(Math.round((av - 1) * 100))}% ${av < 1 ? 'softer' : 'harder'} than a typical hit, because resilience (mental coping, relationships, and financial cushion) controls how hard hardship lands and how fast health bounces back.`); }
  return out;
}

function chart(o) {

function radar() {

  const P = (vals, k) => vals.map((v, i) => `${(cx + Math.cos(ang(i)) * R * v / CONFIG.axisMax * k).toFixed(1)},${(cy + Math.sin(ang(i)) * R * v / CONFIG.axisMax * k).toFixed(1)}`).join(' ');

  g += keys.map((k, i) => `<line x1="${cx}" y1="${cy}" x2="${cx + Math.cos(ang(i)) * R}" y2="${cy + Math.sin(ang(i)) * R}" style="stroke:var(--line)"/><text x="${cx + Math.cos(ang(i)) * (R + 16)}" y="${cy + Math.sin(ang(i)) * (R + 16) + 4}" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--ink)">${CONFIG.axes[k].short} ${S.ax[k].toFixed(0)}</text>`).join('');

    <polygon points="${P(keys.map(k => S.ax0[k]), 1)}" fill="none" style="stroke:var(--info)" stroke-width="2" stroke-dasharray="5 4"/><polygon id="rdEnd" points="${P(keys.map(k => S.ax[k]), 0)}" fill="rgba(255,176,32,.35)" style="stroke:var(--accent)" stroke-width="3"/></svg>`;

}
function showReview() {
  S.phase = 'review'; save(); FX.set(null, 0); $('#play').hidden = true;

  rv.innerHTML = `<div class="rv"><h1>Your Life in Review: ${esc(S.name)}</h1>
  <div class="rvs"><h2>${esc(P.title)}</h2><p>${esc(fmt(P.desc, S))}</p><p><b>Strengths:</b> ${esc(fmt(P.bright, S))}<br><b>Still open:</b> ${esc(fmt(P.open, S))}</p>

  <div class="rvs"><h2>How health, money, and meaning changed</h2><div class="legend"><span>Dashed vertical lines mark life events: <b style="color:#52e0aa">good</b>, <b style="color:#ff8a80">hard</b>, or <b style="color:#8fd0ff">mixed</b>.</span></div>
   <div class="charts">${chart({ key: 'hp', title: 'Health', color: '#4cd6a0', fmt: x => Math.round(x), fixed: true })}${chart({ key: 'income', title: 'Income per year', color: '#ffb020', fmt: x => (x < 0 ? '−' : '') + '$' + (Math.abs(x) >= 1000 ? Math.round(Math.abs(x) / 1000) + 'k' : Math.round(Math.abs(x))), zero: true })}${chart({ key: 'net', title: 'Net worth', color: '#8fd0ff', fmt: x => (x < 0 ? '−' : '') + '$' + (Math.abs(x) >= 1000 ? Math.round(Math.abs(x) / 1000) + 'k' : Math.round(Math.abs(x))), zero: true })}</div>
   <details><summary>Show the numbers as a table</summary><table class="tbl"><thead><tr><th>Age</th><th>Health</th><th>Income</th><th>Net worth</th><th>Fulfillment</th></tr></thead><tbody>${S.series.map(p => `<tr><td>${Math.floor(p.age)}</td><td>${Math.round(p.hp)}</td><td>${money(p.income)}</td><td>${money(p.net)}</td><td>${Math.round(p.ful)}%</td></tr>`).join('')}</tbody></table></details></div>
  <div class="rvs"><h2>The hidden momentum, revealed</h2><p>During the game, five invisible scores quietly moved a little with every choice. Here they are.</p><div class="legend"><span><i style="background:var(--accent)"></i>Age 50</span><span><i style="background:transparent;border:2px dashed var(--info)"></i>Where ${esc(S.name)} started</span></div>
   <div style="display:flex;flex-wrap:wrap;gap:16px;align-items:center">${rd.svg}<table class="tbl" style="flex:1;min-width:260px"><thead><tr><th>Axis</th><th>Start</th><th>Age 50</th></tr></thead><tbody>${Object.keys(CONFIG.axes).map(k => `<tr><td>${CONFIG.axes[k].label}</td><td>${S.ax0[k].toFixed(1)}</td><td>${S.ax[k].toFixed(1)}</td></tr>`).join('')}</tbody></table></div></div>
  <div class="rvs"><h2>How small choices added up</h2>${explain().map(t => `<p>${esc(t)}</p>`).join('')}</div>
  <div class="rvs"><h2>What was outside ${esc(S.name)}'s control</h2><p>These things happened with no choice involved. What ${esc(S.name)} did next, and how prepared they were to absorb it, is where choices mattered.</p><ul>${S.hist.filter(x => x.kind === 'event').map(x => {
    const bits = []; if (Math.abs(x.dv.hp) >= 1) bits.push(`health ${sgn(Math.round(x.dv.hp))}`); if (Math.abs(x.dv.net) >= 100) bits.push(`net worth ${x.dv.net < 0 ? '−' : '+'}${money(Math.abs(x.dv.net))}`); if (Math.abs(x.dv.ful) >= 1) bits.push(`fulfillment ${sgn(Math.round(x.dv.ful))}`);
    return `<li><b>Age ${x.age}: ${esc(x.title)}</b> (${x.tone === 'good' ? 'good luck' : x.tone === 'bad' ? 'hardship' : 'mixed'})${bits.length ? ' · ' + bits.join(', ') : ''}. ${esc(x.out)}</li>`; }).join('')}</ul></div>
  <div class="rvs"><h2>Questions for discussion</h2><ol class="qs">${CONFIG.questions.map(q => `<li>${esc(q)}</li>`).join('')}</ol>
   <p class="hint">If anything in this activity stirred up real feelings, a school counselor or other trusted adult is a good person to talk to.</p></div>
  <div class="row"><button class="primary" id="btnReplay" type="button">Replay with a different starting point</button><button id="btnExport" type="button">Export summary (.txt)</button><button id="btnPrint" type="button">Print this page</button></div></div>`;
  // timeline
  const X0 = 40, XW = 880, xa = a => X0 + (a - 17) / 33 * XW, hist = S.hist; let t = `<svg viewBox="0 0 960 230" role="group" aria-label="Timeline of ${esc(S.name)}'s life from age 17 to 50" style="width:100%;height:auto">`;
  CONFIG.stages.slice(0, 5).forEach((st, i) => { t += `<rect x="${xa(st.start)}" y="14" width="${xa(st.end) - xa(st.start)}" height="170" style="fill:var(--panel2)" opacity="${i % 2 ? 0.35 : 0.8}"/><text x="${(xa(st.start) + xa(st.end)) / 2}" y="30" text-anchor="middle" font-size="12" style="fill:var(--muted)">${st.short}</text>`; });

  for (let i = 0; i < log.length - 1; i++) t += `<rect x="${xa(log[i].age)}" y="196" width="${xa(log[i + 1].age) - xa(log[i].age)}" height="12" rx="3" fill="${AC[log[i].arc]}"/><text x="${xa(log[i].age) + 4}" y="224" font-size="11" style="fill:var(--muted)">${CONFIG.arcs[log[i].arc].label}</text>`;
  hist.forEach((x, i) => {
    const px = xa(x.age + (x.stage === 0 ? 0 : 0) + (i % 3) * 0.12), up = i % 2 === 0, py = up ? 62 : 136, lift = abs(x.dAx) ? sum(x.dAx) : 0;
    const col = x.kind === 'event' ? (x.tone === 'good' ? '#52e0aa' : x.tone === 'bad' ? '#ff8a80' : '#8fd0ff') : (lift >= 2 ? '#52e0aa' : lift <= -2 ? '#ff8a80' : '#8fd0ff');
    const shp = x.kind === 'event' ? `<path d="M${px} ${py - 14} L${px + 14} ${py} L${px} ${py + 14} L${px - 14} ${py}Z" fill="${col}" stroke="var(--bg)" stroke-width="2"/>` : `<circle cx="${px}" cy="${py}" r="12" fill="${col}" stroke="var(--bg)" stroke-width="2"/>`;
    t += `<g class="mk" tabindex="0" role="button" data-i="${i}" aria-label="${i + 1}. Age ${x.age}, ${x.kind === 'event' ? 'event' : 'choice'}: ${esc(x.title)}" style="cursor:pointer"><line x1="${px}" x2="${px}" y1="${py}" y2="99" style="stroke:var(--muted)" stroke-opacity=".6"/>${shp}<text x="${px}" y="${py + 4}" text-anchor="middle" font-size="11" font-weight="800" fill="#0d1830">${i + 1}</text></g>`;
  });
  $('#tlbox').innerHTML = t + '</svg>';
  const detail = i => { const x = hist[i]; $('#tlDetail').innerHTML = `<b>${i + 1}. Age ${x.age}: ${esc(x.title)}</b> <span class="chip">${x.kind === 'event' ? 'Happened to you' : 'Your choice'}</span><p>${x.kind === 'choice' ? 'You chose: <i>' + esc(x.text) + '</i>' : esc(x.text)}</p><p>${esc(x.out)}</p>`; };
  $$('#tlbox .mk').forEach(m => { const i = +m.dataset.i; m.onclick = () => detail(i); m.onfocus = () => detail(i); m.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); detail(i); } }; });
  $('#momList').innerHTML = hist.map((x, i) => `<li><b>Age ${x.age}: ${esc(x.title)}</b> (${x.kind === 'event' ? 'event' : 'choice'}). ${x.kind === 'choice' ? 'You chose: ' + esc(x.text) + ' ' : ''}${esc(x.out)}</li>`).join('');
  // chart tooltips + draw animation
  const tip = h('div', { class: 'tip', hidden: true }); document.body.append(tip);
  $$('.mk[data-tip]').forEach(c => { const sh = () => { const r = c.getBoundingClientRect(); tip.textContent = c.dataset.tip; tip.hidden = false; tip.style.left = Math.min(innerWidth - 220, r.left + 10) + 'px'; tip.style.top = (r.top - 34) + 'px'; }; c.onmouseenter = sh; c.onfocus = sh; c.onmouseleave = c.onblur = () => { tip.hidden = true; }; });
  $$('path[data-draw]').forEach(p => { const L = p.getTotalLength(); if (!App.reduced) { p.style.strokeDasharray = L; p.style.strokeDashoffset = L; Tween.add(1.8, e => { p.style.strokeDashoffset = L * (1 - e); }); } });
  Tween.add(1.6, rd.anim);
  $('#btnExport').onclick = () => { const a = h('a', { href: URL.createObjectURL(new Blob([exportText()], { type: 'text/plain' })), download: `the-long-game-${S.name.replace(/\W+/g, '-')}.txt` }); document.body.append(a); a.click(); a.remove(); };

  window.scrollTo(0, 0); $('#main').focus({ preventScroll: true });

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------------- teacher debug panel (Ctrl+Alt+Shift+D, Alt+Shift+D, or type "teacher") ---------------- */
const dbgEl = $('#debug');

  if (dbgEl.hidden) return;

  const m = modeOf(S);
  const bars = Object.keys(CONFIG.axes).map(k => `<div class="ab"><span style="width:92px">${CONFIG.axes[k].short}</span><i style="width:${S.ax[k] / CONFIG.axisMax * 150}px"></i> ${S.ax[k].toFixed(1)} <span style="color:#8aa">(start ${S.ax0[k].toFixed(1)}, drift ${S.pass[k].toFixed(1)})</span></div>`).join('');
  dbgEl.innerHTML = `<b style="font-size:14px">Teacher panel</b> <button id="dbgX">Close</button>
   <h3>Hidden axes (0–${CONFIG.axisMax})</h3>${bars}
   <h3>Trajectory</h3>Direction D=${m.D.toFixed(2)} · ${m.struggling ? 'STRUGGLING → recovery option injected' : m.thriving ? 'THRIVING → temptation injected' : 'neutral'}<br>Resilience ${resil(S).toFixed(2)} · hit severity ×${severity(S).toFixed(2)}<br>Health ${S.hp.toFixed(0)} · Fulfillment ${S.ful.toFixed(0)} · Support ${S.sup.toFixed(0)} · Cash ${fmtMoney(S.cash)} · Debt ${fmtMoney(S.debt + S.hi)}
   <h3>Position</h3>Stage ${S.stage} slot ${S.slot} · age ${S.age.toFixed(1)} · arc ${S.arc || '–'} (30: ${S.arcAt30 || '–'}) · mult ${S.mult.toFixed(2)} tmp ${S.tmp.toFixed(2)} · bizLuck ${S.bizLuck.toFixed(2)}<br>Flags: ${Object.keys(S.flags).join(', ') || '–'}<br>Queue: ${S.queue.join(', ') || '–'}<br>Seed ${S.seed}
   <h3>Last pool draw (id, weight)</h3>${S.dbg ? JSON.stringify(S.dbg.kind || S.dbg.tone) + ' ' + S.dbg.cands.map(c => c.join('=')).join(', ') : '–'}
   <h3>Current beat</h3>${S.cur ? S.cur.kind + ' ' + (S.cur.id || '') + (S.cur.refs ? ' options(hidden axis sums): ' + S.cur.refs.map(r => { const o = getOpt(CONFIG.decisions[S.cur.id], r); return sum(o.ax || {}); }).join(', ') : '') : '–'}
   <h3>Used</h3>Decisions ${Object.keys(S.used).join(', ') || '–'}<br>Events ${Object.keys(S.usedEv).join(', ') || '–'}
   <h3>Tools</h3><button id="dbgSim">Run 300 simulated lives</button><button id="dbgEnd">Fast-forward to ending</button><button id="dbgClr">Clear save</button><pre id="dbgOut" style="white-space:pre-wrap"></pre>`;
  $('#dbgX').onclick = () => { dbgEl.hidden = true; };

}
function toggleDebug() { dbgEl.hidden = !dbgEl.hidden; renderDebug(); }
let typed = '';
document.addEventListener('keydown', e => {
  if ((e.ctrlKey && e.altKey && e.shiftKey && e.code === 'KeyD') || (e.altKey && e.shiftKey && e.code === 'KeyD')) { e.preventDefault(); toggleDebug(); return; }

  if (/^[1-4]$/.test(e.key) && !e.ctrlKey && !e.metaKey && !e.altKey) { const b = $$('.opt:not(:disabled)')[+e.key - 1]; if (b) b.click(); return; }
