    '<div id="reveal"><button class="primary" id="show" style="width:100%">Show answer (Space)</button></div>'+
    '<div class="grades hidden" id="grades">'+
    ['Again','Hard','Good','Easy'].map((n,i)=>'<button class="g-'+n.toLowerCase()+'" data-g="'+i+'">'+n+'<small>'+(i+1)+' · '+preview(s,i)+'</small></button>').join('')+'</div>';
  $('show').onclick=reveal;
  st.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>grade(+b.dataset.g));
}
function reveal(){ if(!cur||shown)return; shown=true; $('ans').classList.remove('hidden'); $('grades').classList.remove('hidden'); $('reveal').classList.add('hidden'); }
function reviewAhead(){
  // weakest first: low ease / lapses / not yet solid; ignores due time
  const pool=deck.filter(c=>inScope(c)&&state.cards[c.id]).sort((a,b)=>{const A=state.cards[a.id],B=state.cards[b.id];return (A.ivl-B.ivl)||(B.lapses-A.lapses)||(A.ease-B.ease);});
  if(!pool.length){return;}
  cur=pool[0]; shown=false;
  // temporarily make due so grading works from here
  render();
}
function renderStats(){
  const all=counts(deck);
  const mature=deck.filter(c=>{const s=state.cards[c.id];return s&&s.state==='review'&&s.ivl>=3}).length;
  const days=Math.ceil((examDay()-today())/DAY);
  $('tiles').innerHTML=[['Due now',counts(deck.filter(inScope)).d],['New left',Math.max(0,Math.min(counts(deck.filter(inScope)).n,newLimit()-state.newCount))],['Seen',deck.filter(c=>state.cards[c.id]).length+' / '+deck.length],['Solid',mature]].map(t=>'<div class="tile"><b>'+t[1]+'</b><span>'+t[0]+'</span></div>').join('');
  $('countdown').innerHTML=(days>0?days+' day'+(days===1?'':'s')+' to exam':days===0?'Exam day':'Exam passed')+'<small>Wed Nov 25, 2026</small>';
  $('deckinfo').textContent=deck.length+' cards · 24 chapters';
  // chapter bars
  let html='';
  for(let i=1;i<=24;i++){
    const list=deck.filter(c=>c.ch===i); if(!list.length)continue;
    let m=0,y=0,l=0; for(const c of list){const s=state.cards[c.id]; if(!s)continue; if(s.state==='review'){ if(s.ivl>=3)m++; else y++; } else l++;}
    const t=list.length;
    html+='<button class="row" data-ch="'+i+'"><span>'+esc(CHAPTERS[i-1])+'</span><span class="track" role="img" aria-label="'+m+' solid, '+y+' learned, '+l+' learning of '+t+'"><i class="s-mature" style="width:'+(m/t*100)+'%"></i><i class="s-young" style="width:'+(y/t*100)+'%"></i><i class="s-learn" style="width:'+(l/t*100)+'%"></i></span><span class="pct">'+Math.round((m+y)/t*100)+'%</span></button>';
  }
  $('bars').innerHTML=html;
  $('bars').querySelectorAll('.row').forEach(r=>r.onclick=()=>{$('chsel').value=r.dataset.ch;chapter=r.dataset.ch;next();renderStats();window.scrollTo({top:0,behavior:'smooth'});});
}
// ---- setup
(function init(){
  const sel=$('chsel'); sel.innerHTML='<option value="all">All chapters</option>'+CHAPTERS.map((n,i)=>'<option value="'+(i+1)+'">'+esc(n)+'</option>').join('');
  sel.onchange=()=>{chapter=sel.value;next();renderStats();};
  $('newlim').onchange=()=>{next();renderStats();};
  $('bkcopy').onclick=async()=>{const t=JSON.stringify(state);try{await navigator.clipboard.writeText(t);$('bkmsg').textContent='Copied. Paste it somewhere safe.';}catch(e){$('bkbox').value=t;$('bkbox').select();$('bkmsg').textContent='Clipboard blocked. Backup is in the box below; copy it by hand.';}};
  $('bkload').onclick=()=>{try{const o=JSON.parse($('bkbox').value);if(!o||!o.cards)throw 0;state=o;save();next();renderStats();$('bkmsg').textContent='Restored '+Object.keys(o.cards).length+' cards.';}catch(e){$('bkmsg').textContent='That text is not a valid backup.';}};
  let armed=false;
  $('reset').onclick=()=>{ if(!armed){armed=true;$('reset').textContent='Click again to erase everything';setTimeout(()=>{armed=false;$('reset').textContent='Reset all progress';},4000);return;} state={cards:{},newDay:'',newCount:0};save();armed=false;$('reset').textContent='Reset all progress';next();renderStats(); };
  document.addEventListener('keydown',e=>{
    if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;
    if(e.code==='Space'){e.preventDefault();reveal();}
    else if(shown&&'1234'.includes(e.key)){grade(+e.key-1);}
  });
  next(); renderStats();
  setInterval(()=>{ if(!shown&&!cur){next();renderStats();} },30000);
})();
</script>
