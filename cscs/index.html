<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSCS Exam Drill</title>
<style>
/* Layout: single-column study deck; summary strip on top, card in the middle, chapter strength grid below. */
:root{
  --bg:#f4f5f2; --surface:#ffffff; --ink:#1b2320; --muted:#5d6a64; --line:#d9ded9;
  --accent:#1f6f5c; --accent-ink:#ffffff;
  --again:#b3402f; --hard:#a8741a; --good:#2f7d4f; --easy:#2a6a9e;
  --font-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --font-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121715; --surface:#1b2320; --ink:#e8ede9; --muted:#9aa8a0; --line:#2e3935;
    --accent:#4fb99b; --accent-ink:#0c1512;
    --again:#e5705d; --hard:#d9a443; --good:#5dbb83; --easy:#6aaee0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121715; --surface:#1b2320; --ink:#e8ede9; --muted:#9aa8a0; --line:#2e3935;
  --accent:#4fb99b; --accent-ink:#0c1512;
  --again:#e5705d; --hard:#d9a443; --good:#5dbb83; --easy:#6aaee0;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.5}
body{padding:16px 16px 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:var(--font-display);margin:0;letter-spacing:.02em;text-wrap:balance}
h1{font-size:30px;line-height:1.1}
h2{font-size:20px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:8px}
.countdown{font-family:var(--font-display);font-size:22px;color:var(--accent)}
.countdown small{display:block;font-family:var(--font-body);font-size:13px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.tile b{display:block;font-family:var(--font-display);font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
label{font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center}
select,input[type=number]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
input[type=number]{width:76px}
textarea{width:100%;min-height:90px;font:13px/1.4 ui-monospace,Menlo,monospace;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{min-height:220px;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:8px 4px}
.chap{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.q{font-size:22px;font-weight:600;text-wrap:balance}
.a{font-size:19px;border-top:1px dashed var(--line);padding-top:14px}
.hidden{display:none}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grades button{display:flex;flex-direction:column;align-items:center;gap:0;padding:10px 4px;font-weight:600}
.grades small{font-weight:400;font-size:12px;color:var(--muted)}
.g-again{border-color:var(--again);color:var(--again)}
.g-hard{border-color:var(--hard);color:var(--hard)}
.g-good{border-color:var(--good);color:var(--good)}
.g-easy{border-color:var(--easy);color:var(--easy)}
.hint{font-size:13px;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:150px 1fr 54px;gap:10px;align-items:center;font-size:14px;cursor:pointer;background:none;border:0;padding:2px 0;text-align:left;color:var(--ink)}
.row:hover .track{outline:1px solid var(--accent)}
.track{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--bg);border:1px solid var(--line)}
.track i{display:block;height:100%}
.s-mature{background:var(--good)} .s-young{background:var(--easy)} .s-learn{background:var(--hard)}
.pct{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.done{text-align:center;padding:24px 8px;display:flex;flex-direction:column;gap:12px;align-items:center}
@media (max-width:520px){.tiles{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:110px 1fr 46px}.q{font-size:20px}}
@media (prefers-reduced-motion:no-preference){.track i{transition:width .3s}}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>CSCS Exam Drill</h1><div class="hint" id="deckinfo"></div></div>
    <div class="countdown" id="countdown"></div>
  </header>

  <div class="tiles" id="tiles"></div>

  <section class="panel" aria-label="Study session">
    <div class="controls">
      <label for="chsel">Chapter <select id="chsel"></select></label>
      <label for="newlim">New cards/day <input type="number" id="newlim" min="0" max="400" value="80"></label>
    </div>
    <div id="stage"></div>
  </section>

  <section class="panel" aria-label="Chapter strength">
    <h2>Chapter strength</h2>
    <div class="legend"><span><i class="s-mature"></i>Solid (3+ days)</span><span><i class="s-young"></i>Learned</span><span><i class="s-learn"></i>Learning</span><span>Click a row to drill that chapter</span></div>
    <div class="bars" id="bars"></div>
    <div class="hint">The CSCS needs about 70% in each content area, so the weakest chapters matter most.</div>
  </section>

  <section class="panel" aria-label="Backup">
    <h2>Backup</h2>
    <div class="hint">Progress saves in this browser. Copy a backup now and then; paste it back to restore on another device.</div>
    <div class="controls"><button id="bkcopy">Copy progress backup</button><button id="bkload">Restore from box below</button><button id="reset">Reset all progress</button></div>
    <textarea id="bkbox" aria-label="Backup text" placeholder="Paste a backup here to restore"></textarea>
    <div class="hint" id="bkmsg"></div>
  </section>
</div>

<script>
const EXAM = new Date(2026,10,25,8,0,0); // Wed 2026-11-25, local
const CHAPTERS = ["1. Skeletal system", "2. Muscular system", "3. Bioenergetics", "4. Endocrine system", "5. Anaerobic adaptations", "6. Aerobic adaptations", "7. Age and sex differences", "8. Sport psychology", "9. Basic nutrition", "10. Nutrition and performance", "11. Performance-enhancing substances", "12. Test selection", "13. Test administration", "14. Warm-up and stretching", "15. Exercise technique", "16. Nontraditional implements", "17. Anaerobic prescription", "18. Plyometrics", "19. Speed and agility", "20. Aerobic endurance", "21. Periodization", "22. Rehabilitation", "23. Facility design", "24. Policies and legal"];
const CARDS = [[1, "Axial vs appendicular skeleton?", "Axial: cranium, vertebral column, coccyx, ribs, sternum. Appendicular: shoulder girdle (scapula, clavicle), arms, hands, pelvic girdle, legs, feet."], [1, "Vertebral column counts by region?", "7 cervical (C1-C7), 12 thoracic (T1-T12), 5 lumbar (L1-L5), 5 sacral (fused), plus coccyx. About 206 bones total."], [1, "How can adult bone density be increased?", "Heavy loading, explosive movements, and frequent loading of the axial skeleton. Bone adapts slower than muscle and needs varied frequency, intensity, and stimulus type."], [1, "Fibrous vs cartilaginous vs synovial joints (movement + example)?", "Fibrous: virtually no movement (skull sutures). Cartilaginous: limited (intervertebral discs). Synovial: considerable, low friction, large ROM (elbow, knee)."], [1, "Uniaxial vs biaxial vs multiaxial joints (examples)?", "Uniaxial: one axis (elbow, knee). Biaxial: two perpendicular axes (ankle, wrist). Multiaxial: all three axes (shoulder and hip ball-and-socket)."], [1, "Proximal vs distal attachment; superior vs inferior attachment?", "Limb muscles: proximal = closer to midline, distal = farther. Trunk muscles: superior = closer to head, inferior = closer to feet."], [1, "Order of muscle connective tissue layers (outer to inner)?", "Epimysium (whole muscle) > perimysium (around fasciculi) > endomysium (around each fiber), which is contiguous with the sarcolemma. All are contiguous with the tendon."], [1, "Fasciculus: what is it and how many fibers?", "A bundle of muscle fibers wrapped in perimysium; up to about 150 fibers. Fibers are 50-100 micrometers in diameter."], [1, "Tendons attach muscle to what?", "The periosteum, the connective tissue covering bone."], [1, "What are myofibrils made of?", "Actin and myosin myofilaments, organized longitudinally in sarcomeres."], [1, "Smallest contractile unit of muscle?", "The sarcomere."], [1, "Sarcoplasmic reticulum function?", "Surrounds each myofibril and stores calcium ions that regulate contraction."], [1, "T-tubule function?", "Contiguous with the sarcolemma; delivers the motor neuron signal simultaneously to all depths of the fiber. Terminates near the Z-line."], [1, "A-band vs I-band vs H-zone vs Z-line?", "A-band: myosin alignment. I-band: actin only, between adjacent sarcomeres. H-zone: center, myosin only. Z-line: separates sarcomeres, splits the I-band."], [1, "What is a motor unit?", "A motor neuron plus all the muscle fibers it innervates. Each fiber has only one motor neuron; one neuron can innervate hundreds to thousands of fibers."], [1, "All-or-nothing principle?", "When a motor unit's action potential fires, all fibers it innervates contract simultaneously."], [1, "Sliding filament theory: five phases in order?", "Resting, excitation-contraction coupling, contraction, recharge, relaxation."], [1, "Excitation-contraction coupling phase events?", "Action potential crosses the NMJ; Ca2+ released from sarcoplasmic reticulum and binds troponin; H-zone and I-band shrink; Z-lines pull together."], [1, "Contraction phase: what supplies energy for the power stroke?", "ATP hydrolyzed to ADP + Pi by myosin ATPase on the cross-bridge."], [1, "Recharge vs relaxation phase?", "Recharge: new ATP replaces ADP on the cross-bridge; cycling repeats if Ca2+, ATP, ATPase available. Relaxation: Ca2+ pumped back into SR; actin and myosin unbind."], [1, "Type I fiber characteristics?", "Slow twitch: fatigue resistant, high capillary and mitochondrial density, high aerobic capacity, low recruitment threshold, limited rapid force/power."], [1, "Type IIa vs IIx?", "Both fast twitch. IIa has greater aerobic capacity and more capillaries (more fatigue resistant); IIx is the most powerful and fatigues fastest."], [1, "Fiber composition of postural muscles vs prime movers?", "Postural muscles (e.g., soleus): mostly Type I. Prime movers (e.g., quadriceps): mix of Type I and II, with involvement depending on intensity."], [1, "Two ways muscle force is graded?", "Frequency of motor unit activation (twitch rate) and number of activated motor units. Rapid twitches summate; fusion is tetanus."], [1, "Ways to improve force production in athletes?", "Heavier-load phases, increase muscle cross-sectional area, emphasize explosive multi-muscle multi-joint exercises."], [1, "Muscle spindle: location and function?", "Intrafusal fibers parallel to extrafusal fibers; sense muscle length and rate of length change; stretch causes reflex contraction and increased motor unit activation."], [1, "Golgi tendon organ: location and function?", "In tendon near myotendinous junction, in series with muscle fibers; senses tension; discharge inhibits the motor unit and reduces tension (protective). Motor cortex can override it."], [1, "Spindle vs GTO effect on motor unit activation?", "Spindle activation increases it; GTO activation decreases it."], [1, "Heart chambers and what each does?", "RA receives deoxygenated blood from body; RV pumps to lungs; LA receives oxygenated blood from lungs; LV pumps to body."], [1, "AV valves vs semilunar valves?", "AV (tricuspid, mitral): prevent backflow from ventricles to atria during systole. Semilunar (aortic, pulmonary): prevent backflow into ventricles during diastole."], [1, "Cardiac conduction pathway in order?", "SA node (pacemaker) > AV node (delays impulse so ventricles fill) > AV bundle > left and right bundle branches > Purkinje fibers."], [1, "Sympathetic vs parasympathetic effect on heart rate?", "Sympathetic speeds SA node depolarization (HR up); parasympathetic slows it (HR down). Controlled via the medulla."], [1, "Bradycardia vs tachycardia thresholds?", "Normal resting HR 60-100 bpm. Under 60 = bradycardia; over 100 = tachycardia."], [1, "ECG waves?", "P wave: atrial depolarization. QRS: ventricular depolarization (masks atrial repolarization). T wave: ventricular repolarization."], [1, "Hemoglobin function?", "Iron-protein molecule in red blood cells that carries oxygen and buffers blood pH."], [1, "Arteries vs arterioles vs capillaries vs venules vs veins?", "Arteries carry blood from heart (stiff walls); arterioles control flow into capillaries; capillaries exchange O2, CO2, nutrients; venules collect from capillaries; veins return blood to heart (thin, dilatable walls)."], [1, "Respiratory passage sequence and gas exchange site?", "Nasal cavities > trachea > bronchi > bronchioles (23 more generations) > alveoli, where gas exchange (diffusion) occurs."], [1, "Normal inspiration vs expiration mechanics?", "Inspiration: diaphragm contracts, negative pressure pulls air in. Expiration: diaphragm relaxes, elastic recoil expels air. Heavy breathing adds intercostals, sternocleidomastoids, anterior serrati, scaleni."], [2, "Fleshy vs fibrous muscle attachments?", "Fleshy: fibers attach directly to bone over a wide area, distributing force; often proximal. Fibrous: contiguous with connective tissue sheaths, extend into bone, very strong (tendons)."], [2, "Agonist vs antagonist vs synergist?", "Agonist (prime mover): most directly causes the movement. Antagonist: slows/stops movement, stabilizes and brakes (protects joint). Synergist: assists indirectly, e.g., scapular stabilizers, or controls motion when the agonist crosses two joints."], [2, "Torque formula?", "Torque = force x moment arm (perpendicular distance from force line of action to the fulcrum)."], [2, "Mechanical advantage formula and interpretation?", "MA = moment arm of applied force / moment arm of resistive force. Greater than 1.0: applied force can be less than resistance. Less than 1.0: mechanical disadvantage; applied force must exceed resistance."], [2, "First-class lever: arrangement, advantage, body example?", "Muscle force and resistance on opposite sides of the fulcrum; can be advantage or disadvantage. Example: triceps extension (forearm)."], [2, "Second-class lever: arrangement, advantage, example?", "Resistance and muscle force on the same side of the fulcrum, with muscle force on the longer moment arm; always mechanical advantage. Example: calf raise (foot)."], [2, "Third-class lever: arrangement, advantage, example?", "Same side of fulcrum, muscle force on the shorter moment arm; always mechanical disadvantage. Example: biceps curl. Most muscles are third-class."], [2, "Tendon insertion farther from the joint favors what?", "Greater mechanical advantage: can lift heavier loads but moves resistance slower per contraction velocity. Favors strength sports (powerlifting). Insertion closer to the joint favors speed sports."], [2, "Sagittal vs frontal vs transverse plane (movements)?", "Sagittal: right/left halves; flexion-extension (squat). Frontal: front/back; abduction-adduction (lateral raise). Transverse: upper/lower; internal-external rotation (trunk rotation, bat swing)."], [2, "Anatomical position?", "Body erect, arms down at sides, palms forward."], [2, "Work, power, and force equations?", "Force = mass x acceleration. Work = force x displacement. Power = work / time. Units: N, J, W. Gravity approximated as 9.8 m/s2."], [2, "Calc: 100 kg bar, 2 m lift, 2 m/s2 acceleration, 4 s. Work and power?", "Weight = 980 N; extra force = 200 N; work = (980+200) x 2 = 2,360 J; power = 2,360 / 4 = 590 W."], [2, "Calc: lowering same bar (a = -2 m/s2, -2 m, 4 s). Negative work?", "Force = 980 - 200 = 780 N; work = 780 x -2 = -1,560 J; power = -390 W. Negative sign = work done on the athlete by the bar."], [2, "Rotational work and power equations?", "Rotational work (J) = torque x angular displacement (radians). Rotational power (W) = rotational work / time. Torque in N-m."], [2, "Two ways to increase power?", "Increase work (strength) or decrease time to perform the work (speed). Football linemen benefit more from max strength; tennis players from reduced time."], [2, "List the biomechanical factors in human strength.", "Neural control, muscle cross-sectional area, arrangement of fibers (pennation), muscle length, joint angle, contraction velocity, joint angular velocity, strength-to-mass ratio, body size."], [2, "Muscle CSA and force: key relationships?", "Maximum force is directly related to CSA, not volume. Smaller athletes are pound-for-pound stronger; taller athletes with equal CSA are not stronger."], [2, "Classic formula for comparing strength across body sizes?", "Load lifted / bodyweight^(2/3). Most effective for athletes in the middle of the body weight range."], [2, "Neural control: what increases force?", "Greater recruitment (more motor units) and faster rate coding. Both drive early strength gains; later gains depend more on hypertrophy."], [2, "Concentric vs eccentric vs isometric action?", "Concentric: force > resistance, muscle shortens (curl up). Eccentric: force < resistance, lengthens (squat descent). Isometric: force = resistance, no length change, angular velocity = 0."], [2, "Torque vs joint angular velocity: concentric and eccentric?", "Concentric: torque capability decreases as angular velocity increases. Eccentric: torque increases with angular velocity until about 90 rad/s (per guide)."], [2, "Greater vs lesser angle of pennation?", "Greater: more sarcomeres in parallel, more force, lower shortening velocity. Lesser: higher velocity, less max force. Pennation is partly hereditary and trainable."], [2, "At what muscle length is force greatest?", "Resting length (maximal actin-myosin overlap and cross-bridge sites). Stretched or contracted lengths reduce force."], [2, "Contraction velocity vs force?", "Higher velocity = lower force (steepest decline at lower speeds); slower velocity = greater force over a longer time."], [2, "Joint angle and force production?", "Forces manifest as torques; lever arm and muscle length change through ROM, so mechanical advantage and force capability vary by joint angle."], [2, "Five sources of resistance with examples?", "Gravity (barbells), inertia (Olympic lifts, acceleration), friction (sled push), fluid resistance (running, swimming, rowing; increases with velocity), elasticity (bands; least useful for realistic training)."], [2, "Fluid resistance: surface drag vs form drag?", "Surface drag: friction along the object's surface. Form drag: fluid pressing on the front/rear of a moving object."], [2, "Pros of weight machines vs free weights?", "Machines: safety, ease of use, design flexibility (e.g., lat pulldown). Free weights: whole-body training with spinal loading for bone, natural coordination and real-life transfer."], [2, "Neutral spine description?", "Normal lordotic curve in lumbar and kyphotic curve in thoracic spine; safest lifting position."], [2, "Joint injury concerns in lifting?", "Back: compressive load, keep neutral spine. Shoulder: greatest ROM, rotator cuff impingement, warm up. Knee: patella and surrounding tissue, tendinitis from load/volume/recovery. Elbow/wrist: overhead lifts, growth plates in youth; low overall risk."], [2, "Weight belt: when to use?", "Only on the heaviest sets and only for exercises loading the lower back; it raises intra-abdominal pressure. Risk: underdeveloped core and over-reliance."], [3, "Catabolism vs anabolism?", "Catabolism: breakdown of large molecules into small, usually releases energy (exergonic). Anabolism: building larger molecules from smaller, usually requires energy (endergonic)."], [3, "ATP hydrolysis reaction and enzyme?", "ATP + H2O <-> ADP + Pi + H+ + energy, catalyzed by myosin ATPase (ATPase)."], [3, "Three energy systems that replenish ATP?", "Phosphagen (creatine phosphate), glycolytic (carbohydrate), oxidative (carbohydrates and fats; rarely protein)."], [3, "Phosphagen system reaction and enzyme?", "ADP + CP <-> ATP + creatine, catalyzed by creatine kinase. Anaerobic, single reaction, very rapid but short-lived. Adenylate kinase: 2 ADP <-> ATP + AMP."], [3, "Mass-action effect?", "Concentrations of reactants and products on each side drive the direction of the reaction."], [3, "Fast vs slow glycolysis?", "Fast: pyruvate converted to lactate; rapid ATP but limited by pH drop. Slow: pyruvate shuttled to mitochondria (first step of aerobic system); slower but sustained; requires lower intensity and O2."], [3, "Net ATP from glycolysis: glucose vs glycogen?", "Glucose: net 2 ATP. Glycogen: net 3 ATP."], [3, "Rate-limiting enzyme of glycolysis?", "Phosphofructokinase (PFK), inhibited allosterically by ATP."], [3, "What causes fatigue during high-intensity glycolysis?", "H+ accumulation (metabolic acidosis, lower pH), not \"lactic acid\" per se."], [3, "Cori cycle?", "Lactate is transported to the liver and converted to glucose (gluconeogenesis)."], [3, "Substrate-level vs oxidative phosphorylation?", "Substrate-level: direct ADP-to-ATP resynthesis in a single reaction (phosphagen, glycolysis). Oxidative: ATP resynthesis in the electron transport chain."], [3, "Lactate threshold: definition and typical % VO2max?", "First intensity where blood lactate rises; corresponds with ventilatory threshold. Untrained: 50-60% VO2max; trained athletes: 70-80%."], [3, "OBLA definition?", "Onset of blood lactate accumulation: second inflection point at higher intensity, when blood lactate reaches 4 mmol/L."], [3, "How to raise the intensity at which LT/OBLA occurs?", "Train at or near/above LT or OBLA intensities."], [3, "Oxidative system: glucose pathway?", "Glycolysis > pyruvate to mitochondria > acetyl-CoA (+ NADH, FADH2) > Krebs cycle > ETC; oxygen is the final electron acceptor. 38 ATP per glucose, 39 per glycogen."], [3, "Fat oxidation steps?", "Triglycerides > free fatty acids + glycerol > beta oxidation in mitochondria > acetyl-CoA to Krebs, H+ to ETC. Slow but greatest ATP capacity of any substrate."], [3, "Protein oxidation facts?", "Amino acids converted to glucose, pyruvate, or Krebs intermediates; contributes 3-18% during prolonged activity; BCAAs best suited; waste products urea and ammonia (ammonia linked to fatigue)."], [3, "Oxidative system regulation?", "Inhibited by ATP, stimulated by ADP."], [3, "Phosphagen depletion and recovery times?", "CP can drop 50-70% early and is fully depleted at exhaustion. ATP fully resynthesized in 3-5 min; CP in about 8 min."], [3, "Glycogen stores?", "About 300-400 g in muscle; 70-100 g in liver. Muscle glycogen is used in moderate/high intensity; liver glycogen at low intensity."], [3, "Glycogen repletion recommendation?", "0.7-3.0 g carbohydrate per kg bodyweight every 2 hours after exercise; typically replenished within 24 h (longer after intense eccentric exercise)."], [3, "Children vs adults in bioenergetics?", "Children have higher oxidative capacity, lower CP depletion, and less pH drop during high-intensity intermittent exercise."], [3, "Limiting bioenergetic factor by event duration?", "Short events: ATP/CP depletion. Intermediate intense (400 m run): drop in cellular pH. Long events: muscle and liver glycogen depletion. Fat depletion rarely limits (maybe marathon)."], [3, "Oxygen deficit vs EPOC?", "Oxygen deficit: anaerobic energy contribution at exercise onset. EPOC (oxygen debt): elevated O2 uptake after exercise until pre-exercise state is restored."], [3, "Factors affecting EPOC?", "Intensity matters most. Aerobic: greatest above 50-60% VO2max and over 40 min; short supramaximal bouts can produce large EPOC. Resistance: heavy sets (80-90% 1RM) produce greater EPOC than circuits at 50% 1RM."], [3, "Causes of EPOC?", "O2 replenishment in blood/muscle, ATP/CP resynthesis, elevated temperature, circulation and ventilation, triglyceride-fatty acid cycling, protein turnover, changes in energy efficiency."], [3, "Metabolic specificity?", "Choosing exercises and work-rest ratios that mimic the energy demands of the sport, by manipulating intensity and work-rest ratio."], [3, "HIIT variables to manipulate?", "Intensity and duration of work interval; intensity and duration of recovery interval; number of duty cycles per set; number of sets; recovery intensity between sets; exercise mode."], [3, "Phosphagen system training prescription?", "90-100% intensity, 5-10 s work, work-rest ratio 1:12 to 1:20."], [3, "Fast glycolytic training prescription?", "75-90% intensity, 15-30 s work, work-rest 1:3 to 1:5."], [3, "Slow glycolytic training prescription?", "30-75% intensity, 1-3 min work, work-rest 1:3 to 1:4."], [3, "Oxidative system training prescription?", "20-30% intensity, 3+ min work, work-rest 1:1 to 1:3."], [3, "Combination training: who benefits?", "Endurance athletes may benefit from added resistance/anaerobic work. Adding aerobic training to strength/power athletes can decrease performance and does not help well-trained anaerobic athletes."], [4, "Three categories of hormonal response to exercise?", "Anabolic (tissue building), permissive (allow other processes/hormone actions), catabolic (breaking down tissue/substances)."], [4, "General adaptation syndrome?", "Adrenal response to a stressor such as exercise; begins with the alarm reaction; training stress leads to adaptations that increase resistance to the stressor."], [4, "Where do peptide vs steroid/thyroid hormone receptors sit?", "Peptide hormones: cell surface receptors. Steroid and thyroid hormones: receptors in the cytosol. Binding proteins protect hormones in transit."], [4, "Muscle remodeling sequence?", "Fiber disruption/damage > inflammatory response (immune cells) > degradation of damaged proteins > hormone/growth factor/cytokine interactions > synthesis of new proteins (actin, myosin, titin, desmin) incorporated into sarcomeres."], [4, "Which hormones are anabolic, permissive, catabolic?", "Anabolic: insulin, IGFs, testosterone, growth hormone. Permissive: thyroid hormones. Catabolic: cortisol (and progesterone per the guide)."], [4, "Lock-and-key theory?", "Specific hormones react with specific receptors; real interactions are more complex (cross-reactivity, allosteric binding)."], [4, "Receptor downregulation: when and why?", "Receptors become less responsive when adaptation is no longer possible (e.g., maximum protein added) or from overstimulation (e.g., insulin resistance). Changing receptor number/sensitivity can produce adaptations comparable to increased hormone release."], [4, "Steroid hormone mechanism?", "Fat-soluble; diffuse across membrane; bind receptor inside cell to form hormone-receptor complex; exposes DNA; transcription releases mRNA; mRNA drives protein synthesis. Examples: cortisol, testosterone, estradiol."], [4, "Polypeptide hormone mechanism?", "Amino acid chains (growth hormone, insulin); cannot cross membrane; use secondary messengers; regulated by negative feedback."], [4, "Amine hormones?", "Made from tyrosine (epinephrine, norepinephrine, dopamine) or tryptophan (serotonin); bind surface receptors; act via secondary messengers."], [4, "Long-term heavy resistance training hormonal effect?", "Increased anabolic hormone concentration and increased receptors, partly from large motor unit recruitment."], [4, "Interpreting hormone blood concentration?", "Tricky: increased concentration raises chance of receptor interaction; decreased may reflect increased uptake. Increased concentration is not a prerequisite for hypertrophy."], [4, "Testosterone basics?", "Primary androgen for skeletal muscle; produced in testes; promotes GH release (synergistic); acts via receptor binding; transported by binding protein; raising receptor number possible with resistance training."], [4, "Protocol to raise free testosterone in men?", "Large muscle groups (squat, deadlift, power clean), heavy load (85%+ 1RM), moderate-high volume, short rest (30-60 s), and 2+ years of training."], [4, "Testosterone in women after resistance training?", "Little or no rise in blood level, but increased androgen receptor sensitivity in muscle may drive adaptations."], [4, "Growth hormone basics?", "Anterior pituitary; superfamily of variants (22 kDa); targets bone, immune cells, muscle, fat, liver. Releases influenced by age, sex, sleep, nutrition, alcohol, exercise; shorter rests raise serum GH."], [4, "GH in women vs men?", "Women have higher 22 kDa GH; levels vary across the menstrual cycle; GH response to similar workouts is comparable between sexes."], [4, "IGFs: source and facts?", "Small polypeptides made in the liver; IGF-I 70 amino acids, IGF-II 67; regulated by GH, testosterone, thyroid hormone; at least 6 binding proteins regulate IGF-I; crucial for protein anabolism."], [4, "IGF response to training?", "Acute rise depends on resting level: low pre-training levels are elevated; normal/high are unchanged. Women show increased total IGF-I and reduced binding protein post-exercise."], [4, "Cortisol: source, regulation, effects?", "Adrenal cortex, stimulated by ACTH. Catabolic: converts amino acids to carbohydrates, raises proteolytic enzymes, inhibits protein synthesis, suppresses immune cells. Testosterone counters it."], [4, "Acute vs chronic cortisol elevation?", "Acute rises (high volume, large muscle groups, short rests) can be part of remodeling. Chronic elevation harms tissue growth and is linked to overtraining and immunosuppression."], [4, "Catecholamines: source and roles?", "Epinephrine (mainly), norepinephrine, dopamine from adrenal medulla. Increase force production, contraction rate, blood pressure, energy availability, muscle blood flow; augment testosterone secretion. Among the first endocrine responses to resistance exercise."], [4, "How to optimize adrenal response?", "High volume, large muscle groups, short rest, but vary protocols over time, include full rest days, and cycle in low-volume workouts to avoid chronic cortisol."], [4, "Raising growth hormone through training?", "Workouts with high lactate: high intensity, high total work, short rest; carbohydrate before and after."], [4, "Why do large-muscle, high-recruitment exercises matter hormonally?", "More fibers recruited means greater remodeling potential; only activated fibers adapt, including hormonally."], [5, "Early strength gains come mostly from what?", "Neural adaptations before hypertrophy: increased agonist recruitment, firing rate, synchronization, and reduced inhibition (e.g., GTO)."], [5, "Untrained people: how much muscle can be activated at max effort?", "Less than about 71%."], [5, "Size principle?", "Motor units are recruited in order of recruitment threshold (small/type I first, then larger/type II). Advanced lifters (e.g., Olympic lifters) can selectively recruit type II units."], [5, "Small vs large muscles: how force increases?", "Smaller muscles mainly increase contraction (firing) frequency; larger muscles mainly increase motor unit recruitment."], [5, "NMJ and reflex adaptations to anaerobic training?", "Larger NMJ area and longer terminal nerve branches; stronger myotatic (stretch) reflex enhancing elastic force."], [5, "Cross-education?", "Unilateral training increases strength and neural activity in the contralateral untrained limb."], [5, "Bilateral deficit vs bilateral facilitation?", "Deficit (untrained): both limbs together produce less than the sum of each alone. Facilitation (trained): both together produce more than the sum."], [5, "Hypertrophy mechanism and signaling?", "Increased contractile (actin, myosin) and structural (titin, nebulin) protein; AKT/mTOR signaling. Influenced by nutrient intake and timing, amino acids, mechanical stress, hydration, hormones."], [5, "Training emphasis for hypertrophy?", "Heavy loads, eccentric actions, moderate-to-high volume. Type II fibers have greater hypertrophy potential than type I. Hyperplasia (longitudinal splitting) may play a role."], [5, "Fiber type transitions with resistance training?", "Mainly IIx to IIa (shift in myosin heavy chain isoforms); IIa to I is unlikely."], [5, "Structural muscle changes with training?", "Greater pennation angle (more CSA/protein); fascicle length may increase with sprint/jump training."], [5, "Why do mitochondrial and capillary density fall with hypertrophy?", "Dilution: CSA grows faster than mitochondria/capillaries; existing ones are not lost."], [5, "Other muscular adaptations to anaerobic training?", "Increased myofibrillar volume, cytoplasmic density, SR and T-tubule density, Na-K ATPase activity, H+ buffering, resting CP/ATP, and glycogen content."], [5, "Bone remodeling sequence?", "Weight-bearing bends bone; osteoblasts migrate and secrete collagen; collagen mineralizes (hydroxyapatite); new bone forms mainly at the periosteum, increasing diameter and strength."], [5, "Cortical vs trabecular bone?", "Cortical: dense compact outer shell. Trabecular: spongy inner bone, more capable of growth (turns over faster)."], [5, "Minimal essential strain (MES)?", "Threshold stimulus for new bone formation; rises as bone gets stronger, so progression is required. Remodeling takes 6+ months."], [5, "Principles to build bone?", "Load specific regions, novel force vectors, multi-joint structural exercise (squat, power clean, deadlift, shoulder press), progressive overload (about 1-10RM), high-impact loading; stimulus can be maximized with as few as 30 reps."], [5, "Collagen basics?", "Primary structural protein of connective tissue; type I in bone, tendon, ligament; type II in cartilage; secreted by fibroblasts as procollagen; cross-linking strengthens fibers."], [5, "Tendon vs ligament vs fascia vs cartilage?", "Tendon/ligament: parallel collagen, few cells, slow healing (low blood flow); ligaments contain elastin. Fascia: collagen in multiple planes, converges into tendons. Cartilage: hyaline (smooth surface, shock absorption) and fibrous (disks, tendon-bone junction); nourished by synovial fluid diffusion."], [5, "Connective tissue adaptations to resistance training?", "More collagen fibril diameter, number, cross-links, and packing density; increased tendon stiffness and force tolerance. Needs progressive high-intensity loading through full ROM; low-moderate loads don't change collagen content."], [5, "Acute endocrine response to anaerobic training?", "Elevated testosterone, GH, and cortisol (men); stabilize after about 30 min; greatest with large muscle mass and moderate-high intensity; correlates with lactate/H+; IGF response is delayed."], [5, "Resting hormones and androgen receptors with chronic training?", "Resting levels generally unchanged. Androgen receptors upregulate within 48-72 h; high-volume work can downregulate AR at 1 h; post-workout protein-carbohydrate attenuates downregulation."], [5, "Acute cardiovascular responses to resistance exercise?", "HR highest right after the set (about 5 s); stroke volume and cardiac output highest during eccentric phase (especially with Valsalva); BP highest in concentric sticking point; blood flow restricted above 20% 1RM then reactive hyperemia."], [5, "Chronic cardiovascular adaptations?", "Slight drop in resting HR, 2-4% BP decrease, rate-pressure product constant or lower, possible LDL decrease/HDL increase, greater LV wall thickness (not relative to lean mass), reduced acute CV response at an absolute load."], [5, "Rate-pressure product formula?", "HR x systolic BP."], [5, "Respiratory adaptations to anaerobic training?", "Ventilation seldom limits resistance exercise; max exercise: tidal volume and frequency up; submax: frequency down, tidal volume up; reduced ventilatory equivalent (air ventilated per O2 used)."], [5, "Aerobic and anaerobic compatibility?", "Aerobic training can hinder strength and especially power (greatest with high volume); do aerobic after strength; resistance training generally helps endurance performance."], [5, "Performance improvements from anaerobic training?", "Strength (20-40% by training age), power, local muscular endurance, lean mass, flexibility (best with flexibility training), VO2max only in untrained (circuit training can), motor performance."], [5, "Three phases of overtraining?", "Functional overreaching (days-weeks) > non-functional overreaching (weeks-months) > overtraining syndrome (6+ months)."], [5, "Sympathetic vs parasympathetic OTS?", "Sympathetic: increased resting sympathetic activity. Parasympathetic (final phase): increased parasympathetic activity at rest and exercise, decreased force and glycolytic activity, more illness and emotional disturbance."], [5, "Detraining timelines?", "Strength maintained up to about 4 weeks; power and sport-specific decline sooner; recreational athletes up to about 6 weeks; significant atrophy in powerlifters by 7 weeks. Principle of reversibility."], [6, "Cardiac output formula and values?", "Q = stroke volume x heart rate. Rest about 5 L/min; maximum about 20-22 L/min."], [6, "Stroke volume during exercise: key facts?", "Rises at onset, plateaus at about 40-50% of max O2 uptake. Untrained college men 100-120 mL/beat; trained up to 150-160; women about 25% less than men. Determined by end-diastolic volume and catecholamines."], [6, "Frank-Starling mechanism?", "Greater end-diastolic volume stretches myocardial fibers, producing a more forceful contraction and greater ejection. Venous return increases via vasoconstriction, skeletal muscle pump, and respiratory pump."], [6, "Ejection fraction?", "The fraction of end-diastolic volume ejected during contraction."], [6, "Heart rate vs exercise intensity?", "Rises immediately before/at onset, then increases linearly with intensity."], [6, "Fick equation?", "VO2 = Q x a-vO2 difference (arterial minus venous O2 content)."], [6, "One MET and normal VO2max range?", "1 MET = 3.5 mL O2/kg/min (resting). Normal VO2max about 25-80 mL/kg/min."], [6, "Mean arterial pressure formula?", "MAP = [(systolic - diastolic) / 3] + diastolic."], [6, "Typical resting BP and maximal exercise BP?", "Resting 120/80 mmHg. Maximal exercise systolic 220-260 mmHg, diastolic about 90."], [6, "Blood flow distribution at rest vs exercise?", "Muscles receive 15-20% of cardiac output at rest, up to about 90% during work, via local arteriole dilation in active tissue and constriction elsewhere."], [6, "Breathing responses to aerobic exercise?", "Breaths/min rise from 12-15 to 35-45; tidal volume from 0.4-1.0 L to 3+ L. Ventilatory equivalent 20-25 L air per L O2, up to 35-40 in intense exercise."], [6, "Anatomical vs physiological dead space?", "Anatomical: nonfunctional airways (nose, mouth, trachea), about 150 mL in young adults, increases with age. Physiological: alveoli with poor blood flow or ventilation; increased by lung disease."], [6, "How is oxygen carried in blood?", "Mostly bound to hemoglobin (1 g carries 1.34 mL O2; 15-16 g/100 mL men, about 14 g women); less than 3 mL O2 per L plasma dissolved. About 20 mL O2 per 100 mL blood."], [6, "How is CO2 transported?", "About 5% dissolved in plasma, small amount on hemoglobin, most as bicarbonate: CO2 + H2O to carbonic acid (carbonic anhydrase) to H+ + HCO3-; H+ buffered by hemoglobin; bicarbonate to plasma and chloride shifts into RBCs."], [6, "Chronic cardiovascular adaptations to aerobic training?", "Higher max cardiac output and stroke volume, lower resting and submaximal HR (athlete bradycardia 40-60 bpm), greater capillary density, increased LV volume and wall thickness over 6-12 months."], [6, "Muscular adaptations to aerobic training?", "Glycogen sparing, more fat use, higher OBLA intensity (up to 80-90%), IIx to IIa shift (no II to I), limited type I hypertrophy, more mitochondria, myoglobin, aerobic enzymes, and glycogen/triglyceride stores."], [6, "Respiratory and neural adaptations to aerobic training?", "Max exercise: higher tidal volume and breathing frequency; submax: lower. Neural: greater efficiency, delayed fatigue, rotation of motor unit activity among synergists."], [6, "Aerobic training and bone/connective tissue?", "Intense aerobic work stimulates bone if intensity and strain frequency exceed thresholds and progress; high-intensity intervals give greater osteogenic stimulus."], [6, "Endocrine adaptations to aerobic training?", "More circulating hormones, receptors, and hormone turnover; increased cortisol offset by IGF and testosterone; net protein synthesis occurs, mostly mitochondrial proteins."], [6, "Altitude: threshold and acute responses?", "Above about 3,900 ft (1,200 m): hyperventilation (rate first, tidal volume later); resting and submax cardiac output up 30-50%."], [6, "Altitude: longer-term adjustments (3-6 weeks)?", "HR/cardiac output normalize (10-14 days); red cell concentration up 30-50%; hemoglobin up 5-15%; better O2 diffusing capacity; renal bicarbonate excretion. Performance improves but remains below sea level."], [6, "Hyperoxic breathing?", "Oxygen-enriched gas during rest or after exercise; may help some measures; effects unclear since sea-level saturation is already about 98%."], [6, "How does smoking impair performance?", "Nicotine bronchoconstriction (airway resistance), paralysis of cilia, and carbon monoxide binding hemoglobin (higher affinity than O2)."], [6, "Blood doping: effects and risks?", "Raises red cell mass (infusion or EPO); up to 11% greater O2 uptake; lower HR and lactate; improves heat/altitude tolerance. Risks: higher hematocrit leading to stroke, MI, DVT, pulmonary embolism; EPO also raises BP, potassium, flu-like symptoms."], [6, "Age and sex and aerobic power?", "Max aerobic power declines with age; women are 73-85% of men due to higher body fat, lower hemoglobin, smaller heart. Training responses are similar."], [6, "Functional vs nonfunctional overreaching vs OTS (aerobic)?", "FOR: short intensified block, recovery in days/weeks; tapering produces supercompensation. NFOR: extended excess, weeks-months to recover. OTS: major performance drop, altered nervous/immune function, months to recover."], [6, "Cardiovascular and biochemical markers of aerobic overtraining?", "Decreased HR variability, lower max HR, resting BP generally unchanged (maybe higher diastolic); high creatine kinase; lower muscle glycogen; low/unchanged lactate response."], [6, "Endocrine markers of aerobic overtraining?", "Lower testosterone (men), 30% drop in testosterone:cortisol ratio may flag OTS; reduced GH; lower nocturnal epinephrine; higher catecholamine responses to a given workload; lower dopamine."], [6, "Preventing overtraining syndrome?", "Good nutrition, sleep and recovery, variety in intensity and volume, accurate performance records, multidisciplinary team (coach, physician, nutritionist, psychologist)."], [6, "Aerobic detraining: magnitude and causes?", "Highly trained: VO2max drops 4-14% short term, 6-20% long term, from lower blood volume, stroke volume, and max cardiac output. Aerobic adaptations are most susceptible (enzymatic basis). Prevent with variation, proper intensity, maintenance programs, active recovery."], [7, "Growth vs development vs maturation?", "Growth: increase in body size/part. Development: natural progression from prenatal life to adulthood. Maturation: process of becoming fully functional/mature."], [7, "Why is chronological age a poor guide for youth?", "Children grow at different rates; 14-year-olds can differ by up to 9 inches and 40 lb due to timing, tempo, and magnitude of puberty."], [7, "Biological age: best measure and alternatives?", "Skeletal age (X-ray vs reference) is best. Others: visual sexual maturation (impractical), somatic age via growth curves/peak height velocity (assess every 3 months). Menarche marks female maturation; voice change and pubic/facial hair in boys."], [7, "Peak height velocity (PHV): when and implication?", "Typically ages 12-14; higher injury risk, so reinforce technique, address flexibility restrictions/imbalances, and reduce volume/intensity if needed."], [7, "Training age (youth)?", "Length of time a child has consistently followed a formal, supervised resistance program; gains depend on prior adaptation."], [7, "Does resistance training stunt growth in nourished children?", "No evidence that training delays or accelerates growth in adequately nourished children."], [7, "Muscle mass as % of body weight, birth vs adulthood?", "About 25% at birth; about 40% in adulthood."], [7, "When does peak muscle mass occur?", "Girls 16-20 years; boys 18-25 years (unless affected by training)."], [7, "Sites of growth cartilage in youth?", "Epiphyseal growth plate, joint surface, and apophyseal insertions of muscle-tendon units. Injury here can disrupt blood supply and cause permanent growth disturbance; peak incidence at PHV."], [7, "When does peak strength gain occur relative to growth in boys?", "About 1.2 years after peak height velocity and 0.8 years after peak weight velocity."], [7, "Why is myelination relevant in youth?", "Full myelination of motor neurons doesn't occur until sexual maturation, affecting skill gains and responses."], [7, "Body types of early vs late maturers?", "Early: mesomorphic (muscular, broad shoulders) or endomorphic (rounded, broader hips). Late: ectomorphic (slender, tall)."], [7, "Youth resistance training guidelines (sets, reps, frequency)?", "1-3 sets of 6-15 reps; 2-3 nonconsecutive days/week; start light and progress 5-10%; dynamic warm-up before, static stretching after; competent supervision and spotters; periodize."], [7, "Strength gains in children?", "Typically 30-40% (range 10-90%); gains in preadolescents are mostly neural (recruitment, synchronization, firing); hypertrophy contributes more in adolescents/adults; detraining returns strength to age norms."], [7, "Testosterone in boys vs girls through adolescence?", "Boys increase from about 20-60 ng/100 mL to about 600 ng/mL; females unchanged."], [7, "Benefits of youth resistance training?", "Strength, power, endurance; lower body fat and better insulin sensitivity/cardiac function in obese children; higher bone mineral density (lower later osteoporosis risk); injury resistance; better performance."], [7, "Youth injury risk reduction steps?", "Pre-participation exam by sports medicine physician, parent education, long-term training with recovery between seasons, multidimensional programs, good lifestyle habits, qualified coaches, delay sports specialization until adolescence."], [7, "Sex differences in body composition (adults)?", "Women have more body fat, less muscle, lower BMD, lighter weight, broader hips relative to waist/shoulders. No meaningful differences before puberty."], [7, "Women's strength relative to men?", "Absolute: about 2/3 of men's; lower body closer to men than upper. Relative to fat-free mass, differences largely disappear; muscle quality not sex-specific."], [7, "Women's response to resistance training?", "Similar relative to baseline; absolute gains higher in men; percentage gains often higher in women; short-term hypertrophy (to 16 weeks) similar."], [7, "Female athlete triad?", "Interrelated menstrual dysfunction (amenorrhea: absence of menses > 3 months, via reduced LH), low energy availability, and low bone mineral density."], [7, "Risks from the female athlete triad?", "Reduced BMD/osteoporosis, stress fractures, endocrine and GI complications, performance decrements; eating disorder risk in appearance-scored sports (gymnastics, dance)."], [7, "Program design for women: main points?", "Same as men except absolute load; emphasize upper body (add 1-2 exercises/sets, snatch and clean derivatives) and injury prevention."], [7, "ACL injury risk in women and prevention?", "About 6x higher in sports like basketball/soccer. Prevention: resistance, plyometrics, agility, and balance training with correct jumping, landing, twisting, cutting mechanics; adequate calories/protein/fat; appropriate shoes/clothing."], [7, "Osteopenia vs osteoporosis?", "Osteopenia: BMD between -1 and -2.5 SD below adult mean. Osteoporosis: below -2.5 SD."], [7, "Sarcopenia?", "Age-related loss of muscle mass and strength; CSA declines from about age 30, most pronounced in women; due to inactivity and gradual denervation; reduces power as well as strength."], [7, "Neuromotor changes with aging?", "Slower reaction time, worse balance and postural stability; pre-activation (before ground contact) and co-contraction (after contact) compensate. Use low-intensity plyometrics, balance, proprioception training with resistance work."], [7, "Older adults' response to resistance training?", "Age does not blunt the ability to respond; improves strength, power, mass, BMD, function, quality of life, and mortality risk. High-velocity training helps power; maximal strength training beats low-moderate intensity."], [7, "Older adult program design?", "Medical history/risk screening (physician clearance when needed); test on intended equipment; low volume/intensity for untrained; avoid Valsalva; 5-10 min low-intensity warm-up; progress from 1x8-12 at 40-50% 1RM to 3 sets at 60-80%; power 40-60% 1RM x 6-10 fast; pain-free ROM; 48-72 h between sessions; start 2 days/week."], [8, "Ideal performance state characteristics?", "No fear of failure, no analysis of performance, narrow focus on the activity, effortlessness, sense of control, distorted time/space (time slows)."], [8, "Arousal definition and measures?", "Blend of physiological activation and intensity of motivation, on a continuum from deeply asleep to highly excited; not inherently pleasant or unpleasant. Indexed by HR, BP, EEG, EMG, catecholamines, activation-deactivation checklist."], [8, "Anxiety: cognitive vs somatic, state vs trait?", "Anxiety is negatively perceived arousal. Cognitive: negative thoughts. Somatic: physical symptoms (tense muscles, fast HR). State: acute situational apprehension. Trait: enduring disposition to perceive threat (floods attention with irrelevant thoughts)."], [8, "Three factors typically behind ineffective state anxiety?", "High ego involvement/perceived threat to self-esteem; perceived gap between ability and demands; fear of consequences of failure."], [8, "Stress, stressor, eustress, distress?", "Stress: imbalance between demand and response capability with consequences. Stressor: event that triggers it. Eustress: positive; distress: negative. Perceiving stress as negative produces anxiety."], [8, "Drive theory?", "Performance rises as arousal/state anxiety increases (true for low-moderate arousal). Skilled athletes tolerate more arousal; novices and complex decision tasks need lower arousal."], [8, "Arousal and task complexity?", "Simple or well-learned skills tolerate (and benefit from) higher arousal; complex skills requiring decisions need lower arousal to keep a wide attentional focus."], [8, "Inverted-U theory?", "Arousal improves performance up to an optimal level; beyond it, performance declines."], [8, "Individual zones of optimal functioning (IZOF)?", "Each athlete performs best within a small individual arousal range that differs by person and task."], [8, "Catastrophe vs reversal theory?", "Catastrophe: performance can drop sharply (not gradually) past a certain arousal level. Reversal: the athlete's perception of arousal/anxiety matters as much as its level."], [8, "Intrinsic vs extrinsic vs achievement motivation?", "Intrinsic: desire for competence and self-determination (\"love of the game\"). Extrinsic: external rewards (trophies, approval). Achievement: efforts to master tasks, excel, and compete; includes motive to achieve success (MAS) and to avoid failure (MAF)."], [8, "Self-controlled practice?", "Athlete gets input on practice or which skill to work on; promotes active involvement."], [8, "Positive vs negative reinforcement; positive vs negative punishment?", "Positive reinforcement: add something desirable (praise). Negative reinforcement: remove something aversive (skip sprints for good effort). Positive punishment: add something aversive (push-ups). Negative punishment: remove something valued (revoke privileges)."], [8, "Why reinforcement over punishment?", "Builds task-relevant focus, self-efficacy, confidence, and long-term memories of success; punishing valid effort is ineffective."], [8, "Selective attention and stages of attentional focus development?", "Selective attention: inhibiting some stimuli to focus on others (\"level of focus\"). Stages: cognitive (effortful, conscious) > associative > automaticity (relaxed, automatic)."], [8, "Four attentional styles?", "Broad external (assess environment), broad internal (analyze/plan strategy), narrow internal (rehearse action), narrow external (focus on one or two cues)."], [8, "Diaphragmatic breathing: effect and method?", "Deep belly breathing increases vagal tone, counters fight-or-flight, lowers HR/muscle tension; three-stage inhalation (lower abdomen, mid chest, upper chest)."], [8, "Progressive muscular relaxation (PMR)?", "Maximally tense a muscle group 10-15 s, then consciously relax it; teaches discrimination of tension vs relaxation; practice on non-competition days."], [8, "Autogenic training?", "Focus on warmth and heaviness in muscle groups; alternative to PMR for those who can't tolerate muscle tension."], [8, "Systematic desensitization?", "Counter-conditioning: visualize a feared event while using diaphragmatic breathing and PMR (starting in a relaxed setting) to replace fear with relaxation."], [8, "Imagery: key points?", "Mentally rehearse with visual, auditory, kinesthetic (even olfactory/gustatory) cues; first- or third-person; challenging but possible; effective for skill enhancement."], [8, "When to use arousal reduction vs enhancement?", "Reduction: new/complex skills or high-pressure situations. Enhancement: simple, well-learned skills or low-pressure situations."], [8, "Self-confidence vs self-efficacy?", "Self-confidence: belief one can succeed. Self-efficacy: perception of ability for a task in specific circumstances; may predict performance better than arousal or anxiety."], [8, "Bandura's sources of self-efficacy?", "Past experience (success/failure), vicarious experience, verbal persuasion, imaginal performance, physiological states, emotional states."], [8, "Self-talk types and caveats?", "Positive, negative, instructional. Positive and instructional can help; experts may be harmed by instructional talk interfering with automaticity; negative generally harms."], [8, "Process vs outcome goals?", "Process: controllable actions/habits (effort-linked). Outcome: result-based (winning), dependent on competitors; overfocus slows reaction and attention. Combine both."], [8, "Short-term vs long-term goals?", "Short-term: attainable soon; boosts confidence and motivation (e.g., hold 160 bpm for 25 min). Long-term: overarching vision built through sequential short-term goals."], [8, "Whole vs part practice?", "Whole: for highly interrelated skills (lunge). Part: for complex skills with distinct subcomponents (snatch)."], [8, "Segmentation vs fractionalization vs simplification?", "Segmentation: break into parts with clear breaks (snatch phases). Fractionalization: parts that occur simultaneously (push press knee/hip/shoulder extension). Simplification: reduce difficulty (PVC pipe, slow speed)."], [8, "Pure-part vs progressive-part vs repetitive-part training?", "Pure: practice each part alone then combine. Progressive: practice two parts, combine, then add the third, etc. Repetitive: practice first part, then add each subsequent part until whole."], [8, "Random vs variable vs observational practice?", "Random: multiple skills in random order. Variable: variations of one skill in a session; helps novel variations. Observational: watching others; best with physical practice. Random and variable lower early performance but improve learning."], [8, "Explicit instruction vs guided discovery vs discovery?", "Explicit: prescriptive rules. Guided discovery: goal plus prompts without how-to. Discovery: goal only; slows learning but increases focus on task cues and can impair performance under stress."], [8, "Intrinsic vs augmented feedback?", "Intrinsic: from the athlete's own senses. Augmented: from an external source (coach, video)."], [8, "Knowledge of results vs knowledge of performance?", "KR: outcome of the task (time to complete drill). KP: movement pattern feedback (video analysis)."], [8, "Feedback timing and frequency?", "Concurrent feedback boosts performance but impairs learning; post-task feedback enhances learning. More frequent feedback aids performance but impairs learning (except complex skills). Give more early, then fade."], [9, "Sports dietitian vs sports nutrition coach?", "Sports dietitian: registered dietitian with sports nutrition education (CSSD credential); does individual dietary needs analysis. Sports nutrition coach: not an RD; basic training; gives basic education only."], [9, "MyPlate: key facts?", "USDA food guidance icon (based on 2010 Dietary Guidelines) with fruit, vegetables, grains, protein, dairy; geared toward people with under 30 min moderate activity most days, so adjust for athletes. Excluding a group risks deficiency (e.g., no dairy: calcium, potassium, vitamin D; no animal foods: B12)."], [9, "RDA vs AI vs UL vs EAR?", "RDA: intake adequate for most healthy people. AI: used when RDA can't be set. UL: maximum intake with no adverse effects (all sources). EAR: intake that meets needs of half the healthy population."], [9, "Nutrients of concern in the general population?", "Fiber, potassium, calcium, vitamin D (plus magnesium and vitamin E deficiency prevalence). B12 absorption declines after age 50; supplement or fortified foods."], [9, "Amino acids counts?", "9 essential (dietary), 4 non-essential (body can make), conditionally essential ones needed in illness/stress (arginine, cysteine, glutamine, glycine, proline, serine, tyrosine)."], [9, "Essential amino acids list?", "Histidine, isoleucine, leucine, lysine, methionine, phenylalanine, threonine, tryptophan, valine."], [9, "Where is body protein stored?", "About half in skeletal muscle; about 15% in structural tissues (skin, blood); remainder in visceral tissues (liver, kidney) and bone."], [9, "Peptide bonds terminology?", "Dipeptide: 2 amino acids; polypeptide: 3 or more."], [9, "Protein quality measure?", "PDCAAS: accounts for digestibility and essential amino acid provision; doesn't account for antinutrient factors. Animal proteins have all essential amino acids; plant protein digestibility is lower (soy is the notable complete plant source)."], [9, "Protein RDA for adults and how needs change with calories?", "0.8 g/kg/day for adults 19+. Needs rise as calorie intake falls (protein can supply 1-6% of energy, up to 10% when glycogen-depleted)."], [9, "Protein AMDR?", "5-20% of calories for ages 1-3; 10-30% for 4-18; 10-35% for adults. Increase protein 1% for each 100 kcal below 2,000/day."], [9, "Protein recommendations for athletes?", "Endurance 1.0-1.6 g/kg/day; strength 1.4-1.7; combined 1.4-1.7."], [9, "Post-exercise protein guidance?", "Muscle is most receptive after workouts; 20-48 g protein with carbohydrate (3:1 or 4:1 carb:protein) may stimulate muscle protein synthesis, depending on leucine content."], [9, "Protein and bone health?", "Protein makes up about 50% of bone volume and 33% of mass; influences IGF-I. Intake under 0.7 g/kg suppresses calcium absorption; above that raises absorption and excretion."], [9, "Protein and weight management?", "Dose-dependent satiety; highest thermic effect of the macronutrients."], [9, "Monosaccharides and key disaccharides?", "Monosaccharides: glucose, fructose (sweetest, naturally in fruit, less insulin), galactose. Sucrose = glucose + fructose; lactose = glucose + galactose; maltose = glucose + glucose."], [9, "Polysaccharides?", "Starch (plant storage), fiber (plant cell wall, partly resistant to digestion), glycogen (animal storage)."], [9, "Glycemic index definition and caveats?", "Ranks carbs by how fast they raise blood glucose (reference: glucose or white bread = 100). Values vary with ripeness, cooking, storage, and meal composition. Higher GI during/after exercise for glycogen replenishment."], [9, "Glycemic load formula?", "GL = (GI x grams of carbohydrate per serving) / 100."], [9, "Fiber recommendations and low-fiber risks?", "Women 21-29 g/day; men 30-38 g/day. Low fiber linked to constipation, heart disease, colon cancer, type 2 diabetes."], [9, "Carbohydrate requirements for athletes?", "Endurance (90+ min/day moderate or HIIT): 8-10 g/kg/day, plus 1.5 g/kg high-GL carb within 30 min. Strength, sprint, skill athletes: 5-6 g/kg/day."], [9, "Fat energy density and fat types?", "About 9 kcal/g. Saturated: no double bonds. Monounsaturated: one double bond. Polyunsaturated: two or more (omega-3, omega-6)."], [9, "Omega-3 types and sources?", "EPA and DHA from fatty fish (lower triglycerides and BP). ALA from flax, walnuts, soy, canola; poorly converted (about 5% to EPA, under 0.5% to DHA)."], [9, "Functions of fat?", "Energy storage, organ insulation/protection, hormone regulation, carrier for vitamins A, D, E, K."], [9, "Cholesterol: functions and lipoproteins?", "Cell membrane component; precursor of bile salts, vitamin D, sex hormones, cortisol. LDL/VLDL/triglycerides raise heart disease risk; HDL is protective."], [9, "Dietary fat guidelines for heart health?", "Limit saturated fat to under 10% of calories; avoid hydrogenated oils; replace saturated with unsaturated (especially polyunsaturated)."], [9, "Fat as fuel during exercise?", "Large stores (lean 160 lb runner at 4% body fat holds about 22,400 kcal); dominant at rest/low intensity; shifts to carbohydrate as intensity rises; aerobic training increases fatty acid use."], [9, "Water-soluble vs fat-soluble vitamins?", "Water-soluble: B vitamins and C; excreted in urine (B12 stored in liver for years). Fat-soluble: A, D, E, K; stored in fat tissue; toxicity possible."], [9, "Vitamin toxicity risks?", "Vitamin A (preformed): liver damage, intracranial pressure, nausea, bone pain, coma. Vitamin D: arrhythmias, calcification, kidney damage. Vitamin E: anticoagulant, hemorrhagic stroke risk."], [9, "Heme vs nonheme iron?", "Heme: only in meat, most absorbable, unaffected by other substances. Nonheme: plants/fortified foods, absorption reduced by plant compounds, increased with vitamin C."], [9, "Iron functions and deficiency?", "Hemoglobin synthesis and myoglobin. Deficiency stages: depletion, marginal deficiency, anemia (fatigue, weakness, poor concentration, decreased exercise capacity, hair loss, pica). Most common nutrient deficiency worldwide."], [9, "Calcium importance?", "Bone growth and density; deficiency pulls calcium from bone, lowering BMD and peak bone mass and raising fracture risk. Encourage dairy/calcium-rich foods."], [9, "Nutrient-dense vs calorie-dense foods?", "Nutrient-dense: high fiber, vitamins, minerals relative to calories (milk, vegetables, protein foods, grains). Calorie-dense: high calories, low nutrients (chips, candy, desserts)."], [9, "Body water and hypohydration effects?", "Water is 45-75% of body weight. Hypohydration raises HR and perceived exertion, lowers plasma volume; 2-3% loss impairs performance, power, neuromuscular control; raises heatstroke risk."], [9, "Why are children at higher dehydration risk?", "Higher surface area relative to mass, more heat production, less sweating ability, lower thirst sensation."], [9, "Heat acclimation effects?", "Greater sweat volume, lower sweat electrolyte content, earlier onset of sweating; dehydration risk is greatest early in the season."], [9, "Adequate water intake?", "Men 3.7 L, women 2.7 L, pregnant 3.0 L, lactating 3.8 L (all fluids count)."], [9, "Fluid intake guidelines?", "Prevent losses over 2% body weight. Pre-exercise USG under 1.020. Children: 88 lb = 5 oz every 20 min; adolescents 132 lb = 9 oz every 20 min. Hot weather drink: 460-690 mg sodium and 78-195 mg potassium per liter, 5-10% carbohydrate. Recovery under 12 h: 1.5 L per kg lost. Thirst is unreliable."], [9, "Hydration biomarker cutoffs (euhydration)?", "Total body water <2%; plasma osmolality <290 mOsmol; urine specific gravity <1.020; urine osmolality <700 mOsmol; body weight change <1%."], [9, "Electrolytes lost in sweat (order) and hyponatremia?", "Sodium > potassium > magnesium > calcium. Hyponatremia: blood sodium below 125 mmol/L (headache, nausea, cramps, swelling); below 120 can cause cerebral edema, seizures, coma, death."], [10, "Glycogen storage capacity and sites?", "About 15 g per kg body weight (80 kg man about 1,200 kcal). Liver glycogen serves the whole body; muscle glycogen only that muscle."], [10, "Pre-competition meal guidelines?", "Provides fluid and carbohydrate; smaller closer to competition; avoid high fat, high fiber, and sugar alcohols; experiment in training, never try a new protocol right before competition."], [10, "Pre-event carbohydrate by timing (endurance)?", "4+ h before: 1-4 g/kg carbohydrate plus 0.15-0.25 g/kg protein. 2 h before: about 1 g/kg. 1 h before: about 0.5 g/kg (liquid carbs if under 2 h)."], [10, "When does the pre-competition meal matter most?", "Long-duration aerobic events (over 2 hours); carbohydrate 3+ hours before can enhance depleted glycogen."], [10, "Carbohydrate loading protocol?", "Three high-carb days at 8-10 g/kg with tapering; marathoners may use 10-12 g/kg 36-48 h before. Weigh drawbacks (temporary weight gain) and trial it outside competition."], [10, "During-event carbohydrate for prolonged endurance?", "30-90 g per hour of multiple carbohydrate types (glucose + fructose beats a single type)."], [10, "Fluid/electrolyte during intermittent high-intensity sports?", "200-400 mL every 15-20 min; drink with 20-30 mEq sodium, 2-5 mEq potassium, 5-10% carbohydrate."], [10, "Post-exercise nutrition for endurance athletes?", "About 1.5 g/kg carbohydrate within 30 min; about 10 g protein within 3 h; high-carb meals at regular intervals if under 24 h to next bout. Daily: 8-10 g/kg carbohydrate and 1.0-1.6 g/kg protein for 90+ min training."], [10, "Post-exercise protein for strength/hypertrophy?", "Younger: 20-25 g high-quality, high-leucine protein; older: 40+ g. 30-100 g high-GI carbohydrate after muscle-damaging exercise; 20-30 g leucine-rich protein every 3-4 h. Daily: 1.4-1.7 g/kg protein, 5-6 g/kg carbohydrate."], [10, "Components of TDEE?", "BMR/RMR (65-70%, largest), physical activity (20-30%, more in athletes), diet-induced thermogenesis (thermic effect of food)."], [10, "BMR vs RMR?", "RMR measured after overnight fast without exercise; BMR typically 10-20% higher than RMR per guide (digestion/exercise effects). Often used interchangeably."], [10, "Harris-Benedict vs Cunningham equation?", "Harris-Benedict: sex, weight, height, age. Cunningham: RMR = 550 + 22 x lean body mass (kg); more accurate since it uses fat-free mass."], [10, "MET for energy estimation?", "1 MET = resting energy expenditure while sitting quietly (3.5 mL O2/kg/min)."], [10, "Rough daily kcal per kg: light/moderate/heavy activity?", "Men: 38 / 41 / 50 kcal/kg. Women: 35 / 37 / 44 kcal/kg."], [10, "Gaining lean mass: guidelines?", "About 500 kcal above TDEE daily, at least 1.5-2.0 g/kg protein, work with a sports dietitian."], [10, "Fat loss guidelines?", "Intake below expenditure; total calories and adherence matter most; low-carb and low-fat work equally at equal calories; 1.8-2.7 g/kg protein; about 500 kcal/day deficit minimizes muscle loss."], [10, "BMI formula and categories?", "Weight (kg) / height (m)^2. Overweight 25-29.9; obesity 30+. Screening tool only: overestimates in muscular people, underestimates in older adults with less muscle."], [10, "Waist circumference risk thresholds?", "Elevated disease risk above 40 inches (men) and 35 inches (women)."], [10, "Obesity-related risks and screening?", "Hypertension, dyslipidemia, CHD, stroke, type 2 diabetes, gallbladder disease, sleep apnea, osteoarthritis, some cancers. Screen for diabetes, orthopedic and cardiac problems, binge-eating disorder, depression."], [10, "Rapid weight loss: methods and risks?", "Fasting, fad diets, voluntary dehydration (diuretics, sauna, spitting, vomiting, laxatives). Risks: lean mass loss, reduced strength/performance, dehydration, heat illness, electrolyte imbalance, kidney failure, low BP, immune suppression, death."], [10, "Anorexia nervosa key features?", "Distorted body image, intense fear of weight gain, severe restriction; ritual behaviors; restrictive or binge-purge subtypes; average onset about 19; highest mortality of any mental health disorder."], [10, "Binge-eating disorder criteria and features?", "Repeated uncontrolled binges (at least once weekly for 3 weeks): rapid eating, eating until uncomfortably full, eating when not hungry, eating alone, guilt; no purging so often overweight; average onset about 25."], [10, "Bulimia nervosa?", "Recurrent binge eating followed by purging (vomiting, intense exercise, laxatives/diuretics); average onset about 20."], [10, "ARFID?", "Avoidant/restrictive food intake disorder: lack of interest in food (not due to other disorders/culture) causing weight loss, nutritional deficiency, dependence on supplements/enteral feeding, psychosocial interference."], [10, "Pica and rumination disorder?", "Pica: eating nonnutritive substances for 1+ month (clay, starch, ice). Rumination: chewing/re-swallowing/spitting regurgitated food for 1+ month."], [10, "Role of the S&C professional with suspected eating disorders?", "Refer the athlete to a qualified physician; not qualified to diagnose or treat."], [10, "Anorexia nervosa physical signs?", "Osteopenia/osteoporosis, brittle hair/nails, lanugo (fine body hair), anemia, muscle wasting, constipation, low BP/pulse, cardiac damage, feeling cold, fatigue, infertility."], [10, "Bulimia nervosa physical signs?", "Chronic sore throat, swollen salivary glands, worn tooth enamel, acid reflux, GI distress, severe dehydration, electrolyte imbalances (can cause heart attack)."], [11, "Two categories of performance-enhancing substances?", "Hormones and drugs that mimic them; dietary supplements."], [11, "Dietary supplement regulation?", "Regulated by the FDA, but products do not need to meet FDA standards for safety and effectiveness before sale."], [11, "Anabolic steroids: what are they and how are they used?", "Synthetic testosterone derivatives (chemically modified to slow degradation). Used in \"stacking\" and in cycles; dose-response is logarithmic; linked to strength/power sports; muscle dysmorphia is a motivation."], [11, "Anabolic steroid effects and adverse effects?", "Increase muscle mass and strength (esp. in trained strength athletes), aggression. Adverse: higher BP and blood lipids, gynecomastia, testicular atrophy, low sperm count, acne, liver tumors/damage, premature epiphyseal closure, tendon tears, mood disturbances. Women: menstrual irregularity, clitoromegaly, deepened voice."], [11, "Prohormones?", "Precursors to other hormones; no significant anabolic effects shown; still banned by many organizations."], [11, "hCG: what and why used?", "Placenta-derived hormone similar to LH; stimulates testicular testosterone; used at the end of a steroid cycle to counter suppressed testosterone; ineffective for weight loss. Side effects mainly injection-site pain."], [11, "Insulin as an anabolic?", "Secreted by pancreas; increases muscle protein synthesis and suppresses breakdown; injection in healthy people risks coma, death, or diabetes."], [11, "HGH: effects and risks?", "Anterior pituitary protein; effective for muscle mass in deficient men; hard to detect in random testing. Risks: acromegaly, diabetes, cardiovascular dysfunction, hypertension, accelerated osteoarthritis."], [11, "EPO: effects and risks?", "Kidney hormone stimulating red cell production; raises hematocrit/hemoglobin, aerobic capacity 6-8%, time to exhaustion up to 17%. Risks: higher viscosity, clotting, systolic BP, stroke, embolism, worsened by dehydration."], [11, "Beta-agonists?", "Epinephrine-related bronchodilators; may increase lipolysis and thermogenesis. Side effects: tachycardia, hyperthermia, tremors, dizziness, palpitations, insomnia."], [11, "Beta-blockers?", "Block beta-adrenergic receptors, reduce anxiety and tremor (helpful in archery/shooting). Adverse: reduced cardiovascular response to exercise, slower 10 km time, bronchospasm, bradycardia, hypoglycemia, heart failure risk."], [11, "EAAs vs BCAAs and leucine?", "EAAs stimulate muscle protein synthesis. BCAAs (leucine, isoleucine, valine) are most responsible; leucine is key, and total leucine matters more than total protein. No adverse effects reported."], [11, "Arginine ergogenic effect?", "Conditionally essential; produces nitric oxide; marketed as vasodilator; no evidence of benefit in healthy people; no adverse effects at typical doses."], [11, "HMB?", "Leucine derivative; stimulates muscle protein synthesis and reduces breakdown; benefits beginners or trained athletes starting a new program; little benefit in trained athletes on a continued program; no adverse effects at typical doses."], [11, "Beta-alanine: mechanism, benefit, side effect?", "Raises muscle carnosine (up to 40% of muscle buffering capacity, mostly type II fibers); improves high-intensity exercise lasting over 60 s; high acute doses cause paresthesia (tingling), so space doses."], [11, "Sodium bicarbonate dosing and effect?", "0.3 g/kg raises blood pH and improves buffering for high-intensity exercise lasting 60 s to 6 min; higher doses cause cramping, diarrhea, nausea, vomiting; trial before competition."], [11, "Sodium citrate vs bicarbonate?", "Citrate also raises blood pH (breaks down to bicarbonate) with less GI distress, but needs more research."], [11, "L-carnitine?", "Made from lysine and methionine; carries fatty acids into mitochondria; no evidence it increases fat use; may reduce pain, muscle damage, and metabolic stress after resistance exercise; 2 g/day for 3 weeks upregulates androgen receptors; up to 3 g/day well tolerated."], [11, "Creatine: mechanism and effects?", "Supplies creatine phosphate to resynthesize ATP in short, high-intensity work; CP depletion is the main fatigue mechanism there. Increases strength gains (2-3x vs placebo in trained athletes), improves workout quality, raises lean mass (water uptake and protein synthesis); needs 28+ days; mild GI discomfort in loading; no long-term renal damage shown."], [11, "Caffeine: effects and side effects?", "CNS stimulant; improves power, sprint, strength, and endurance; most effective as tablet/anhydrous; main ingredient in pre-workouts. Side effects: anxiety, GI upset, insomnia, tremors, arrhythmias, withdrawal (headache, fatigue); very high doses can be fatal."], [11, "Ephedrine?", "Stimulant with thermogenic effect; effective mainly combined with caffeine; banned by FDA and most athletic committees due to adverse effects."], [11, "Citrus aurantium (bitter orange)?", "Mild stimulant containing synephrine (a beta-agonist); insufficient evidence for performance; synephrine banned by NCAA; may cause BP issues."], [12, "Two main reasons for athletic testing?", "Assess athletic talent (potential to play at the team's level) and identify physical abilities needing improvement."], [12, "Construct validity?", "Degree to which a test measures what it is supposed to measure. Valid tests measure sport-relevant abilities, are repeatable, differentiate ability levels, are scored accurately; choose the simpler/cheaper of two valid tests."], [12, "Face validity?", "Appearance (to nonexperts/athletes) that the test measures what it claims; improves athlete motivation."], [12, "Content validity?", "Expert judgment that the test covers all relevant component abilities in appropriate proportions for the sport."], [12, "Criterion-referenced validity: three subtypes?", "Concurrent (agrees with other accepted tests of the same ability), convergent (high correlation with the gold standard), predictive (corresponds to future performance)."], [12, "Discriminant validity?", "Ability to distinguish between different constructs; shown by low correlations between different tests, avoiding redundancy."], [12, "Reliability definition and relationship to validity?", "Consistency/repeatability of a test; a test must be reliable to be valid."], [12, "Test-retest reliability and typical error?", "Differences between two scores on an unchanged athlete reflect measurement error; typical error of measurement includes equipment error and biological variation."], [12, "Sources of score variability?", "Intrasubject variability (athlete inconsistency), interrater reliability problems (different raters), intra-rater variability (same tester inconsistent), and failure of the test itself (technique-dependent tests vary more)."], [12, "How to improve interrater reliability?", "Clearly defined scoring system; same scorer tests the same athletes pre and post; identical protocols among testers."], [12, "Test selection: metabolic specificity?", "Test should emulate the sport's energy demands (phosphagen, glycolytic, oxidative) and movement/energy patterns of the game."], [12, "Test selection: biomechanical specificity example?", "The more similar to the sport movement the better; e.g., vertical jump for basketball/volleyball; football linemen: pushing strength and 5-15 yd sprint; receivers: 30-100 yd sprint."], [12, "Test selection: experience, age, sex examples?", "Technique-intensive tests suit experienced athletes; 1.5-mile run suits college-aged athletes, not inexperienced preadolescents; max pull-ups inappropriate for many women (use prone pull-up with supported feet)."], [12, "Environmental limits for testing?", "Temperature above 80 F and humidity above 50% can impair endurance performance; allow altitude adaptation; record environmental conditions."], [12, "When is medical referral warranted during testing?", "Chest pressure, pain, light-headedness/dizziness/confusion, headache, cold or clammy skin, irregular or rapid pulse, joint pain, blurred vision, nausea, shortness of breath, disproportionate weakness."], [12, "Health and safety basics for testing?", "Medical clearance beforehand, monitor health before/during/after maximal exertion (1RM and max running can reveal heart pro
