blems), heat precautions (light clothing, water), don't ignore musculoskeletal symptoms."], [12, "Rest intervals between test trials and tests?", "At least 2 min between non-maximal attempts; at least 3 min near maximal attempts; 5 min between separate tests in a battery."], [12, "Logical test order?", "Non-fatiguing (height, weight, flexibility, vertical jump) > agility (T-test, pro agility) > max power/strength (1RM clean, squat) > sprints > local muscular endurance > fatiguing anaerobic capacity (300 yd shuttle) > aerobic capacity (1.5-mile run, Yo-Yo)."], [12, "Rules for sequencing fatiguing tests?", "High-skill tests before fatiguing ones; anaerobic capacity and aerobic tests on a different day if possible (or last after extended rest); if on different days, same time of day."], [12, "Preparing athletes for testing?", "Announce date/purpose in advance; familiarization 1-3 days before at submaximal intensity; give instructions (purpose, procedure, warm-up, trials, scoring, disallowed attempts); demonstrate; same warm-up for everyone; equal motivation; cooldown after (walk/stretch, don't sit or lie down)."], [12, "Tester training and recording forms?", "Testers must be trained and practiced, follow identical protocols (e.g., same verbal encouragement); forms prepared in advance with results, comments, environmental conditions, and setup details (e.g., pin height)."], [13, "How is maximal muscular strength quantified, and how many attempts to find 1RM?", "1RM (in a lift, isometric force via transducer, or max force at an isokinetic speed). After submaximal warm-up (first attempt about 50% of estimated 1RM, rest 1-5 min), find 1RM within 3-5 attempts."], [13, "1RM bench press protocol essentials?", "Instruct technique; spotter at head of bench; warm-up 5-10 reps light, then 1-2 sets near 1RM; find 1RM within 3-5 attempts after warm-up; record attempts."], [13, "1RM bench pull protocol key points?", "Closed pronated grip; start from hang; bar pulled to lower chest with elbows up; head stays in contact with bench; valid rep requires bar touching bottom of bench with control; feet off ground."], [13, "1RM back squat protocol equipment and personnel?", "Squat rack with adjustable safety bars, flat solid surface; two spotters and one recorder; load increments may be larger than bench."], [13, "1RM power clean protocol?", "Olympic bar with revolving sleeves, lifting platform; one tester and one recorder; 3-5 attempts after warm-up. Tests high-speed strength/maximum power."], [13, "Anaerobic maximum power: characteristics and tests?", "High force at high speed, usually 1 second or less, using CP and stored ATP. Tests: 1RM explosive lifts, vertical jump, stair sprint, Wingate."], [13, "Wingate anaerobic test?", "30 s maximal cycle ergometer effort with resistance based on body weight; power = work/time per 5-s interval; outputs peak power, average power, fatigue index."], [13, "Anaerobic capacity definition?", "Maximal rate of energy production by phosphagen plus anaerobic glycolysis, quantified as max power over 30-90 s."], [13, "Local muscular endurance and example tests?", "Repeated contractions against submaximal resistance; tests are continuous without rest (max pull-ups, push-ups, fixed-load resistance exercise)."], [13, "Aerobic capacity definition and measurement?", "Max rate of energy production via oxidation (aerobic power), expressed in mL/kg/min; usually estimated from 1.5-mile run, 12-min run, maximal aerobic speed, or Yo-Yo test."], [13, "Agility vs speed definitions?", "Agility: rapid whole-body change of direction or speed in response to a sport-specific stimulus (T-test, 5-0-5, pro agility). Speed: distance per time; 10 yd measures acceleration, 40 yd measures maximum speed; tests not over 100 m."], [13, "Hand vs electronic timing?", "Hand timing can be up to about 0.24 s faster due to reaction delay and anticipation; electronic timing preferred."], [13, "Flexibility testing methods and rules?", "Goniometers (joint angle) and sit-and-reach (hips/lower back); standardized warm-up and static stretching; move slowly and hold; no ballistic stretching."], [13, "Balance vs stability; valid balance tests?", "Balance: maintain center of gravity over base of support (static/dynamic equilibrium). Stability: return to desired position after disturbance. BESS and Star Excursion Balance Test are reliable; poor balance raises lower-limb injury risk."], [13, "Body composition measurement standards?", "Two-compartment model (fat vs lean). Skinfold (trained tester, consistent caliper pressure) is the most reliable/valid generally available; DEXA and hydrostatic weighing are gold standards; circumferences add disease-risk info."], [13, "Anthropometry measurement rules?", "Height: stadiometer, no shoes, nearest 1/4 in or 0.5 cm. Weight: calibrated scale, minimal dry clothing, morning after voiding before fluids/food. Girth: spring-loaded flexible tape, baseline at start of training."], [13, "Difference score vs percent change; limitation?", "Difference score: post minus pre. Percent change: relative to initial score. Limitation: lower-trained athletes have more room to improve; athletes may sandbag pretests."], [13, "Descriptive statistics: central tendency measures?", "Mean (average), median (middle score), mode (most frequent; least useful)."], [13, "Variability measures and formulas?", "Range (lowest to highest); standard deviation SD = sqrt[sum(x - mean)^2 / (n - 1)]; z = (x - mean)/SD; percentile rank = percentage scoring below."], [13, "Inferential vs magnitude statistics?", "Inferential: draw conclusions about a population from a sample. Magnitude: assess practical significance (smallest worthwhile change, effect size)."], [13, "Smallest worthwhile change formula?", "0.2 x between-subjects standard deviation (e.g., SD 10 cm vertical jump gives 2 cm)."], [13, "Effect size formula and benchmarks?", "ES = (post mean - pre mean) / pretest SD. Small 0.2, moderate 0.6, large 1.2, very large 2.0. Example: (111.7-104.5)/5.7 = 1.26 (large)."], [13, "Six steps for an athletic profile?", "Select sport-relevant tests; choose valid and reliable tests in proper order; test as many athletes as possible; determine smallest worthwhile change and compare to norms (build your own); retest and present visually; use results to identify strengths/weaknesses and design training."], [13, "Standing long jump protocol?", "Flat 20 ft area, tape start line; toe behind line; countermovement and jump as far as possible; must land on feet; measure to rearmost heel."], [13, "Vertical jump protocol (chalk and Vertec)?", "Dominant shoulder 6 in from wall, reach and mark; countermovement without stutter step, mark at peak; score = difference; best of three. Vertec: tap highest vane; score vs standing reach."], [13, "Static vertical jump and eccentric utilization ratio?", "Contact mat; squat hold 2-3 s then jump. Eccentric utilization ratio = countermovement jump height / static jump height."], [13, "Reactive strength index protocol?", "Step off a drop box (hands on hips) onto contact mat, jump as high as possible with minimal contact time. RSI = jump height / ground contact time; multiple box heights give stretch tolerance profile."], [13, "Margaria-Kalamen test?", "Sprint from 20 ft, climb stairs 3 at a time, timed from 3rd to 9th step (elevation = 6 x step height). Power = (weight in newtons x height) / time. 2-3 trials with 2-3 min rest."], [13, "300-yard shuttle protocol?", "Two lines 25 yd apart; six round trips; pairs of athletes; 5 min rest; two trials averaged. Tests anaerobic capacity."], [13, "Partial curl-up test protocol?", "90-degree knees, metronome 40 bpm, lift shoulder blades slowly without neck flexion, tape markers 12 cm apart (<45 y) or 8 cm (>45); maximum 75 reps. Tests abdominal endurance."], [13, "Push-up test: Army vs ACSM standards?", "Army: max reps in 2 min, low position = upper arms parallel to ground, women same as men, pause only in up position. ACSM: continuous to failure; women use knees at 90 degrees; low position = chest touches fist/foam roller."], [13, "YMCA bench press test?", "80 lb (men) or 35 lb (women), metronome 60 bpm (2 counts per rep); repeat until unable to keep pace. Tests chest endurance."], [13, "1.5-mile run and 12-minute run tests?", "1.5-mile: fastest time at a steady, barely maintainable pace. 12-min: farthest distance in 12 minutes on a 400 m track. Both test aerobic capacity."], [13, "Yo-Yo intermittent recovery test?", "2 x 20 m shuttles with active recovery (5 m jog); audio beeps increase speed; ends after two missed beeps; IRT1 starts at 10 km/h (recommended), IRT2 at 13 km/h. Better for team sports."], [13, "Maximal aerobic speed test?", "Cones every 25 m; start 8-12 km/h; increase 1 km/h every 2 min; last speed held 2 min = MAS; VO2max = 3.5 x MAS (km/h)."], [13, "T-test protocol and disqualifications?", "Sprint forward, shuffle left 5 yd, right 10 yd, left 5 yd, backpedal; best of two trials. DQ: not touching cone, crossing feet, not facing forward."], [13, "Hexagon test protocol?", "24-inch sides, 120-degree angles; double-leg hop over each side clockwise 3 times, always facing same direction; repeat if landing on a line, losing balance, or turning."], [13, "Pro agility test (20-yard shuttle) protocol?", "Three lines 5 yd apart; start straddling center line (three-point stance); sprint 5 yd left, 10 yd right, 5 yd to center; touch all lines; best of three."], [13, "5-0-5 agility test?", "Sprint 10 m, then 5 m to turning line, turn and accelerate back; timing starts at the 10 m mark; best of two trials; preferred leg (or both)."], [13, "Straight-line sprint test protocol?", "Dynamic warm-up and two submax practice runs; 3- or 4-point stance; sprint specified distance (e.g., 40 yd, 10/20/40 m); best of two trials; 2 min rest between sets. Tests maximal speed."], [13, "Balance Error Scoring System (BESS)?", "Three stances (double-leg, single-leg on nondominant leg, tandem) on firm and foam surfaces, 20 s each with eyes closed and hands on hips; errors include opening eyes, lifting hands, touchdown, stepping, lifting forefoot/heel, >30 degrees hip flexion/abduction, out of position 5+ s; errors summed."], [13, "Star Excursion Balance Test?", "Single-leg stance at center of grid with 8 lines at 45-degree increments; reach as far as possible with the other leg; three trials with 15 s rest; at least four practice trials; anteromedial, medial, posteromedial directions often enough."], [13, "Sit-and-reach protocol?", "Tape at 15-inch mark, shoeless, feet 12 in apart with heels at the line; slow reach, exhale; best of three. Tests hamstring and low back flexibility."], [13, "Overhead squat test?", "Dowel overhead with grip twice shoulder width, heels down, squat until hip crease below knee top; at least five reps viewed from the side; qualitative pass/fail assessment of flexibility and movement."], [13, "Skinfold measurement procedure?", "Dry skin, before exercise; grasp fold with thumb and index finger; calipers perpendicular 0.5-1 inch from fingers; read 1-2 s after release to nearest 0.5 mm; two trials per site; average if within 10%, otherwise repeat."], [13, "Skinfold sites (chest, thigh, abdomen, triceps)?", "Chest: diagonal fold halfway between anterior axillary line and nipple (men). Thigh: vertical, midway hip and knee. Abdomen: vertical, 1 inch right of umbilicus. Triceps: vertical on posterior midline, halfway between acromion and olecranon."], [13, "Skinfold sites (suprailium, midaxilla, subscapula, calf)?", "Suprailium: diagonal above iliac crest. Midaxilla: vertical at xiphoid level. Subscapula: diagonal 0.5-1 in from inferior angle of scapula. Calf: vertical on medial calf at maximum circumference."], [13, "Girth measurement protocol?", "Spring-loaded flexible tape in relaxed anatomical position; sites: chest (nipple level in males), upper arm, forearm, abdomen (umbilicus), hips (maximal buttocks protrusion), thigh (maximal), calf (maximal)."], [14, "Benefits of a warm-up?", "Raises muscle and core temperature, enhances neural function, increases blood flow and baseline O2 consumption, post-activation potentiation, lowers viscous resistance, improves O2 delivery (Bohr effect), faster contraction/relaxation, better RFD, strength, power, and psychological readiness. Best elicited with an active warm-up."], [14, "Bohr effect in warm-up context?", "Higher temperature facilitates oxygen release from hemoglobin and myoglobin."], [14, "Phases and length of a warm-up?", "General (about 5 min slow aerobic activity plus general stretching) then specific (sport-like movements and skill rehearsal). Typically 10-20 min; progress gradually without fatigue."], [14, "RAMP protocol?", "Raise (physiological parameters and skill via low-intensity sport movements), Activate and Mobilize (key movement patterns, motor control, stability, flexibility; dynamic over static), Potentiate (sport-specific activities progressing to session intensity; crucial for speed, strength, power)."], [14, "Static vs dynamic flexibility?", "Static: ROM during passive movement (external force). Dynamic: ROM during active movement requiring muscle action. Mobility adds balance, coordination, postural control, perception."], [14, "Flexibility and performance?", "Depends on sport; most flexible is not always best; too little ROM or hyperflexibility both raise injury risk."], [14, "Joint structure and ROM?", "Ball-and-socket (shoulder, hip): greatest ROM in all planes. Ellipsoidal (wrist): sagittal and frontal. Hinge (knee): primarily sagittal."], [14, "Age and sex effects on flexibility?", "Younger are more flexible than older; females more than males. Older adults undergo fibrosis from inactivity but can improve with exercise."], [14, "Elasticity vs plasticity?", "Elasticity: return to resting length after passive stretch. Plasticity: tendency to assume a new, greater length after stretch; stretching exploits plasticity."], [14, "Other factors affecting flexibility?", "Stretch tolerance, neural control, resistance training (full ROM, agonist and antagonist), muscle bulk (can impede ROM), activity level."], [14, "Stretching dosage guidelines?", "Hold 15-30 s (under 15 s little effect; over 30 s diminishing returns) at mild discomfort, not pain; ROM gains last 3 min to 24 h temporarily; twice weekly for 5 weeks gives lasting improvement; precede with general activity."], [14, "Timing of stretching?", "After practice or competition (warm muscles), or in a separate session preceded by a general warm-up."], [14, "Muscle spindle role in stretching?", "Rapid stretch triggers the stretch reflex (muscle contraction), which limits ROM; stretch slowly to avoid it."], [14, "Autogenic vs reciprocal inhibition?", "Autogenic: GTO-driven relaxation of the same muscle after it develops tension (contract before passive stretch). Reciprocal: relaxation of the antagonist when the opposite muscle contracts (e.g., quads contract during hamstring stretch)."], [14, "Active vs passive vs static stretching?", "Active: the person provides the force. Passive: partner/machine provides the force. Static: slow, constant, held 15-30 s; can be active or passive; caution on hypermobile joints and spinal combination movements."], [14, "Ballistic stretching?", "Active bouncing movement without holding end position; stimulates stretch reflex; injury risk if uncontrolled; avoid in injured areas."], [14, "Dynamic stretching?", "Controlled sport-generic or sport-specific movements through ROM; muscle stays active; ideal warm-up; improves dynamic flexibility; may improve static ROM less than static/PNF."], [14, "PNF stretching: general structure?", "Partner-assisted; combines passive stretch with isometric or concentric contraction of the stretched muscle (autogenic inhibition) and/or agonist contraction (reciprocal inhibition), followed by a passive static stretch (\"the relax\")."], [14, "Hold-relax PNF sequence?", "Passive pre-stretch 10 s at mild discomfort; isometric \"hold\" against partner 6 s; relax and passive stretch 30 s."], [14, "Contract-relax PNF sequence?", "Passive pre-stretch 10 s; concentric contraction through full ROM against mild resistance; relax and passive stretch 30 s."], [14, "Hold-relax with agonist contraction?", "Same as hold-relax (10 s pre-stretch, 6 s isometric hold), then concentric contraction of the opposite (agonist) muscle to move deeper into ROM, using reciprocal inhibition."], [15, "Pronated vs supinated vs neutral vs alternated grip?", "Pronated: palms down. Supinated: palms up. Neutral: palms facing each other. Alternated: one pronated, one supinated."], [15, "Closed vs false vs hook grip?", "Closed: thumb wrapped around bar. False: thumb not wrapped. Hook: pronated grip with thumb under index and middle fingers (power exercises; used for clean and snatch)."], [15, "Common, clean, and snatch grip widths?", "Common: about shoulder width. Clean: slightly wider than shoulder width (hook grip). Snatch: wide, measured fist-to-opposite-shoulder or elbow-to-elbow with arms out to the sides (hook grip)."], [15, "Five-point body contact position?", "Head, shoulders/upper back, and buttocks on the bench, plus right and left feet flat on the floor; for supine exercises."], [15, "Standing stance for most exercises?", "Feet slightly wider than hip width, heels and balls of feet in contact with the floor."], [15, "Breathing during a lift?", "Inhale on eccentric phase, exhale through the sticking point (most strenuous portion, shortly after the eccentric-to-concentric transition). Experienced lifters may use Valsalva on structural lifts; hold no longer than 1-2 s."], [15, "Valsalva maneuver: purpose and risks?", "Exhaling against a closed glottis with abdomen and rib cage contracted creates a fluid ball that supports the spine and reduces disc compression; risks: dizziness, blackout, very high BP."], [15, "Spotting: overhead, bar-on-back, front-rack exercises?", "Perform in a power rack with appropriate crossbars; spotters at least as strong and tall as the lifter; clear area; power exercises (cleans, snatch) are not spotted."], [15, "Spotting over-the-face exercises and dumbbells?", "Alternated grip (narrower than lifter's) on bar; for curved paths use alternated for liftoff, supinated while spotting. Dumbbells: spot forearms near wrists (not triceps/elbows) or the dumbbell itself in pullovers and overhead triceps extensions."], [15, "Number of spotters and communication?", "Use the minimum number needed (load, athlete/spotter experience and strength). Athlete states handling, reps, and liftoff signal; for assistance say \"take it\"; spotter helps mainly through the sticking point."], [15, "Two-spotter bench liftoff?", "One spotter helps with liftoff then moves to the empty end of the bar opposite the other spotter; both help rack."], [15, "Bench press: athlete form?", "Five-point contact, eyes under bar, closed pronated grip slightly wider than shoulders; bar touches chest at about nipple level; wrists stiff, forearms perpendicular to floor; push up and slightly back; do not arch or raise chest."], [15, "Bench press: spotter position?", "Stand at head of bench, feet shoulder width, alternated grip inside the athlete's hands, hands close to but not touching the bar; keep back neutral."], [15, "Back squat: low bar vs high bar?", "Low bar: across posterior deltoids at mid-trapezius (grip wider than shoulders). High bar: above posterior deltoids at base of neck (grip slightly wider than shoulders)."], [15, "Back squat form cues?", "Elbows up to create a shelf, chest up and out, neutral spine, constant torso angle, heels down, knees over feet; descend until thighs parallel, trunk begins to round, or heels rise; extend hips and knees at the same rate."], [15, "Back/front squat spotters?", "Two spotters at the ends of the bar, thumbs crossed, hands 2-3 inches below bar ends, follow athlete with neutral spine, move sideways with athlete to rack."], [15, "Front squat arm positions?", "Parallel-arm (clean grip): closed pronated grip slightly wider than shoulders, bar on anterior deltoids and clavicles, upper arms parallel to floor. Crossed-arm: arms crossed, open grip on top of the bar, elbows up."], [15, "Forward step lunge: key cues?", "Bar high on back; exaggerated step directly forward; torso erect; lead knee over lead foot; trailing knee 1-2 in above floor; push off with lead leg back to start without stutter step; spotter's lead foot 12-18 in behind athlete's."], [15, "Barbell step-up cues?", "Whole foot on box; keep torso erect; trailing foot stays put (no push off or hop); extend lead hip and knee to stand; descend with the trailing leg, then bring the lead foot back."], [15, "Deadlift start position?", "Feet hip to shoulder width, bar over balls of feet about 1 in from shins; closed pronated or alternated grip just outside the knees; hips lower than shoulders; neutral or slightly arched back; scapulae depressed and retracted; shoulders over or slightly ahead of bar; elbows extended."], [15, "Deadlift upward movement?", "Extend hips and knees keeping torso-to-floor angle constant (hips don't rise before shoulders); bar close to shins/thighs; lower with controlled hip and knee flexion and a neutral spine."], [15, "Push press phases?", "Dip (controlled, not past a quarter squat, torso erect) > drive (explosive triple extension then elbows) > press out to full elbow extension (bar over/behind ears); lower to shoulders cushioning with hips/knees."], [15, "Push jerk vs push press?", "Push jerk adds a catch: after the drive, quickly dip under so the bar is received overhead with elbows fully extended at the same moment it peaks, then recover to standing. Push press has no catch under the bar."], [15, "Split jerk catch and recovery?", "After dip and drive, split legs forward/back into a lunge to catch the bar as it reaches maximal height; front foot flat, back heel up; front shin and rear thigh near vertical; recover by stepping back with the front foot half the split, then forward with the back foot."], [15, "Power clean phases?", "Start (hook grip slightly wider than shoulders, bar over balls of feet, shoulders over bar) > first pull (extend hips/knees, constant torso angle) > transition (thrust hips forward, knees under bar) > second pull (triple extension, shrug, pull under) > catch (quarter squat, bar on clavicles/anterior deltoids, upper arms parallel)."], [15, "Second pull key cues?", "Rapidly extend hips, knees, ankles keeping heels down as long as possible; keep bar close; shoulders over bar and elbows extended until full lower body extension; then shrug and flex elbows to pull under the bar."], [15, "Power snatch catch position?", "Bar caught over and slightly behind the ears in a quarter squat with fully extended elbows, erect torso, neutral head, flat feet, weight over mid-foot."], [15, "Safe lowering after a power clean/snatch?", "Lower in control to the thighs while flexing hips and knees to cushion; drop bumper plates to the platform only if using rubber bumpers."], [16, "General guidelines for nontraditional implement training?", "Similar to traditional: stable aligned body position; feet typically wider than shoulder width for ground-based work; one of the three traditional grips (grip often limiting); exhale through sticking point, inhale on eccentric; Valsalva for structural lifts."], [16, "Bodyweight training benefits and limits?", "Low cost, builds relative strength and body control, closed-chain, multiple muscle groups, specific to individual anthropometrics. Limited resistance: progress via reps (shifts toward strength-endurance), changing movement patterns (feet-elevated push-ups), or suspension devices."], [16, "Anatomical core and isolation exercises?", "Core: axial skeleton and soft tissues with proximal attachments on it; transfers torque and angular momentum. Isolation (planks) can help untrained/rehab but limited transfer to performance."], [16, "Free weights vs machines vs instability for core?", "Ground-based free weights (squat, deadlift, snatch) give core activation similar or greater to isolation work. Machines reduce stabilization. Instability devices raise core activation but cut agonist force/power (to under 70% of stable); best for novices or rehab."], [16, "Three methods of applying overload?", "Constant external resistance (traditional; best real-life transfer), accommodating resistance (semi-isokinetic; poor external validity), variable resistance (bands/chains matching strength curve)."], [16, "Why use variable resistance?", "Offsets changing mechanical advantage and deceleration at the end of the concentric phase, increasing load at mechanically advantageous angles (e.g., top of a squat)."], [16, "Chain loading: how calculated and applied?", "Load depends on chain structure, density, length, diameter; average the top and bottom loads and adjust bar load. Method 1: chains touch floor from full extension. Method 2: main chains hung from lighter chains, touching floor only at the bottom (faster acceleration, within-rep PAP). Use with experienced/intermediate lifters."], [16, "Resistance band load calculation?", "Tension = stiffness (k) x deformation (d); add average band resistance of top and bottom positions to the bar load. Highest tension at top of the lift; may raise peak power (about 35% of squat load replaced by bands)."], [16, "Strongman exercises overview?", "Lifting, pushing, carrying implements: tire flip, log lift, farmer's walk."], [16, "Tire selection for flipping?", "Not taller than athlete's standing height; narrow tires harder for tall athletes, wide tires harder for short ones; worn treads are harder to grip; pronounced treads may hide debris or metal."], [16, "Tire flip techniques?", "Sumo (wide stance, narrow grip), back lift (narrower conventional deadlift stance, forward press), and shoulders-against-tire (preferred in practice literature)."], [16, "Tire flip form cues?", "Chin and anterior deltoids on tire, neutral spine, arms outside knees, supinated grip; extend knees/hips, take 2-3 forward steps to 45 degrees, drive knee into tire, switch to pronated grip, push tire over."], [16, "Log clean and press cues?", "Closed neutral grip on handles; first pull, transition (pull log into body, pause in quarter squat), explosive second pull, catch on clavicles/anterior deltoids; then dip (max quarter squat) and drive overhead."], [16, "Farmer's walk benefits and caution?", "Carry loads at the sides; builds anaerobic endurance, back endurance, grip strength, and stabilization; limited safety evidence so use experienced, strong athletes."], [16, "Kettlebell training key points?", "Increases strength vs no training, supports aerobic conditioning, six weeks of swings/goblet squats improved vertical jump (less than traditional lifting); best as general preparation. Cast iron fitness bells change size with weight; sport kettlebells have standardized size (weight by color)."], [16, "Unilateral training: use and rationale?", "Lunges, step-ups, single-leg squats; reduces asymmetries and used in rehab. Because bilateral facilitation occurs in trained/stronger athletes, focus unilateral work on untrained, weaker, or injured individuals."], [17, "SAID principle and specificity in resistance training?", "Specific Adaptations to Imposed Demands: the type of demand dictates the adaptation. Specificity involves muscles, movement pattern, speed, and force application; training should progress from general to sport-specific across season phases."], [17, "Overload and ways to apply it?", "Greater intensity than the athlete is accustomed to: increase loads, add sessions, exercises or sets, emphasize complex exercises, or shorten rest."], [17, "Progression?", "Gradual, systematic increase based on training status (more resistance, sessions, drills, or exercise difficulty, e.g., front squat to hang power clean to power clean)."], [17, "Seven program design variables?", "Needs analysis, exercise selection, training frequency, exercise order, training load and repetitions, volume, rest periods."], [17, "Needs analysis: two stages?", "Evaluation of the sport (movement, physiological, and injury analysis) and assessment of the athlete (training status, training background, testing, primary goal)."], [17, "Primary resistance training goals and focus per season?", "Strength, power, hypertrophy, or muscular endurance; concentrate on one outcome per season, guided by test results, movement/physiological analysis, and season priorities."], [17, "Core vs assistance exercises?", "Core: large muscle areas, two or more primary joints, priority for sport transfer. Assistance: smaller muscles, one primary joint (shoulder complex and spine count as one joint), injury prevention/rehab."], [17, "Structural vs power exercises?", "Both are core lifts that load the spine. Structural: muscular stabilization of posture (squat). Power: structural exercises done quickly/explosively (power clean, snatch)."], [17, "Muscle balance in exercise selection?", "Maintain strength balance across joints and between opposing muscle groups (not always equal strength); correct imbalances to reduce injury risk."], [17, "Recovery exercises?", "Low stress exercises (light resistance or low-intensity aerobics) at the end of a session or separate microcycle section; help remove metabolic waste and maintain blood flow."], [17, "Training frequency: beginners and split routines?", "Beginners 2-3 days/week with 1 day between sessions (no more than 3 days). Trained athletes use split routines (upper/lower or by muscle area)."], [17, "Factors affecting frequency?", "Training status, sport season (less in-season), load and exercise type (near-max loads need more recovery; upper body and single-joint recover faster), other training and occupational stress; mix heavy and light days."], [17, "Common exercise order?", "Power exercises first, then other core, then assistance (multijoint before single-joint), because power exercises need skill and are most affected by fatigue."], [17, "Alternating exercise orders?", "Upper/lower alternation (more recovery per muscle group; circuit training if minimal rest), push/pull alternation (less local fatigue, more reps), and supersets/compound sets."], [17, "Superset vs compound set?", "Superset: back-to-back sets for opposing muscle groups (biceps curl then triceps extension). Compound set: back-to-back sets for the same muscle group (barbell curl then dumbbell curl)."], [17, "Volume-load and mechanical work?", "Volume-load = weight x total reps (e.g., 2x10 at 50 lb = 1,000 lb). Not affected by rep scheme (3x5 vs 5x3). Mechanical work = force x distance."], [17, "1RM and repetition maximum concepts?", "1RM = max weight for one proper repetition; RM = max reps at a given load. 5RM is about 87% of 1RM (table estimate). Predictions are most accurate above 75% 1RM and under 10 reps; use tables only as a guide."], [17, "Options for assigning training loads?", "Test actual 1RM (best for intermediate/advanced), estimate 1RM from multiple-RM tests (e.g., 10RM), or use goal-rep RM (e.g., 5RM for 5 reps; suited to assistance work)."], [17, "Repetition maximum continuum?", "85%+ 1RM (low reps): maximum strength and power. 7-10RM: hypertrophy. 15RM+: muscular endurance."], [17, "Load for maximum strength vs power?", "Strength: above 85% 1RM. Power: single-effort events (shot put, Olympic lifting) 1-2 reps near 90%; multiple-effort events (basketball jumping) 3-5 reps at 75-85%. Peak power for non-weightlifting multijoint exercises occurs around 30% 1RM."], [17, "Heavy-light-medium variation?", "Example: Monday heavy; Wednesday light (80% of Monday's weight); Friday medium (90% of Monday's). Avoids constant near-failure effort and overtraining."], [17, "2-for-2 rule and load increase size?", "If the athlete performs 2 or more reps over the assigned number in the last set for 2 consecutive sessions, increase load next session; typical increases 2.5-10%."], [17, "Single vs multiple sets?", "Single sets work for novices in the first few months; intermediate and advanced athletes need multiple sets (multiple sets not to failure beat one set to failure). Beginners start 1-2 sets."], [17, "Volume recommendations by goal?", "Strength: 2-6 sets in strength range. Power: 3-5 sets after warm-up. Hypertrophy: 3-6 sets of 3+ exercises per muscle group. Muscular endurance: 12+ reps for 2-3 sets (lowest overall volume)."], [17, "Rest periods by goal?", "Strength/power: 2-5 min (3-5 min for heavy sets, esp. lower body/structural). Hypertrophy: 30 s to 1.5 min. Muscular endurance: under 30 s. Rest depends on load and muscle mass involved."], [18, "Mechanical vs neurophysiological model of plyometrics?", "Mechanical: rapid stretch stores elastic energy in the series elastic component (tendons), released in the following concentric action. Neurophysiological: muscle spindle stretch reflex potentiates agonist activity. Both likely contribute; delay negates both."], [18, "Stretch-shortening cycle phases?", "Phase I eccentric (preload, SEC stores energy, spindles stimulated via Ia afferents); Phase II amortization (delay between eccentric and concentric; must be short); Phase III concentric (stored energy and reflex increase force)."], [18, "Why must the amortization phase be short?", "If too long, stored elastic energy dissipates as heat and the stretch reflex no longer enhances the concentric action."], [18, "Vertical jump comparison illustrating SSC?", "Static squat jump (no eccentric preload) is lowest; countermovement jump uses SSC; approach jump has the most forceful eccentric phase and the highest jump."], [18, "Plyometric modes by body region?", "Lower body: jumps in place, standing jumps, multiple hops/jumps, bounds, box drills, depth jumps. Upper body: medicine ball throws, catches, push-up variations. Trunk: need shorter, quicker, lower-ROM movements to use the stretch reflex."], [18, "Plyometric intensity rule?", "Skipping drills are low intensity; depth jumps are high. As intensity rises, volume should fall."], [18, "Plyometric frequency and recovery?", "1-3 sessions/week with 48-72 h between sessions; drills for the same body area not on consecutive days; 2-4 days recovery between sessions overall."], [18, "Work-to-rest ratio for plyometrics?", "1:5 to 1:10 (e.g., depth jumps: 5-10 s between reps, 2-3 min between sets). Treat as power training, not conditioning."], [18, "Plyometric volume by experience?", "Measured in foot contacts per session: beginner 80-100, intermediate 100-120, advanced 120-140."], [18, "Plyometric program length and progression?", "Typically 6-8 weeks (jump height can improve in 4 weeks); progress frequency/volume/intensity systematically; volume low-moderate while intensity advances low to moderate to high."], [18, "Plyometric warm-up?", "General warm-up, stretching, then specific low-intensity dynamic movements (marching, jogging, skipping, footwork, lunging)."], [18, "Plyometrics for prepubescent children?", "Beneficial for power and bone strength but avoid depth jumps and high-intensity drills (open epiphyseal plates); focus on landing mechanics and neuromuscular control; simple-to-complex progression; adequate recovery."], [18, "Plyometrics for masters athletes?", "Consider orthopedic history (knee surgery contraindicates depth jumps); prefer alternate-leg bounding and double-leg hops; no more than 5 low-moderate exercises; lower volume; 3-4 days recovery."], [18, "Combining plyometrics with resistance and aerobic training?", "Pair lower-body resistance with upper-body plyometrics (and vice versa); heavy resistance and plyometrics same day generally not recommended except complex training; do aerobic exercise after plyometrics."], [18, "Safety prerequisites for plyometrics?", "Understand technique; base of strength, speed, balance; maturity; adequate warm-up; proper progression; good shoes and surfaces. Squat 1RM about 1.5x bodyweight suggested (technique matters more); single-leg stand 30 s on the training surface."], [18, "Landing mechanics to teach?", "Shoulders over knees, knees over toes, proper ankle/knee/hip flexion; avoid knee valgus (ACL risk)."], [18, "Plyometric weight limit?", "Athletes over 220 lb should avoid high-intensity drills and depth jumps from boxes above 18 inches."], [18, "Surface and facility requirements?", "Shock-absorbing surface (grass, suspended floor, rubber mat); avoid concrete, tile, wood; very soft surfaces (mini-trampolines) lengthen amortization. Space: 30 m straightaway (some 100 m); ceiling 3-4 m."], [18, "Plyometric box and shoe specifications?", "Boxes 6-42 in, sturdy, nonslip top, landing area at least 18x24 in; depth jump height 16-42 in (30-32 in typical). Shoes need ankle/foot support and lateral stability (running shoes not recommended)."], [19, "Speed vs change of direction vs agility?", "Speed: ability to reach high velocity (accelerate and max velocity). Change of direction (CoD): explosively changing direction/velocity/mode. Agility: CoD in response to a stimulus (adds perceptual-cognitive demand)."], [19, "Rate of force development (RFD) and impulse?", "RFD: change in force / change in time; index of explosive strength. Impulse: force x time (area under force-time curve); determines change in momentum."], [19, "Why is RFD more relevant than maximal force in sport?", "Maximal force needs at least 300 ms, but most sport actions last only 0-200 ms."], [19, "Speed vs velocity?", "Speed is scalar (how fast). Velocity is a vector (speed with direction). Acceleration is rate of change of velocity."], [19, "Ground contact phases of impulse?", "Braking phase (negative horizontal force) and propulsive phase (positive horizontal force); elite max-velocity sprinting has very short contact times and high RFD."], [19, "Momentum and impulse in sprinting?", "Body mass is constant, so to increase impulse in the same time athletes must increase force; greater impulse changes momentum. Train impulse as well as RFD."], [19, "Implications of angle on CoD?", "Greater cutting angle needs greater impulse to change momentum; angles under 75 degrees have shorter contacts (<250 ms), 75+ degrees exceed 250 ms and need eccentric and maximal strength."], [19, "Neural adaptations that improve sprinting?", "Strength training raises neural drive (rate/amplitude of impulses); plyometrics increases excitability of high-threshold motor neurons; both may raise RFD and impulse."], [19, "Training the SSC for speed?", "Skillful multijoint movements exploiting elastic-reflexive mechanisms, brief work bouts with frequent rest; complex training (heavy resistance alternated with SSC tasks) uses post-activation potentiation, appropriate for advanced athletes."], [19, "Spring-mass model (SMM)?", "Models sprinting as a spring-like leg compressing then extending to return energy; links SSC, muscle stiffness, and sprinting; elite sprinters deviate from it at max velocity (most vertical force in first half of ground contact); stiffness matters as stride frequency increases."], [19, "Typical ground contact times?", "Max velocity sprint 0.09-0.11 s; acceleration 0.17-0.20 s; agility plant 0.23-0.25 s; CoD 0.44-0.72 s."], [19, "Sprint speed = ?", "Stride length x stride frequency; rate of force development underlies both. Sprinting is maximal-effort running of 15 s or less."], [19, "Elite vs novice sprinter metrics?", "Elite: stride about 2.7 m, rate about 4.63 steps/s, max velocity about 12.55 m/s, contact about 0.087 s. Novice: stride 2.56 m, about 11.25 m/s, contact about 0.101 s. Elite apply more vertical force in less time."], [19, "Sprint start technique?", "3- or 4-point staggered start; front lower leg about 90 degrees, rear about 133 degrees (elite men); aggressive extension of both legs; low swing-leg recovery in early acceleration; center of mass nearly upright by about 20 m."], [19, "Maximal velocity posture?", "Stacked joints (shoulders over hips over foot in stance), head neutral eyes forward, shoulders relaxed down, arms cycle at the same rate as legs."], [19, "Max velocity sprint cycle: flight and support muscle actions?", "Early flight: eccentric hip flexion and knee extension. Midflight: concentric hip flexion. Late flight: concentric hip extension, eccentric knee flexion. Early support: continued hip extension, eccentric plantarflexion for shock absorption. Late support: concentric knee extension and plantarflexion for propulsion."], [19, "Sprint training goals?", "Optimal stride length and frequency via correct force application in short ground contact; develop SSC; Olympic lifts and derivatives overload the SSC with greater force than open sprinting."], [19, "Perceptual-cognitive skills?", "Visual scanning, anticipation, pattern recognition, knowledge of situation, decision-making time, accuracy, reaction time; largely sport-specific."], [19, "\"Agility test\" vs \"change of direction test\"?", "Tests without a reactive/perceptual component are CoD tests, not agility tests; long tests (e.g., Illinois) may reflect metabolic capacity."], [19, "What improves CoD ability?", "Faster hip extension velocity, lower center of mass, greater braking and propulsive impulse, more knee flexion entering the CoD, minimal trunk angular displacement, lateral trunk tilt in 180-degree turns; train eccentric deceleration (drop landings, catch phase of power clean/snatch)."], [19, "Coaching technique for CoD?", "Visual focus on opponent's shoulders, trunk, hips; control trunk entering deceleration; reorient trunk/hips toward travel direction; low center of mass; avoid stiff-legged braking; \"push the ground away\" (external focus); arms assist leg drive."], [19, "Assisted vs resisted sprinting?", "Assisted/overspeed (towing, downhill): generally not recommended (excess braking, eccentric load). Resisted (sleds, incline): emphasizes acceleration mechanics; keep loads from reducing max speed by more than 10-12%; field athletes may use 20-30% bodyweight for initial movement."], [19, "Strength and mobility for sprinting?", "Specific weight training (movement pattern, peak force, RFD); weightlifting derivatives (clean, snatch, midthigh pull) improve stiffness, RFD, hip-knee coactivation; adequate mobility in midflight prevents misplaced forces."], [19, "Agility training goals?", "Perceptual-cognitive ability, rapid braking of momentum, rapid reacceleration; emphasize eccentric strength and relative strength-speed qualities."], [19, "Agility strength qualities and examples?", "Dynamic strength (bodyweight, squats/pulls), concentric explosive (box jumps, loaded squat jumps, Olympic lifts), eccentric (drop landings, catches), reactive (plyometrics, drop jumps), multidirectional (lunges, unilateral lifts), perceptual-cognitive (reaction drills, small-sided games)."], [19, "Program design variable definitions for speed/agility?", "Set: group of reps and rest. Series: group of sets and recovery intervals. Interval: duration/distance of a rep. Work-to-rest ratio: density of exercise and rest. Volume: work in a session. Frequency: sessions per time period."], [19, "Periodization levels?", "Microcycle (weekly), mesocycle (monthly), macrocycle (yearly)."], [19, "Short-to-long method for sprinters?", "Programs first develop acceleration, then maximal velocity."], [19, "Phasic development, Block 1 (short sprinter)?", "Aim: acceleration development; tool: incline sprinting; emphasize low heel recovery, driving foot down and through ground, complete arm action, neutral head."], [19, "Phasic development, Block 2?", "Long acceleration, transition to upright sprinting, exposure to speed endurance; tools: gradually remove incline, flat sprints from low start or towing."], [19, "Phasic development, Block 3?", "Introduce max-speed training, maintain acceleration, continued speed endurance, introduce special endurance; schedule speed/special endurance later in week when fatigue dampens neural drive."], [19, "Phasic development, Block 4?", "Enhance max speed (longer fly-in zones, race-modeling), keep short acceleration sprints early in nearly every session, event-specific speed/special endurance."], [19, "Best method for monitoring sprint ability?", "High-speed camera systems."], [19, "Ground contact time monitoring?", "Total time of one stance phase; decreased contact with faster sprint time suggests improved force production; may be longer during acceleration."], [19, "Step length vs stride length?", "Step length: toe of one foot to heel of other in two consecutive steps. Stride length: heel to heel of the same foot in consecutive steps."], [19, "Flight time interpretation?", "Higher vertical force over shorter time = proper mass displacement down the track; higher vertical force over longer time = excess vertical amplitude of center of mass."], [19, "Stride angle?", "Angle at which the foot leaves the track; shows whether force is applied at the right moment and the sprint stage."], [19, "General strategy for agility development?", "Periodized: begin with preplanned CoD drills, then progress to perceptual-cognitive drills with CoD in response to a stimulus."], [19, "Agility periodization Block 1?", "CoD linear deceleration and maneuverability; low-volume braking tasks with eccentric focus; stay low, may sacrifice speed for positioning."], [19, "Agility periodization Block 2?", "Lateral deceleration, maneuverability between modes (CoD-shuffle-sprint-shuffle); effective lateral/forward braking; cue \"pushing the ground away\"; single efforts to generic stimulus."], [19, "Agility periodization Block 3?", "Deceleration to reacceleration; \"braking in\" and \"exploding out\"; \"drop and drive\" footwork; \"decide and go\" response to generic stimulus."], [19, "Why is total drill time a poor agility/CoD measure?", "It does not isolate the physical vs perceptual-cognitive quality; straight-line sprint gains can improve test time without improved CoD."], [19, "Change-of-direction deficit?", "Time difference between a straight-line sprint and a CoD test of equal length; added time is due to CoD demand (e.g., 5-0-5 time minus 10 m sprint)."], [19, "Exit velocity and entry velocity?", "Exit: horizontal velocity during first step out of the plant (toe-off to next foot strike). Entry: velocity before the plant phase. Higher exit velocity with same/shorter contact implies greater RFD."], [19, "Decision-making time?", "Time between two events (can be positive or negative); defensive movement = same direction as stimulus, offensive = opposite direction."], [19, "A-skip technique?", "Simulates upright sprinting mechanics and vertical force; tall stance, thigh near parallel, foot at stance-knee height with heel under glutes (\"figure 4\"), dorsiflexed foot (\"lift the big toe\"), drive swing leg down through forefoot toward triple extension, land under hips, arms move at the leg rate."], [19, "Deceleration drill progression?", "Half speed, stop within 3 steps; then 3/4 speed in 5 steps; most advanced top speed in 7 steps; most demanding braking step occurs one or more steps before stopping; vary with lateral and backward running."], [19, "Y-shaped agility drill?", "Start 10 yd from stimulus director; run toward them, director points left/right at the 5-yd line; athlete plants and accelerates to cones at 45 degrees, 3 yd left/right; variations: opposite direction (offensive), step cues, passing implement."], [20, "Main determinants of aerobic endurance performance?", "VO2max, lactate threshold (or maximal lactic steady state), and exercise economy."], [20, "Which predicts endurance performance better: VO2max, LT, or MLSS?", "LT is better than VO2max; maximal lactic steady state is considered better than both."], [20, "Maximal lactic steady state (MLSS)?", "Exercise intensity at which maximal lactate production equals maximal lactate clearance."], [20, "Lactate threshold definition?", "Speed or %VO2max at which blood lactate rises above resting levels."], [20, "Exercise economy?", "Energy cost of activity at a given velocity; economical athletes expend less energy at a given speed. Better runners typically have shorter stride length and higher stride frequency."], [20, "Economy factors in cycling and swimming?", "Cycling: body mass, velocity, aerodynamic position. Swimming: efficient technique lowers energy demand; elite swimmers more economical."], [20, "Well-trained athletes and VO2max?", "Little room to increase VO2max; focus on sustaining higher velocities; HIIT improves peak power, ventilatory threshold, H+ buffering, fat utilization."], [20, "Exercise mode principle?", "Train in the specific activity of competition to challenge specific fibers and systems; multiple modes OK for multi-mode sports or general fitness."], [20, "Training frequency guidelines?", "Depends on intensity, duration, and training status; more than 5x/week raises injury risk; more than 2x/week needed to raise VO2max; fewer sessions maintain than build."], [20, "Recovery priorities for endurance athletes?", "Rest, rehydration/fluid replacement, post-exercise carbohydrate to restore muscle and liver glycogen, avoiding strenuous activity after hard sessions."], [20, "Most accurate ways to regulate aerobic intensity?", "Monitor O2 consumption and measure blood lactate; otherwise use HR, RPE, METs, velocity, or power."], [20, "When does HR closely predict VO2?", "Between 50% and 90% of VO2max or heart rate reserve."], [20, "RPE scale in the guide?", "1 (no effort, lying down) to 10 (maximum effort); affected by music, temperature, age, sex, training status."], [20, "One MET?", "3.5 mL/kg/min of O2 consumption (resting). Prescribing by METs requires knowing the athlete's max O2 uptake."], [20, "Exercise duration vs intensity?", "Inversely related; above MLSS duration is short (lactate accumulation); about 70% VO2max can last up to several hours."], [20, "Aerobic progression rules?", "Increase frequency, intensity, duration; at least 1 recovery/active rest day weekly; increases no more than 10% per week; at high fitness rely on intensity; fitness maintained up to 5 weeks at 2x/week if intensity kept."], [20, "Long slow distance (LSD) training?", "About 70% VO2max or 80% HRmax, 30 min to 2 h, distance greater than race distance, talking pace; builds cardiovascular/thermoregulatory function, mitochondria, fat use, IIx to I shift; does not train race recruitment patterns."], [20, "Pace/tempo training?", "At or slightly above race intensity (lactate threshold); steady (20-30 min continuous at LT) or intermittent (same intensity, shorter intervals with brief recovery); also called threshold training."], [20, "Interval training for aerobic endurance?", "Intensity near VO2max, work:rest about 1:1, work intervals 3-5 min; requires aerobic base; very stressful, use sparingly."], [20, "HIIT characteristics?", "Repeated high-intensity bouts with brief recovery; several minutes above 90% VO2max; short (<45 s) or long (2-4 min) intervals; longer bouts raise glycolysis and lactate; improves speed, economy, and finishing kick; example 2-3 min at 90%+ with under 2 min relief."], [20, "Fartlek training?", "\"Speed play\": easy running (about 70% VO2max) mixed with hills or bursts (85-90%); any aerobic mode; improves VO2max, LT, economy, fuel use."], [20, "Off-season aerobic training?", "Base training: long duration, low intensity; progress duration (5-10%/week max) then intensity."], [20, "Preseason aerobic training?", "Increase intensity, maintain or reduce duration, include all training types (HIIT, Fartlek), tailored to athlete strengths and weaknesses."], [20, "In-season aerobic training?", "Schedule competition days; low-intensity, short-duration days precede competitions."], [20, "Postseason aerobic training?", "Active rest: low duration/intensity, maintain fitness/strength/lean mass, rehab injuries, strengthen weak muscles."], [20, "Karvonen method?", "APMHR = 220 - age; HRR = APMHR - RHR; THR = (HRR x intensity) + RHR. Example: age 30, RHR 60, 60-70% gives 138-151 bpm."], [20, "Percentage of max HR method?", "THR = (220 - age) x intensity. Example: age 20, 70-85% gives 140-170 bpm."], [20, "Cross-training?", "Different mode than competition at same intensity/duration; maintains conditioning during injury/recovery, spreads stress and reduces overuse injury; less effective than mode-specific for single-event performance."], [20, "Detraining?", "Loss of adaptations when training is reduced/stopped; regresses rapidly; cross-training or reduced volume/intensity of primary mode lessens it."], [20, "Tapering definition and length?", "Systematic reduction in duration and intensity with more technique and nutrition focus to peak at competition; typically 7-28 days; promotes recovery, rehydration, glycogen."], [20, "Taper models?", "Linear: gradual daily volume decrease. Step: abrupt reduction, typically more than 50%, held constant. Progressive: combination, with smaller 10-15% reductions at each tier."], [20, "Resistance training for endurance athletes?", "Can improve endurance performance with aerobic training (without raising VO2max); aids injury recovery, overuse prevention, muscle imbalances, hills, breakaways, final sprint."], [20, "Altitude categories?", "Sea level under 500 m; low 500-2000 m; moderate 2000-3000 m; high 3000-5500 m; extreme 5500 m or more."], [20, "Altitude effects and acclimatization?", "Lower partial pressure of O2; acute detriments from as low as 700 m; moderate altitude acclimatization 12-14 days (full may take months); \"live high, train low\" gives adaptation plus sea-level training quality."], [21, "General Adaptation Syndrome (GAS) phases?", "Alarm (initial fatigue, soreness, reduced performance), resistance (adaptation, supercompensation if stress structured well), exhaustion (inability to adapt; overreaching/overtraining risk)."], [21, "Causes of the exhaustion phase?", "Excessive loading, monotonous training, overly varied training, and non-training stressors (occupation, stress, poor sleep, diet)."], [21, "Goal of periodization relative to GAS?", "Avoid the exhaustion phase through proper planning of training stressors."], [21, "Supercompensation?", "Biochemical, structural, and mechanical adjustments in the resistance phase that raise performance capacity above baseline."], [21, "Stimulus-Fatigue-Recovery-Adaptation (SFRA) theory?", "Extension of GAS: greater workload gives more fatigue and longer delay to recovery/adaptation; as fatigue dissipates preparedness rises; with no new stimulus, involution/detraining occurs; new stimulus repeats the cycle."], [21, "SFRA practical implications?", "Full recovery not always required before next session; light/heavy sessions and days modulate fatigue; foundation for sequential periodization models."], [21, "Fitness-fatigue paradigm?", "Every training bout creates fitness and fatigue aftereffects that summate into preparedness; fatigue dissipates faster than fitness, so reducing load (taper) raises preparedness."], [21, "Periodization hierarchy?", "Multiyear plan (2-4 yr), annual plan (1 yr), macrocycle (months to 1 yr), mesocycle (2-6 wk, \"block\"), microcycle (several days to 2 wk, typically 7 days), training day, training session."], [21, "What counts as a separate training session?", "Rest periods longer than 30 minutes separate sessions."], [21, "General direction of periodized variables?", "From high volume/low intensity/general nonspecific work toward lower volume/high intensity/sport-specific work."], [21, "Preparatory period?", "Off-season, no competitions; build base conditioning to tolerate intense training; LSD, low-intensity plyometrics, high-rep low-moderate resistance; limited sport-specific work."], [21, "General preparatory phase?", "Early; high volume, low intensity, variety of means; includes hypertrophy/strength endurance phase (moderate loads, high reps)."], [21, "Specific preparatory phase?", "After general phase; more sport-specific; includes basic strength phase with high loads and lower reps (about 80-95% 1RM)."], [21, "First transition period?", "Links preparatory and competitive periods (preseason); strength/power phase: translate strength to power, alternate high-low loads, power exercises 30-95% 1RM, speed work near competition pace (sleds, resisted/hill sprints); last week reduced volume/intensity."], [21, "Competitive period?", "In-season; higher intensity, lower volume; more skill/tactics, proportional drop in conditioning; peaking lasts only 1-2 weeks (extending it reduces performance)."], [21, "Maintenance program in long seasons?", "Moderate-to-high intensity (85-93% 1RM) at low-to-moderate volume; microcycles modulated by training, travel, competition schedule."], [21, "Second transition period?", "Postseason active rest/restoration; 1-4 weeks (longer only if injured); too active or too long lengthens next preparatory period; rehab and recover; short versions can be \"deload weeks.\""], [21, "Daily undulating (nonlinear) periodization?", "Large daily fluctuations in load and volume within the microcycle (e.g., 4x6RM, 3x10RM, 5x3RM); claimed to reduce neural fatigue from ever-rising intensity."], [21, "Traditional (\"linear\") periodization?", "Same sets/reps across days with varying load or progressive load changes over time (e.g., 4x6 at 85%, 75%, 65%); the term \"linear\" is described as a misnomer; experts disagree on which model is superior."], [22, "Team physician role?", "MD or DO proficient in sports injuries; preparticipation exams, on-field emergency care, evaluation/diagnosis, referrals, prescribes medication; typically makes final return-to-competition decision."], [22, "Athletic trainer (ATC) role?", "Day-to-day physical health; certified by NATA; works under team physician; injury management, prevention, rehab, taping/bracing; administrator of the sports medicine team and key communicator between team, coach, and athlete."], [22, "Physical therapist role on the team?", "Licensed PT (often Sports Certified Specialist via ABPTS); evaluation, treatment, rehab of acutely injured athletes; may be employed by team or outpatient clinic; often dual role with athletic trainer."], [22, "Strength and conditioning professional role in rehab?", "Strength, power, performance; usually CSCS; consults with athletic trainer/PT; designs reconditioning programs to return athlete to competition."], [22, "Exercise physiologist and nutritionist roles?", "Exercise physiologist: conditioning programs considering metabolic responses that aid healing. Nutritionist: registered dietitian with sport nutrition background; nutrition to optimize tissue healing."], [22, "Counselor/psychologist/psychiatrist role?", "Licensed mental health professionals helping injured athletes cope with injury-related stress."], [22, "Who does the athlete communicate with most?", "Coaches, athletic trainer, and strength and conditioning professional; weekly full-team meeting recommended."], [22, "Who provides exercise indications and contraindications?", "The athletic trainer, typically via a form; S&C professional must follow them."], [22, "Macrotrauma vs microtrauma?", "Macro: sudden single overload episode disrupting tissue integrity. Micro: overuse from repeated abnormal stress or too little recovery."], [22, "Joint macrotrauma terms?", "Dislocation: complete displacement of joint surfaces. Subluxation: partial displacement. Sprain: ligament trauma."], [22, "Sprain grades?", "First: partial tear, no increased instability. Second: partial tear, minor instability. Third: complete tear, full instability."], [22, "Contusion vs strain?", "Contusion: direct trauma with blood/fluid accumulation around muscle. Strain: indirect trauma, tear of muscle fibers."], [22, "Strain grades?", "First: partial tear, strong but painful contraction. Second: partial tear, weak painful contraction. Third: complete tear, very weak, painless contraction."], [22, "Where do muscle-tendon units fail most often?", "Musculotendinous junction, muscle belly, and tendon attachment to bone (collagen is typically stronger than muscle fibers)."], [22, "Causes of microtrauma?", "Training errors (poor design, excess volume), poor surfaces, faulty biomechanics, poor motor control, decreased flexibility, skeletal malalignment."], [22, "Stress fracture vs tendinitis?", "Stress fracture: bone overuse injury from rapid volume increase or hard surfaces. Tendinitis: tendon inflammation; becomes tendinopathy if uncorrected."], [22, "Three phases of tissue healing?", "Inflammatory response, fibroblastic repair, maturation-remodeling."], [22, "Inflammatory phase events?", "Redness/swelling from vascular changes and permeability; hypoxia, histamine and bradykinin release; edema; phagocytosis clears debris; pain fiber stimulation; lasts 2-3 days up to a week."], [22, "Fibroblastic repair phase?", "Breakdown/replacement of nonviable tissue, new capillaries and scar; type III collagen laid randomly (mostly transverse to stress, weaker); starts about day 2, lasts up to several months."], [22, "Maturation-remodeling phase?", "Type I collagen produced; with loading, collagen and scar hypertrophy and align with lines of stress; still weaker than original; lasts months to years."], [22, "Inflammatory-phase treatment goals?", "Maximal protection, prevent disruption of new tissue; rest and physical agents (ice, compression, elevation, e-stim; results mixed); passive rest of injured area; train uninjured areas and distal/proximal joints without stressing the injury."], [22, "Fibroblastic-phase treatment goals?", "Prevent excess atrophy/joint deterioration; add low-load stress to promote collagen synthesis and alignment while avoiding disruption; protected motion avoids adhesions; pain-free isometrics (at multiple angles) then slow isotonics; begin neuromuscular control/proprioception work."], [22, "Proprioception?", "Afferent sensory information from skin, muscles, tendons, ligaments, and joint capsule contributing to control of posture, balance, stability, and position sense; trained with balance boards, balls, uneven surfaces."], [22, "Maturation-remodeling treatment goals?", "Optimize function for return to play; progress to sport-specific, specificity-based exercise (joint-angle, velocity-specific, closed chain, neuromuscular); criteria-based return to play (ROM, strength, functional tests, patient-reported function)."], [22, "Hamstring strain return progression?", "Flexibility/strength, eccentric strength, concentric strength, dynamic stretching, rapid isotonic strengthening, manually resisted strengthening, plyometric and speed training."], [22, "Closed vs open kinetic chain?", "Closed: distal segment fixed, considerable resistance at terminal joint, more functional (squat, pushup, deadlift). Open: terminal joint free, isolates joint/muscle (knee extension). Most sport uses both."], [22, "Delorme vs Oxford resistance protocols?", "Delorme: 3x10 at 50%, 75%, 100% of 10RM (ascending). Oxford: 3x10 at 100%, 75%, 50% of 10RM (descending)."], [22, "DAPRE (Knight)?", "Four sets: 10 reps at 50% 1RM, 6 at 75%, max reps at 100% estimated 1RM (then adjusts)."], [22, "Aerobic/anaerobic rehab prescription?", "Optimal program unknown; mimic sport and metabolic demands; S&C professional ideal to prescribe and supervise."], [22, "Risk factors for reinjury?", "Previous injury is among the most substantial risk factors."], [22, "Upper extremity injury risk factors and prevention?", "Decreased shoulder ROM, scapular dyskinesis, decreased shoulder strength; ROM work and the \"Thrower's Ten.\""], [22, "Lower extremity injury risk factors and prevention?", "Decreased balance, poor neuromuscular control in jump landing, decreased strength; train landing/cutting control (single-leg squat, plyometric landings)."], [23, "Facility design team members?", "Contractor, architect, designers, lawyers, facility users, and at least one instructor/coach/professional who will work in the facility."], [23, "Phases of building a facility?", "Predesign, design, construction, preoperation."], [23, "Predesign phase components?", "Needs analysis, feasibility study, master plan (including hiring an architect)."], [23, "Needs analysis?", "Determines needs of the athletic program (space, what must fit); matches facility philosophy and intended use (e.g., plyometrics need a plyo area)."], [23, "Feasibility study?", "SWOT analysis of whether the investment yields viable return; location, growth potential, competition, market analysis."], [23, "Master plan contents?", "Building/construction plan, facility design, budget, operational plan, short- and long-term goals; hire a reputable architect, ideally with S&C experience."], [23, "Design phase?", "Committee ideas become structure and design; follow city planning codes; finalize design committee; consider equipment specs, traffic flow, and coaches' clear view of athletes."], [23, "Construction phase?", "Longest phase; refer to the master plan to stay on goals and deadline; architect may bear delay costs; delays can lead to lawsuits over lost revenue."], [23, "Preoperation phase?", "Final steps before opening: interior decor, hiring qualified staff (minimum certifications, development plan), plan for cleaning/maintenance, admin/clerical (software, liability, budgeting)."], [23, "Assessing athletic program needs?", "Number of athletes (city sets max occupancy), training goals, demographics, experience level, scheduling, equipment condition."], [23, "Minimum space recommendation per athlete?", "100 square feet per participant; lack of space limits training more than lack of equipment."], [23, "Equipment condition rules?", "No holes, cuts, missing pieces; do not use machines with frayed or damaged cables until replaced; repair/clean regularly."], [23, "Facility location and floor load?", "Ground floor away from offices/classrooms (noise); non-ground floors need load capacity of 100 lb per square foot."], [23, "Supervisor station?", "Central location with clear line of sight and mirrors to view entire facility; elevation helps."], [23, "Accessibility specs?", "Ramp or lift for height changes over 0.5 inch; ramp 12 inches of run per 1 inch of rise; rough strips on steps; double doors (narrow hallways negate wide doors)."], [23, "Recommended ceiling height?", "12-14 feet (athlete height plus box jumps, vertical jumps, Olympic lifts)."], [23, "Flooring options and lifting platforms?", "Rubber, antifungal carpet, indoor turf; lifting platforms have wood middle and rubber outer sections."], [23, "Lighting, temperature, humidity, and air exchange?", "Natural plus artificial light (50-100 lumens depending on ceiling height); 72-78 F; humidity not over 60%; 8-12 air exchanges per hour; 2-4 fans per 1200 sq ft."], [23, "Sound guidelines?", "Under 90 dB so athletes hear cues; elevate speakers; sound-absorbing materials for yoga/dance areas; rubber flooring reduces impact noise."], [23, "Mirror placement?", "At least 6 inches from equipment and at least 20 inches above floor (18-inch plates then have 2 inches of clearance)."], [23, "Other facility design items?", "Drinking fountains away from training area; locker rooms/showers; at least 1 wheelchair-accessible emergency phone; bumper rails/padding; storage space; adequate grounded electrical service."], [23, "Equipment grouping layout?", "Sections (warm-up, plyometric, free weights, aerobic); free weights/racks along walls; machines in middle; cardio grouped by type in own area."], [23, "Spacing between barbells and dumbbells?", "At least 36 inches between them (and between ends of racked bars) for safe movement of lifters and spotters."], [23, "Warm-up area size?", "At least 49 square feet of open space for dynamic movement, with mats, rollers, bands, PVC."], [23, "Circuit/machine spacing and walkway width?", "Machines 24-36 inches apart (safety cushion); designated walkways 4-7 feet wide."], [23, "Weightlifting area spacing?", "3-4 feet between racks/platforms; bolt racks to floor; platforms usually on concrete with rubber foundation."], [23, "Aerobic equipment space?", "Bikes 24 sq ft; stair steppers 24 sq ft; skiers 6 sq ft; rowers 40 sq ft; treadmills 45 sq ft."], [23, "Cleaning and maintenance frequency?", "Clean surfaces daily or every other day with agent effective against HIV and hepatitis; walls/ceilings weekly or biweekly; check wood platforms for cracks, tighten bolts, replace frayed cables immediately; vacuum carpet to prevent mold."], [24, "Mission statement criteria?", "Short, sharply focused, clear; defines why the organization exists; does not prescribe means; broad; supports the code of ethics; inspires commitment."], [24, "Three components of a mission statement?", "Target clientele, the service provided, and what makes the service unique."], [24, "Program goals vs program objectives?", "Goals: desired end products, broad and general. Objectives: the specific means of attaining the goals."], [24, "Who should be involved in mission and objectives?", "S&C department, institution, athletic administration, and sports medicine department."], [24, "Sample program objectives?", "Design strength/flexibility/aerobic/plyometric programs reducing injury and improving performance; individualize (age, sex, training status, limitations, injury); recognize acute/chronic responses; educate on nutrition and sleep; educate on performance-enhancing substances and policy."], [24, "Performance team concept?", "Using individuals with specific expertise as resources in the S&C program."], [24, "Annual orientation meeting purpose?", "Held at the start of the year or season for staff, coaches, and athletes: goals, objectives, policies, procedures, hours, schedule, rules, discipline, emergency procedures, spotting/technique and risks."], [24, "Director of S&C responsibilities?", "Direct staff/program/facility; design or review all training programs; ensure rules compliance; annual budget; generate income; schedule and evaluate staff; maintain certifications."], [24, "Director of S&C qualifications?", "Bachelor's or master's (exercise science preferred), independent certification (CSCS), CPR/AED, 2+ years of experience."], [24, "Staff qualifications?", "Independent accredited certification (e.g., CSCS), continuing education (reduces liability, especially in supervision/instruction), CPR/AED, know policies, governing rules, philosophy, and instruction methods."], [24, "Risk management?", "Strategies to decrease and control injury risk from participation, reducing liability exposure; risk cannot be eliminated."], [24, "Informed consent?", "Process of describing an activity, inherent risks and benefits so the individual can decide whether to participate."], [24, "Standard of care?", "What a responsible, prudent person would do in similar circumstances; S&C professionals judged by education, training, and certification."], [24, "Elements of negligence?", "Duty, breach of duty, proximate cause, damages."], [24, "Proximate cause?", "Natural, continuous sequence of reasonably foreseeable events leading to injury (e.g., ignoring a worn cable)."], [24, "Assumption of risk?", "Knowing an inherent risk exists and voluntarily choosing to participate anyway."], [24, "Preparticipation screening responsibility?", "Athletes must be screened per governing bodies; S&C needs signed proof of clearance (not the exam itself); extra proof for return from injury or conditions (epilepsy, diabetes, asthma); medical clearance is outside S&C scope and is the sports medicine staff's responsibility."], [24, "Eligibility criteria for facility use?", "Student-athletes in department sports, PE students, athletic staff, eligible-completed alumni athletes, groups approved by the athletic director."], [24, "Outside group use criteria?", "Preapproved by athletic director, supervised, off-hours, proof of liability insurance, signed release agreements, follow facility rules."], [24, "Recommended records?", "Cleaning/maintenance, safety procedures, warranties, assumption-of-risk forms, personnel credentials, professional guidelines, injury reports; keep indefinitely or at least the statute of limitations."], [24, "Liability insurance?", "Contractual promise to defend and indemnify up to limits for defined risks, for a premium; S&C staff should carry individual coverage if not covered by the facility."], [24, "Product liability?", "Legal responsibility of manufacturers/sellers for injury from products; S&C professionals can be codefendants; modifying equipment or using it in unintended ways may void manufacturer liability."], [24, "Equipment liability precautions?", "Use as intended, meet professional standards, heed recalls, buy from reputable makers, no unauthorized modifications, apply warning labels, inspect continually, no unsupervised use."], [24, "Discipline guidelines?", "Athletes sign discipline form beforehand; never use exercise as punishment; tiered system (warning, 1 day, 1 week, rest of year, permanent) with documentation and coach/AD correspondence."], [24, "Supplements and banned substances?", "NSCA standard 9.1: do not prescribe, recommend, or provide illegal, prohibited, or harmful drugs/supplements; stay current on governing body rules."], [24, "Reporting, documentation, and confidentiality?", "Establish risk-management chain of command; protect privacy (e.g., HIPAA consent forms); keep credentials, standards, policies, manuals, maintenance, clearances, return-to-participation, legal documents, training logs."], [24, "Code of ethics purpose?", "Athlete welfare is the primary focus; staff know the facility, NSCA, and institution codes."], [24, "Supervision ratios?", "Supervisor:athlete 1:10 junior high, 1:15 high school, 1:20 college; emphasize safety and technique over load."], [24, "Emergency action plan (EAP)?", "Written procedures: EMS activation, primary/secondary/tertiary contacts, facility address, phone and exit locations, designated care personnel, ambulance access, emergency supplies, plans for fire/tornado/life-threatening injury/crime/terrorism; staff CPR/AED certified and practice quarterly."], [24, "Emergency equipment and communication?", "First aid kit, AED, CPR equipment readily available; direct plus backup communication line; everyone knows nearest phone; plan for timely physician access."], [24, "Principal roles on the emergency team?", "Provide immediate care, retrieve emergency equipment, activate EMS, direct EMS to the scene. Life safety is always the priority."]]; // [chapterNum, question, answer]

function h(s){let x=5381;for(let i=0;i<s.length;i++)x=((x<<5)+x+s.charCodeAt(i))|0;return (x>>>0).toString(36);}
const deck = CARDS.map(c=>({ch:c[0],q:c[1],a:c[2],id:h(c[1])}));
const byId = Object.fromEntries(deck.map(c=>[c.id,c]));

// ---- persistence (try/catch; falls back to memory)
const KEY='cscs-drill-v1';
let state={cards:{},newDay:'',newCount:0};
try{const r=localStorage.getItem(KEY); if(r) state=JSON.parse(r);}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}

// ---- time helpers
const DAY=86400000, MIN=60000;
function dayStart(t){const d=new Date(t);d.setHours(0,0,0,0);return d.getTime();}
function today(){return dayStart(Date.now());}
function examDay(){return dayStart(EXAM.getTime());}
function dayKey(){return new Date().toISOString().slice(0,10)+'|'+new Date().getDate();}

// ---- scheduler: SM-2-like, learning steps 1m/10m, intervals capped to land on or before the day before the exam
const STEPS=[1*MIN,10*MIN];
function capDue(due){
  const lastReview=examDay()-DAY;           // final pass the day before
  const t=today();
  const cap=Math.max(lastReview,t);
  return Math.min(due,cap);
}
function schedule(card,grade){ // grade: 0 again,1 hard,2 good,3 easy
  const now=Date.now();
  const c=card||{ease:2.3,ivl:0,step:0,state:'new',reps:0,lapses:0,due:now};
  c.reps++;
  if(c.state==='new'||c.state==='learn'||c.state==='relearn'){
    if(grade===0){c.step=0;c.state=c.state==='new'?'learn':c.state;c.due=now+STEPS[0];}
    else if(grade===1){c.state=c.state==='new'?'learn':c.state;c.due=now+STEPS[Math.min(c.step,1)];}
    else if(grade===2){
      if(c.step<1){c.step=1;c.state=c.state==='new'?'learn':c.state;c.due=now+STEPS[1];}
      else{c.state='review';c.ivl=c.ivl>0?Math.max(1,c.ivl):1;c.due=capDue(today()+c.ivl*DAY);}
    } else {c.state='review';c.ivl=2;c.due=capDue(today()+c.ivl*DAY);}
  } else { // review
    if(grade===0){c.lapses++;c.ease=Math.max(1.3,c.ease-0.2);c.ivl=1;c.state='relearn';c.step=0;c.due=now+STEPS[0];}
    else{
      let m = grade===1?1.2 : grade===2?c.ease : c.ease*1.4;
      if(grade===1)c.ease=Math.max(1.3,c.ease-0.15);
      if(grade===3)c.ease+=0.1;
      c.ivl=Math.max(c.ivl+1,Math.round(c.ivl*m));
      c.due=capDue(today()+c.ivl*DAY);
    }
  }
  return c;
}
function preview(card,grade){ // label for buttons
  const c=JSON.parse(JSON.stringify(card||{ease:2.3,ivl:0,step:0,state:'new',reps:0,lapses:0,due:Date.now()}));
  const before=Date.now(); const r=schedule(c,grade); const diff=r.due-before;
  if(diff<60*MIN) return Math.max(1,Math.round(diff/MIN))+'m';
  const d=Math.round((r.due-today())/DAY); return d<=0?'today':d+'d';
}

// ---- queue
let chapter='all', queue=[], cur=null, shown=false;
function inScope(c){return chapter==='all'||String(c.ch)===chapter;}
function counts(list){
  const now=Date.now(); let n=0,l=0,d=0,tot=list.length;
  for(const c of list){const s=state.cards[c.id]; if(!s){n++;continue;}
    if(s.due<=now || (s.state==='review' && s.due<=today()+DAY-1)) d++;
    if(s.state!=='review') l++;}
  return {n,l,d,tot};
}
function newLimit(){const v=parseInt(document.getElementById('newlim').value,10);return isNaN(v)?80:v;}
function buildQueue(){
  const dk=dayKey(); if(state.newDay!==dk){state.newDay=dk;state.newCount=0;}
  const now=Date.now(), endToday=today()+DAY-1;
  const due=[],learn=[];
  for(const c of deck){ if(!inScope(c))continue; const s=state.cards[c.id]; if(!s)continue;
    if(s.state==='review'){ if(s.due<=endToday) due.push(c); }
    else if(s.due<=now+20*MIN) learn.push(c); }
  due.sort((a,b)=>state.cards[a.id].due-state.cards[b.id].due);
  const room=Math.max(0,newLimit()-state.newCount);
  const fresh=deck.filter(c=>inScope(c)&&!state.cards[c.id]).slice(0,room);
  // learning cards first, then due reviews, then new, interleaved lightly
  queue=[...learn,...due,...fresh];
}
function next(){
  buildQueue(); shown=false;
  // pick learning card whose time has come first
  const now=Date.now();
  cur=queue.find(c=>{const s=state.cards[c.id];return s&&s.state!=='review'&&s.due<=now})||queue.find(c=>{const s=state.cards[c.id];return s&&s.state==='review'})||queue.find(c=>!state.cards[c.id])||null;
  render();
}
function grade(g){
  if(!cur)return;
  const wasNew=!state.cards[cur.id];
  state.cards[cur.id]=schedule(state.cards[cur.id],g);
  if(wasNew)state.newCount++;
  save(); next(); renderStats();
}

// ---- rendering
const $=id=>document.getElementById(id);
function esc(s){return s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}
function render(){
  const st=$('stage');
  if(!cur){
    const now=Date.now(); const nextDue=Object.entries(state.cards).filter(([id,s])=>inScope(byId[id])).map(([,s])=>s.due).filter(t=>t>now).sort((a,b)=>a-b)[0];
    st.innerHTML='<div class="done"><h2>Queue clear</h2><div>'+(nextDue?'Next card is due '+new Date(nextDue).toLocaleString([], {weekday:'short',hour:'numeric',minute:'2-digit'})+'.':'Nothing left in this selection.')+'</div><button class="primary" id="ahead">Review ahead (weakest first)</button></div>';
    $('ahead').onclick=reviewAhead; return;
  }
  const c=cur, s=state.cards[c.id];
  st.innerHTML='<div class="card"><div class="chap">'+esc(CHAPTERS[c.ch-1])+(s?' · '+s.state:' · new')+'</div><div class="q">'+esc(c.q)+'</div><div class="a hidden" id="ans">'+esc(c.a)+'</div></div>'+
