<title>Sparkle Cannon</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #6fd04e;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  body { position: fixed; inset: 0; }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .layer { position: absolute; inset: 0; pointer-events: none; }
  #vignette { background: radial-gradient(ellipse at center, rgba(0,0,0,0) 58%, rgba(30,12,60,.30) 100%); }

  /* ---- HUD: cookie jar ---- */
  #jar {
    position: absolute; top: max(10px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right));
    width: clamp(84px, 17vmin, 170px); aspect-ratio: 100 / 128; opacity: 0; transition: opacity .5s;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,.25));
  }
  #jar.show { opacity: 1; }
  #jar svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  #slots { position: absolute; left: 13%; right: 13%; top: 27%; bottom: 7%; }
  #slots img { position: absolute; transform: translate(-50%, 50%) scale(0); transition: transform .35s cubic-bezier(.3,2.2,.5,1); }
  #slots img.ghost { transform: translate(-50%, 50%) scale(1); opacity: .16; filter: grayscale(1) brightness(1.6); transition: none; }
  #slots img.in { transform: translate(-50%, 50%) scale(1); opacity: 1; filter: none; }
  #jar.bump { animation: bump .35s; }
  #jar.party { animation: party .5s infinite; }
  @keyframes bump { 30% { transform: scale(1.22, .86); } 60% { transform: scale(.92, 1.12); } }
  @keyframes party { 50% { transform: scale(1.12) rotate(6deg); } }
  .fly { position: absolute; left: 0; top: 0; width: clamp(60px, 11vmin, 120px); will-change: transform; }

  /* ---- start screen: one giant pulsing play cookie ---- */
  #start {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 45%, rgba(255,255,255,.35), rgba(120,220,255,.25) 50%, rgba(60,40,120,.35));
    transition: opacity .5s; cursor: pointer;
  }
  #start.hide { opacity: 0; pointer-events: none; }
  #playCookie { width: min(52vmin, 420px); animation: pulse 1.1s ease-in-out infinite; filter: drop-shadow(0 12px 18px rgba(0,0,0,.35)); }
  @keyframes pulse { 0%,100% { transform: scale(1) rotate(-3deg); } 50% { transform: scale(1.13) rotate(3deg); } }

  /* ---- level wipe ---- */
  #wipe { position: absolute; inset: 0; pointer-events: none; background: #ffd23f; clip-path: circle(0% at 50% 50%); transition: clip-path .6s ease-in; }
  #wipe.on { clip-path: circle(120% at 50% 50%); }

  /* ---- parent menu (hold top-left 3s) ---- */
  #holdRing { position: absolute; left: 10px; top: 10px; width: 64px; height: 64px; opacity: 0; pointer-events: none; }
  #holdRing circle { fill: none; stroke: #fff; stroke-width: 7; stroke-linecap: round; stroke-dasharray: 163; stroke-dashoffset: 163; transform: rotate(-90deg); transform-origin: 50% 50%; }
  #parent { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(20,10,50,.6); }
  #parent.open { display: flex; }
  #panel { background: #fff; border-radius: 22px; padding: 22px 26px; width: min(88vw, 400px); max-height: 90vh; overflow: auto; color: #33264d; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
  #panel h2 { margin: 0 0 12px; font-size: 21px; }
  #panel .row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 9px 0; font-size: 17px; border-top: 1px solid #eee; }
  #panel input[type=range] { flex: 1; max-width: 190px; height: 30px; }
  #panel input[type=checkbox] { width: 28px; height: 28px; }
  #panel button { font: inherit; font-weight: 600; border: 0; border-radius: 12px; padding: 12px 16px; background: #ece6ff; color: #33264d; cursor: pointer; }
  #panel button.go { background: #7a4cf0; color: #fff; width: 100%; margin-top: 12px; }
  #panel small { display: block; color: #8a80a0; margin-top: 8px; line-height: 1.35; }
  #err { position: absolute; inset: auto 0 0 0; padding: 14px; text-align: center; background: #fff; color: #333; display: none; }
</style>

      <path d="M20 26 Q6 32 6 48 V108 Q6 124 22 124 H78 Q94 124 94 108 V48 Q94 32 80 26 Z" fill="rgba(255,255,255,.34)" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
      <path d="M16 46 V100" stroke="rgba(255,255,255,.75)" stroke-width="5" stroke-linecap="round"/>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* =====================================================================
   1. UTILITIES + SAVED SETTINGS
   ===================================================================== */
const TAU = Math.PI * 2;
const rand = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
const easeOutBack = t => { const c = 2.2; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const $ = id => document.getElementById(id);
const QS = new URLSearchParams(location.search);

const SAVE_KEY = 'sparkle-cannon-v1';
const settings = { level: 0, diff: 0.3, volume: 0.8, music: true, voice: true, calm: false };
try {
  const s = JSON.parse(localStorage.getItem(SAVE_KEY) || '{}');
  for (const k in settings) if (typeof s[k] === typeof settings[k]) settings[k] = s[k];
} catch (e) {}
const save = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(settings)); } catch (e) {} };

/* =====================================================================
   2. AUDIO  (everything synthesized with Web Audio; starts on first tap)
   ===================================================================== */
const Sound = (() => {
  let ctx = null, master, musicBus, sfxBus, noiseBuf, music = null, step = 0, nextT = 0;
  const PENT = [523.25, 587.33, 659.25, 783.99, 880];
  const midi = n => 440 * Math.pow(2, (n - 69) / 12);
  const soft = () => settings.calm ? 0.55 : 1;

  function init() {
    if (ctx) { if (ctx.state !== 'running') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.ratio.value = 8; comp.attack.value = 0.003; comp.release.value = 0.2;
    comp.connect(ctx.destination);
    master = ctx.createGain(); master.connect(comp);
    musicBus = ctx.createGain(); musicBus.connect(master);
    sfxBus = ctx.createGain(); sfxBus.gain.value = 0.9; sfxBus.connect(master);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    apply();
    setInterval(tick, 40);
  }
  function apply() {
    if (!ctx) return;
    master.gain.setTargetAtTime(settings.volume, ctx.currentTime, 0.05);
    musicBus.gain.setTargetAtTime(settings.music ? 0.3 : 0, ctx.currentTime, 0.1);
  }
  // --- primitives -----------------------------------------------------
  function tone({ type = 'sine', f = 440, f2 = 0, t = 0, at = 0, dur = 0.2, g = 0.3, a = 0.006, dest = sfxBus, vib = 0, vibHz = 12 }) {
    if (!ctx) return;
    const t0 = at || ctx.currentTime + t, o = ctx.createOscillator(), v = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t0 + dur);
    if (vib) { const l = ctx.createOscillator(), lg = ctx.createGain(); l.frequency.value = vibHz; lg.gain.value = vib; l.connect(lg).connect(o.frequency); l.start(t0); l.stop(t0 + dur + 0.05); }
    v.gain.setValueAtTime(0.0001, t0); v.gain.linearRampToValueAtTime(g, t0 + a); v.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(v).connect(dest); o.start(t0); o.stop(t0 + dur + 0.05);
  }
  function noise({ t = 0, at = 0, dur = 0.2, g = 0.3, type = 'lowpass', f = 1000, f2 = 0, q = 0.8, dest = sfxBus }) {
    if (!ctx) return;
    const t0 = at || ctx.currentTime + t, s = ctx.createBufferSource(), fl = ctx.createBiquadFilter(), v = ctx.createGain();
    s.buffer = noiseBuf; s.loop = true; fl.type = type; fl.Q.value = q; fl.frequency.setValueAtTime(f, t0);
    if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
    v.gain.setValueAtTime(g, t0); v.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(fl).connect(v).connect(dest); s.start(t0, Math.random() * 0.5); s.stop(t0 + dur + 0.05);
  }
  // --- sound effects ---------------------------------------------------
  const fx = {
    pew() {
      const p = rand(0.88, 1.2);
      tone({ type: 'triangle', f: 1700 * p, f2: 300 * p, dur: 0.15, g: 0.22 });
      tone({ type: 'square', f: 2300 * p, f2: 800 * p, dur: 0.07, g: 0.04 });
      for (let i = 0; i < 3; i++) tone({ f: rand(2600, 5200), t: 0.03 + i * 0.035, dur: 0.1, g: 0.06 });
    },
    antic() { tone({ f: 320, f2: 1100, dur: 0.24, g: 0.14, type: 'triangle' }); },
    boom(size = 1, stepUp = 0) {
      const p = rand(0.85, 1.2) * Math.pow(1.06, Math.min(stepUp, 10)), g = soft() * Math.min(1.35, 0.75 + 0.25 * size), len = Math.sqrt(size);
      tone({ f: 165 * p, f2: 36, dur: 0.45 * len, g: 0.9 * g });                       // thump
      tone({ type: 'triangle', f: 430 * p, f2: 90, dur: 0.18, g: 0.38 * g });          // pop
      noise({ f: 1900, f2: 180, dur: 0.5 * len, g: 0.6 * g });                         // whoosh
      noise({ type: 'bandpass', f: 3200, q: 1.5, dur: 0.07, g: 0.3 * g });             // crack
      const n = Math.round(6 + 3 * size);                                              // sparkly tail
      for (let i = 0; i < n; i++) tone({ f: pick(PENT) * pick([2, 4]) * p, t: 0.08 + rand(0.75 * len), dur: rand(0.15, 0.4), g: 0.06 });
    },
    boing() { tone({ type: 'triangle', f: 180, f2: 420, dur: 0.32, g: 0.3, vib: 60, vibHz: 22 }); noise({ f: 900, dur: 0.08, g: 0.2 }); },
    crunch() { for (let i = 0; i < 3; i++) noise({ type: 'bandpass', f: rand(1800, 3600), q: 2, t: i * 0.055, dur: 0.045, g: 0.5 }); tone({ f: 880, f2: 1320, dur: 0.12, g: 0.1 }); },
    ding() { tone({ f: 1318.5, dur: 0.35, g: 0.16 }); tone({ f: 1975.5, t: 0.07, dur: 0.4, g: 0.13 }); },
    pop() { tone({ f: 500, f2: 1200, dur: 0.08, g: 0.16 }); },
    giggle() { const b = rand(700, 950); for (let i = 0; i < 4; i++) tone({ type: 'triangle', f: b * (1 + 0.18 * (i % 2)), f2: b * 0.8, t: i * 0.085, dur: 0.07, g: 0.15 }); },
    cheer() { const b = rand(600, 800); tone({ type: 'triangle', f: b, f2: b * 1.9, dur: 0.16, g: 0.14 }); tone({ type: 'triangle', f: b * 1.2, f2: b * 2.3, t: 0.14, dur: 0.2, g: 0.14 }); },
    bonk() { tone({ f: 330, f2: 140, dur: 0.14, g: 0.4 }); tone({ type: 'square', f: 900, dur: 0.03, g: 0.08 }); tone({ f: 900, f2: 500, t: 0.12, dur: 0.6, g: 0.1, vib: 80, vibHz: 7 }); },
    heh() { for (let i = 0; i < 3; i++) tone({ type: 'sawtooth', f: 240 - i * 25, f2: 190 - i * 25, t: i * 0.11, dur: 0.08, g: 0.07 }); },
    nyah() { [67, 64, 69, 67, 64].forEach((n, i) => tone({ type: 'square', f: midi(n + 5), t: i * 0.17, dur: 0.15, g: 0.055, vib: 10, vibHz: 9 })); },
    combo(n) { const k = Math.min(n, 8); for (let i = 0; i <= k; i++) tone({ type: 'triangle', f: midi(72 + [0, 4, 7, 12, 16, 19, 24, 28, 31][i]), t: i * 0.055, dur: 0.22, g: 0.13 }); },
    firework() { tone({ f: rand(700, 1000), f2: rand(1800, 2600), dur: 0.22, g: 0.05 }); noise({ t: 0.2, f: 2600, f2: 400, dur: 0.35, g: 0.28 * soft() }); tone({ t: 0.2, f: 220, f2: 60, dur: 0.25, g: 0.3 * soft() }); for (let i = 0; i < 5; i++) tone({ f: pick(PENT) * 4, t: 0.25 + rand(0.5), dur: 0.2, g: 0.04 }); },
    fanfare() {
      [[60, 0], [64, 0.14], [67, 0.28], [72, 0.42], [67, 0.6], [72, 0.74]].forEach(([n, t]) => { tone({ type: 'triangle', f: midi(n + 12), t, dur: 0.3, g: 0.18 }); tone({ type: 'square', f: midi(n), t, dur: 0.25, g: 0.04 }); });
      [72, 76, 79, 84].forEach(n => tone({ type: 'triangle', f: midi(n), t: 0.9, dur: 1.4, g: 0.12 }));
    },
  };
  // --- music sequencer (swung eighth notes, look-ahead scheduling) ------
  function setMusic(def) { music = def; step = 0; if (ctx) nextT = ctx.currentTime + 0.15; }
  function tick() {
    if (!ctx || !music || ctx.state !== 'running') return;
    const e = 60 / music.bpm / 2 * (settings.calm ? 1.12 : 1);
    if (nextT < ctx.currentTime) nextT = ctx.currentTime + 0.05;
    while (nextT < ctx.currentTime + 0.2) {
      const s = step % music.mel.length, m = music.mel[s], b = music.bass[s % music.bass.length], at = nextT;
      if (m) { tone({ type: 'triangle', f: midi(m), at, dur: 0.26, g: 0.2, dest: musicBus }); tone({ f: midi(m + 12), at, dur: 0.12, g: 0.05, dest: musicBus }); }
      if (b) tone({ type: 'sine', f: midi(b), at, dur: 0.24, g: 0.34, dest: musicBus });
      if (s % 4 === 0) tone({ f: 130, f2: 45, at, dur: 0.14, g: 0.3, dest: musicBus });
      if (s % 2 === 1) noise({ type: 'highpass', f: 6500, at, dur: 0.04, g: 0.06, dest: musicBus });
      nextT += e * (step % 2 === 0 ? 1.2 : 0.8); step++;
    }
  }
  const api = { init, apply, setMusic, suspend() { ctx && ctx.suspend(); }, resume() { ctx && ctx.resume(); } };
  for (const k in fx) api[k] = (...a) => { if (ctx && ctx.state === 'running') fx[k](...a); };
  return api;
})();

/* Short cheerful praise with the Web Speech API, at most once every few seconds. */
const Voice = {
  last: -1e9, timer: 0,
  say(text, important = false) {
    if (!settings.voice || !('speechSynthesis' in window)) return;
    const now = performance.now(), gap = 3600;
    if (now - this.last < gap) {
      if (important) { clearTimeout(this.timer); this.timer = setTimeout(() => this.say(text), gap - (now - this.last) + 60); }
      return;
    }
    this.last = now;
    try {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US'; u.rate = 1.05; u.pitch = 1.45; u.volume = clamp(settings.volume * 1.1, 0, 1);
      speechSynthesis.cancel(); speechSynthesis.speak(u);
    } catch (e) {}
  },
};

/* =====================================================================
   3. SCENE: renderer, camera, lights, post-processing, quality scaling
   ===================================================================== */
const canvas = $('game');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 1, 200);
const CAM = { elev: 60 * Math.PI / 180, dist: 22, look: new THREE.Vector3(0, 0, 0.9), shake: 0, punch: 0 };

const hemi = new THREE.HemisphereLight(0xffffff, 0x7fcf5a, 1.5);
const keyLight = new THREE.DirectionalLight(0xfff1d8, 2.3);
keyLight.position.set(8, 17, 9);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(1024, 1024);
Object.assign(keyLight.shadow.camera, { left: -20, right: 20, top: 15, bottom: -15, near: 1, far: 50 });
keyLight.shadow.bias = -0.0006; keyLight.shadow.normalBias = 0.04; keyLight.shadow.radius = 4;
const fillLight = new THREE.DirectionalLight(0xbcd9ff, 0.55);
fillLight.position.set(-9, 8, -10);
const boomLight = new THREE.PointLight(0xffe2a8, 0, 20, 1.4);
scene.add(hemi, keyLight, fillLight, boomLight);

const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(4, 4, { type: THREE.HalfFloatType, samples: 4 }));
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(new THREE.Vector2(256, 256), 0.45, 0.55, 1.12);
composer.addPass(bloomPass);
composer.addPass(new OutputPass());

/* Watches frame rate; sheds shadows first, then bloom, then particles. */
const Quality = {
  level: 0, particleMul: 1, bloom: true, acc: 0, n: 0, slow: 0, warm: 0, locked: QS.has('hq'), active: false,
  sample(dt) {
    if (this.locked || !this.active || document.hidden) return;
    this.acc += dt; this.n++;
    if (this.acc < 2) return;
    const fps = this.n / this.acc; this.acc = 0; this.n = 0;
    if (this.warm < 2) { this.warm++; return; }
    if (fps < 50) { if (++this.slow >= 2) { this.slow = 0; this.step(); } } else this.slow = 0;
  },
  step() {
    if (this.level >= 4) return;
    this.level++;
    if (this.level === 1) { keyLight.castShadow = false; renderer.shadowMap.enabled = false; scene.traverse(o => { if (o.userData.blob) o.visible = true; if (o.material) o.material.needsUpdate = true; }); }
    else if (this.level === 2) this.bloom = false;
    else if (this.level === 3) this.particleMul = 0.55;
    else { this.particleMul = 0.35; renderer.setPixelRatio(1); layout(); }
  },
};

/* Arena bounds on the ground plane, recomputed from the camera on resize. */
const B = { inX: 9, inZ0: -5, inZ1: 6, outX: 14, outZ0: -9, outZ1: 10, farZ: -7, nearZ: 8, farX: 13 };
const _ray = new THREE.Raycaster(), _ndc = new THREE.Vector2(), _v = new THREE.Vector3();
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
function groundAt(nx, ny, out = new THREE.Vector3()) {
  _ray.setFromCamera(_ndc.set(nx, ny), camera);
  return _ray.ray.intersectPlane(groundPlane, out) || out.set(0, 0, 0);
}
function placeCamera(shX = 0, shY = 0) {
  const d = CAM.dist * (1 - 0.045 * CAM.punch);
  camera.position.set(CAM.look.x + shX, Math.sin(CAM.elev) * d + shY, CAM.look.z + Math.cos(CAM.elev) * d);
  camera.lookAt(CAM.look.x + shX * 0.6, 0, CAM.look.z);
}
function layout() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(w, h);
  camera.aspect = w / h;
  CAM.dist = clamp(10.8 / (Math.tan(camera.fov * Math.PI / 360) * camera.aspect), 21, 70);
  camera.updateProjectionMatrix(); placeCamera(); camera.updateMatrixWorld();
  B.nearZ = groundAt(0, -1).z; B.farZ = groundAt(0, 1).z;
  const nearX = groundAt(1, -1).x; B.farX = groundAt(1, 1).x;
  B.inX = nearX - 1.3; B.inZ0 = B.farZ + 2.6; B.inZ1 = B.nearZ - 1.5;

function impact(s) { emit('glitter', Math.round(10 * Quality.particleMul), s.x, 1.3, s.z, { sp: [2, 6], up: [1, 6], colors: theme.glitPal, life: [0.3, 0.8] }); flash(s.x, 1.3, s.z, 0.35, 0xffc6f5, 0.15); }

/* =====================================================================
   9. DIFFICULTY: adaptive (last ~20 taps, up and down) + a per-level ramp
   ===================================================================== */
const Diff = {
  hist: [], n: 0,
  // every level adds a little; the adaptive part can cancel only half of it
  ramp() { return Math.min(0.5, settings.level * 0.05); },
  record(hit) {

    this.speed = lerp(1.25, 2.9, d) * (c ? 0.7 : 1);              // toy walking speed
    this.wiggle = lerp(0, 1.2, d);                                // how much they weave
    this.scale = lerp(1.35, 1.0, d);                              // bigger targets when he's missing
    this.spawnDelay = lerp(4.5, 1.6, d) * (c ? 1.5 : 1);
    this.cone = lerp(0.8, 0.4, d);                                // aim-assist half-angle (radians)

  },

Diff.apply();

/* =====================================================================
   10. UI: cookie art, jar HUD, flying cookies, level wipe
   ===================================================================== */
function cookieImage(size, play) {

    x.beginPath(); x.moveTo(-R * 0.15, -R * 0.26); x.lineTo(R * 0.3, 0); x.lineTo(-R * 0.15, R * 0.26); x.closePath(); x.lineJoin = 'round'; x.lineWidth = size * 0.05; x.strokeStyle = x.fillStyle = '#ff5d8f'; x.stroke(); x.fill();

const COOKIE_URL = cookieImage(160, false);
$('playCookie').src = cookieImage(640, true);
const jarEl = $('jar'), slotsEl = $('slots'), flyLayer = $('flyLayer'), wipeEl = $('wipe');
function buildJar(n) {

    el.src = COOKIE_URL; el.draggable = false; el.className = 'ghost'; el.style.width = (w * 1.12) + '%';
    el.style.left = (50 + (col - (inRow - 1) / 2) * w) + '%'; el.style.bottom = (row * (96 / Math.max(rows, 3)) + 12) + '%';

}
function fillSlot(i) {
  const el = slotsEl.children[i]; if (el) { el.className = ''; void el.offsetWidth; el.className = 'in'; }
  jarEl.classList.remove('bump'); void jarEl.offsetWidth; jarEl.classList.add('bump'); Sound.ding();
}
function flyCookie(wx, wy, wz, slot) {
  _v.set(wx, wy, wz).project(camera);
  const sx = (_v.x * 0.5 + 0.5) * innerWidth, sy = (-_v.y * 0.5 + 0.5) * innerHeight, r = jarEl.getBoundingClientRect(), tx = r.left + r.width / 2, ty = r.top + r.height * 0.55;
  const el = document.createElement('img'); el.src = COOKIE_URL; el.className = 'fly'; el.draggable = false; flyLayer.appendChild(el);
  const T = (x, y, s, rot) => `translate(${x}px,${y}px) translate(-50%,-50%) scale(${s}) rotate(${rot}deg)`;

  el.animate([{ transform: T(sx, sy, 1.2, 0) }, { transform: T(lerp(sx, tx, 0.3), Math.min(sy, ty) - 60, 1.5, 200), offset: 0.4 }, { transform: T(tx, ty, 0.45, 560) }], { duration: 620, easing: 'ease-in' }).onfinish = done;
}
function collectCookie(c) {
  const p = c.root.position; removeCookie(c);
  emit('sprinkle', 9, p.x, p.y, p.z, { sp: [1, 4], up: [3, 7], colors: ['#e2a45c', '#c98740', '#5a2d0c'], life: [0.8, 1.4] });
  emit('glitter', 12, p.x, p.y, p.z, { sp: [1, 5], up: [1, 6], colors: ['#fff3b0', '#ffffff'], life: [0.4, 0.9] });
  emit('star', 4, p.x, p.y, p.z, { sp: [2, 4], up: [5, 8], colors: theme.starPal, life: [1, 1.6] });

  if (Game.state !== 'play') return;
  const slot = Game.collected++; flyCookie(p.x, p.y, p.z, slot);
  if (Game.collected >= Game.need) levelComplete();
  else if (Math.random() < 0.3) Voice.say(pick(['Cookie power!', 'Yummy!', 'Yum yum!', 'Crunch!']));
}

/* =====================================================================
   11. GAME FLOW: spawning, level celebration, next landscape
   ===================================================================== */
const Game = { state: 'start', collected: 0, need: 10, sinceMega: 0, badT: 3, cookieT: 0.5, celebT: 0, fwT: 0, megaShow: 0, megaAt: null, paused: false, lastBad: '' };
const bigStar = (() => {
  const g = new THREE.Group(), s = mesh(starGeo(1.5, 0.68, 0.45), mat('#ffd23f', { r: 0.25, e: 0.3 })); g.add(s); g.rotation.x = -0.75; g.position.set(0, 4.6, -2.6); g.visible = false; scene.add(g); return { g, s };
})();
function needFor(level) { return Math.min(16, 10 + Math.floor(level / 2)); }   // a few more cookies as levels go up
function startLevel() {
  Diff.apply();
  Game.state = 'play'; Game.collected = 0; Game.need = needFor(settings.level); Game.badT = 3; Game.cookieT = 0.3; Game.celebT = 0;
  buildJar(Game.need); jarEl.classList.remove('party'); jarEl.classList.add('show'); bigStar.g.visible = false; cannon.spin = 0;
  for (const g of goods) if (g.state === 'dance') { g.state = 'idle'; g.stateT = 1; g.root.rotation.z = 0; }
  $('pLevel').textContent = settings.level + 1;
}
function levelComplete() {
  Game.state = 'celebrate'; Game.celebT = 0; Game.fwT = 0.5;
  bads.slice().forEach((b, i) => setTimeout(() => { if (b.root.parent && b.state !== 'antic') { b.hp = 1; b.hitCool = 0; hitBad(b); } }, 250 + i * 220));
  for (const g of goods) { g.state = 'dance'; g.stars.visible = false; }
  bigStar.g.visible = true; bigStar.g.scale.setScalar(0.01); cannon.spin = 7; jarEl.classList.add('party');
  Sound.fanfare(); Voice.say(pick(['You did it!', 'Hooray!', 'Amazing!']), true);
  settings.level++; save();
}
function nextLevel() {
  wipeEl.style.background = pick(['#ffd23f', '#ff5d8f', '#4cc9f0']); wipeEl.classList.add('on');
  setTimeout(() => {
    for (const b of bads.slice()) { if (b.carry) removeCookie(b.carry); removeBad(b); }
    for (const c of cookies.slice()) removeCookie(c);
    for (const p of poolList) p.n = 0;
    setTheme(settings.level); startLevel();
    setTimeout(() => wipeEl.classList.remove('on'), 250);
  }, 650);
}
function updateGame(dt) {
  if (Game.megaShow > 0) {                                      // extra-huge fireworks after a mega toy
    const before = Game.megaShow; Game.megaShow -= dt;
    if (Math.floor(before / 0.2) !== Math.floor(Game.megaShow / 0.2)) firework(Game.megaAt.x + rand(-6, 6), Game.megaAt.z + rand(-4, 4));
  }
  const free = cookies.filter(c => c.state !== 'carried').length;
  Game.cookieT -= dt;
  if (Game.state !== 'celebrate' && free < (Game.state === 'start' ? 2 : 3) && Game.cookieT <= 0) { spawnCookie(); Game.cookieT = rand(1.4, 3); }
  if (Game.state === 'play') {
    Game.badT -= dt;
    if (bads.length < Diff.maxBad && Game.badT <= 0) {
      const mega = Game.sinceMega >= Diff.megaEvery && !bads.some(b => b.mega);
      if (mega) { Game.sinceMega = 0; spawnBad('robot', true); }
      else { const k = Game.lastBad === 'robot' ? (Math.random() < 0.75 ? 'car' : 'robot') : (Math.random() < 0.75 ? 'robot' : 'car'); Game.lastBad = k; spawnBad(k); }
      Game.badT = Diff.spawnDelay * rand(0.7, 1.3);
    }
  } else if (Game.state === 'celebrate') {
    Game.celebT += dt; Game.fwT -= dt;
    if (Game.fwT <= 0 && Game.celebT < 6) { Game.fwT = rand(0.25, 0.5); firework(rand(-B.inX, B.inX), rand(B.inZ0, B.inZ1)); }
    const k = Math.min(1, Game.celebT / 0.6);
    bigStar.g.scale.setScalar(Math.max(0.01, easeOutBack(k)) * (1 + Math.sin(Game.celebT * 6) * 0.06)); bigStar.s.rotation.y = Math.sin(Game.celebT * 2.4) * 0.7; bigStar.s.rotation.z = Math.sin(Game.celebT * 3) * 0.25;
    if (Math.random() < dt * 14) POOLS.glitter.spawn(rand(-1.8, 1.8), 4.6 + rand(-1.3, 1.3), -2.6, rand(-2, 2), rand(0, 3), rand(-2, 2), rand(1, 1.6), pick(theme.glitPal), rand(0.5, 1), false);
    if (Game.celebT > 7.2) { Game.state = 'wipe'; nextLevel(); }

}

/* =====================================================================
   12. INPUT: a tap is the only control (+ hidden parent menu)
   ===================================================================== */
let lastShotAt = -1e9, lastFs = -1e9;
const tapPoint = new THREE.Vector3();
function pickTarget(px, pz, a, onCannon) {
  let best = null, bestScore = 1e9;
  const consider = (o, isBad) => {
    if (!onScreen(o.x, o.z, 1.02)) return;
    const dTap = Math.hypot(o.x - px, o.z - pz), ang = Math.abs(angDiff(a, Math.atan2(o.x, o.z)));
    let s;
    if (onCannon) s = Math.hypot(o.x, o.z) * 0.1;                 // tapped the cannon: nearest thing
    else if (dTap < Diff.tapR) s = dTap * 0.12;                   // tapped (roughly) on it
    else if (ang < Diff.cone) s = 1 + ang / Diff.cone;            // inside the aim-assist cone
    else return;
    if (isBad) s -= 0.18;
    if (s < bestScore) { bestScore = s; best = o; }
  };
  for (const b of bads) if (b.state !== 'antic') consider(b, true);

  return best;
}
function tap(cx, cy) {
  const now = performance.now();
  if (now - lastShotAt < 165) return;                             // ~6 shots per second, max
  lastShotAt = now;
  groundAt(cx / innerWidth * 2 - 1, -(cy / innerHeight) * 2 + 1, tapPoint);
  const onCannon = Math.hypot(tapPoint.x, tapPoint.z) < 1.6;
  let a = onCannon ? cannon.aim : Math.atan2(tapPoint.x, tapPoint.z);
  if (Game.state === 'celebrate' || Game.state === 'wipe') {      // party time: taps make fireworks
    cannon.fireAt(a); Sound.pew(); if (Game.state === 'celebrate') firework(tapPoint.x, tapPoint.z, rand(2.5, 5)); return;
  }
  const target = pickTarget(tapPoint.x, tapPoint.z, a, onCannon);
  if (target) a = Math.atan2(target.x, target.z);
  const anything = bads.some(b => onScreen(b.x, b.z)) || cookies.some(c => c.state !== 'carried' && onScreen(c.x, c.z));
  cannon.fireAt(a); fireShot(a, target, anything); Sound.pew();
}

  try { const p = f.call(el, { navigationUI: 'hide' }); if (p && p.catch) p.catch(() => {}); } catch (e) {}
  try { screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape').catch(() => {}); } catch (e) {}
  try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => {}); } catch (e) {}
}
// hidden parent menu: press and hold the top-left corner for 3 seconds
const holdRing = $('holdRing'), holdCircle = holdRing.querySelector('circle'), parentEl = $('parent');
let holdId = null, holdStart = 0;
function cancelHold() { holdId = null; holdRing.style.opacity = 0; }
function openParent() {
  cancelHold(); Game.paused = true; parentEl.classList.add('open');
  $('pVol').value = settings.volume; $('pMusic').checked = settings.music; $('pVoice').checked = settings.voice; $('pCalm').checked = settings.calm; $('pLevel').textContent = settings.level + 1;
}
function closeParent() { parentEl.classList.remove('open'); Game.paused = false; save(); if (Game.state !== 'start') goFullscreen(); }
$('pVol').oninput = e => { settings.volume = +e.target.value; Sound.apply(); };
$('pMusic').onchange = e => { settings.music = e.target.checked; Sound.apply(); };
$('pVoice').onchange = e => { settings.voice = e.target.checked; };
$('pCalm').onchange = e => { settings.calm = e.target.checked; Diff.apply(); };
$('pClose').onclick = closeParent;
$('pSkip').onclick = () => { if (Game.state === 'play') { settings.level++; save(); Game.state = 'wipe'; nextLevel(); } closeParent(); };

window.addEventListener('pointerdown', e => {
  if (parentEl.contains(e.target)) return;
  e.preventDefault();
  if (Game.paused) return;
  if (e.clientX < 110 && e.clientY < 110) { holdId = e.pointerId; holdStart = performance.now(); }
  if (Game.state === 'start') {
    Sound.init(); goFullscreen(); $('start').classList.add('hide'); Quality.active = true;
    Sound.setMusic(theme.music); startLevel(); Sound.fanfare(); Voice.say("Let's play!");
    try { speechSynthesis.getVoices(); } catch (err) {}
    return;
  }
  Sound.init();
  if (e.pointerType === 'touch' && performance.now() - lastFs > 10000) { lastFs = performance.now(); goFullscreen(); }

}, { passive: false });
for (const ev of ['pointerup', 'pointercancel']) window.addEventListener(ev, e => { if (e.pointerId === holdId) cancelHold(); });

for (const ev of ['touchstart', 'touchmove', 'touchend', 'gesturestart', 'gesturechange', 'gestureend', 'contextmenu', 'dblclick', 'selectstart', 'dragstart', 'wheel'])
  document.addEventListener(ev, e => { if (!parentEl.contains(e.target)) e.preventDefault(); }, { passive: false });

let resizeT = 0;
window.addEventListener('resize', () => { layout(); clearTimeout(resizeT); resizeT = setTimeout(() => setTheme(settings.level), 300); });

/* =====================================================================
   13. MAIN LOOP
   ===================================================================== */
layout();
setTheme(settings.level);
buildJar(needFor(settings.level));
spawnGood('duck'); spawnGood('ball');
const chainTargets = [];
let last = performance.now(), simT = 0;

}

window.__booted = true;
window.__sc = { Game, Diff, Quality, settings, bads, cookies, goods, spawnBad, hitBad, levelComplete, firework, tap, B, POOLS };
